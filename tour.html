<!DOCTYPE html>
<html lang="en">
<head>
<script src="schedule-health.js?v=1"></script>
<script src="worker-health.js?v=1"></script>
<!-- NOT deferred, and first: it wraps window.fetch, so it has to be in place
     before any other script can start a feed. Deferred would run after the
     page's own inline code had already begun fetching. -->
<script src="feed-backoff.js?v=1"></script>
<script src="license.js?v=2" defer></script>
<!-- Restarts a board that has been up for days, but only once it has just
     proved this origin is reachable — a reload into a dead network turns a
     stale-but-useful wall display into an empty one. See kiosk-reload.js. -->
<script src="kiosk-reload.js?v=1" defer></script>
<script src="gate.js?v=3" defer></script>
<meta charset="utf-8" />
<!-- Brand marks. favicon.svg is the dot-less 16px drawing: the guide's floor
     for the full mark is 40px, and a browser tab is not going to honour that. -->
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="apple-touch-icon" href="brand/icon-dark-180.png">
<meta name="theme-color" content="#12101A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#010409" />
<title>Grand Tour — Live Transit</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  /* ---------------------------------------------------------------------------
     GRAND TOUR — a self-running, kiosk-style "world tour" of live transit.
     It shuffles between cities and modes (planes / trains / buses / trams),
     flies a full-screen map to whatever real vehicle is nearest each stop,
     glides that vehicle across the map by dead-reckoning from its own speed +
     heading, and overlays all the detail it can find. The page re-tints to a
     per-mode gradient palette on every stop, keeps the screen awake (wake
     lock), can STAY pinned on one vehicle with live re-tracking, and has
     ⚙ settings for pace + city/mode filters and a ⏮ back button. Standalone
     from the boards + night.html on purpose (its own full-map layout), but it
     pulls the SAME public sources: adsb.lol (planes), Amtrak (amtraker),
     the bundled GTFS schedules already in this repo (local rail / bus / tram),
     adsbdb (flight routes), planespotters + Wikimedia (photos).
  --------------------------------------------------------------------------- */
  :root{
    /* --accent/--accent2/--accent-dim are LIVE: present() re-tints them per
       mode (gold planes / teal trains / violet buses / pink trams), and every
       accent-colored element below morphs along via the transition rule. */
    --accent:#7db8ff; --accent2:#59e0c1; --accent-dim:#4a7fc4; --muted:#8ba3c7; --faint:#22344f;
    --bg:#040810; --panel:rgba(10,18,32,.82); --good:#5ad1a0; --late:#ff6b5a; --city:#eaf2ff;
    --violet:#b58cff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--accent-ink); font-family:Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; height:100dvh; letter-spacing:.3px}
  #map{position:fixed; top:0;right:0;bottom:0;left:0;inset:0; z-index:0; background:#040810}
  .leaflet-container{background:#040810; font-family:inherit}
  /* the map is a show, not a tool: no attribution clutter, kill focus outlines */
  .leaflet-control-attribution{display:none}
  #map:focus{outline:none}

  /* dim vignette so overlays stay readable over bright map areas */
  #vignette{position:fixed; top:0;right:0;bottom:0;left:0;inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(2,5,11,.72) 100%)}

  /* ---- vehicle marker: a heading-rotated glyph with a pulsing halo ---- */
  .tour-veh{filter:drop-shadow(0 0 10px var(--accent))}
  .tour-veh .rot{display:block; transition:transform .6s ease}
  .tour-veh svg path, .tour-veh svg rect, .tour-veh svg circle{fill:#eaf3ff}
  .tour-veh .ping{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    border-radius:50%; border:2px solid var(--accent); opacity:0; animation:ping 2.4s ease-out infinite}
  @keyframes ping{0%{transform:scale(.5); opacity:.8}100%{transform:scale(4.4); opacity:0}}
  .tour-endpt{width:11px; height:11px; border-radius:50%; background:var(--accent-dim);
    border:2px solid var(--bg); box-shadow:0 0 8px var(--accent-dim)}
  .endpt-label{white-space:nowrap; transform:translate(10px,-8px); color:var(--city); font-size:12px;
    font-weight:700; text-shadow:0 1px 6px #000, 0 0 2px #000; letter-spacing:.5px}
  /* intermediate calling points: route texture, deliberately quieter than the
     two endpoint markers — stops already passed fade back further still */
  .tour-stopdot{display:block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); opacity:.75; box-shadow:0 0 4px var(--accent)}
  .tour-stopdot.done{opacity:.28; box-shadow:none}
  .tour-nextdot{display:block; width:13px; height:13px; border-radius:50%;
    background:var(--bg); border:3px solid var(--accent); box-shadow:0 0 10px var(--accent)}
  .endpt-label.next{color:var(--accent-ink); font-size:11px; transform:translate(11px,-7px)}

  /* ---- top bar: what we're watching + the shuffle queue + controls ---- */
  header{position:fixed; z-index:5; top:0; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:16px 22px; pointer-events:none}
  header > *{pointer-events:auto}
  .brand{display:flex; align-items:center; gap:4px; font-weight:800; letter-spacing:.28em;
    text-transform:uppercase; font-size:13px; color:var(--accent-dim); text-decoration:none}
  /* gradient wordmark — re-tints with the live mode palette */
  .brand .t{background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent}
  /* The dot-less small mark, styled here because this page does not load
     theme.css. Dot-less because the header floats over the map and is built
     around 13px type: a 40px mark would tower over its own wordmark, and one
     sized to match would sit under the floor where the station dots close up.
     The margin is the guide's clear space — one station dot, 13% — which is why
     .brand's own gap is small. */
  .brand .brandmark--sm{display:block; flex:none; width:26px; height:26px; margin:3.4px}
  .upnext{display:flex; align-items:center; gap:9px; margin-left:8px; flex:1; min-width:0}
  .qlabel{font-size:9px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); opacity:.55; white-space:nowrap}
  .queue{display:flex; gap:7px; overflow:hidden; flex:1; min-width:0}
  .queue .chip{display:inline-flex; align-items:baseline; gap:5px;
    font:inherit; font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--faint);
    border-radius:999px; padding:5px 11px; white-space:nowrap; opacity:.7; background:rgba(6,12,22,.5);
    /* the header itself is click-through; the chips are the exception */
    pointer-events:auto; cursor:pointer; transition:opacity .15s ease, transform .15s ease}
  .queue .chip:hover,.queue .chip:focus-visible{opacity:1; transform:translateY(-1px); outline:none}
  .queue .chip.now{color:var(--bg); background:var(--accent); border-color:var(--accent); opacity:1; cursor:default}
  .queue .chip.now:hover{transform:none}
  .queue .chip i{font-style:normal; font-weight:600; opacity:.72; font-size:10px}
  .queue .chip .qn{font-size:9px; opacity:.6; font-weight:800}
  .clock{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted); font-size:15px; font-weight:700}
  .ctrls{display:flex; gap:8px; align-items:center}
  .ctrls .cdiv{width:1px; height:22px; background:var(--faint); margin:0 3px}
  .ctrls button, .ctrls a{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
    border-radius:11px; border:1px solid var(--faint); background:rgba(8,14,24,.7); color:var(--muted);
    cursor:pointer; font-size:16px; text-decoration:none; font-family:inherit}
  .ctrls button:hover, .ctrls a:hover{color:var(--accent-ink); border-color:var(--accent-dim)}
  /* an engaged toggle (Stay) fills with the live mode gradient */
  .ctrls button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:var(--accent); color:#04101f}
  /* everything accent-tinted morphs smoothly when the mode palette changes */
  .chips .c, .queue .chip, .ctrls button, .ctrls a, .kicker .mode-ic, .kicker,
  .title, .clock, .prog .lbl .pct, .citytime{transition:color .8s ease, background-color .8s ease, border-color .8s ease}

  /* countdown ring around the "skip" button, drains until the next shuffle */
  .ring{position:relative}
  .ring svg{position:absolute; top:-1px;right:-1px;bottom:-1px;left:-1px;inset:-1px; transform:rotate(-90deg); pointer-events:none}
  .ring circle{fill:none; stroke:var(--accent); stroke-width:2.5; opacity:.85}

  /* ---- the info overlay (bottom-left glass card) ---- */
  #card{position:fixed; z-index:5; left:22px; bottom:22px; width:min(560px,calc(100vw - 44px));
    background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--faint); border-radius:20px; padding:20px 22px; box-shadow:0 24px 70px rgba(0,0,0,.55);
    display:grid; grid-template-columns:1fr auto; gap:18px; align-items:stretch;
    opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease}
  #card.in{opacity:1; transform:none}
  /* gradient rail across the card's top edge, in the live mode palette */
  #card::before{content:""; position:absolute; top:0; left:24px; right:24px; height:3px;
    border-radius:0 0 6px 6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); opacity:.95}
  #card .txt{min-width:0}
  .kicker{display:flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent-dim)}
  .kicker .mode-ic{font-size:15px}
  .kicker .live{color:var(--good-ink); border:1px solid rgba(90,209,160,.4); background:rgba(90,209,160,.1);
    border-radius:6px; padding:1px 7px; letter-spacing:.1em}
  .kicker .sched{color:var(--violet); border:1px solid rgba(181,140,255,.4); background:rgba(181,140,255,.12);
    border-radius:6px; padding:1px 7px; letter-spacing:.1em}
  .city{font-size:clamp(1.5rem,3.6vw,2.5rem); font-weight:800; color:var(--city); line-height:1.02; margin-top:6px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  .citytime{font-size:14px; font-weight:800; color:var(--accent-ink); letter-spacing:.08em;
    font-variant-numeric:tabular-nums; text-transform:uppercase}
  .citytime:empty{display:none}
  /* the vehicle/line name flows through the mode gradient */
  .title{font-size:clamp(1.05rem,2.3vw,1.6rem); font-weight:800; color:var(--accent-ink); margin-top:3px; line-height:1.1;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; width:fit-content}
  .sub{font-size:13px; color:var(--muted); font-weight:600; margin-top:3px}
  .route{display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap; margin-top:10px; font-weight:800; color:var(--city)}
  .route .r{font-size:clamp(1rem,2vw,1.35rem)} .route .arw{color:var(--accent-dim); font-weight:400}
  .route .r.dim{color:var(--muted); font-weight:700; font-size:clamp(.9rem,1.6vw,1.1rem)}

  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  .chips .c{font-size:13px; font-weight:700; color:var(--accent-ink); background:rgba(125,184,255,.08);
    border:1px solid var(--faint); border-radius:9px; padding:5px 10px; display:inline-flex; align-items:center; gap:6px}
  /* gradient-tinted chip fills where color-mix exists (older browsers keep the flat look above) */
  @supports (color: color-mix(in srgb, red 10%, blue)){
    .chips .c{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent),
        color-mix(in srgb, var(--accent2) 9%, transparent));
      border-color:color-mix(in srgb, var(--accent) 32%, transparent)}
  }
  .chips .c.badge-ok{color:var(--good-ink); background:rgba(90,209,160,.1); border-color:rgba(90,209,160,.35)}
  .chips .c.badge-late{color:var(--late-ink); background:rgba(255,107,90,.12); border-color:rgba(255,107,90,.4)}
  .hdg-arrow{display:inline-block; font-weight:900}

  /* weather where the vehicle actually is — arrives after the card, so it gets
     its own row rather than being folded into the chips innerHTML */
  .wx{display:none; align-items:center; gap:8px; margin-top:10px; font-size:12px;
    font-weight:600; color:var(--muted)}
  .wx.show{display:flex}
  .wx .ic{font-size:16px; line-height:1}
  .wx .t{color:var(--city); font-weight:800; font-variant-numeric:tabular-nums}
  .wx .sep{opacity:.4}

  .prog{margin-top:14px}
  .prog .bar{position:relative; height:6px; border-radius:99px; background:var(--faint)}
  .prog .fill{position:absolute; left:0; top:0; bottom:0; border-radius:99px;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width 1s linear}
  .prog .dot{position:absolute; top:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%;
    background:var(--accent); transform:translateY(-50%); box-shadow:0 0 0 3px var(--panel),0 0 9px var(--accent); transition:left 1s linear}
  .prog .lbl{display:flex; justify-content:space-between; margin-top:7px; font-size:12px; color:var(--muted);
    font-weight:600; font-variant-numeric:tabular-nums}
  .prog .lbl .pct{color:var(--accent-dim); font-weight:800}

  #photo{width:150px; min-height:0; border-radius:14px; border:1px solid var(--faint); object-fit:cover;
    display:none; align-self:stretch; box-shadow:0 8px 30px rgba(0,0,0,.4)}
  #photoCred{grid-column:1 / -1; text-align:right; font-size:11px; color:var(--muted); margin-top:-6px; display:none}
  #photoCred a{color:var(--muted); text-decoration:none}

  /* status flash while tuning into the next stop */
  #flash{position:fixed; z-index:4; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center;
    color:var(--muted); font-weight:700; font-size:clamp(1rem,2.4vw,1.5rem); opacity:0; transition:opacity .4s ease;
    text-shadow:0 2px 20px #000; pointer-events:none}
  #flash.show{opacity:1}
  #flash .big{font-size:clamp(1.6rem,4vw,2.6rem); font-weight:800; display:block; margin-top:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--city));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent}

  /* ---- tour log: what this session has already shown ---- */
  #log{position:fixed; z-index:7; top:0; right:0; bottom:0; width:min(92vw,400px);
    background:rgba(6,11,20,.97); border-left:1px solid var(--faint);
    box-shadow:-20px 0 60px rgba(0,0,0,.6); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .28s ease; pointer-events:auto}
  #log.show{transform:none}
  .log-head{display:flex; align-items:center; gap:10px; padding:16px 18px;
    border-bottom:1px solid var(--faint)}
  .log-title{font-weight:800; letter-spacing:.5px; color:var(--city)}
  .log-count{font-size:11px; color:var(--muted); font-weight:700; margin-right:auto}
  .log-head button{font:inherit; font-size:11px; font-weight:700; cursor:pointer;
    color:var(--muted); background:rgba(8,14,24,.7); border:1px solid var(--faint);
    border-radius:8px; padding:5px 10px}
  .log-head button:hover{color:var(--accent-ink); border-color:var(--accent-dim)}
  .log-body{flex:1; overflow-y:auto; padding:8px 0}
  .log-row{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:9px 18px;
    border-bottom:1px solid rgba(255,255,255,.04)}
  .log-row .ic{font-size:15px; line-height:1.3}
  .log-row .l1{font-size:13px; font-weight:700; color:var(--city)}
  .log-row .l2{font-size:11px; color:var(--muted); font-weight:600; margin-top:1px}
  .log-row .l3{font-size:10px; color:var(--muted); opacity:.65; margin-top:2px;
    font-variant-numeric:tabular-nums}
  .log-empty{padding:24px 18px; font-size:12px; color:var(--muted)}

  /* ---- tour settings (⚙): pace + city/mode filters, persisted ---- */
  #settings{position:fixed; z-index:8; top:74px; right:22px; width:min(320px,calc(100vw - 44px));
    background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--faint); border-radius:16px; padding:16px 18px 18px; display:none;
    box-shadow:0 18px 50px rgba(0,0,0,.5); max-height:calc(100dvh - 100px); overflow:auto}
  #settings.show{display:block}
  #settings h3{font-size:13px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent}
  .set-lbl{margin:14px 0 0; font-size:10.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .seg{display:flex; gap:6px; margin-top:7px}
  .seg button{flex:1; padding:7px 0; border-radius:9px; border:1px solid var(--faint); background:rgba(8,14,24,.6);
    color:var(--muted); font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit}
  .seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:var(--accent); color:#04101f}
  .checks{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
  .checks label{font-size:12.5px; font-weight:700; color:var(--muted); border:1px solid var(--faint);
    border-radius:9px; padding:6px 10px; cursor:pointer; user-select:none}
  .checks label.on{color:var(--accent-ink); border-color:var(--accent);
    background:linear-gradient(135deg,rgba(125,184,255,.14),rgba(89,224,193,.09))}
  #settings .note{margin-top:14px; font-size:11px; color:var(--muted); line-height:1.5}

  /* Narrow screens: the control row wins the header. The queue is no longer
     decorative (its chips jump the tour), but number keys 1-6 still do the same
     job, so dropping it here costs reachability, not the feature. */
  @media (max-width:1100px){
    .upnext{display:none}
  }
  @media (max-width:640px){
    #card{grid-template-columns:1fr} #photo{width:100%; max-height:120px}
    /* The control bar is a nowrap flex row of 40px buttons. Measured on a 375px
       screen it reached 584px — 209px past the edge, on an axis with nothing to
       scroll — so the right-hand controls could be seen and never pressed. It
       wraps below 640px and centres, which costs one extra row of height on a
       phone and nothing at all above it. */
    .ctrls{flex-wrap:wrap; justify-content:center; row-gap:8px}
  }
  #fsHint{position:fixed; z-index:9; top:0; left:50%; transform:translate(-50%,-120%);
    background:var(--panel); color:var(--city); border:1px solid var(--faint); border-radius:0 0 12px 12px;
    padding:12px 20px; font-size:14px; max-width:90vw; text-align:center; transition:transform .35s ease}
  #fsHint.show{transform:translate(-50%,0)}

  /* ============ blue depth pass ============
     The tour re-tints --accent per mode, so a fixed blue would fight it: this
     adds only a deep floor under the info card and blue-tinted panel edges.
     tour.html doesn't load theme.css, hence the literal values. */
  #vignette{background:
      radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(2,5,11,.72) 100%),
      linear-gradient(0deg, rgba(10,26,61,.55) 0%, transparent 34%)}
  #card{box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(124,192,255,.10)}
  .ctrls button, .ctrls a{box-shadow:inset 0 0 0 1px rgba(124,192,255,.07)}
</style>
</head>
<body>
  <div id="map"></div>
  <div id="vignette"></div>

  <header>
    <a class="brand" href="index.html" title="Transit Project" aria-label="Transit Project — home"
       onclick="window.location.href='index.html'; return false;"><img class="brandmark--sm" src="brand/mark-small.svg" alt="" width="26" height="26"><span class="t">Grand Tour</span></a>
    <div class="upnext">
      <span class="qlabel">Up next</span>
      <div class="queue" id="queue"></div>
    </div>
    <span class="clock" id="clock">—</span>
    <!-- transport controls and utilities are different jobs; the divider keeps
         one undifferentiated row of eight buttons from reading as a jumble -->
    <div class="ctrls">
      <button id="backBtn" title="Previous stop (←)">⏮</button>
      <button id="pauseBtn" title="Pause / resume (space)">⏸</button>
      <button class="ring" id="skipBtn" title="Skip to next (→)">⏭
        <svg viewBox="0 0 40 40"><circle id="ringC" cx="20" cy="20" r="18.5"></circle></svg>
      </button>
      <span class="cdiv"></span>
      <button id="stayBtn" title="Stay with this vehicle (S)">Stay</button>
      <button id="logBtn" title="Tour log — everything this session has shown (L)">Log</button>
      <button id="setBtn" title="Tour settings">⚙︎</button>
      <button id="fsBtn" title="Full screen (F)">⛶</button>
      <a id="boardBtn" href="dc.html" title="Back to the board">‹</a>
    </div>
  </header>

  <div id="settings">
    <h3>Tour settings</h3>
    <div class="set-lbl">Seconds per stop</div>
    <div class="seg" id="paceSeg"></div>
    <div class="set-lbl">Cities</div>
    <div class="checks" id="cityChecks"></div>
    <div class="set-lbl">Modes</div>
    <div class="checks" id="modeChecks"></div>
    <div class="note">Stay holds the current vehicle (its position keeps updating live) ·
      the screen is kept awake while the tour runs · unchecking everything shows everything.</div>
  </div>

  <div id="flash"><span id="flashSmall">Tuning in…</span><span class="big" id="flashBig"></span></div>

  <div id="log">
    <div class="log-head">
      <span class="log-title">Tour log</span>
      <span class="log-count" id="logCount"></span>
      <button id="logClear" type="button" title="Clear the log">Clear</button>
      <button id="logClose" type="button" title="Close (Esc)">✕</button>
    </div>

  train:{a:"#4de0c0", b:"#3fa9ff", dim:"#2e9c85"},   // mint → sky blue

/* keep the display awake — this page lives on kiosks/portals, and without a
   wake lock the screen sleeps mid-tour. Re-acquired whenever the tab comes
   back (the lock auto-releases on hide); a first-gesture retry covers
   browsers that refuse the boot-time request. */
let wakeLock=null;
async function keepAwake(){

    wakeLock=await navigator.wakeLock.request("screen");

/* ===================== small geo + fetch helpers ========================= */
async function getJSON(url, timeout=15000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(), timeout);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
function haversineNm(a,b){
  const R=3440.065, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const COMPASS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const COMPASS8={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
function bearingDeg(a,b){
  const y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180);
  const x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function toDeg(h){ if(typeof h==="number"&&isFinite(h)) return (h%360+360)%360;
  if(typeof h==="string"){ const k=h.trim().toUpperCase(); if(k in COMPASS8) return COMPASS8[k]; if(/^-?\d+(\.\d+)?$/.test(k)) return (parseFloat(k)%360+360)%360; } return null; }
function compassOf(deg){ return COMPASS[Math.round(deg/22.5)%16]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// advance a lat/lon by `nm` nautical miles along heading `deg` (dead reckoning)
function moveLL(ll, deg, nm){
  const dLat=(nm/60)*Math.cos(deg*Math.PI/180);
  const dLon=(nm/60)*Math.sin(deg*Math.PI/180)/Math.cos(ll.lat*Math.PI/180);
  return { lat:ll.lat+dLat, lon:ll.lon+dLon };
}
// a lifted bezier arc between two points (classic flight-map curve)
/* The real path a flight takes: the great circle between the two airports,
   sampled as a polyline. This replaces a decorative quadratic Bézier that bowed
   the line sideways by 22% of the route length — on a 400nm hop that put the
   drawn line ~90nm off the truth, so the aircraft marker never sat on its own
   route. Slerp on the unit sphere, which is the actual shortest path; the
   apparent curve on a Mercator map is then real, not ornamental. */
function greatCircle(o,d,steps=64){
  const rad=Math.PI/180, deg=180/Math.PI;
  const φ1=o.lat*rad, λ1=o.lon*rad, φ2=d.lat*rad, λ2=d.lon*rad;
  const sinφ1=Math.sin(φ1), cosφ1=Math.cos(φ1), sinφ2=Math.sin(φ2), cosφ2=Math.cos(φ2);
  const Δ=2*Math.asin(Math.sqrt(Math.sin((φ2-φ1)/2)**2 + cosφ1*cosφ2*Math.sin((λ2-λ1)/2)**2));
  if(!(Δ>1e-9)) return [[o.lat,o.lon],[d.lat,d.lon]];
  const pts=[];
  for(let i=0;i<=steps;i++){
    const f=i/steps, a=Math.sin((1-f)*Δ)/Math.sin(Δ), b=Math.sin(f*Δ)/Math.sin(Δ);
    const x=a*cosφ1*Math.cos(λ1)+b*cosφ2*Math.cos(λ2);
    const y=a*cosφ1*Math.sin(λ1)+b*cosφ2*Math.sin(λ2);
    const z=a*sinφ1+b*sinφ2;
    pts.push([Math.atan2(z,Math.hypot(x,y))*deg, Math.atan2(y,x)*deg]);
  }
  return unwrapLons(pts);
}
/* A great circle can cross the antimeridian; Leaflet draws a full-width streak
   back across the map unless successive longitudes stay continuous. */
function unwrapLons(pts){
  for(let i=1;i<pts.length;i++){
    let d=pts[i][1]-pts[i-1][1];
    if(d>180) pts[i][1]-=360; else if(d<-180) pts[i][1]+=360;
  }
  return pts;
}

/* Amtrak's own published track geometry, same bundle the boards use. */
let amtrakShapes=null;
function normAmtrakName(n){ return (n||"").toLowerCase().replace(/\s+service$/,"").trim(); }
async function ensureAmtrakShapes(){
  if(amtrakShapes) return amtrakShapes;
  try{
    const data=await getJSON("amtrak-routes.json",15000);
    const m={}; for(const name in data) m[normAmtrakName(name)]=data[name];
    amtrakShapes=m;
  }catch(e){ amtrakShapes={}; }
  return amtrakShapes;
}

/* A stored shape's point order is arbitrary — GTFS shapes are just as likely to
   run destination-to-origin, and a station list can come back either way too.
   pathProgress measures from path[0], so an unoriented path reports a train
   ARRIVING at its destination as 1% travelled. Flip the path when its ends
   match the trip's endpoints better the other way round. */
function orientPath(path, oLL, dLL){
  if(!path || path.length<2 || !oLL || !dLL) return path;
  const a={lat:path[0][0], lon:path[0][1]};
  const z={lat:path[path.length-1][0], lon:path[path.length-1][1]};
  const asStored = haversineNm(a,oLL)+haversineNm(z,dLL);
  const flipped  = haversineNm(a,dLL)+haversineNm(z,oLL);
  return flipped<asStored ? path.slice().reverse() : path;
}

/* Does this route shape actually describe this particular trip? Stations sit
   essentially on the track, so a genuine match puts both ends within a mile or
   two; a mismatched variant is out by tens of miles. */
function nearestOnPathNm(p, path){
  let b=Infinity;
  for(const q of path){ const d=haversineNm(p,{lat:q[0],lon:q[1]}); if(d<b) b=d; }
  return b;
}
function shapeCoversTrip(shape, callPath){
  if(!shape || shape.length<2 || !callPath || callPath.length<2) return false;
  const a={lat:callPath[0][0], lon:callPath[0][1]};
  const z={lat:callPath[callPath.length-1][0], lon:callPath[callPath.length-1][1]};
  return nearestOnPathNm(a,shape)<15 && nearestOnPathNm(z,shape)<15;
}

/* Distance along a polyline to the point on it nearest `p`, and the total —
   so "% of the way there" follows the route actually being travelled instead
   of the straight line between endpoints. */
function pathProgress(path, p){
  if(!path || path.length<2) return null;
  let total=0, best=Infinity, bestRun=0, run=0;
  for(let i=1;i<path.length;i++){
    const a={lat:path[i-1][0],lon:path[i-1][1]}, b={lat:path[i][0],lon:path[i][1]};
    const seg=haversineNm(a,b);
    const d=haversineNm(p,a);
    if(d<best){ best=d; bestRun=run; }
    run+=seg; total+=seg;
  }
  const last={lat:path[path.length-1][0],lon:path[path.length-1][1]};
  if(haversineNm(p,last)<best){ best=haversineNm(p,last); bestRun=total; }
  if(!(total>0)) return null;
  return {total, done:Math.max(0,Math.min(total,bestRun)), off:best};
}

/* ===================== route + photo lookups (planes) ==================== */
const routeCache = (()=>{ try{ return JSON.parse(localStorage.getItem("tour.routes")||"{}"); }catch(e){ return {}; } })();
const photoCache = (()=>{ try{ return JSON.parse(localStorage.getItem("tour.photos")||"{}"); }catch(e){ return {}; } })();
const saveRoutes=()=>{ try{ localStorage.setItem("tour.routes", JSON.stringify(routeCache)); }catch(e){} };
const savePhotos=()=>{ try{ localStorage.setItem("tour.photos", JSON.stringify(photoCache)); }catch(e){} };
async function lookupRoute(cs){
  if(!cs) return null; const hit=routeCache[cs]; if(hit && Date.now()-hit.t<216e5) return hit.v;
  try{ const d=await getJSON(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(cs)}`);
    const fr=d&&d.response&&d.response.flightroute;
    const v=fr?{airline:fr.airline,origin:fr.origin,destination:fr.destination}:null;
    routeCache[cs]={t:Date.now(),v}; saveRoutes(); return v;
  }catch(e){ routeCache[cs]={t:Date.now(),v:null}; return null; }
}
/* adsbdb stores ONE canonical direction per callsign while airlines reuse the
   number for the return leg, so a flight is often shown flying its route
   backwards. Measured on live traffic, 14 of 35 aircraft were headed AWAY from
   their stated destination, most ~170 degrees off. The aircraft settles it: if
   its track points at the stated ORIGIN and away from the DESTINATION, swap
   them. The 30-degree margin spares aircraft holding or being vectored. */
function orientRoute(route, a){
  if(!route || !route.origin || !route.destination) return route;
  const trk = typeof a.track==="number" ? a.track : null;
  if(trk==null || typeof a.lat!=="number") return route;
  const O=route.origin, D=route.destination;
  if(typeof O.latitude!=="number" || typeof D.latitude!=="number") return route;
  const bearTo=t=>{ const r=Math.PI/180;
    const y=Math.sin((t.longitude-a.lon)*r)*Math.cos(t.latitude*r);
    const x=Math.cos(a.lat*r)*Math.sin(t.latitude*r)
          - Math.sin(a.lat*r)*Math.cos(t.latitude*r)*Math.cos((t.longitude-a.lon)*r);
    return (Math.atan2(y,x)/r+360)%360; };
  const off=b=>{ const d=Math.abs(b-trk)%360; return d>180?360-d:d; };
  if(off(bearTo(O)) < off(bearTo(D)) - 30) return {...route, origin:D, destination:O, flipped:1};
  return route;
}
async function planePhoto(hex){
  if(!hex) return null; const hit=photoCache["h:"+hex]; if(hit && Date.now()-hit.t<864e5) return hit.v;
  let v=null; try{ const d=await getJSON(`https://api.planespotters.net/pub/photos/hex/${encodeURIComponent(hex)}`);
    const p=d&&d.photos&&d.photos[0]; if(p) v={src:(p.thumbnail_large||p.thumbnail||{}).src||"", link:p.link||"", cred:p.photographer||""}; }catch(e){}
  photoCache["h:"+hex]={t:Date.now(),v}; savePhotos(); return v;
}
async function wikiPhoto(query){
  if(!query) return null; const hit=photoCache["w:"+query]; if(hit && Date.now()-hit.t<30*864e5) return hit.v;
  let v=null; try{
    const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=800&format=json&origin=*`;
    const d=await getJSON(url,10000); const pages=d&&d.query&&d.query.pages; const page=pages&&Object.values(pages)[0];
    const info=page&&page.imageinfo&&page.imageinfo[0];
    if(info){ const artist=(((info.extmetadata||{}).Artist||{}).value||"").replace(/<[^>]+>/g,"").trim();
      v={src:info.thumburl||info.url, link:info.descriptionurl||"", cred:artist, rep:true}; }
  }catch(e){}
  photoCache["w:"+query]={t:Date.now(),v}; savePhotos(); return v;
}

/* ===================== PLANE subject =====================================
   `pin` (from Stay mode) re-finds the SAME aircraft by hex instead of
   picking the nearest — null once it lands / leaves the search radius. */

/* Keep an aircraft on screen through a tracking gap -- see the boards' copy of
   this for the full reasoning. Short version: ADS-B receivers have a blind cone
   directly overhead and MLAT fixes drop in and out, so the closest traffic is
   exactly what flickers out of the feed. Carry a missing aircraft forward along
   its last track/speed for a minute, flagged as extrapolated, instead of
   deleting it the moment one poll omits it. */
const PLANE_MEMORY_MS = 60000;
const planeMemory = new Map();
function coastPlanes(fresh){
  const now = Date.now(), seen = new Set();
  for(const a of fresh){ if(!a.hex) continue; seen.add(a.hex); planeMemory.set(a.hex, { a, t: now }); }
  const out = fresh.slice();
  for(const [hex, rec] of planeMemory){
    if(seen.has(hex)) continue;
    const age = now - rec.t;
    if(age > PLANE_MEMORY_MS){ planeMemory.delete(hex); continue; }
    const a = rec.a, gs = Number(a.gs), trk = Number(a.track);
    if(!isFinite(gs) || !isFinite(trk) || gs <= 0) continue;
    const nm = gs * (age / 3600000), r = trk * Math.PI / 180;
    out.push({ ...a, lat: a.lat + (nm/60)*Math.cos(r),
               lon: a.lon + (nm/60)*Math.sin(r)/Math.max(0.2, Math.cos(a.lat*Math.PI/180)),
               _coasted: Math.max(1, Math.round(age/1000)) });
  }
  return out;
}
/* Aircraft feed. Defaults to adsb.lol, which is free and CORS-open but
   PROHIBITS COMMERCIAL USE. Set "tb.adsbUrl" to an adsb-worker.js deployment to
   switch to a commercially-usable feed (adsb.lol / adsb.fi) — those send no CORS
   headers of their own, so the Worker is required, not optional. */
/* An empty card that explains itself. A board with no aircraft feed is not
   broken, it is unconfigured, and the difference matters to someone who just
   paid for this. */
function showPlanesUnconfigured(){
  const box=document.querySelector("#planeList"); if(!box) return;
  if(box.dataset.unconfigured==="1") return;       // don't rebuild every tick
  box.dataset.unconfigured="1";
  box.innerHTML='<div class="empty">No aircraft feed configured.<br>'
    + '<span style="opacity:.75">Add one in \u2699 Settings \u2192 Aircraft feed. '
    + 'See AIRCRAFT-FEED.md \u2014 it takes a few minutes and runs on your own machine.</span></div>';
  const c=document.querySelector("#planeCount"); if(c) c.textContent="";
}
function adsbBase(){
  /* NO DEFAULT, on purpose. This used to fall back to adsb.lol, which is
     free and CORS-open and PROHIBITS COMMERCIAL USE — so a product that ships
     with it baked in is in breach the day it is sold, however the feature is
     priced. Giving the planes away inside a paid app does not make the use
     non-commercial; it is still the seller's product calling that feed.

     So the seller ships no aircraft feed at all. The operator of each board
     supplies their own URL, on their own machine, under whatever terms they
     agree with the provider — which takes the seller out of the licence chain
     entirely. adsb-proxy.py in this repo is a ready-made one; AIRCRAFT-FEED.md
     is the setup. Unset, the card says so and nothing is fetched. */
  try{ var u=(localStorage.getItem("tb.adsbUrl")||"").trim().replace(/\/+$/,"");
       if(u) return u+"/v2"; }catch(e){}
  return "";
}
/* Throws when no feed is configured, so the callers below fail into their
   existing error handling instead of fetching a relative URL off this site. */
function adsbRequire(){
  const b = adsbBase();
  if(!b) throw new Error("no aircraft feed configured (see AIRCRAFT-FEED.md)");
  return b;
}
async function planeSubject(stop, pin){
  const {loc}=stop;
  const data=await getJSON(`${adsbRequire()}/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/${RADIUS_NM}`);
  const air=(coastPlanes(data.ac||[])).filter(a=>a.alt_baro!=="ground" && typeof a.lat==="number" && typeof a.lon==="number")
    .map(a=>({a, nm:a.dst!=null?a.dst:haversineNm(loc,{lat:a.lat,lon:a.lon})})).sort((x,y)=>x.nm-y.nm);
  if(!air.length) return null;
  let pick=null;
  if(pin){
    const m=air.find(x=>x.a.hex===pin.hex); if(!m) return null;
    pick={...m, route:orientRoute(await lookupRoute((m.a.flight||"").trim()), m.a)};
  }else{
    for(const x of air.filter(x=>/^[A-Z]{3}\d/.test((x.a.flight||"").trim())).slice(0,5)){
      const route=orientRoute(await lookupRoute((x.a.flight||"").trim()), x.a);
      if(route&&route.origin&&route.destination){ pick={...x,route}; break; }
    }
  }
  if(!pick) pick={...air[0], route:null};
  const {a,route}=pick, spd=a.gs?Math.round(a.gs):null, hdg=toDeg(a.track);
  const oLL=route&&typeof route.origin.latitude==="number"?{lat:route.origin.latitude,lon:route.origin.longitude}:null;
  const dLL=route&&typeof route.destination.latitude==="number"?{lat:route.destination.latitude,lon:route.destination.longitude}:null;
  const chips=[];
  if(typeof a.alt_baro==="number") chips.push({t:`${a.alt_baro.toLocaleString()} ft`});
  if(spd) chips.push({t:`${spd} kt`});
  if(typeof a.baro_rate==="number" && Math.abs(a.baro_rate)>=120) chips.push({t:`${a.baro_rate>0?"↗":"↘"} ${Math.abs(Math.round(a.baro_rate/10)*10).toLocaleString()} fpm`});
  if(hdg!=null) chips.push({t:`${Math.round(hdg)}° ${compassOf(hdg)}`, hdg:Math.round(hdg)});
  const sq=(a.squawk||"").trim(), em=(a.emergency||"").trim().toLowerCase();
  const emerg={"7500":"HIJACK","7600":"RADIO FAIL","7700":"EMERGENCY"}[sq] || (em&&em!=="none"?em.toUpperCase():null);
  if(emerg) chips.unshift({t:`⚠ ${emerg}`, cls:"badge-late"});
  if(!pin && air.length>1) chips.push({t:`${air.length} aircraft up`});
  return {
    kind:"plane", live:true, city:stop.city, feedLbl:stop.label, ref:{hex:a.hex},
    title: (route&&route.airline&&route.airline.name)||a.ownOp||(a.flight||"").trim()||"Aircraft",
    sub:[(a.flight||"").trim(), a.desc||a.t, a.r].filter(Boolean).join("  ·  "),
    oCity: route?(route.origin.municipality||route.origin.iata_code):null,
    dCity: route?(route.destination.municipality||route.destination.iata_code):null,
    subline: route?`${route.origin.iata_code||""} → ${route.destination.iata_code||""}`:(a.ownOp?"":"General aviation"),
    pos:{lat:a.lat,lon:a.lon}, oLL, dLL, heading:hdg, speedKt:spd||0, chips,
    photoHex:a.hex, arcRoute:true, zoom:8,
  };
}

/* ===================== AMTRAK subject (national, cached) ================= */
let amTrains=null, amStations=null, amAt=0;
async function ensureAmtrak(){
  if(amTrains && Date.now()-amAt<45000) return;
  const [tr, st]=await Promise.all([
    getJSON("https://api-v3.amtraker.com/v3/trains",15000),
    amStations?Promise.resolve(null):getJSON("https://api-v3.amtraker.com/v3/stations",15000).catch(()=>({})),
  ]);
  amTrains=tr; amAt=Date.now();
  if(st){ const m={}; for(const c in st){ const s=st[c]; if(typeof s.lat==="number") m[c]=[s.lat,s.lon]; } amStations=m; }
}
async function amtrakSubject(stop, pin){
  await ensureAmtrak(); const {loc}=stop, st=amStations||{}, list=[];
  let t=null;
  if(pin){ // stay mode: re-find the SAME train by number, wherever it's got to
    outer: for(const arr of Object.values(amTrains)) for(const x of (arr||[])){
      if(String(x.trainNum)===String(pin.num) && typeof x.lat==="number" && typeof x.lon==="number"
         && (!x.trainState || x.trainState==="Active")){ t=x; break outer; }
    }
    if(!t) return null;
  }else{
    for(const arr of Object.values(amTrains)) for(const x of (arr||[])){
      if(typeof x.lat!=="number"||typeof x.lon!=="number") continue;
      if(x.trainState && x.trainState!=="Active") continue;
      const nm=haversineNm(loc,{lat:x.lat,lon:x.lon});
      if(nm>260) continue;                         // keep Amtrak picks reasonably near this city
      list.push({t:x, nm});
    }
    list.sort((x,y)=>x.nm-y.nm); if(!list.length) return null;
    t=list[0].t;
  }
  const oLL=st[t.origCode]?{lat:st[t.origCode][0],lon:st[t.origCode][1]}:null;
  const dLL=st[t.destCode]?{lat:st[t.destCode][0],lon:st[t.destCode][1]}:null;
  const _hd=toDeg(t.heading);
  const hdg=_hd!=null?_hd:(dLL?bearingDeg({lat:t.lat,lon:t.lon},dLL):null);
  const ns=(t.stations||[]).find(s=>s.status!=="Departed");
  /* Amtrak's own track geometry gives the nicest line, but the bundle stores ONE
     shape per route NAME while a route can run wildly different variants — the
     "Northeast Regional" shape is a 224mi segment, and a BOS->Roanoke Regional
     (622mi, 27 stops) sits 163nm away from it. Drawing that shape put the line
     nowhere near the train and pinned progress at 0%. So only trust the shape
     when it actually covers THIS train's journey; otherwise the train's own
     station sequence is the honest path. */
  const shapes=await ensureAmtrakShapes();
  const shape=shapes[normAmtrakName(t.routeName)];
  const callPts=(t.stations||[]).map(x=>({...x, ll:st[x.code]})).filter(x=>x.ll);
  const callPath=callPts.map(x=>[x.ll[0],x.ll[1]]);
  const amPath=(shape && shape.length>1 && shapeCoversTrip(shape, callPath)) ? shape
             : (callPath.length>1 ? callPath : null);
  const amStops=callPts.map(x=>({lat:x.ll[0], lon:x.ll[1], name:x.name||x.code,
    done:x.status==="Departed", next:!!(ns && x.code===ns.code)}));
  const chips=[]; if(t.velocity) chips.push({t:`${Math.round(t.velocity)} mph`});
  if(hdg!=null) chips.push({t:`${Math.round(hdg)}° ${compassOf(hdg)}`, hdg:Math.round(hdg)});
  const late=(t.trainTimely||"").trim();
  if(late) chips.push({t:late, cls:/late/i.test(late)?"badge-late":"badge-ok"});
  if(ns){ const tm=ns.arr||ns.dep||ns.schArr||ns.schDep; const tt=tm?new Date(tm).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
    chips.push({t:`→ ${ns.name||ns.code}${tt?` · ${tt}`:""}`}); }
  if(!pin && list.length>1) chips.push({t:`${list.length} trains nearby`});
  return {
    kind:"train", live:true, city:stop.city, feedLbl:stop.label, ref:{num:t.trainNum},
    title:t.routeName||"Amtrak", sub:`Train ${t.trainNum} · Amtrak`,
    oCity:t.origName||t.origCode, dCity:t.destName||t.destCode,
    subline:`${t.origCode||""} → ${t.destCode||""}`,
    pos:{lat:t.lat,lon:t.lon}, oLL, dLL, heading:hdg, speedKt:(t.velocity||0)/1.15078, chips,
    path:amPath, stops:amStops,
    photoQuery:`Amtrak ${t.routeName||"train"} train`, zoom:9,
  };
}

/* ===================== bundled-schedule subject ========================= */
const bundleCache={};
async function ensureBundle(file){
  if(bundleCache[file]) return bundleCache[file];
  const s=await getJSON(file, 25000); s._coord={};
  (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon,st.name]; });
  bundleCache[file]=s; return s;
}
function ymd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
function nowParts(tz){
  const d=new Date();
  if(!tz) return { y:ymd(d), dow:(d.getDay()+6)%7, min:d.getHours()*60+d.getMinutes() };
  const p={}; new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short"})
    .formatToParts(d).forEach(x=>{ if(x.type!=="literal") p[x.type]=x.value; });
  const dow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[p.weekday];
  return { y:p.year+p.month+p.day, dow, min:(parseInt(p.hour,10)%24)*60+parseInt(p.minute,10) };
}
function activeServices(s, parts){
  const {y,dow}=parts, act=new Set();
  for(const id in s.svc){ const v=s.svc[id]; if(y>=v.start && y<=v.end && v.dow[dow]) act.add(id); }
  const ex=s.exc[y]; if(ex){ (ex.rem||[]).forEach(x=>act.delete(x)); (ex.add||[]).forEach(x=>act.add(x)); }
  /* Bundled calendars EXPIRE. Agencies publish only a few weeks ahead, and
     when the last date passes this set comes back empty and the card goes
     silently blank -- no error, just no trains (how LA Metro Rail vanished).
     refresh-schedules.py + the schedule-refresh workflow keep the bundles
     current; this is the last resort if that ever stops running: fall back
     to the same weekday from the calendar we do have. Times drift from
     reality as the bundle ages, so the boards label it "stale schedule"
     rather than passing it off as current. */
  if(!act.size){
    for(const id in s.svc){ const v=s.svc[id]; if(v.dow[dow]) act.add(id); }
    if(act.size) s._stale=true;
  }
  return act;
}
function minClock(min){ if(typeof min!=="number") return ""; const m=((Math.round(min)%1440)+1440)%1440;
  return new Date(2000,0,1,Math.floor(m/60),m%60).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
async function schedSubject(stop, pin){
  const s=await ensureBundle(stop.src); if(!s) return null;
  const p=nowParts(s.tz), active=activeServices(s,p); let best=null, running=0;
  s.trips.forEach(tr=>{
    if(pin && tr!==pin.trip) return;   // stay mode: track only the pinned trip
    if(!active.has(tr.s)) return; const seq=tr.st; if(seq.length<2) return;
    for(const now of [p.min, p.min+1440]){
      if(now<seq[0][1] || now>seq[seq.length-1][1]) continue;
      let k=0; while(k<seq.length-1 && seq[k+1][1]<=now) k++;
      const a=seq[k], b=seq[Math.min(k+1,seq.length-1)], ca=s._coord[a[0]], cb=s._coord[b[0]]; if(!ca||!cb) break;
      const f=b[1]>a[1]?(now-a[1])/(b[1]-a[1]):0;
      const lat=ca[0]+(cb[0]-ca[0])*f, lon=ca[1]+(cb[1]-ca[1])*f, nm=haversineNm(stop.loc,{lat,lon});
      running++;
      if(!best||nm<best.nm){ const first=s._coord[seq[0][0]], last=s._coord[seq[seq.length-1][0]];
        const segNm=haversineNm({lat:ca[0],lon:ca[1]},{lat:cb[0],lon:cb[1]}), segMin=Math.max(1,b[1]-a[1]);
        best={ nm, lat, lon, tr, first, last, ca, cb, nextName:cb[2], nextMin:b[1], nowMin:now,
          heading: bearingDeg({lat:ca[0],lon:ca[1]},{lat:cb[0],lon:cb[1]}), speedKt: segNm/(segMin/60) }; }
      break;
    }
  });
  if(!best) return null;
  const {tr,lat,lon,first,last,nextName,nextMin,heading,speedKt,nowMin}=best;
  /* The trip's own stop sequence IS the route — every intermediate station is
     already in the bundle, so the line can follow the timetable instead of
     cutting a straight chord from first stop to last. */
  const seqStops=tr.st.map(([id,min])=>{ const c=s._coord[id];
    return c ? {lat:c[0], lon:c[1], name:c[2], min, done:min<=nowMin, next:min===nextMin} : null;
  }).filter(Boolean);
  const seqPath=seqStops.map(x=>[x.lat,x.lon]);
  const chips=[]; if(speedKt>2) chips.push({t:`${Math.round(speedKt*1.15078)} mph`});
  chips.push({t:`${Math.round(heading)}° ${compassOf(heading)}`, hdg:Math.round(heading)});
  if(nextName) chips.push({t:`→ ${nextName}${nextMin!=null?` · ${minClock(nextMin)}`:""}`});
  if(!pin && running>1) chips.push({t:`${running} running now`});
  chips.push({t:"scheduled", cls:"sched-chip"});
  // "Route 23" for buses/trams, but rail lines are named ("Penn Line", "Far
  // Rockaway"), where a "Route" prefix reads wrong. A feed can also supply
  // lineNames to expand terse GTFS codes (Amsterdam's EST → "Eurostar").
  const lineName=(stop.lineNames && stop.lineNames[tr.line]) || tr.line;
  const title = (stop.kind==="bus"||stop.kind==="tram") ? `Route ${lineName}` : String(lineName||stop.label);
  return {
    kind:stop.kind, live:false, city:stop.city, feedLbl:stop.label, ref:{trip:tr},
    title, sub:`${tr.hs||""} · ${stop.label}`,
    oCity:first?first[2]:null, dCity:last?last[2]:(tr.hs||null),
    subline:"scheduled position",
    pos:{lat,lon}, oLL:first?{lat:first[0],lon:first[1]}:null, dLL:last?{lat:last[0],lon:last[1]}:null,
    path:seqPath.length>1?seqPath:null, stops:seqStops,
    heading, speedKt, chips, count:running,
    photoQuery:stop.photo, zoom: stop.kind==="tram"?14:12,
  };
}

async function fetchSubject(stop, pin){
  try{
    let s=null;
    if(stop.src==="plane")       s=await planeSubject(stop, pin);
    else if(stop.src==="amtrak") s=await amtrakSubject(stop, pin);
    else                         s=await schedSubject(stop, pin);
    if(s) s.stop=stop;           // keep the stop def around (stay-mode refetch, local time)
    return s;
  }catch(e){ return null; }
}
// stay mode: re-fetch the SAME vehicle, searching around wherever it is now
// (not the city center — a pinned plane can fly well past the city radius)
function refetchPinned(c){
  return fetchSubject({...c.stop, loc:{lat:c.pos.lat, lon:c.pos.lon}}, c.ref);
}

};
function vehIcon(kind, deg){
  return L.divIcon({ className:"tour-veh", iconSize:[30,30], iconAnchor:[15,15],

function initMap(){
  map=L.map("map",{ zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false,
    doubleClickZoom:false, boxZoom:false, keyboard:false, touchZoom:false, worldCopyJump:true })

/* ---- live precipitation radar (RainViewer -- free public tiles, no key).
   Latest composite frame as a translucent tile layer under the vectors; the
   frame list is re-checked every 5 min and the layer swapped only when a new
   frame exists (old one lingers a beat so tiles never flash). Planes visibly
   routing around storm cells is exactly the show this page is for. */
let radarTL=null;
async function refreshRadar(){
  try{
    const j=await getJSON("https://api.rainviewer.com/public/weather-maps.json", 10000);
    const fr=j&&j.radar&&j.radar.past&&j.radar.past[j.radar.past.length-1];
    if(!fr) return;
    const url=`${j.host}${fr.path}/256/{z}/{x}/{y}/2/1_1.png`;
    if(radarTL && radarTL._url===url) return;
    // RainViewer's public composite tops out at z7 (verified: z8+ returns
    // watermark tiles) -- Leaflet upscales beyond that, like any weather app
    const nl=L.tileLayer(url,{opacity:.55, maxNativeZoom:7});
    nl.addTo(map);
    const old=radarTL; radarTL=nl;
    if(old) setTimeout(()=>map.removeLayer(old), 1200);
  }catch(e){}
}
function initRadar(){ refreshRadar(); setInterval(refreshRadar, 5*60000); }

/* ---- day/night terminator: shade the actual night half of the planet ----
   Same low-precision solar position math as night.html. For each longitude,
   the latitude where the sun sits exactly on the horizon comes from
   tan(lat) = -cos(hourAngle)/tan(declination); closing the polygon over the
   winter pole covers the whole night hemisphere. The tour hops between
   continents, so stops visibly flip between daylight and night. */
let nightPoly=null;
function drawTerminator(){
  const rad=Math.PI/180, d=(Date.now()-Date.UTC(2000,0,1,12,0,0))/86400000;
  const meanLon=(280.460+0.9856474*d)%360, meanAnom=(357.528+0.9856003*d)%360;
  const eclLon=meanLon+1.915*Math.sin(meanAnom*rad)+0.020*Math.sin(2*meanAnom*rad);
  const obl=23.439-0.0000004*d;
  const ra=Math.atan2(Math.cos(obl*rad)*Math.sin(eclLon*rad), Math.cos(eclLon*rad))/rad;
  const decl=Math.asin(Math.sin(obl*rad)*Math.sin(eclLon*rad))/rad;
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  const ha0=gmst*15-(((ra%360)+360)%360);            // sun's hour angle at lon 0
  const pts=[];
  for(let lon=-180;lon<=180;lon+=3){
    const H=(ha0+lon)*rad;
    pts.push([Math.atan(-Math.cos(H)/Math.tan(decl*rad))/rad, lon]);
  }
  const pole=decl>0?-90:90;                          // night side wraps over the winter pole
  pts.push([pole,180],[pole,-180]);
  const np=L.polygon(pts,{pane:"nightshade", stroke:false, fillColor:"#01030a", fillOpacity:.42, interactive:false}).addTo(map);
  if(nightPoly) map.removeLayer(nightPoly);
  nightPoly=np;
}

/* ===================== render one stop ================================== */
let cur=null, driftTimer=null, dashTimer=null, flying=false, flyT=null;
function present(s){
  cur=s;
  applyPalette(s.kind);   // pour the mode's palette into the page BEFORE drawing (route/trail read it)
  // ---- map: draw route + endpoints, fly to the vehicle ----
  routeLayer.clearLayers(); trailPts=[]; if(trail){ trail=null; }
  /* The route line. Order of preference: a real path the feed gave us (Amtrak
     track geometry, or a timetable's own stop sequence), then a great circle
     for flights, and only then a straight chord. */
  s._line = s.path && s.path.length>1 ? orientPath(s.path, s.oLL, s.dLL)
          : (s.oLL && s.dLL ? (s.arcRoute ? greatCircle(s.oLL,s.dLL)
                                          : [[s.oLL.lat,s.oLL.lon],[s.dLL.lat,s.dLL.lon]])
                            : null);
  if(s._line){
    const prog=pathProgress(s._line, s.pos);
    /* Split the line at the vehicle so the distance already covered reads
       differently from the distance still to run. */
    let doneLine=null, restLine=s._line;
    if(prog && prog.total>0){
      let run=0, cut=0;
      for(let i=1;i<s._line.length;i++){
        const seg=haversineNm({lat:s._line[i-1][0],lon:s._line[i-1][1]},{lat:s._line[i][0],lon:s._line[i][1]});
        if(run+seg>=prog.done){ cut=i; break; }
        run+=seg; cut=i;
      }
      if(cut>0 && cut<s._line.length){
        doneLine=s._line.slice(0,cut+1).concat([[s.pos.lat,s.pos.lon]]);
        restLine=[[s.pos.lat,s.pos.lon]].concat(s._line.slice(cut));
      }
    }
    if(doneLine) L.polyline(doneLine,{color:getAccent(),weight:2,opacity:.22,interactive:false}).addTo(routeLayer);
    L.polyline(restLine,{color:getAccent(),weight:2.5,opacity:.55,dashArray:"3 10"}).addTo(routeLayer);

    /* Intermediate calling points, when the feed knows them. Kept small and
       non-interactive so they read as route texture, not clutter. */
    (s.stops||[]).forEach(st=>{
      if(st.next) return;   // the next stop gets its own brighter marker below
      L.marker([st.lat,st.lon],{interactive:false,icon:L.divIcon({className:"",
        html:`<span class="tour-stopdot${st.done?" done":""}"></span>`,iconSize:[7,7],iconAnchor:[3.5,3.5]})}).addTo(routeLayer);
    });
    const nextStop=(s.stops||[]).find(x=>x.next);
    if(nextStop){
      L.marker([nextStop.lat,nextStop.lon],{interactive:false,icon:L.divIcon({className:"",
        html:'<span class="tour-nextdot"></span>',iconSize:[13,13],iconAnchor:[6.5,6.5]})}).addTo(routeLayer);
      L.marker([nextStop.lat,nextStop.lon],{interactive:false,
        icon:L.divIcon({className:"endpt-label next",html:escapeHtml(nextStop.name||"")})}).addTo(routeLayer);
    }
  }
  if(s.oLL && s.dLL){
    [s.oLL,s.dLL].forEach(p=> L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:'<span class="tour-endpt"></span>',iconSize:[11,11],iconAnchor:[5,5]})}).addTo(routeLayer));
    if(s.oCity) L.marker([s.oLL.lat,s.oLL.lon],{icon:L.divIcon({className:"endpt-label",html:escapeHtml(s.oCity)}),interactive:false}).addTo(routeLayer);
    if(s.dCity) L.marker([s.dLL.lat,s.dLL.lon],{icon:L.divIcon({className:"endpt-label",html:escapeHtml(s.dCity)}),interactive:false}).addTo(routeLayer);
  }
  veh=L.marker([s.pos.lat,s.pos.lon],{icon:vehIcon(s.kind, s.heading||0),zIndexOffset:1000}).addTo(routeLayer);
  veh.on("click", toggleStay);   // tapping the vehicle = stay with it
  trail=L.polyline([[s.pos.lat,s.pos.lon]],{color:getAccent(),weight:3,opacity:.45}).addTo(routeLayer);
  // The drift loop's edge-of-view panTo would CANCEL this flyTo mid-animation
  // (Leaflet aborts a running fly on any new map movement), stranding the map
  // zoomed way out -- so flag the flight window and let drift wait it out.
  // Center the map a bit SOUTH of the vehicle so the vehicle settles in the
  // upper part of the screen, clear of the info card along the bottom.
  const tz=s.zoom||9;
  const ctr=map.unproject(map.project([s.pos.lat,s.pos.lon], tz).add([0, map.getSize().y*0.16]), tz);
  flying=true; clearTimeout(flyT);
  flyT=setTimeout(()=>{ flying=false;
    // Safety net: flyTo is rAF-driven, and rAF is suspended in hidden/
    // throttled tabs -- if the fly stalled, snap straight to the destination
    // so the tour never lingers zoomed out over nothing.
    if(Math.abs(map.getZoom()-tz)>0.5) map.setView(ctr, tz, {animate:false});
  }, 2800);
  map.flyTo(ctr, tz, {duration:2.6, easeLinearity:.25});
  animateDashes();
  startDrift();
  fillCard(s);
  loadPhoto(s);
  loadWeather(s);
  logStop(s);
}
function getAccent(){ return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#7db8ff"; }

// flowing dashes along the route line
function animateDashes(){
  clearInterval(dashTimer); let off=0;
  dashTimer=setInterval(()=>{ off=(off-1)%1000; routeLayer.eachLayer(l=>{ if(l._path && l.options.dashArray) l._path.style.strokeDashoffset=off; }); }, 45);
}
// glide the vehicle forward from its own speed + heading, drop a comet trail
function startDrift(){
  clearInterval(driftTimer);
  if(!cur || cur.heading==null || !(cur.speedKt>3)){ return; }
  const stepMs=280;
  driftTimer=setInterval(()=>{
    if(paused || !cur) return;
    const nmPerStep=cur.speedKt*(stepMs/3600000);
    cur.pos=moveLL(cur.pos, cur.heading, nmPerStep);
    veh.setLatLng([cur.pos.lat,cur.pos.lon]);
    trailPts.push([cur.pos.lat,cur.pos.lon]); if(trailPts.length>26) trailPts.shift();
    if(trail) trail.setLatLngs(trailPts);
    if(flying) return;   // don't interrupt the fly-in (see present())
    const b=map.getBounds().pad(-0.22); if(!b.contains([cur.pos.lat,cur.pos.lon])) map.panTo([cur.pos.lat,cur.pos.lon],{animate:true,duration:1.4});
  }, stepMs);
}

function chipHtml(c){
  const arrow = c.hdg!=null ? `<span class="hdg-arrow" style="transform:rotate(${c.hdg}deg)">↑</span> ` : "";
  const cls = c.cls==="sched-chip" ? "" : (c.cls||"");
  return `<span class="c ${cls}">${arrow}${escapeHtml(c.t)}</span>`;
}
function fillCard(s){
  $("#modeIc").textContent = MODE_IC[s.kind]||"AIR";
  $("#feedLbl").textContent = s.feedLbl;   // the big .city line right below already names the city
  $("#liveTag").className = s.live?"live":"sched"; $("#liveTag").textContent = s.live?"LIVE":"SCHED";
  $("#city").textContent = s.city;
  $("#title").textContent = s.title||"";
  $("#sub").textContent = s.sub||"";
  const r=$("#route");
  if(s.dCity){ r.style.display="";
    r.innerHTML = (s.oCity?`<span class="r">${escapeHtml(s.oCity)}</span><span class="arw">→</span>`:`<span class="arw">→</span>`)
      + `<span class="r">${escapeHtml(s.dCity)}</span>` + (s.subline?`<span class="r dim">${escapeHtml(s.subline)}</span>`:"");
  } else r.style.display="none";
  $("#chips").innerHTML = (s.chips||[]).map(chipHtml).join("");
  // progress bar — measured ALONG the route being travelled when we have one,
  // so a train that curves round a bay isn't credited a straight-line shortcut.
  const prog=$("#prog");
  const pp = s._line ? pathProgress(s._line, s.pos) : null;
  let tot=null, flown=null, toGo=null;
  if(pp && pp.total>1){ tot=pp.total; flown=pp.done; toGo=Math.max(0,pp.total-pp.done); }
  else if(s.oLL && s.dLL){
    tot=haversineNm(s.oLL,s.dLL);
    if(tot>1){ toGo=Math.max(0,haversineNm(s.pos,s.dLL)); flown=Math.max(0,tot-toGo); } else tot=null;
  }
  if(tot){
    const pct=Math.max(0,Math.min(1,flown/tot));
    const conv = s.kind==="plane"?1:1.15078, u = s.kind==="plane"?"nm":"mi";
    const verb = s.kind==="plane"?"flown":"travelled";
    prog.style.display=""; $("#progFill").style.width=(pct*100).toFixed(1)+"%"; $("#progDot").style.left=(pct*100).toFixed(1)+"%";
    $("#progFlown").textContent=`${Math.round(flown*conv).toLocaleString()} ${u} ${verb}`;
    $("#progPct").textContent=`${Math.round(pct*100)}%`;
    $("#progToGo").textContent=`${Math.round(toGo*conv).toLocaleString()} ${u} to go`;
  } else prog.style.display="none";
  $("#card").classList.add("in");
}
/* ===================== weather where the vehicle is ====================== */
/* open-meteo: free, no key, CORS-open — the same "works straight from the
   browser" test every other feed on these boards has to pass. */
const WMO={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",
  55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",
  67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  77:"Snow grains",80:"Rain showers",81:"Rain showers",82:"Heavy showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorm",
  96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
const wxCache=new Map();
let wxTok=0;
async function loadWeather(s){
  const tok=++wxTok, box=$("#wx");
  box.className="wx"; box.innerHTML="";
  if(!s.pos || typeof s.pos.lat!=="number") return;
  /* Round to ~11km and cache 15 min: consecutive stops in the same city would
     otherwise re-ask for weather that cannot meaningfully have changed. */
  const key=`${s.pos.lat.toFixed(1)},${s.pos.lon.toFixed(1)}`;
  let w=wxCache.get(key);
  if(!w || Date.now()-w.at>900000){
    try{
      const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${s.pos.lat.toFixed(3)}`+
        `&longitude=${s.pos.lon.toFixed(3)}&current=temperature_2m,weather_code,wind_speed_10m`+
        `&temperature_unit=fahrenheit&wind_speed_unit=mph`, 9000);
      if(!j || !j.current) return;
      w={at:Date.now(), c:j.current}; wxCache.set(key,w);
    }catch(e){ return; }                      // weather is a nicety; never break the card over it
  }
  if(tok!==wxTok) return;                     // a newer stop took over while we waited
  const c=w.c, d=WMO[c.weather_code]||"—";
  const wind=Math.round(c.wind_speed_10m||0);
  box.innerHTML=`<span class="t">${Math.round(c.temperature_2m)}°F</span>`+
    `<span class="sep">·</span><span>${escapeHtml(d)}</span>`+
    (wind>1?`<span class="sep">·</span><span>${wind} mph wind</span>`:"")+
    `<span class="sep">·</span><span>at the ${s.kind==="plane"?"aircraft":"vehicle"}</span>`;
  box.classList.add("show");
}

/* ===================== tour log ========================================== */
const LOG_MAX=200;
let tourLog=(()=>{ try{ return JSON.parse(localStorage.getItem("tour.log"))||[]; }catch(e){ return []; } })();
function saveLog(){ try{ localStorage.setItem("tour.log",JSON.stringify(tourLog.slice(0,LOG_MAX))); }catch(e){} }
function logStop(s){
  const e={t:Date.now(), kind:s.kind, city:s.city, feed:s.feedLbl,
           title:s.title||"", sub:s.sub||"", live:!!s.live};
  /* Staying with one vehicle re-presents the same subject every few seconds —
     collapse that into the single entry it really is. */
  const p=tourLog[0];
  if(p && p.kind===e.kind && p.city===e.city && p.title===e.title && p.sub===e.sub){ p.t=e.t; }
  else tourLog.unshift(e);
  if(tourLog.length>LOG_MAX) tourLog.length=LOG_MAX;
  saveLog();
  if($("#log").classList.contains("show")) renderLog();
}
function renderLog(){
  const body=$("#logBody");
  $("#logCount").textContent = tourLog.length ? `${tourLog.length} stop${tourLog.length===1?"":"s"}` : "";
  if(!tourLog.length){ body.innerHTML='<div class="log-empty">Nothing yet — the tour logs each stop as it plays.</div>'; return; }
  body.innerHTML=tourLog.map(e=>{
    const when=new Date(e.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return `<div class="log-row"><div class="ic">${MODE_IC[e.kind]||"•"}</div><div>`+
      `<div class="l1">${escapeHtml(e.title||e.city)}</div>`+
      `<div class="l2">${escapeHtml(e.city)} · ${escapeHtml(e.feed||"")}</div>`+
      (e.sub?`<div class="l3">${escapeHtml(e.sub)}</div>`:"")+
      `<div class="l3">${when}${e.live?" · live":" · scheduled"}</div>`+
      `</div></div>`;
  }).join("");
}
function toggleLog(){ $("#log").classList.contains("show") ? closeLog() : openLog(); }
function openLog(){ renderLog(); $("#log").classList.add("show"); }
function closeLog(){ $("#log").classList.remove("show"); }

let photoTok=0;
async function loadPhoto(s){
  const tok=++photoTok, img=$("#photo"), cred=$("#photoCred");
  img.style.display="none"; cred.style.display="none";
  const v = s.photoHex ? await planePhoto(s.photoHex) : (s.photoQuery? await wikiPhoto(s.photoQuery) : null);
  if(tok!==photoTok || !v || !v.src) return;        // a newer stop took over while we waited
  img.src=v.src; img.style.display="block";
  cred.style.display="block";
  cred.innerHTML = v.rep
    ? `<a href="${escapeHtml(v.link)}" target="_blank" rel="noopener">${v.cred?escapeHtml(v.cred)+" · ":""}Wikimedia (representative)</a>`
    : `<a href="${escapeHtml(v.link)}" target="_blank" rel="noopener">${v.cred?"© "+escapeHtml(v.cred)+" · ":""}planespotters.net</a>`;
}

/* ===================== the shuffle loop ================================= */
let order=[], oi=0, paused=false, holdTimer=null, holdStart=0, ringRAF=null, nextPrefetch=null;
let hist=[];                       // recently shown subjects, for the ⏮ button
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* which cities/modes are in the rotation — ⚙ settings, persisted. A key
   missing from the pref object means "on"; everything-off falls back to all. */
function loadPref(k){ try{ return JSON.parse(localStorage.getItem(k)||"null")||{}; }catch(e){ return {}; } }
let cityPref=loadPref("tour.cities"), modePref=loadPref("tour.modes");
function savePrefs(){ try{ localStorage.setItem("tour.cities",JSON.stringify(cityPref));
  localStorage.setItem("tour.modes",JSON.stringify(modePref)); }catch(e){} }
function stopEnabled(st){ return cityPref[st.cityKey]!==false && modePref[st.kind]!==false; }
function activeIdx(){
  const a=STOPS.map((_,i)=>i).filter(i=>stopEnabled(STOPS[i]));
  return a.length ? a : STOPS.map((_,i)=>i);
}
function buildOrder(){ order=shuffle(activeIdx()); oi=0; }
function renderQueue(){
  const q=$("#queue"), html=[];
  for(let k=0;k<6;k++){
    const st=STOPS[order[(oi+k)%order.length]]; if(!st) break;
    const p=MODE_PAL[st.kind]||MODE_PAL.plane;
    /* A city can appear more than once in the queue with different feeds
       (Philadelphia's Amtrak and its SEPTA rail are separate stops), so the
       chip carries the feed name too — city alone read as a duplicate. */
    const txt=`${MODE_IC[st.kind]} ${escapeHtml(st.city)}<i>${escapeHtml(st.label)}</i>`;
    html.push(k===0
      ? `<button class="chip now" data-k="0" title="Showing now" style="background:linear-gradient(135deg,${p.a},${p.b});border-color:${p.a};color:#04101f">${txt}</button>`
      : `<button class="chip" data-k="${k}" title="Jump to ${escapeHtml(st.city)} · ${escapeHtml(st.label)} (${k+1})" style="color:${p.a};border-color:${p.a}55;background:${p.a}14"><span class="qn">${k+1}</span>${txt}</button>`);
  }
  q.innerHTML=html.join("");
}
/* Jump straight to a queue position instead of waiting for the shuffle to
   reach it. k is the offset shown on the chip; 0 is what's already playing. */
function jumpTo(k){
  if(!order.length || !(k>0)) return;
  oi=(oi+k)%order.length;
  advance();
}
function flash(city){ $("#flashBig").textContent=city; $("#flash").classList.add("show"); }
function unflash(){ $("#flash").classList.remove("show"); }

function advanceNext(){ oi=(oi+1)%order.length; if(oi===0) buildOrder(); advance(); }
async function advance(){
  clearTimeout(holdTimer); cancelAnimationFrame(ringRAF);
  endStay();
  if(oi>=order.length) oi=0;         // order can shrink when filters change
  $("#card").classList.remove("in");
  renderQueue();
  // find the next stop that actually has a vehicle (try several before giving up)
  let s=null, tries=0;
  if(nextPrefetch && nextPrefetch.idx===order[oi]){ s=nextPrefetch.subject; nextPrefetch=null; }
  while(!s && tries<STOPS.length){
    const stop=STOPS[order[oi]];
    if(!(nextPrefetch && nextPrefetch.used)) flash(stop.city);
    s=await fetchSubject(stop);
    if(!s){ oi=(oi+1)%order.length; tries++; if(oi===0) buildOrderKeepPos(); }
  }
  unflash();
  if(!s){ // nothing anywhere right now — wait and retry
    holdTimer=setTimeout(advance, 4000); return;
  }
  if(cur){ hist.push(cur); if(hist.length>14) hist.shift(); }
  present(s);
  startRing();
  prefetchNext();
  holdTimer=setTimeout(advanceNext, holdMs);
  holdStart=Date.now();
}
function buildOrderKeepPos(){ const seen=order.slice(0,oi); order=seen.concat(shuffle(activeIdx())); }
async function prefetchNext(){
  const idx=order[(oi+1)%order.length]; const stop=STOPS[idx];
  try{ const subject=await fetchSubject(stop); nextPrefetch={idx, subject, used:true}; }catch(e){ nextPrefetch=null; }
}
function startRing(){
  const C=$("#ringC"), R=18.5, LEN=2*Math.PI*R; C.style.strokeDasharray=LEN;
  const tick=()=>{ const el=Math.min(1,(Date.now()-holdStart)/holdMs); C.style.strokeDashoffset=(LEN*el).toFixed(1);
    if(el<1 && !paused) ringRAF=requestAnimationFrame(tick); };
  holdStart=Date.now(); ringRAF=requestAnimationFrame(tick);
}

/* ===================== controls ======================================== */
function togglePause(){ paused=!paused; $("#pauseBtn").textContent=paused?"▶":"⏸";
  if(paused){ clearTimeout(holdTimer); cancelAnimationFrame(ringRAF); }
  else if(!stay){ const left=Math.max(0,holdMs-(Date.now()-holdStart)); holdStart=Date.now()-(holdMs-left);
    holdTimer=setTimeout(advanceNext, left); startRing(); } }
function skip(){ clearTimeout(holdTimer); advanceNext(); }
function goBack(){
  if(!hist.length) return;
  clearTimeout(holdTimer); cancelAnimationFrame(ringRAF); endStay();
  nextPrefetch=null;
  present(hist.pop());               // its pos kept drifting while stored — resumes seamlessly
  startRing();
  holdTimer=setTimeout(advanceNext, holdMs);
}

/* ---- stay mode: hold the tour on this vehicle, keep its data LIVE ----
   Unlike pause (which freezes the countdown and lets dead reckoning run
   open-loop), stay re-fetches the same vehicle every 20 s, correcting
   position/heading/speed and refreshing the chips. When the vehicle stops
   reporting (landed / run ended), the tour resumes on its own. */
let stay=false, stayTimer=null, stayMiss=0;
function setStayUI(on){ const b=$("#stayBtn"); b.classList.toggle("on",on);
  b.title=on?"Resume the tour (S)":"Stay with this vehicle (S)"; }
function endStay(){ if(!stay) return; stay=false; clearInterval(stayTimer); setStayUI(false); }
function toggleStay(){
  if(stay){ endStay(); holdStart=Date.now(); holdTimer=setTimeout(advanceNext, holdMs); startRing(); return; }
  if(!cur || !cur.ref) return;
  stay=true; stayMiss=0; setStayUI(true);
  clearTimeout(holdTimer); cancelAnimationFrame(ringRAF);
  const C=$("#ringC"); if(C) C.style.strokeDashoffset=(2*Math.PI*18.5).toFixed(1);  // ring off while staying
  stayTimer=setInterval(refreshStay, 20000);
}
async function refreshStay(){
  if(!stay || !cur || !cur.stop || !cur.ref) return;
  const s=await refetchPinned(cur);
  if(!stay) return;                  // toggled off while the fetch was in flight
  if(!s){ if(++stayMiss>=2){ endStay(); advanceNext(); } return; }
  stayMiss=0;
  cur.pos=s.pos; cur.heading=s.heading; cur.speedKt=s.speedKt; cur.chips=s.chips; cur.ref=s.ref;
  veh.setLatLng([cur.pos.lat,cur.pos.lon]);
  const el=veh.getElement&&veh.getElement(), rot=el&&el.querySelector(".rot");
  if(rot) rot.style.transform=`rotate(${cur.heading||0}deg)`;
  fillCard(cur);
}

/* ---- ⚙ settings: pace + city/mode filters ---- */
function buildSettings(){
  const seg=$("#paceSeg");
  seg.innerHTML=PACES.map(v=>`<button data-v="${v}" class="${v===holdMs?"on":""}">${v/1000}s</button>`).join("");
  seg.querySelectorAll("button").forEach(b=> b.onclick=()=>{
    holdMs=parseInt(b.dataset.v,10);
    try{ localStorage.setItem("tour.pace",String(holdMs)); }catch(e){}
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    if(!paused && !stay){ clearTimeout(holdTimer); holdStart=Date.now();
      holdTimer=setTimeout(advanceNext, holdMs); startRing(); }
  });
  const cc=$("#cityChecks");
  cc.innerHTML=CITIES.map(c=>`<label data-k="${c.key}" class="${cityPref[c.key]!==false?"on":""}">${escapeHtml(c.label)}</label>`).join("");
  cc.querySelectorAll("label").forEach(l=> l.onclick=()=>{
    const k=l.dataset.k; cityPref[k]=!(cityPref[k]!==false);
    l.classList.toggle("on",cityPref[k]!==false);
    savePrefs(); buildOrderKeepPos(); renderQueue();
  });
  const MODES=["plane","train","bus","tram"];
  const mc=$("#modeChecks");
  mc.innerHTML=MODES.map(([k,lbl])=>`<label data-k="${k}" class="${modePref[k]!==false?"on":""}">${lbl}</label>`).join("");
  mc.querySelectorAll("label").forEach(l=> l.onclick=()=>{
    const k=l.dataset.k; modePref[k]=!(modePref[k]!==false);
    l.classList.toggle("on",modePref[k]!==false);
    savePrefs(); buildOrderKeepPos(); renderQueue();
  });
}
/* Full screen must act on the TOP document. Boards run inside the same-origin
   cityswitch.js shell iframe, where the fullscreen element belongs to the outer
   document — so document.fullscreenElement reads null inside the frame and
   document.exitFullscreen() silently no-ops, which is why Exit did nothing. */
function fsDoc(){
  try{ if(window.top && window.top!==window && window.top.document) return window.top.document; }catch(e){}
  return document;
}
function fsElement(){ const d=fsDoc(); return d.fullscreenElement || d.webkitFullscreenElement; }
function toggleFS(){ const d=fsDoc(), el=d.documentElement;
  if(fsElement()){ const ex=d.exitFullscreen||d.webkitExitFullscreen; if(ex) ex.call(d); return; }
  /* The licence check lives HERE rather than on the button, so that every way
     in is covered -- the button, the F key, and whatever gets added next. On
     the button alone it was one keystroke to walk past the only lock on the
     feature the licence exists to sell, and the button's own tooltip named the
     shortcut. Note the position: AFTER the exit branch, because leaving full
     screen is never gated. Trapping somebody in it is a bug, not a sale. */
  if(window.TBGate && !TBGate.require("fullscreen")) return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen; if(!req){ hintFS(); return; }
  try{ const p=req.call(el); if(p&&p.catch) p.catch(hintFS); }catch(e){ hintFS(); } }
let hintT=null;
function hintFS(){ let t=$("#fsHint"); if(!t){ t=document.createElement("div"); t.id="fsHint"; document.body.appendChild(t); }
  t.textContent="Full screen is blocked here — open this page in its own tab (or the deployed link)."; t.classList.add("show");
  clearTimeout(hintT); hintT=setTimeout(()=>t.classList.remove("show"),4200); }

function clock(){
  $("#clock").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  // the visited city's own local time, on the card — half the fun of a world tour
  const ct=$("#cityTime");
  if(cur && cur.stop && cur.stop.tz){
    try{ ct.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",timeZone:cur.stop.tz})+" local"; }
    catch(e){ ct.textContent=""; }
  } else ct.textContent="";
}

function boot(){
  initMap();
  buildOrder();
  buildSettings();
  $("#pauseBtn").onclick=togglePause; $("#skipBtn").onclick=skip; $("#fsBtn").onclick=toggleFS;
  $("#backBtn").onclick=goBack; $("#stayBtn").onclick=toggleStay;
  $("#setBtn").onclick=()=>$("#settings").classList.toggle("show");
  document.addEventListener("keydown",e=>{ if(/^(input|textarea)$/i.test(e.target.tagName)) return;
    if(e.key===" "){ e.preventDefault(); togglePause(); } else if(e.key==="ArrowRight") skip();
    else if(e.key==="ArrowLeft") goBack();
    else if(e.key==="s"||e.key==="S") toggleStay();
    else if(e.key==="Escape"){ $("#settings").classList.remove("show"); closeLog(); }
    else if(e.key==="l"||e.key==="L") toggleLog();
    else if(e.key==="f"||e.key==="F") toggleFS();
    else if(/^[1-6]$/.test(e.key)) jumpTo(parseInt(e.key,10)-1); });
  $("#queue").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(b) jumpTo(parseInt(b.dataset.k,10));
  });
  $("#logBtn").addEventListener("click",toggleLog);
  $("#logClose").addEventListener("click",closeLog);
  $("#logClear").addEventListener("click",()=>{ tourLog=[]; saveLog(); renderLog(); });
  const onFs=()=>{ setTimeout(()=>map&&map.invalidateSize(),200); };
  document.addEventListener("fullscreenchange", onFs);
  try{ if(fsDoc()!==document) fsDoc().addEventListener("fullscreenchange", onFs); }catch(e){}
  clock(); setInterval(clock,1000);
  keepAwake();
  advance();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
</body>
</html>
