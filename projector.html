<title>Transit Project — Projector</title>
<!--
  projector.html — the sky above you, thrown onto the room.

  A projector is not a screen. Black costs nothing (it is the absence of
  light), so the page is black almost everywhere and only things that are
  actually there are lit: stars, the moon, aircraft, trains. And it is aimed
  at a surface, so the picture has to describe where the surface points.

  Two surfaces:

    CEILING   A planetarium dome. The zenith is the centre of the circle and
              the horizon is its rim, drawn as seen FROM BELOW (east is left
              of north, like a star chart held overhead). Turn "North" until
              the N on the rim points at the room's real north and every
              star, the moon and every aircraft is right where it is through
              the roof. Next departures circle the rim.

    WALL      A window. Say which way the wall faces and the page renders the
              view through it with a 90 degree lens: the
              horizon, the stars and aircraft in that direction, a skyline,
              and a track with the nearest Metro station's trains sliding in
              to it in real time.

  Projector controls (S or the gear): keystone corner-pin (drag the corners,
  or 1-4 + arrows on a remote), mirror for rear / bounced projection,
  brightness, constellation lines and labels. Everything persists in
  localStorage under tb.proj.*.

  Data (all optional — a missing source says so and steps aside):
    Location   city preset, or a saved observer when opening the generic URL
    Aircraft   the operator's own feed, tb.adsbUrl — never a default (see
               adsbBase() in night.html for why)
    Metro      WMATA live predictions (transitboard.wmataKey / config.js)
    Weather    Open-Meteo, no key
    Sky        computed here: ~110 bright stars, moon + phase, sun for twilight

  URL:  projector.html?city=nyc&surface=ceiling|wall&face=180&demo=1
        projector-cities.html lists every distinct city page.
        demo=1 fills an empty sky with sample aircraft and trains, labelled
        as a demo on screen.
-->

<script>
"use strict";
/* ======================================================================= */
const $ = s => document.querySelector(s);
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } };
const lsSet = (k,v) => { try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
const lsJSON = (k,d) => { try{ const v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return d; } };
const Q = new URLSearchParams(location.search);
const DEMO = Q.get("demo")==="1";

const cityData=window.TBProjectorCities;
const savedLocation=lsJSON("transitboard.loc",null);
const requestedCity=cityData.get(Q.get("city"));
const city=requestedCity||cityData.get(lsGet("tb.proj.city",""))||cityData.nearest(savedLocation);
// Explicit city pages use that city's observer, independently of the board's
// location. Opening the original generic URL still honours a nearby observer.
const useSavedObserver=!requestedCity&&cityData.validLocation(savedLocation)&&cityData.nearest(savedLocation).id===city.id;
const loc=useSavedObserver?{...savedLocation,label:city.name}:{lat:city.lat,lon:city.lon,label:city.name};
document.title=`${city.name} — Projector | Transit Project`;
document.documentElement.dataset.city=city.id;
lsSet("tb.proj.city",city.id);
const wmataKey = lsGet("transitboard.wmataKey","") || ((window.TB_CONFIG||{}).wmataKey||"");
const adsbUrl = (lsGet("tb.adsbUrl","")||"").trim().replace(/\/+$/,"");

const RAIL_COLORS = { RD:"#BF0D3E", BL:"#009CDE", YL:"#FFD100", OR:"#ED8B00", GR:"#00B140", SV:"#919D9D" };
const RAIL_NAMES  = { RD:"Red", BL:"Blue", YL:"Yellow", OR:"Orange", GR:"Green", SV:"Silver" };
city.routes.forEach(r=>{if(!RAIL_COLORS[r[0]])RAIL_COLORS[r[0]]=r[2];});

/* ---- settings ----------------------------------------------------------- */
function finiteSetting(value,fallback){const n=Number(value);return Number.isFinite(n)?n:fallback;}
function degrees(value,fallback){const n=finiteSetting(value,fallback);return ((n%360)+360)%360;}
const savedKeystone=lsJSON("tb.proj.keystone",null);
const validKeystone=Array.isArray(savedKeystone)&&savedKeystone.length===4&&savedKeystone.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite));
const S = {
  surface: (Q.get("surface")||(requestedCity?"wall":lsGet("tb.proj.surface","ceiling")))==="wall" ? "wall" : "ceiling",
  face:  degrees(Q.get("face")!=null?Q.get("face"):lsGet("tb.proj.face","180"),180),
  north: degrees(lsGet("tb.proj.north","0"),0),
  bright:Math.max(25,Math.min(100,finiteSetting(lsGet("tb.proj.bright","85"),85))),
  mirror: lsGet("tb.proj.mirror","0")==="1",
  lines:  lsGet("tb.proj.lines","1")==="1",
  labels: lsGet("tb.proj.labels","1")==="1",
  detail: lsGet("tb.proj.detail","1")==="1",
  motion: lsGet("tb.proj.motion","1")==="1" && !matchMedia("(prefers-reduced-motion: reduce)").matches,
  ks:     validKeystone?savedKeystone:null      // [[fx,fy] x4] fractions of the viewport
};
function save(){
  lsSet("tb.proj.surface", S.surface); lsSet("tb.proj.face", String(S.face));
  lsSet("tb.proj.north", String(S.north)); lsSet("tb.proj.bright", String(S.bright));
  lsSet("tb.proj.mirror", S.mirror?"1":"0"); lsSet("tb.proj.lines", S.lines?"1":"0");
  lsSet("tb.proj.labels", S.labels?"1":"0");
  lsSet("tb.proj.detail", S.detail?"1":"0");lsSet("tb.proj.motion", S.motion?"1":"0");
  lsSet("tb.proj.keystone", S.ks ? JSON.stringify(S.ks) : null);
}

/* ---- astronomy ----------------------------------------------------------
   Low-precision, plenty for a picture: positions good to well under a
   degree. Precession since J2000 (~0.35 degrees) is ignored. */
const D2R=Math.PI/180, R2D=180/Math.PI;
const wrap360=a=>((a%360)+360)%360;
const wrap180=a=>{ a=wrap360(a); return a>180?a-360:a; };
const jdays = t => t/864e5 + 2440587.5 - 2451545.0;          // days since J2000
function lstDeg(t){ return wrap360(280.46061837 + 360.98564736629*jdays(t) + loc.lon); }
function raDecToAltAz(raDeg, decDeg, lst){
  const ha=(lst-raDeg)*D2R, dec=decDeg*D2R, lat=loc.lat*D2R;
  const sa=Math.sin(dec)*Math.sin(lat)+Math.cos(dec)*Math.cos(lat)*Math.cos(ha);
  const alt=Math.asin(sa);
  const az=Math.atan2(-Math.sin(ha)*Math.cos(dec), Math.cos(lat)*Math.sin(dec)-Math.sin(lat)*Math.cos(dec)*Math.cos(ha));
  return { alt:alt*R2D, az:wrap360(az*R2D) };
}
function eclToEq(lonDeg, latDeg){
  const e=23.439*D2R, l=lonDeg*D2R, b=latDeg*D2R;
  const ra=Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e), Math.cos(l));
  const dec=Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l));
  return { ra:wrap360(ra*R2D), dec:dec*R2D };
}
function sunEcl(t){
  const d=jdays(t), g=(357.529+0.98560028*d)*D2R, q=280.459+0.98564736*d;
  return wrap360(q+1.915*Math.sin(g)+0.020*Math.sin(2*g));
}
function moonEcl(t){
  const d=jdays(t);
  const L=218.316+13.176396*d, M=(134.963+13.064993*d)*D2R, F=(93.272+13.229350*d)*D2R;
  const D=(297.850+12.190749*d)*D2R;
  return { lon:wrap360(L+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+0.658*Math.sin(2*D)), lat:5.128*Math.sin(F) };
}

const STAR_IDX={}; STARS.forEach((s,i)=>STAR_IDX[s[0]]=i);
const CONST=[
 ["Orion",[["Betelgeuse","Bellatrix"],["Bellatrix","Mintaka"],["Mintaka","Alnilam"],["Alnilam","Alnitak"],["Betelgeuse","Alnitak"],["Alnitak","Saiph"],["Mintaka","Rigel"],["Rigel","Saiph"]]],

/* ---- canvas + projection ------------------------------------------------ */
const cv=$("#sky"), cx=cv.getContext("2d");
let W=0, H=0, DPR=1;
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  buildSkyline(); applyKeystone(); placeHandles();
}
/* Geometry of the current surface, recomputed each frame (it is cheap). */
let G={};
function geom(){
  if(S.surface==="ceiling"){
    const R=Math.min(W,H)/2*0.97;
    G={ kind:"ceiling", cx:W/2, cy:H/2, R, Rs:R*0.885, fs:Math.max(11,R*0.042) };
  }else{
    const hfov=90*D2R;
    G={ kind:"wall", focal:(W/2)/Math.tan(hfov/2), hy:H*0.70, fs:Math.max(11,Math.min(W,H)*0.024) };
  }
}
/* az/alt (degrees) -> screen point, or null when it is not on this surface. */
function proj(az, alt){
  if(G.kind==="ceiling"){
    if(alt < -1) return null;
    const r=(90-alt)/90*G.Rs, th=(az+S.north)*D2R;
    // Seen from below: north up puts east on the LEFT.
    return { x:G.cx - Math.sin(th)*r, y:G.cy - Math.cos(th)*r };
  }
  const daz=wrap180(az-S.face)*D2R, el=alt*D2R;
  const f=Math.cos(el)*Math.cos(daz);
  if(f<0.08) return null;
  const rt=Math.cos(el)*Math.sin(daz), up=Math.sin(el);
  return { x:W/2 + rt/f*G.focal, y:G.hy - up/f*G.focal };
}
const onScreen=p=>p && p.x>-60 && p.x<W+60 && p.y>-60 && p.y<H+60;

/* ---- live data ---------------------------------------------------------- */
async function getJSON(url, ms=12000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(), ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const src={};    // name -> {state, note}
function setSrc(k,state,note){ src[k]={state,note}; renderStatus(); }

function hav(a,b){
  const R=6371000, t=x=>x*D2R, dLa=t(b.lat-a.lat), dLo=t(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearingDeg(a,b){
  const y=Math.sin((b.lon-a.lon)*D2R)*Math.cos(b.lat*D2R);
  const x=Math.cos(a.lat*D2R)*Math.sin(b.lat*D2R)-Math.sin(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.cos((b.lon-a.lon)*D2R);
  return wrap360(Math.atan2(y,x)*R2D);
}
function moveLL(p, brgDeg, m){
  const R=6371000, d=m/R, b=brgDeg*D2R, la=p.lat*D2R, lo=p.lon*D2R;
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la), Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return { lat:la2*R2D, lon:lo2*R2D };
}
/* Where an aircraft appears from here: azimuth, elevation (with the earth's
   curvature taken off), and slant distance. */
function lookAngles(p){
  const d=hav(loc,p), hm=(p.alt||0)*0.3048;
  const drop=d*d/(2*6371000);
  return { az:bearingDeg(loc,p), alt:Math.atan2(hm-drop, Math.max(1,d))*R2D, d };
}

/* Aircraft. Each poll is a fix; between polls every plane flies on along its
   track at its ground speed, so motion is continuous instead of a 10 s hop. */
const planes=new Map();     // hex -> {call,type,alt,gs,trk,lat,lon,at,trail:[{lat,lon,alt}],color,seen}
let brands=null;
async function loadBrands(){
  if(brands) return brands;
  const c=lsJSON("tb.home.brands",null);         // home.html caches night.html's airline colours here
  if(c && Date.now()-c.t<864e5){ brands=c.b; return brands; }
  try{
    const txt=await (await fetch("night.html")).text(), i=txt.indexOf("const AIRLINE_BRAND={");
    const block=i<0?"":txt.slice(i, txt.indexOf("};",i)), b={};
    block.replace(/"?([A-Z0-9]{2,3})"?\s*:\s*"(#[0-9A-Fa-f]{6})"/g,(m,k,v)=>{ b[k]=v; return m; });
    brands=b; lsSet("tb.home.brands", JSON.stringify({t:Date.now(), b}));
  }catch(e){ brands={}; }
  return brands;
}
function brandOf(call){ const k=String(call||"").trim().toUpperCase().slice(0,3).replace(/[^A-Z0-9]/g,""); return (brands&&brands[k])||""; }

function ingest(list, now){
  const seen=new Set();
  list.forEach(a=>{
    if(a.alt_baro==="ground" || typeof a.lat!=="number") return;
    const hex=a.hex||a.flight; seen.add(hex);
    let p=planes.get(hex);
    if(!p){ p={trail:[]}; planes.set(hex,p); }
    p.call=(a.flight||"").trim()||a.r||hex; p.type=a.t||""; p.desc=a.desc||"";
    p.alt=typeof a.alt_baro==="number"?a.alt_baro:(a.alt_geom||p.alt||0);
    p.gs=a.gs||0; p.trk=a.track!=null?a.track:(a.true_heading||0);
    p.lat=a.lat; p.lon=a.lon; p.at=now; p.color=brandOf(p.call);
  });
  for(const [k,p] of planes) if(!seen.has(k) && now-p.at>30000) planes.delete(k);
}
function planeNow(p, now){
  const dt=Math.min(60, (now-p.at)/1000);
  const pos=moveLL(p, p.trk, p.gs*0.514444*dt);
  return { lat:pos.lat, lon:pos.lon, alt:p.alt };
}
async function refreshPlanes(){
  if(DEMO && !adsbUrl){ demoPlanes(); setSrc("Aircraft","demo","Sample aircraft (demo)"); return; }
  if(!adsbUrl){ setSrc("Aircraft","off","No aircraft feed set up — add one in the Sky view's settings (AIRCRAFT-FEED.md)"); return; }
  try{
    await loadBrands();
    const j=await getJSON(`${adsbUrl}/v2/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/35`);
    ingest(j.ac||[], Date.now());
    setSrc("Aircraft","ok",`${planes.size} aircraft within 35 nm`);
  }catch(e){ setSrc("Aircraft","bad","Aircraft feed not answering"); }
}
let demoSeeded=false;
function demoPlanes(){

    const D=[["UAL1432","B739",34000,460,62,14,250],["AAL2210","A321",28000,430,231,9,40],["DAL881","A320",11000,290,195,6,330],
             ["SWA3107","B38M",5200,210,152,4,10],["JBU622","A20N",37000,470,300,22,120],["FDX1204","B763",19000,380,88,16,280],
             ["N512CS","C172",2500,105,20,2,180]];
    D.forEach((d,i)=>{

/* Metro: nearest station(s), live predictions. */
let stations=null, trains=[];   // trains: {line,dest,min,at,group,stop}
async function nearStations(){
  if(stations) return stations;
  let c=lsJSON("tb.home.wmataStations",null);      // shared with home.html
  if(!c || Date.now()-c.t > 7*864e5){
    const j=await getJSON(`https://api.wmata.com/Rail.svc/json/jStations?api_key=${encodeURIComponent(wmataKey)}`);
    c={ t:Date.now(), list:(j.Stations||[]).map(s=>({c:s.Code, n:s.Name, lat:s.Lat, lon:s.Lon, t1:s.StationTogether1||""})) };
    lsSet("tb.home.wmataStations", JSON.stringify(c));
  }
  const seen=new Set();
  stations=c.list.map(s=>({...s, m:hav(loc,s)})).sort((a,b)=>a.m-b.m)
    .filter(s=>{ if(seen.has(s.n)) return false; seen.add(s.n); return true; })
    .filter(s=>s.m<=4500).slice(0,2);
  return stations;
}
async function refreshTrains(){
  if(DEMO){demoTrains();setSrc("Metro","demo",`${city.name} sample trains (demo)`);return;}
  if(city.id!=="dc"){
    setSrc("Transit","off","Live arrivals available on the city board");return;
  }
  if(!wmataKey){
    if(DEMO){ demoTrains(); setSrc("Metro","demo","Sample trains (demo)"); }
    else setSrc("Metro","off","Metro: add a WMATA key on the DC board");
    return;
  }
  try{
    const st=await nearStations();
    if(!st.length){ trains=[]; setSrc("Metro","off","No Metro station nearby"); return; }
    const codes=[...new Set(st.flatMap(s=>[s.c,s.t1].filter(Boolean)))].join(",");
    const j=await getJSON(`https://api.wmata.com/StationPrediction.svc/json/GetPrediction/${codes}?api_key=${encodeURIComponent(wmataKey)}`);
    const at=Date.now();
    trains=(j.Trains||[]).filter(t=>t.Line && t.Line!=="--" && t.Line!=="No" &&
        !/^(no passenger|train|ssenger)$/i.test((t.DestinationName||"").trim()))
      .map(t=>{
        const s=st.find(x=>x.c===t.LocationCode||x.t1===t.LocationCode)||st[0];
        const min=(t.Min==="BRD"||t.Min==="ARR")?0:parseInt(t.Min,10);
        return { line:t.Line, dest:t.DestinationName||t.Destination, min, at, group:String(t.Group||"1"), stop:s.n };
      }).filter(d=>isFinite(d.min)).sort((a,b)=>a.min-b.min);
    setSrc("Metro","ok",`Metro live · ${st.map(s=>s.n).join(", ")}`);
  }catch(e){ setSrc("Metro","bad","Metro feed not answering"); }
}
function demoTrains(){
  if(trains.length && trains.some(t=>liveMin(t)>-0.5)) {
    trains=trains.filter(t=>liveMin(t)>-0.6);
    if(trains.length>=4) return;
  }
  const at=Date.now(), pick=city.routes.map((r,i)=>[r[0],r[1],String(i+1)]);
  stations=[{n:city.station}];
  while(trains.length<5){
    const p=pick[trains.length%2], last=trains.filter(t=>t.group===p[2]).reduce((m,t)=>Math.max(m,liveMin(t)),-2);
    trains.push({line:p[0], dest:p[1], min:last+4+Math.random()*6, at, group:p[2], stop:city.station});
  }
  trains.sort((a,b)=>liveMin(a)-liveMin(b));
}
const liveMin=t=>t.min-(Date.now()-t.at)/60000;

/* ---- city skyline (wall) -------------------------------------------------
   The cached panorama is an artistic composition, independent of the true
   sky bearings. Its vector artwork stays stable when the wall turns. */
function buildSkyline(){ window.TBProjectorScene.clear(); }

/* ---- drawing ------------------------------------------------------------ */
let shooting=null, nextShoot=Date.now()+20000+Math.random()*40000;
function twinkle(i, t, alt){ return 0.82+0.18*Math.sin(t/(380+i*7%300)+i*1.7)*(alt<25?1.4:0.7); }

function skyBackground(sun){
  // Projectors are black by default; only twilight earns a little light.
  const tw=Math.max(0, Math.min(1, (sun.alt+18)/18));           // 0 at astronomical night, 1 at sunset
  if(G.kind==="ceiling"){
    const g=cx.createRadialGradient(G.cx,G.cy,0,G.cx,G.cy,G.Rs);
    g.addColorStop(0, `rgba(${8+tw*18},${10+tw*26},${24+tw*60},1)`);
    g.addColorStop(1, `rgba(${4+tw*60},${6+tw*30},${18+tw*60},1)`);
    cx.fillStyle="#000"; cx.fillRect(0,0,W,H);
    cx.beginPath(); cx.arc(G.cx,G.cy,G.Rs,0,Math.PI*2); cx.fillStyle=g; cx.fill();
    // a warm glow on the rim where the sun is, during twilight
    if(tw>0.05){
      const p=proj(sun.az, 0);
      if(p){ const gg=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,G.Rs*0.7);
        gg.addColorStop(0,`rgba(255,120,60,${0.22*tw})`); gg.addColorStop(1,"rgba(255,120,60,0)");
        cx.save(); cx.beginPath(); cx.arc(G.cx,G.cy,G.Rs,0,Math.PI*2); cx.clip(); cx.fillStyle=gg; cx.fillRect(0,0,W,H); cx.restore(); }
    }
  }else{
    const g=cx.createLinearGradient(0,0,0,G.hy);
    g.addColorStop(0, `rgb(${2+tw*8},${3+tw*12},${10+tw*36})`);
    g.addColorStop(1, `rgb(${6+tw*70},${8+tw*40},${22+tw*60})`);
    cx.fillStyle=g; cx.fillRect(0,0,W,G.hy+1);
    if(tw>0.05){
      const daz=wrap180(sun.az-S.face);
      if(Math.abs(daz)<110){
        const p=proj(sun.az, 0.5) || {x: daz<0?-W*0.2:W*1.2, y:G.hy};
        const gg=cx.createRadialGradient(p.x,G.hy,0,p.x,G.hy,W*0.6);
        gg.addColorStop(0,`rgba(255,130,60,${0.28*tw})`); gg.addColorStop(1,"rgba(255,130,60,0)");
        cx.fillStyle=gg; cx.fillRect(0,0,W,G.hy);
      }
    }
    cx.fillStyle="#000"; cx.fillRect(0,G.hy,W,H-G.hy);
  }
}

function drawStars(lst, t){
  const pts=new Array(STARS.length);
  STARS.forEach((s,i)=>{
    const h=raDecToAltAz(s[1]*15, s[2], lst);
    const p=h.alt>-1?proj(h.az,h.alt):null;
    pts[i]=p&&{...p, alt:h.alt};
  });
  if(S.lines){
    cx.lineWidth=Math.max(1,G.fs*0.07);
    CONST.forEach(([name,segs,dashed])=>{
      cx.strokeStyle=dashed?"rgba(124,156,255,.13)":"rgba(124,156,255,.28)";
      cx.setLineDash(dashed?[G.fs*0.4,G.fs*0.5]:[]);
      let sx=0,sy=0,n=0;
      cx.beginPath();
      segs.forEach(([a,b])=>{
        const pa=pts[STAR_IDX[a]], pb=pts[STAR_IDX[b]];
        if(!pa||!pb) return;
        if(Math.hypot(pa.x-pb.x,pa.y-pb.y)>Math.max(W,H)*0.6) return;    // wrapped behind the lens
        cx.moveTo(pa.x,pa.y); cx.lineTo(pb.x,pb.y); sx+=pa.x+pb.x; sy+=pa.y+pb.y; n+=2;
      });
      cx.stroke();
      if(S.labels && n && !dashed){
        cx.fillStyle="rgba(124,156,255,.42)"; cx.font=`500 ${G.fs*0.62}px system-ui`;
        cx.textAlign="center"; cx.fillText(name.toUpperCase(), sx/n, sy/n+G.fs*1.3);
      }
    });
    cx.setLineDash([]);
  }
  STARS.forEach((s,i)=>{
    const p=pts[i]; if(!onScreen(p)) return;
    const m=s[3], base=Math.max(0.6, (3.9-m)*G.fs*0.075);
    const ext=p.alt<10 ? 0.45+p.alt/18 : 1;                         // dimmer through more air
    const a=Math.min(1, (0.35+(3.6-m)*0.2)*twinkle(i,t,p.alt)*ext);
    if(m<1.2){
      const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,base*4);
      g.addColorStop(0,`rgba(220,230,255,${a*0.35})`); g.addColorStop(1,"rgba(220,230,255,0)");
      cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,p.y,base*4,0,Math.PI*2); cx.fill();
    }
    cx.fillStyle = s[0]==="Betelgeuse"||s[0]==="Antares"||s[0]==="Aldebaran"||s[0]==="Arcturus" ? `rgba(255,200,160,${a})` :
                   s[0]==="Rigel"||s[0]==="Vega"||s[0]==="Sirius"||s[0]==="Spica" ? `rgba(200,220,255,${a})` : `rgba(235,238,255,${a})`;
    cx.beginPath(); cx.arc(p.x,p.y,base,0,Math.PI*2); cx.fill();
    if(S.labels && m<1.0){
      cx.fillStyle="rgba(207,214,255,.45)"; cx.font=`500 ${G.fs*0.6}px system-ui`; cx.textAlign="left";
      cx.fillText(s[0], p.x+base+G.fs*0.35, p.y+G.fs*0.2);
    }
  });
}

function drawMoon(t, lst){
  const me=moonEcl(t), se=sunEcl(t);
  const mq=eclToEq(me.lon, me.lat), h=raDecToAltAz(mq.ra, mq.dec, lst);
  if(h.alt<-1) return;
  const p=proj(h.az,h.alt); if(!onScreen(p)) return;
  const elong=wrap360(me.lon-se), f=(1-Math.cos(elong*D2R))/2;
  // bright limb points along the sky toward the sun
  const sq=eclToEq(se,0), sh=raDecToAltAz(sq.ra,sq.dec,lst);
  const v=(az,al)=>[Math.cos(al*D2R)*Math.sin(az*D2R), Math.cos(al*D2R)*Math.cos(az*D2R), Math.sin(al*D2R)];
  const a=v(h.az,h.alt), b=v(sh.az,sh.alt), k=0.04;
  const n=[a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
  const naz=wrap360(Math.atan2(n[0],n[1])*R2D), nal=Math.asin(n[2]/Math.hypot(...n))*R2D;
  const q=proj(naz,nal), ang=q?Math.atan2(q.y-p.y,q.x-p.x):0;
  const r=G.fs*1.15;
  const glow=cx.createRadialGradient(p.x,p.y,r,p.x,p.y,r*5);
  glow.addColorStop(0,`rgba(230,235,255,${0.10+0.2*f})`); glow.addColorStop(1,"rgba(230,235,255,0)");
  cx.fillStyle=glow; cx.beginPath(); cx.arc(p.x,p.y,r*5,0,Math.PI*2); cx.fill();
  cx.save(); cx.translate(p.x,p.y); cx.rotate(ang);
  cx.fillStyle="rgba(40,44,60,.9)"; cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fill();
  const lit="rgba(240,238,225,.95)";
  cx.fillStyle=lit; cx.beginPath(); cx.arc(0,0,r,-Math.PI/2,Math.PI/2); cx.fill();       // sunward half
  cx.fillStyle=f>0.5?lit:"rgba(40,44,60,1)";
  cx.beginPath(); cx.ellipse(0,0,Math.max(0.01,r*Math.abs(1-2*f)),r,0,0,Math.PI*2); cx.fill();
  cx.restore();
  if(S.labels){ cx.fillStyle="rgba(207,214,255,.5)"; cx.font=`500 ${G.fs*0.62}px system-ui`; cx.textAlign="center";
    cx.fillText(`Moon · ${Math.round(f*100)}%`, p.x, p.y+r+G.fs*1.0); }
}

function drawShooting(now){
  if(!shooting && now>nextShoot){
    const a=Math.random()*360, el=25+Math.random()*50, dir=Math.random()*Math.PI*2;
    shooting={az:a, alt:el, dir, at:now, len:6+Math.random()*10};
    nextShoot=now+30000+Math.random()*70000;
  }
  if(!shooting) return;
  const k=(now-shooting.at)/900; if(k>1){ shooting=null; return; }
  const head={az:shooting.az+Math.cos(shooting.dir)*shooting.len*k, alt:shooting.alt+Math.sin(shooting.dir)*shooting.len*k*0.6};
  const tail={az:head.az-Math.cos(shooting.dir)*shooting.len*0.35, alt:head.alt-Math.sin(shooting.dir)*shooting.len*0.35*0.6};
  const p=proj(head.az,head.alt), q=proj(tail.az,tail.alt); if(!p||!q) return;
  const g=cx.createLinearGradient(q.x,q.y,p.x,p.y);
  g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,`rgba(255,255,255,${0.9*(1-k)})`);
  cx.strokeStyle=g; cx.lineWidth=G.fs*0.12; cx.beginPath(); cx.moveTo(q.x,q.y); cx.lineTo(p.x,p.y); cx.stroke();
}

// Wall artwork deliberately reserves clear air ABOVE the tallest roofline.
// Bearings and altitude readouts stay geographic; the wall's aircraft layer
// compresses its vertical display space. Ceiling projection is unchanged.
function projectAircraft(az,alt){
  const point=proj(az,alt);
  if(!point||G.kind!=="wall")return point;
  const span=Math.min(H*.40,W*.24);
  const clearHorizon=Math.max(G.fs*3,G.hy-span*1.12-G.fs*2.5);
  return {x:point.x,y:point.y>0?point.y*clearHorizon/G.hy:point.y};
}

let featured=null;
function drawPlanes(now){
  let best=null;
  /* A busy sky (DC has 40+ in range) piles low, far aircraft onto the horizon.
     Only the highest few get a label and full size; the rest are quiet dots. */
  const rank=[...planes.values()].map(p=>{ const l=lookAngles(planeNow(p,now)); return {p, el:l.alt, on:l.alt>0&&onScreen(projectAircraft(l.az,l.alt))}; })
    .filter(x=>x.on).sort((a,b)=>b.el-a.el), loud=new Set(rank.slice(0,9).filter(x=>x.el>(G.kind==="wall"?1:4)).map(x=>x.p));
  for(const p of planes.values()){
    const pos=planeNow(p,now), la=lookAngles(pos);
    // trail: sample the flown path every 2 s, keep ~2 minutes
    const last=p.trail[p.trail.length-1];
    if(!last || now-last.t>2000){ p.trail.push({...pos,t:now}); if(p.trail.length>60) p.trail.shift(); }
    if(la.alt<0) continue;
    const sp=projectAircraft(la.az,la.alt); if(!onScreen(sp)) continue;
    if(!best || la.alt>best.la.alt) best={p,la,pos};
    // contrail
    if(p.trail.length>1 && loud.has(p)){
      cx.lineCap="round";
      for(let i=1;i<p.trail.length;i++){
        const A=lookAngles(p.trail[i-1]), B=lookAngles(p.trail[i]);
        const pa=A.alt>0&&projectAircraft(A.az,A.alt), pb=B.alt>0&&projectAircraft(B.az,B.alt);
        if(!pa||!pb||Math.hypot(pa.x-pb.x,pa.y-pb.y)>W/3) continue;
        const k=i/p.trail.length;
        cx.strokeStyle=`rgba(190,205,255,${0.25*k})`; cx.lineWidth=G.fs*0.1*(0.4+k);
        cx.beginPath(); cx.moveTo(pa.x,pa.y); cx.lineTo(pb.x,pb.y); cx.stroke();
      }
      const L=p.trail[p.trail.length-1], A=lookAngles(L), pa=A.alt>0&&projectAircraft(A.az,A.alt);
      if(pa){ cx.strokeStyle="rgba(190,205,255,.28)"; cx.beginPath(); cx.moveTo(pa.x,pa.y); cx.lineTo(sp.x,sp.y); cx.stroke(); }
    }
    // heading on screen: project a point a little ahead along the track
    const ahead=lookAngles({...moveLL(pos,p.trk,400),alt:pos.alt}), ap=projectAircraft(ahead.az,ahead.alt);
    const ang=ap?Math.atan2(ap.y-sp.y,ap.x-sp.x):0;
    const isLoud=loud.has(p);
    if(!isLoud){
      const ph=(now+(p.call||"").length*137)%1500;
      cx.fillStyle="rgba(200,212,255,.55)"; cx.beginPath(); cx.arc(sp.x,sp.y,G.fs*0.13,0,Math.PI*2); cx.fill();
      if(ph<120){ cx.fillStyle="rgba(255,50,50,.9)"; cx.beginPath(); cx.arc(sp.x,sp.y,G.fs*0.16,0,Math.PI*2); cx.fill(); }
      continue;
    }
    const sz=G.fs*(0.55+Math.min(1, 6000/Math.max(1500,la.d))*0.9);
    cx.save(); cx.translate(sp.x,sp.y); cx.rotate(ang);
    cx.fillStyle="rgba(220,228,255,.9)";
    cx.beginPath();                                                   // a small airliner, nose along +x
    cx.moveTo(sz,0); cx.lineTo(sz*0.2,sz*0.12); cx.lineTo(-sz*0.1,sz*0.85); cx.lineTo(-sz*0.3,sz*0.85);
    cx.lineTo(-sz*0.15,sz*0.12); cx.lineTo(-sz*0.75,sz*0.1); cx.lineTo(-sz*0.95,sz*0.4); cx.lineTo(-sz*1.05,sz*0.4);
    cx.lineTo(-sz*0.95,0); cx.lineTo(-sz*1.05,-sz*0.4); cx.lineTo(-sz*0.95,-sz*0.4); cx.lineTo(-sz*0.75,-sz*0.1);
    cx.lineTo(-sz*0.15,-sz*0.12); cx.lineTo(-sz*0.3,-sz*0.85); cx.lineTo(-sz*0.1,-sz*0.85); cx.lineTo(sz*0.2,-sz*0.12);
    cx.closePath(); cx.fill();
    // nav lights: red port (left wing), green starboard, red beacon, white strobes
    const ph=(now+ (p.call||"").length*137)%1500;
    const dot=(x,y,c,r)=>{ cx.fillStyle=c; cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill(); };
    dot(-sz*0.2,-sz*0.85,"rgba(255,60,60,.95)",sz*0.11);
    dot(-sz*0.2, sz*0.85,"rgba(60,255,120,.95)",sz*0.11);
    if(ph<120) dot(0,0,"rgba(255,40,40,1)",sz*0.22);
    if(ph>500&&ph<560 || ph>680&&ph<740){
      const g=cx.createRadialGradient(0,0,0,0,0,sz*1.6); g.addColorStop(0,"rgba(255,255,255,.9)"); g.addColorStop(1,"rgba(255,255,255,0)");
      cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,sz*1.6,0,Math.PI*2); cx.fill();
    }
    cx.restore();
    if(S.labels){
      const col=p.color||"#9fb3ff";
      cx.textAlign="left";
      cx.font=`700 ${G.fs*0.78}px system-ui`; cx.fillStyle=col;
      cx.fillText(p.call, sp.x+sz*1.3, sp.y-G.fs*0.15);
      cx.font=`500 ${G.fs*0.6}px system-ui`; cx.fillStyle="rgba(207,214,255,.6)";
      cx.fillText(`${Math.round(p.alt/100)*100>0?(Math.round(p.alt/100)*100).toLocaleString()+" ft":""}${p.type?" · "+p.type:""}`, sp.x+sz*1.3, sp.y+G.fs*0.6);
    }
  }
  featured=best;
}

/* Ceiling rim: compass, and the departures (or, with none, the place) as a
   ring of text slowly circling the horizon. */
function ringText(){
  const parts=[];
  trains.filter(t=>liveMin(t)>-0.5).slice(0,6).forEach(t=>{
    const m=Math.max(0,Math.round(liveMin(t)));
    parts.push({txt:`${RAIL_NAMES[t.line]||t.line} to ${t.dest}`, col:RAIL_COLORS[t.line]||"#cfd6ff"},
               {txt:` ${m<=0?"now":m+" min"}  ◆  `, col:"rgba(207,214,255,.75)"});
  });
  const now=new Date();
  const base=[{txt:`${(loc.label||"Here").toUpperCase()}  ◆  ${clock(now)}  ◆  `, col:"rgba(207,214,255,.65)"}];
  if(wx) base.push({txt:`${Math.round(wx.temperature_2m)}°  ·  ${wx.cloud_cover}% cloud  ◆  `, col:"rgba(207,214,255,.55)"});
  if(planes.size) base.push({txt:`${planes.size} aircraft in range  ◆  `, col:"rgba(207,214,255,.55)"});
  return parts.length ? parts.concat(base) : base;
}
function drawCeilingRim(t){
  const {cx:X, cy:Y, R, Rs, fs}=G;
  cx.strokeStyle="rgba(124,156,255,.35)"; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(X,Y,Rs,0,Math.PI*2); cx.stroke();
  cx.strokeStyle="rgba(124,156,255,.15)";
  cx.beginPath(); cx.arc(X,Y,R,0,Math.PI*2); cx.stroke();
  // altitude rings 30 / 60
  cx.setLineDash([2,6]); cx.strokeStyle="rgba(124,156,255,.12)";
  [30,60].forEach(a=>{ cx.beginPath(); cx.arc(X,Y,(90-a)/90*Rs,0,Math.PI*2); cx.stroke(); });
  cx.setLineDash([]);
  // compass letters on the horizon ring
  [["N",0],["E",90],["S",180],["W",270]].forEach(([l,az])=>{
    const th=(az+S.north)*D2R, r=Rs-fs*0.9;
    cx.fillStyle=l==="N"?"#ff6b6b":"rgba(207,214,255,.7)"; cx.font=`800 ${fs*0.95}px system-ui`;
    cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(l, X-Math.sin(th)*r, Y-Math.cos(th)*r);
  });
  for(let az=0;az<360;az+=15){
    const th=(az+S.north)*D2R, a=Rs, b=Rs-(az%45===0?fs*0.45:fs*0.22);
    cx.strokeStyle="rgba(124,156,255,.35)"; cx.beginPath();
    cx.moveTo(X-Math.sin(th)*a,Y-Math.cos(th)*a); cx.lineTo(X-Math.sin(th)*b,Y-Math.cos(th)*b); cx.stroke();
  }
  cx.textBaseline="alphabetic";
  // rotating ring of text between Rs and R
  const parts=ringText(), rr=(Rs+R)/2, f=Math.min(fs*0.95,(R-Rs)*0.62);
  cx.font=`600 ${f}px system-ui`; cx.textBaseline="middle"; cx.textAlign="center";
  const circ=2*Math.PI*rr;
  let seq=[], len=0;
  while(len<circ){ for(const p of parts){ const w=cx.measureText(p.txt).width; seq.push({...p,w}); len+=w; } if(!parts.length) break; }
  let a0=-Math.PI/2 + (t/1000)*(2*Math.PI/420);                   // one lap every 7 minutes
  for(const s of seq){
    for(const ch of s.txt){
      const w=cx.measureText(ch).width, da=w/rr;
      if(a0+da > -Math.PI/2 + (t/1000)*(2*Math.PI/420) + Math.PI*2) break;
      const a=a0+da/2;
      cx.save(); cx.translate(X+Math.cos(a)*rr, Y+Math.sin(a)*rr); cx.rotate(a+Math.PI/2);
      cx.fillStyle=s.col; cx.fillText(ch,0,0); cx.restore();
      a0+=da;
    }
  }
  cx.textBaseline="alphabetic";
}

/* Wall: horizon compass, skyline, the track. */
function drawWallGround(now){
  const {hy, fs}=G;
  // compass ticks along the horizon
  cx.textAlign="center";
  for(let az=0;az<360;az+=5){
    const p=proj(az,0); if(!p||p.x<-20||p.x>W+20) continue;
    const big=az%45===0, mid=az%15===0;
    cx.strokeStyle=`rgba(124,156,255,${big?.5:mid?.3:.15})`; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(p.x,hy-(big?fs*0.6:mid?fs*0.35:fs*0.18)); cx.lineTo(p.x,hy); cx.stroke();
    if(big){ const L=["N","NE","E","SE","S","SW","W","NW"][az/45];
      cx.fillStyle=L==="N"?"#ff6b6b":"rgba(207,214,255,.65)"; cx.font=`800 ${fs*0.8}px system-ui`;
      cx.fillText(L,p.x,hy-fs*0.9); }
    else if(mid){ cx.fillStyle="rgba(124,156,255,.35)"; cx.font=`500 ${fs*0.5}px system-ui`; cx.fillText(az+"°",p.x,hy-fs*0.55); }
  }
  window.TBProjectorScene.draw(cx,{city,width:W,height:H,baseline:hy,
    detail:S.detail,labels:S.labels,motion:S.motion,now});

  // the track
  const ty=hy+(H-hy)*0.40, sx=W/2, half=W*0.46, MAXM=20;
  const st=stations&&stations[0];
  if(st || trains.length){
    cx.strokeStyle="rgba(124,156,255,.22)"; cx.lineWidth=2;
    cx.beginPath(); cx.moveTo(W*0.02,ty-fs*0.35); cx.lineTo(W*0.98,ty-fs*0.35); cx.stroke();
    cx.beginPath(); cx.moveTo(W*0.02,ty+fs*0.35); cx.lineTo(W*0.98,ty+fs*0.35); cx.stroke();
    for(let m=5;m<=MAXM;m+=5) [-1,1].forEach(s=>{
      const x=sx+s*m/MAXM*half; cx.fillStyle="rgba(124,156,255,.3)"; cx.font=`500 ${fs*0.5}px system-ui`; cx.textAlign="center";
      cx.fillText(m+" min", x, ty+fs*1.3);
    });
    // platform
    cx.fillStyle="rgba(124,156,255,.18)"; cx.fillRect(sx-fs*2.4, ty-fs*0.8, fs*4.8, fs*1.6);
    cx.fillStyle="rgba(207,214,255,.85)"; cx.font=`700 ${fs*0.75}px system-ui`; cx.textAlign="center";
    cx.fillText((st?st.n:"Station").toUpperCase(), sx, ty+fs*3.3);
    /* One station's track: the next three each way, so labels never pile up. */
    const shown=[], per={};
    trains.filter(t=>!st||!t.stop||t.stop===st.n).forEach(t=>{
      const m=liveMin(t); if(m<-0.6||m>MAXM) return;
      per[t.group]=(per[t.group]||0)+1; if(per[t.group]<=3) shown.push(t);
    });
    shown.forEach(t=>{
      const m=liveMin(t);
      const s=t.group==="2"?1:-1, x=sx+s*Math.max(0,m)/MAXM*half, y=ty+(s<0?-fs*0.35:fs*0.35);
      const col=RAIL_COLORS[t.line]||"#cfd6ff", L=fs*(m<=0?3.6:2.4);
      const g=cx.createRadialGradient(x,y,0,x,y,L*1.3);
      g.addColorStop(0,col+(m<=0?"88":"44")); g.addColorStop(1,col+"00");
      cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,L*1.3,0,Math.PI*2); cx.fill();
      cx.fillStyle=col; const pulse=m<=0?0.75+0.25*Math.sin(now/180):1;
      cx.globalAlpha=pulse; cx.beginPath(); cx.roundRect ? cx.roundRect(x-L/2,y-fs*0.22,L,fs*0.44,fs*0.22) : cx.rect(x-L/2,y-fs*0.22,L,fs*0.44); cx.fill();
      // headlight toward the station
      cx.fillStyle="#fff"; cx.beginPath(); cx.arc(x-s*L/2,y,fs*0.12,0,Math.PI*2); cx.fill();
      cx.globalAlpha=1;
      cx.font=`700 ${fs*0.62}px system-ui`; cx.fillStyle=col; cx.textAlign="center";
      cx.fillText(`${t.dest}`, x, s<0? y-fs*0.75 : y+fs*1.05+fs*0.0);
      cx.font=`600 ${fs*0.55}px system-ui`; cx.fillStyle="rgba(207,214,255,.8)";
      cx.fillText(m<=0.25?"boarding":Math.ceil(m)+" min", x, s<0? y-fs*1.4 : y+fs*1.7);
    });
  }
}

  // A quiet city identity, separate from the observed sky's compass bearings.

    cx.fillText(p.call, pad, by-fs*1.3);

    cx.fillText(`${Math.round(la.alt)}° up in the ${dir}  ·  ${(la.d/1852).toFixed(1)} nm  ·  ${Math.round(p.alt).toLocaleString()} ft${p.desc?"  ·  "+p.desc:(p.type?"  ·  "+p.type:"")}`, pad, by);
  }
  // problems / demo, bottom-right, quiet
  const notes=Object.values(src).filter(s=>s.state==="bad"||s.state==="off").map(s=>s.note).filter(Boolean);
  cx.textAlign="right"; cx.font=`500 ${fs*0.62}px system-ui`;
  const demoOn=Object.values(src).some(s=>s.state==="demo");
  if(demoOn){ cx.fillStyle="rgba(255,209,102,.8)"; cx.fillText("DEMO SKY — sample aircraft and trains", W-pad, by-(notes.length?fs*1.0*notes.length:0)); }
  cx.fillStyle="rgba(207,214,255,.35)";
  notes.forEach((n,i)=>cx.fillText(n, W-pad, by-(notes.length-1-i)*fs*1.0));

let lastFrame=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden || ts-lastFrame<33) return;                    // ~30 fps is plenty, and kind to a stick PC
  lastFrame=ts;
  const now=Date.now();
  geom();
  cx.setTransform(DPR,0,0,DPR,0,0);
  const lst=lstDeg(now), sq=eclToEq(sunEcl(now),0), sun=raDecToAltAz(sq.ra,sq.dec,lst);
  skyBackground(sun);
  if(G.kind==="ceiling"){ cx.save(); cx.beginPath(); cx.arc(G.cx,G.cy,G.Rs,0,Math.PI*2); cx.clip(); }
  else { cx.save(); cx.beginPath(); cx.rect(0,0,W,G.hy); cx.clip(); }
  const starA=Math.max(0.15, Math.min(1, (-sun.alt-2)/10));         // stars fade in through twilight
  cx.globalAlpha=starA; drawStars(lst, now); cx.globalAlpha=1;
  drawShooting(now);
  drawMoon(now, lst);
  drawPlanes(now);
  cx.restore();
  if(G.kind==="ceiling") drawCeilingRim(now); else drawWallGround(now);
  drawCorners(now);
}

/* ---- keystone ------------------------------------------------------------
   Corner pin: the four corners of the picture are dragged to where they land
   on the surface, and a homography maps the full-viewport stage onto them. */
function solve(A,b){
  const n=b.length;
  for(let i=0;i<n;i++){
    let m=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[m][i])) m=r;
    [A[i],A[m]]=[A[m],A[i]]; [b[i],b[m]]=[b[m],b[i]];
    for(let r=i+1;r<n;r++){ const f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; }
  }
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s-=A[i][c]*x[c]; x[i]=s/A[i][i]; }
  return x;
}
function ksCorners(){ return S.ks || [[0,0],[1,0],[1,1],[0,1]]; }
function applyKeystone(){
  const el=$("#ks"), c=ksCorners();
  const src=[[0,0],[W,0],[W,H],[0,H]], dst=c.map(([fx,fy])=>[fx*W,fy*H]);
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const [x,y]=src[i], [X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const h=solve(A,b);
  el.style.transform = S.ks ? `matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)` : "";
  $("#flip").style.transform = S.mirror ? "scaleX(-1)" : "";
  document.body.style.filter = S.bright<100 ? `brightness(${S.bright/100})` : "";
}
const handles=[];
let ksSel=0;
function placeHandles(){
  ksCorners().forEach(([fx,fy],i)=>{ const h=handles[i]; if(!h) return; h.style.left=fx*W+"px"; h.style.top=fy*H+"px"; h.classList.toggle("on",i===ksSel); });
}
for(let i=0;i<4;i++){
  const h=document.createElement("div"); h.className="pj-handle"; h.textContent=i+1;
  h.addEventListener("pointerdown",e=>{
    h.setPointerCapture(e.pointerId); ksSel=i;
    const move=ev=>{ const c=ksCorners().map(x=>x.slice()); c[i]=[ev.clientX/W, ev.clientY/H]; S.ks=c; applyKeystone(); placeHandles(); };
    const up=()=>{ h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up); save(); };
    h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
  });
  document.body.appendChild(h); handles.push(h);
}
function toggleKs(on){ document.body.classList.toggle("ks-edit", on); $("#ks").classList.toggle("editing", on); $("#ksBtn").classList.toggle("on", on); placeHandles(); }

  $("#northRow").style.display=S.surface==="ceiling"?"":"none";
  $("#face").value=S.face; $("#faceVal").textContent=`${DIRS[Math.round(S.face/45)%8]} · ${S.face}°`;
  $("#north").value=S.north; $("#northVal").textContent=`${S.north}°`;
  $("#bright").value=S.bright; $("#brightVal").textContent=`${S.bright}%`;
  [["mirrorBtn",S.mirror],["linesBtn",S.lines],["labelsBtn",S.labels],["detailBtn",S.detail],["motionBtn",S.motion]].forEach(([id,on])=>{const b=$("#"+id);b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));});
  $("#mirrorBtn").classList.toggle("on",S.mirror); $("#linesBtn").classList.toggle("on",S.lines); $("#labelsBtn").classList.toggle("on",S.labels);
}
function renderStatus(){
  const el=$("#status"); if(!el) return;
  el.textContent="";
  const place=document.createElement("b");place.textContent=loc.label||city.name;el.append(place,` · ${loc.lat.toFixed(3)}, ${loc.lon.toFixed(3)}`,document.createElement("br"));
  const info=document.createElement("span");
  info.textContent=
    Object.entries(src).map(([k,s])=>`${k}: ${s.state==="ok"?"✓":s.state==="demo"?"demo":s.state==="off"?"off":"✗"}${s.note?" — "+s.note:""}`).join("\n");info.style.whiteSpace="pre-line";el.appendChild(info);
}

/* Keys: built for a remote (arrows + OK) as much as a keyboard. */
addEventListener("keydown",e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  const k=e.key, ks=document.body.classList.contains("ks-edit");
  if(ks && /^[1-4]$/.test(k)){ ksSel=+k-1; placeHandles(); return; }
  if(ks && k.startsWith("Arrow")){
    const step=e.shiftKey?0.01:0.002, c=ksCorners().map(x=>x.slice());
    if(k==="ArrowLeft") c[ksSel][0]-=step; if(k==="ArrowRight") c[ksSel][0]+=step;
    if(k==="ArrowUp") c[ksSel][1]-=step; if(k==="ArrowDown") c[ksSel][1]+=step;
    S.ks=c; changed(); e.preventDefault(); return;
  }
  if(k==="Escape"){ toggleKs(false); $("#panel").classList.remove("open"); return; }
  if(k==="s"||k==="S"||k==="Enter"&&!$("#panel").classList.contains("open")){ $("#panel").classList.toggle("open"); return; }
  if(k==="c"||k==="C"){ S.surface="ceiling"; changed(); }
  else if(k==="w"||k==="W"){ S.surface="wall"; changed(); }
  else if(k==="m"||k==="M"){ S.mirror=!S.mirror; changed(); }
  else if(k==="k"||k==="K"){ toggleKs(!ks); }
  else if(k==="f"||k==="F"){ fullscreen(); }
  else if(k==="l"||k==="L"){ S.labels=!S.labels; changed(); }
  else if((k==="ArrowLeft"||k==="ArrowRight") && !$("#panel").contains(document.activeElement)){
    const d=(k==="ArrowLeft"?-1:1)*(e.shiftKey?1:5);
    if(S.surface==="wall") S.face=wrap360(S.face+d); else S.north=wrap360(S.north+d);
    changed();
  }
});
let idleT=0;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add("idle"),3000); }
addEventListener("pointermove",wake); addEventListener("keydown",wake); wake();
addEventListener("resize",resize);

/* ---- go ------------------------------------------------------------------ */
syncPanel(); resize(); renderStatus();
requestAnimationFrame(frame);
refreshPlanes(); setInterval(refreshPlanes, 10000);
refreshTrains(); setInterval(refreshTrains, DEMO?5000:25000);
refreshWx(); setInterval(refreshWx, 15*60000);
</script>
