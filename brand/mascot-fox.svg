<svg xmlns="http://www.w3.org/2000/svg" class="tb-mascot" viewBox="0 0 64 76" role="img" aria-label="Fox">
  <title>Fox</title>
  <!-- Built on the penguin's grid: shadow at cy 70, feet 62-69, eyes on y 25,
       scarf on y 44. Front-facing and symmetrical, because a side-profile
       animal loses its silhouette at the 34px the Spotted card draws it at. -->
  <ellipse cx="32" cy="70" rx="17" ry="4.6" fill="#12101A" opacity=".10"/>
  <!-- Tail: one thick sweep with the paper tip carried on its end. The first
       version put a small separate blob there, which at 34px read as a stray
       dot floating beside the fox rather than as the tip of anything. -->
  <path d="M47 42 c12 1 16 12 12 20 c-2 5 -7 7 -11 5 c-4 -2 -4 -7 -1 -9 c4 -2 6 -6 4 -10 c-1 -3 -3 -4 -4 -6 z" fill="#FF3D77"/>
  <path d="M48 58 c3 -2 7 0 7 4 c0 4 -4 6 -7 4 c-3 -2 -3 -6 0 -8 z" fill="#FFFCF5"/>
  <!-- feet -->
  <path d="M20 60 q-5 5 0 8 h9 q2 -3 -2 -8 z" fill="#12101A"/>
  <path d="M44 60 q5 5 0 8 h-9 q-2 -3 2 -8 z" fill="#12101A"/>
  <!-- ears: outer, then the ink inner shape -->
  <path d="M15 30 L13 6 L31 17 Z" fill="#FF3D77"/>
  <path d="M49 30 L51 6 L33 17 Z" fill="#FF3D77"/>
  <!-- inner ear: follows the outer triangle with an even margin, so it reads as
       an ear rather than as a dark chip sitting on one -->
  <path d="M18.5 26 L17 12 L28 18.5 Z" fill="#12101A"/>
  <path d="M45.5 26 L47 12 L36 18.5 Z" fill="#12101A"/>
  <!-- head + body as one silhouette -->
  <path d="M32 12 c13 0 20 11 20 25 v13 c0 9 -8 14 -20 14 s-20 -5 -20 -14 v-13 c0 -14 7 -25 20 -25 z" fill="#FF3D77"/>
  <!-- chest and muzzle in paper -->
  <path d="M32 36 c7 0 11 6 11 14 v3 c0 6 -4 11 -11 11 s-11 -5 -11 -11 v-3 c0 -8 4 -14 11 -14 z" fill="#FFFCF5"/>
  <path d="M32 27 c6 0 9 4 9 8 s-4 6 -9 6 s-9 -2 -9 -6 s3 -8 9 -8 z" fill="#FFFCF5"/>
  <!-- eyes -->
  <circle cx="24" cy="25" r="4.4" fill="#FFFCF5"/>
  <circle class="tb-eye" cx="24" cy="25" r="2.2" fill="#12101A"/>
  <circle cx="40" cy="25" r="4.4" fill="#FFFCF5"/>
  <circle class="tb-eye" cx="40" cy="25" r="2.2" fill="#12101A"/>
  <!-- nose -->
  <path d="M32 30 l3.4 3.4 l-3.4 2.8 l-3.4 -2.8 z" fill="#12101A"/>
  <!-- scarf: a route line with station dots, same as the rest of the cast -->
  <path d="M18 46 h28" stroke="#2F7BFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M44 46 l7 8" stroke="#2F7BFF" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="25" cy="46" r="2.3" fill="#FFFCF5"/>
  <circle cx="38" cy="46" r="2.3" fill="#FFFCF5"/>
</svg>
