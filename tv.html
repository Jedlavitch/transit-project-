<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Brand marks. favicon.svg is the dot-less 16px drawing: the guide's floor
     for the full mark is 40px, and a browser tab is not going to honour that. -->
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="apple-touch-icon" href="brand/icon-dark-180.png">
<meta name="theme-color" content="#12101A">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transit Project — TV Menu</title>
<!-- Keep the screen on. A launcher you drive from a couch is exactly the page
     that sits untouched long enough for a display to dim. -->
<script src="wake.js?v=1"></script>
<style>
  /* tv.html — a 10-foot launcher. Everything here is sized for a couch, not a
     desk, and driven by the four arrow keys + OK that every TV remote has. */

  /* This page deliberately does not load theme.css — it has its own 10-foot
     scale and would fight the board styles — so the brand faces are declared
     here rather than inherited. Same three families, same tokens. */
  @import url("https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap");
  :root{
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --brand-pink:#FF3D77; --brand-teal:#00E0C6; --brand-blue:#2F7BFF;
  }
  /* The mark, scaled to the 10-foot page rather than pinned at 40px, with the
     guide's clear space (one station dot, 13%) built into the margin. */
  .brandmark{display:block; flex:none;
    width:clamp(40px,calc(3*var(--u)),58px); height:clamp(40px,calc(3*var(--u)),58px);
    margin:calc(clamp(40px,calc(3*var(--u)),58px) * .13); align-self:center}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#070d18; color:#e8f0ff; overflow:hidden;
    font-family:var(--body);
    /* One scaling unit for the whole page. Sizing off width alone overflows a
       short screen (720p TVs overlapped their own footer), so height gets a
       vote: on 16:9 the two terms are near-identical, and anything shorter
       shrinks type to fit instead of spilling over the row below. */
    --u:min(1vw, 1.72vh);
    /* TVs overscan: keep everything inside a safe margin so nothing is cut off */
    padding:max(3vh,18px) max(4vw,24px);
    display:flex; flex-direction:column; gap:2.2vh;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(90vw 60vh at 12% 0%, rgba(78,161,255,.16), transparent 60%),
      radial-gradient(70vw 55vh at 95% 105%, rgba(181,140,255,.14), transparent 60%);
  }
  header{position:relative; z-index:1; display:flex; align-items:baseline; gap:1.2rem; flex-wrap:wrap}
  h1{
    margin:0; font-family:var(--display); font-weight:800; text-transform:uppercase;
    font-size:clamp(24px,calc(3.4*var(--u)),84px); letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--brand-pink),var(--brand-blue) 50%,var(--brand-teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{font-size:clamp(13px,calc(1.35*var(--u)),34px); color:#93a6c4}
  .clock{margin-left:auto; font-variant-numeric:tabular-nums; text-align:right}
  .clock .t{font-size:clamp(20px,calc(2.7*var(--u)),68px); font-weight:700; letter-spacing:1px}
  .clock .d{font-size:clamp(11px,calc(1.05*var(--u)),20px); color:#93a6c4}

  /* Cities take twice the leftover height of Views, so the tiles grow to fill a
     TV instead of huddling at the top with dead space underneath. */
  .section{position:relative; z-index:1; display:flex; flex-direction:column; min-height:0}
  #citySec{flex:2 1 0}
  #viewSec{flex:1 1 0}
  .section .grid{flex:1 1 auto; grid-auto-rows:1fr; min-height:0}
  .section h2{
    margin:0 0 1vh; font-size:clamp(11px,calc(1.05*var(--u)),20px); font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:#7f93b3;
  }

  .grid{display:grid; gap:clamp(8px,calc(1.2*var(--u)),20px)}
  /* Cities outgrew four columns: at 11 they need a third row, and this page
     deliberately does not scroll, so the extra row was being cut off. Six
     columns keeps it to two rows and keeps every tile the same height as
     before, rather than shrinking them all to buy room for one row nobody
     could see anyway. */
  #cities{grid-template-columns:repeat(6,1fr)}
  @media (max-width:1500px){ #cities{grid-template-columns:repeat(4,1fr)} }
  /* Five views in four columns is two rows, and Views only gets a third of the
     leftover height, so both rows were squeezed until the tile names clipped.
     Five columns puts them on one row — the same fix, and the same reasoning,
     as the six-column change above. */
  #views{grid-template-columns:repeat(5,1fr)}
  @media (max-width:1100px){ #views{grid-template-columns:repeat(3,1fr)} }

  .tile{
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    gap:.35em; padding:clamp(10px,calc(1.35*var(--u)),24px);
    /* Hard guarantee: a tile can never paint over its neighbour or the footer. */
    overflow:hidden;
    border-radius:14px; cursor:pointer; text-decoration:none; color:inherit;
    background:linear-gradient(160deg,rgba(24,38,64,.95),rgba(14,23,42,.95));
    border:2px solid rgba(120,150,200,.18);
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .tile .num{
    position:absolute; top:.5em; right:.7em; font-size:clamp(11px,calc(1.05*var(--u)),20px);
    font-weight:700; color:#5f7396;
  }
  /* City code in the utility face, not an emoji. Sized far below what the emoji
     occupied — three letters at 72px would swallow the tile — and carrying the
     tile's own accent, so it still works as a colour-coded anchor from a couch,
     which is what the emoji was really doing. */
  .tile .icon{font-family:var(--mono); font-weight:600; letter-spacing:.08em;
    font-size:clamp(13px,calc(1.5*var(--u)),34px); line-height:1;
    align-self:flex-start; padding:.32em .5em; border-radius:.4em;
    background:color-mix(in srgb, var(--sys,#4ea1ff) 22%, transparent); color:#dce8fb}
  .tile .name{font-size:clamp(17px,calc(2.15*var(--u)),56px); font-weight:700; line-height:1.1}
  /* Six narrower columns make the longest system lists wrap to a third line,
     which overflowed the tile. Cap it at two lines and fade the overflow rather
     than letting the box grow — the name is what you navigate by, the list
     underneath is only a hint at what the board carries. */
  .tile .desc{font-size:clamp(11px,calc(1.15*var(--u)),30px); color:#93a6c4; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tile .bar{height:4px; border-radius:3px; background:var(--sys,#4ea1ff); opacity:.85}

  /* The focus ring is the whole point of this page — it has to be obvious from
     across a room, so it scales and glows rather than being a 2px outline. */
  .tile.on{
    transform:scale(1.045);
    border-color:var(--sys,#4ea1ff);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--sys,#4ea1ff) 45%, transparent),
               0 18px 50px rgba(0,0,0,.55);
    background:linear-gradient(160deg,rgba(36,56,92,.98),rgba(18,30,54,.98));
  }
  .tile.on .desc{color:#c3d3ec}
  .tile.last::after{
    content:"last used"; position:absolute; bottom:.55em; right:.8em;
    font-size:clamp(9px,calc(.85*var(--u)),16px); color:#7f93b3; letter-spacing:.1em; text-transform:uppercase;
  }

  footer{
    position:relative; z-index:1; margin-top:auto; display:flex; gap:1.6em; flex-wrap:wrap;
    font-size:clamp(11px,calc(1.05*var(--u)),20px); color:#7f93b3;
  }
  footer kbd{
    background:rgba(120,150,200,.15); border:1px solid rgba(120,150,200,.3);
    border-radius:5px; padding:.1em .45em; font-family:inherit; color:#c3d3ec;
  }

  #castBtn{
    display:flex; align-items:center; gap:.5em; cursor:pointer;
    font:inherit; font-size:clamp(12px,calc(1.1*var(--u)),22px); font-weight:600;
    color:#c3d3ec; background:rgba(120,150,200,.12);
    border:2px solid rgba(120,150,200,.28); border-radius:10px;
    padding:.45em .9em; transition:border-color .14s ease, background .14s ease;
  }
  #castBtn:hover,#castBtn:focus-visible{border-color:#4ea1ff; background:rgba(78,161,255,.18); outline:none}
  #castBtn.casting{border-color:#33d17a; background:rgba(51,209,122,.18); color:#d6ffe7}
  #castBtn.casting .ico{animation:pulse 1.6s ease-in-out infinite}
  #castBtn.dim{opacity:.55}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  #toast{
    position:fixed; left:50%; bottom:6vh; transform:translateX(-50%) translateY(1em);
    z-index:60; max-width:min(90vw,780px); text-align:center;
    background:rgba(10,18,34,.97); border:2px solid rgba(120,150,200,.35);
    border-radius:12px; padding:.7em 1.2em; color:#e8f0ff;
    font-size:clamp(12px,calc(1.15*var(--u)),24px);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  #castHelp{
    position:fixed; inset:0; z-index:70; display:none;
    align-items:center; justify-content:center; background:rgba(4,9,18,.86);
  }
  #castHelp.show{display:flex}
  #castHelp .box{
    max-width:min(92vw,900px); max-height:88vh; overflow:auto;
    background:#0d1728; border:2px solid rgba(120,150,200,.35); border-radius:16px;
    padding:clamp(18px,calc(2*var(--u)),40px); color:#e8f0ff;
    font-size:clamp(13px,calc(1.2*var(--u)),24px); line-height:1.45;
  }
  #castHelp h3{margin:0 0 .6em; font-size:clamp(18px,calc(1.9*var(--u)),36px)}
  #castHelp ol{margin:.5em 0; padding-left:1.4em}
  #castHelp li{margin:.35em 0}
  #castHelp .url{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all;
    background:rgba(120,150,200,.14); border-radius:8px; padding:.5em .7em; margin:.6em 0;
  }
  #castHelp button{
    margin-top:1em; font:inherit; font-weight:700; cursor:pointer;
    background:#4ea1ff; color:#06121f; border:0; border-radius:10px; padding:.5em 1.4em;
  }

  /* Phones/tablets land here too (the header link is on every board) — stack it. */
  @media (max-width:760px){
    #cities{grid-template-columns:repeat(2,1fr)}
    #views{grid-template-columns:repeat(2,1fr)}
    html{height:auto}
    body{overflow:auto; height:auto; min-height:100%}
    /* Fit-the-viewport sizing is a TV concern. On a phone the page scrolls, so
       rows take their natural height — otherwise the flex split squashes them
       and the tiles' overflow:hidden silently crops the text. (ID selectors
       here because #citySec/#viewSec set the flex ratios above.) */
    #citySec,#viewSec{flex:none}
    .section .grid{grid-auto-rows:auto}
    footer{margin-top:1.5em}
  }
</style>
<script>/* Self-heal stale pages. The Spotter PWA's first service worker was scoped to
   the whole site and cached every board, so a device that installed it keeps serving
   old copies no matter how many times the site is redeployed - which looks exactly
   like "GitHub isn't deploying". Drop that old cache, force any worker to re-check
   for a new version, and never let a worker own these pages again. */
(function(){try{
  if(window.caches && caches.keys) caches.keys().then(function(ks){
    ks.forEach(function(k){ if(k!=="spotter-v2") caches.delete(k); });
  });
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){
        // a worker whose scope covers this page must not be caching boards
        if(r.scope && location.href.indexOf(r.scope)===0 && !/spot\.html$/.test(location.pathname)) r.update();
      });
    });
}catch(e){}})();</script>
</head>
<body>

<header>
  <img class="brandmark" src="brand/mark-on-dark.svg" alt="" width="56" height="56">
  <h1>Live Transit Project</h1>
  <div class="sub">Pick a city — <b>arrow keys</b> to move, <b>OK</b> to open</div>
  <button id="castBtn" type="button"><span class="ico">CAST</span><span class="lbl">Cast to TV</span></button>
  <div class="clock"><div class="t" id="clock">--:--</div><div class="d" id="date">—</div></div>
</header>

<div id="toast" role="status" aria-live="polite"></div>
<div id="castHelp"><div class="box" id="castHelpBox"></div></div>

<section class="section" id="citySec">
  <h2>Cities</h2>
  <div class="grid" id="cities"></div>
</section>

<section class="section" id="viewSec">
  <h2>Views</h2>
  <div class="grid" id="views"></div>
</section>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move</span>
  <span><kbd>OK</kbd> / <kbd>Enter</kbd> open</span>
  <span><kbd>1</kbd>–<kbd>9</kbd> jump straight to a board</span>
  <span><kbd>F</kbd> full screen</span>
  <span><kbd>C</kbd> cast to TV</span>
  <span id="hint"></span>
</footer>

<script>
/* Every board this launcher can open. `city` is the query param night.html and
   flipboard.html already expect, so the view tiles just append it.

   Order is deliberate, not the order the files happen to exist in: the two home
   boards first (so 1 and 2 are the ones actually used daily), then the rest of
   the Northeast, then the West Coast, then Europe. Numbers are positional, so
   this order is also the remote's number-key mapping — it should not churn.

   Icons are one consistent idea — a symbol OF the place — rather than the
   earlier mix of transit glyphs and city mascots, which read as arbitrary. */
var CITIES = [
  {id:"dc",        file:"dc.html",         icon:"DC", name:"Washington DC", desc:"Metro · Metrobus · MARC · Ride On", sys:"#4ea1ff"},
  {id:"philly",    file:"philadelphia.html",  icon:"PHL", name:"Philadelphia",  desc:"SEPTA rail · subway · bus · PATCO", sys:"#3ad0c8"},
  {id:"nyc",       file:"nyc.html",           icon:"NYC", name:"New York",      desc:"Subway · LIRR · Metro-North · PATH", sys:"#ffd166"},
  {id:"nj",        file:"newjersey.html",     icon:"NJ", name:"New Jersey",    desc:"NJ Transit rail · light rail · bus", sys:"#ff9d5c"},
  {id:"boston",    file:"boston.html",        icon:"BOS", name:"Boston",        desc:"MBTA subway · commuter rail · bus", sys:"#33d17a"},
  {id:"la",        file:"losangeles.html",    icon:"LA", name:"Los Angeles",   desc:"Metro rail · Metrolink", sys:"#b58cff"},
  {id:"sf",        file:"sanfrancisco.html",  icon:"SF", name:"San Francisco", desc:"BART · Muni · Caltrain · cable car", sys:"#ff6b8a"},
  {id:"amsterdam", file:"amsterdam.html",     icon:"AMS", name:"Amsterdam",     desc:"Metro · tram · rail · ferry", sys:"#8ab4ff"},
  /* Europe. Icons keep the same rule as the rest of this list — a symbol OF the
     place, not a transit glyph: Cologne's cathedral, Stuttgart as the city both
     Mercedes and Porsche come from, the Alps above Zurich. */
  {id:"cologne",   file:"cologne.html",       icon:"CGN", name:"Cologne",       desc:"KVB Stadtbahn · S-Bahn · DB rail", sys:"#e8a33d"},
  {id:"stuttgart", file:"stuttgart.html",     icon:"STR", name:"Stuttgart",     desc:"SSB Stadtbahn · S-Bahn · DB rail", sys:"#e05a5a"},
  {id:"zurich",    file:"zurich.html",        icon:"ZRH", name:"Zurich",        desc:"Tram · S-Bahn · SBB rail", sys:"#5ad1a0"}
];

/* Views that follow whichever city you used last. `perCity:false` = shared page. */
var VIEWS = [
  {icon:"SKY", name:"Sky",   desc:"Nearest flight overhead, full screen", file:"night.html",      perCity:true,  sys:"#b58cff"},
  {icon:"BRD", name:"Board", desc:"Split-flap departure board",           file:"flipboard.html",  perCity:true,  sys:"#ffd166"},
  {icon:"TOUR", name:"Tour",  desc:"Every city's vehicles on one map",     file:"tour.html",       perCity:false, sys:"#3ad0c8"},
  {icon:"SPOT", name:"Spot",  desc:"Log what you see — phone app",         file:"spot.html",       perCity:false, sys:"#33d17a"},
  {icon:"ACCT", name:"Account", desc:"Sign-in, licence key, saved settings", file:"profile.html",    perCity:false, sys:"#4ea1ff"}
];

var LAST_KEY = "tb.tvLastCity";
var lastCity = "";
try { lastCity = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}

/* One flat list in DOM order — the arrow-key math below treats it as rows of
   `cols` so ↓ from a city lands on the view directly beneath it. */
var tiles = [];

function tile(o){
  var a = document.createElement("a");
  a.className = "tile";
  a.href = o.href;
  a.style.setProperty("--sys", o.sys);
  /* Only the first nine tiles get a number: the shortcut is a single keypress,
     so a "10" badge would advertise a key that does not exist. */
  a.innerHTML =
    (o.num <= 9 ? '<span class="num">' + o.num + '</span>' : '') +
    '<span class="icon">' + o.icon + '</span>' +
    '<span class="name">' + o.name + '</span>' +
    '<span class="desc">' + o.desc + '</span>' +
    '<span class="bar"></span>';
  a.addEventListener("mouseenter", function(){ focusIndex(tiles.indexOf(a)); });
  a.addEventListener("click", function(e){ e.preventDefault(); open(o.href, o.city); });
  return a;
}

function targetCity(){ return lastCity || CITIES[0].id; }

function buildViewHref(v){
  return v.perCity ? v.file + "?city=" + targetCity() : v.file;
}

var cityWrap = document.getElementById("cities");
CITIES.forEach(function(c, i){
  var el = tile({href:c.file, icon:c.icon, name:c.name, desc:c.desc, sys:c.sys, num:i+1, city:c.id});
  if (c.id === lastCity) el.classList.add("last");
  cityWrap.appendChild(el); tiles.push(el);
});

var viewWrap = document.getElementById("views");
VIEWS.forEach(function(v, i){
  /* Views used to be numbered 9-12, which was right when there were 8 cities.
     With 11 they collided with city badges 9, 10 and 11 — two tiles showing the
     same number, and the key only ever reaching one of them. Numbering now
     continues from the city count. */
  var el = tile({href:buildViewHref(v), icon:v.icon, name:v.name, desc:v.desc, sys:v.sys,
                 num:CITIES.length + i + 1, city:""});
  el.dataset.view = i;
  viewWrap.appendChild(el); tiles.push(el);
});

/* Start on the board you opened last, so the common case is OK-and-go. */
var idx = 0;
if (lastCity){
  var li = CITIES.map(function(c){ return c.id; }).indexOf(lastCity);
  if (li >= 0) idx = li;
}

function focusIndex(n){
  if (n < 0 || n >= tiles.length) return;
  tiles[idx].classList.remove("on");
  idx = n;
  tiles[idx].classList.add("on");
  tiles[idx].focus({preventScroll:true});
}
tiles.forEach(function(t){ t.tabIndex = -1; });
tiles[idx].classList.add("on");
tiles[idx].focus({preventScroll:true});

function open(href, city){
  if (city){ try { localStorage.setItem(LAST_KEY, city); } catch (e) {} }
  window.location.href = href;
}

function move(dx, dy){
  var cols = 4;
  var n = tiles.length, cityCount = CITIES.length;
  var next = idx;
  if (dx){
    next = idx + dx;
    if (next < 0) next = n - 1;
    if (next >= n) next = 0;
  } else if (dy){
    next = idx + dy * cols;
    /* Wrap between the two sections instead of dead-ending at an edge. */
    if (next < 0) next = idx + cityCount;                  /* up from row 1 -> views */
    if (next >= n) next = idx % cols;                      /* down off the end -> row 1 */
    if (next >= n) next = n - 1;
  }
  focusIndex(next);
}

document.addEventListener("keydown", function(e){
  var k = e.key;
  /* While the cast help is up it owns the keyboard — otherwise arrow presses
     would silently move the selection behind the overlay. */
  if (document.getElementById("castHelp").classList.contains("show")){
    if (k === "Escape" || k === "Enter" || k === " ") { closeCastHelp(); e.preventDefault(); }
    return;
  }
  if (k === "c" || k === "C"){ toggleCast(); e.preventDefault(); return; }
  if (k === "ArrowRight"){ move(1,0); e.preventDefault(); }
  else if (k === "ArrowLeft"){ move(-1,0); e.preventDefault(); }
  else if (k === "ArrowDown"){ move(0,1); e.preventDefault(); }
  else if (k === "ArrowUp"){ move(0,-1); e.preventDefault(); }
  else if (k === "Enter" || k === " "){
    var t = tiles[idx];
    open(t.getAttribute("href"), CITIES[idx] ? CITIES[idx].id : "");
    e.preventDefault();
  }
  else if (/^[1-9]$/.test(k)){
    /* Remotes have a number pad; 1-8 are cities, 9 is the first view. */
    var n = parseInt(k,10) - 1;
    if (n < tiles.length) { focusIndex(n); var t2 = tiles[n]; open(t2.getAttribute("href"), CITIES[n] ? CITIES[n].id : ""); }
  }
  else if (k === "f" || k === "F"){
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function(){
      document.getElementById("hint").textContent = "full screen blocked here — try the TV's own zoom";
    });
  }
});

/* ---- Casting -------------------------------------------------------------
   No web API lets a page mirror its own tab — only the browser's own UI can do
   that, which is why a naive "cast" button on a website does nothing. What a
   page CAN do is the Presentation API: hand a URL to a Chromecast / Google TV,
   which then loads that page itself. For a kiosk board that is better than
   mirroring anyway — the TV renders the board at its own resolution, live, and
   this laptop can be closed afterwards. Where the API doesn't exist (Safari,
   Firefox) the button explains how to cast in THAT browser rather than
   pretending to work. -------------------------------------------------------*/
var castConn = null;
var castAvail = null;   /* true / false once known, null = unknown */

function absUrl(href){ return new URL(href, location.href).href; }
function selectedName(){ return tiles[idx].querySelector(".name").textContent; }

function castSupported(){
  return typeof PresentationRequest === "function" && !!navigator.presentation;
}

/* The TV fetches the URL over the network itself, so it has to be an address
   the TV can actually reach. localhost is a secure context (so the API exists
   and the picker opens) but is unreachable from the TV — worth saying plainly
   instead of letting the cast fail on the device with no explanation. */
function castReachable(){ return location.protocol === "https:"; }

function toast(msg, ms){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, ms || 5200);
}

function setCastUI(){
  var b = document.getElementById("castBtn"), lbl = b.querySelector(".lbl");
  b.classList.remove("dim");
  if (castConn){
    b.classList.add("casting"); lbl.textContent = "Stop casting";
    b.title = "Stop casting (C)"; return;
  }
  b.classList.remove("casting");
  if (!castSupported()){
    lbl.textContent = "Cast — how?";
    b.title = "This browser can't start a cast from a page — click for how to do it on this device";
    return;
  }
  lbl.textContent = "Cast to TV";
  if (castAvail === false){
    b.classList.add("dim");
    b.title = "No cast device found on this network yet — click for other ways to get a board on the TV";
    return;
  }
  b.title = "Cast " + selectedName() + " to a TV (C)";
}

function castHelp(reason){
  var ua = navigator.userAgent;
  var isSafari  = /safari/i.test(ua) && !/chrome|chromium|crios|edg|android/i.test(ua);
  var isFirefox = /firefox|fxios/i.test(ua);
  var published = "https://transitproject.online/tv.html";
  var body;

  if (reason === "local"){
    body = "<h3>Casting needs the published site</h3>" +
      "<p>This page is being served from <b>localhost</b>. The TV fetches the board over " +
      "your network by itself, and it can't reach localhost — so the cast would fail on the " +
      "TV even though the picker opens here. Cast from the published address instead:</p>" +
      '<div class="url">' + published + "</div>";
  } else if (reason === "none"){
    body = "<h3>No cast device found</h3>" +
      "<p>Nothing on this network is advertising itself as a Chromecast or Google TV. Either " +
      "the TV is off/asleep, or this device is on a different network (guest Wi-Fi is a common " +
      "culprit). You can always open the menu in the TV's own browser instead:</p>" +
      '<div class="url">' + published + "</div>";
  } else if (isSafari){
    body = "<h3>Casting from Safari</h3>" +
      "<p>Safari doesn't let a page start a cast, so this has to go through AirPlay:</p>" +
      "<ol><li>Open <b>Control Centre</b> on your Mac or iPhone</li>" +
      "<li>Choose <b>Screen Mirroring</b></li>" +
      "<li>Pick your Apple TV</li></ol>" +
      "<p>Or open this menu in the TV's own browser and pick a board there — that's what it's built for:</p>" +
      '<div class="url">' + published + "</div>";
  } else if (isFirefox){
    body = "<h3>Firefox can't cast</h3>" +
      "<p>Firefox has no casting support at all, from a page or from its own menu. Two options:</p>" +
      "<ol><li>Open this menu in your TV's browser and pick a board there</li>" +
      "<li>Or open it in Chrome, which can cast a board straight to a Chromecast</li></ol>" +
      '<div class="url">' + published + "</div>";
  } else {
    body = "<h3>Casting from this browser</h3>" +
      "<p>This browser doesn't expose casting to a page. Try its own menu " +
      "(<b>⋮ → Cast</b> in Chrome and Edge), or open this menu in the TV's browser:</p>" +
      '<div class="url">' + published + "</div>";
  }

  var box = document.getElementById("castHelpBox");
  box.innerHTML = body + '<button type="button" id="castHelpOk">Got it</button>';
  document.getElementById("castHelp").classList.add("show");
  document.getElementById("castHelpOk").onclick = closeCastHelp;
  document.getElementById("castHelpOk").focus();
}

function closeCastHelp(){
  document.getElementById("castHelp").classList.remove("show");
  tiles[idx].focus({preventScroll:true});
}

function startCast(){
  if (!castSupported()) { castHelp(); return; }
  if (!castReachable()) { castHelp("local"); return; }
  if (castAvail === false) { castHelp("none"); return; }

  var name = selectedName(), req;
  try { req = new PresentationRequest([absUrl(tiles[idx].getAttribute("href"))]); }
  catch (e) { castHelp(); return; }

  req.start().then(function(conn){
    castConn = conn;
    var ended = function(){ castConn = null; setCastUI(); toast("Casting stopped"); };
    conn.onclose = ended; conn.onterminate = ended;
    setCastUI();
    toast(name + " is loading on the TV — it runs the board itself, so you can close this tab");
  }).catch(function(err){
    var n = err && err.name;
    if (n === "NotFoundError") castHelp("none");
    else if (n === "NotAllowedError") toast("Cast cancelled");
    else toast("Couldn't start casting" + (n ? " (" + n + ")" : ""));
  });
}

function stopCast(){
  try { castConn.terminate(); } catch (e) {}
  castConn = null; setCastUI();
}

function toggleCast(){ castConn ? stopCast() : startCast(); }

function initCast(){
  document.getElementById("castBtn").addEventListener("click", toggleCast);
  document.getElementById("castHelp").addEventListener("click", function(e){
    if (e.target.id === "castHelp") closeCastHelp();
  });
  setCastUI();
  if (!castSupported()) return;
  try {
    var probe = new PresentationRequest([absUrl("tv.html")]);
    /* Also lets the browser's own Cast menu offer this page as a target. */
    try { navigator.presentation.defaultRequest = probe; } catch (e) {}
    probe.getAvailability().then(function(a){
      castAvail = a.value;
      a.onchange = function(){ castAvail = a.value; setCastUI(); };
      setCastUI();
    }).catch(function(){ castAvail = null; setCastUI(); });  /* unknown: stay enabled */
  } catch (e) {}
}
initCast();

function tick(){
  var d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  document.getElementById("date").textContent =
    d.toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
