# Emails you when an automated job fails.
#
# WHY THIS EXISTS
#   Two of the jobs here are the safety net for things that fail silently on the
#   boards: "Refresh schedules" rebuilds timetables before agencies' calendars
#   lapse, and "Deploy site to Pages" is how anything reaches customers at all.
#   If one of those breaks, nothing tells you. The schedule job even ends with a
#   deliberate "fail if anything is still expired" step — which is only useful if
#   somebody hears about the failure.
#
# HOW IT REACHES YOU
#   It opens a GitHub issue, and GitHub emails the repo owner about new issues
#   and comments by default. That is deliberate: no API key, no email service, no
#   secret to rotate, and it works the moment this file lands. An issue is also a
#   record — you can see when it started and when it cleared.
#
#   It does NOT open a new issue every run. A repeat failure adds a comment to
#   the open one, so a job failing twice a week for a month is one thread, not
#   eight identical issues. When the job next succeeds, the issue is closed with
#   a note, so an empty issue list means everything is healthy.
#
# ALSO WORTH DOING (30 seconds, and it covers workflows added later):
#   github.com/settings/notifications -> Actions -> tick "Send notifications for
#   failed workflows only". That is GitHub's own email on any failed run. This
#   file adds the issue trail and the auto-close on recovery; the setting is the
#   blunt backstop. Do both.
#
# PHONE PUSH (optional): set a repository variable TB_NTFY_TOPIC to the ntfy
#   topic you already use for the Spotter, and failures also push to your phone.
#   Settings -> Secrets and variables -> Actions -> Variables. Left unset, that
#   step is skipped.

name: Alert on failure

on:
  workflow_run:
    # Named explicitly rather than "all workflows": this one must never watch
    # itself, or a failure here would retrigger it in a loop.
    workflows: ["Refresh schedules", "Deploy site to Pages", "Spotter watch"]
    types: [completed]

permissions:
  contents: read
  issues: write

# One at a time, so two jobs failing together cannot both create the issue.
concurrency:
  group: failure-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the alert issue
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NO: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          TITLE="Automated job failing: $WF"
          # One open issue per workflow, found by exact title.
          NUM=$(gh issue list --state open --label automation --limit 50 \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          BODY=$(printf '%s\n' \
            "Run #$RUN_NO of **$WF** failed." \
            "" \
            "$RUN_URL" \
            "" \
            "This issue closes itself when the job next succeeds.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
            echo "Commented on existing issue #$NUM"
          else
            gh label create automation --color B60205 --description "Automated job alerts" 2>/dev/null || true
            gh issue create --title "$TITLE" --label automation --body "$BODY"
            echo "Opened a new issue"
          fi

      - name: Push to phone (only if a topic is configured)
        if: ${{ github.event.workflow_run.conclusion == 'failure' && vars.TB_NTFY_TOPIC != '' }}
        run: |
          curl -s --max-time 20 \
            -H "Title: ${{ github.event.workflow_run.name }} failed" \
            -H "Tags: warning" \
            -d "${{ github.event.workflow_run.html_url }}" \
            "https://ntfy.sh/${{ vars.TB_NTFY_TOPIC }}" >/dev/null || true

      - name: Close the alert issue when the job recovers
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TITLE="Automated job failing: $WF"
          NUM=$(gh issue list --state open --label automation --limit 50 \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Recovered — $WF succeeded. $RUN_URL"
            echo "Closed issue #$NUM"
          else
            echo "Nothing open for $WF - nothing to close."
          fi
