<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transit Project — Activate</title>
<link rel="stylesheet" href="theme.css?v=14" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{background:radial-gradient(1200px 800px at 80% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color:var(--text); -webkit-font-smoothing:antialiased; padding:40px 20px}
  .wrap{max-width:560px; margin:0 auto}
  h1{font-size:26px; margin:0 0 18px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:14px; padding:24px}
  .key{font:800 24px/1.3 ui-monospace,Menlo,monospace; letter-spacing:.08em; text-align:center;
    background:var(--row-bg); border:1px solid var(--row-line); border-radius:10px; padding:16px; margin:14px 0}
  p{color:var(--muted); font-size:13.5px; line-height:1.7}
  .cta{display:inline-block; width:100%; text-align:center; margin-top:10px; padding:13px; border-radius:10px;
    border:none; background:var(--accent); color:#04101f; font-weight:800; font-size:15px; cursor:pointer}
  input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--row-bg);
    color:var(--text); font:700 16px ui-monospace,Menlo,monospace; letter-spacing:.06em; text-transform:uppercase}
  #msg{font-size:13px; min-height:17px; margin-top:10px}
  .back{color:var(--accent-ink); font-size:13px; text-decoration:none}

  /* ============ blue depth pass (shared design language) ============ */
  body{background:
      radial-gradient(800px 600px at 105% -8%, rgba(78,161,255,.14) 0%, transparent 58%),
      radial-gradient(1000px 700px at 50% 120%, var(--blue-deep,#0a1a3d) 0%, transparent 60%),
      var(--bg)}
  h1{background:linear-gradient(90deg,var(--text) 20%,#4ea1ff 70%,#b58cff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    width:fit-content}
  :root[data-theme="day"] h1{filter:brightness(.7) saturate(1.25)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="dc.html">← back to the board</a>
  <h1>Activate your license</h1>
  <div class="panel">
    <div id="fetching" style="display:none"><p>Confirming your purchase…</p></div>
    <div id="keyWrap" style="display:none">
      <p>Your license key — save it somewhere safe. It works on up to 5 devices:</p>
      <div class="key" id="keyText">—</div>
    </div>
    <div id="manualWrap">
      <p>Paste your license key:</p>
      <input id="keyInput" placeholder="TB-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
    </div>
    <button class="cta" id="activateBtn">Activate this device</button>
    <div id="msg"></div>
    <!-- The way out for somebody who paid and has nothing to type. Written by
         strandedHelp() so it can carry a mailto link and the session id, which
         is the one string support needs to reissue the key. -->
    <div id="help" style="display:none;margin-top:14px;padding:13px 15px;border-radius:11px;
      background:var(--panel2,#0c1628);border:1px solid var(--line,#22345a);
      color:var(--muted,#93a5cf);font-size:13.5px;line-height:1.6"></div>
    <p style="margin-top:16px">To license another device: open any city board on it, click the
      “◇ evaluation” chip in the corner, and enter the same key.</p>
  </div>
</div>
<script>
  const WORKER_URL = "https://tblicense.jacklemonade2.workers.dev";
  const workerUrl = (localStorage.getItem("tb.workerUrl") || WORKER_URL || "").replace(/\/+$/,"");
  /* Where a stranded buyer is sent. A role address on the product's own domain
     rather than a personal inbox: it can be handed to somebody else, and it
     does not put anyone's private mail on a page the whole internet can read.
     Empty is still a valid setting — the panel then says to reply to the
     receipt Stripe already sent, which needs no published address at all. */
  const SUPPORT_EMAIL = "info@transitproject.online";

  const qs = new URLSearchParams(location.search);
  const msg = t => { document.getElementById("msg").textContent = t; };
  const show = (id, on) => { document.getElementById(id).style.display = on ? "block" : "none"; };
  let key = (qs.get("key") || "").trim().toUpperCase();
  const esc = s => String(s == null ? "" : s)
    .replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  /* The dead end this exists to remove: somebody has paid, has no key, and the
     page's only control is a box asking for the key they never got. Whatever
     went wrong upstream — a missing redirect, a Stripe lookup that failed, a
     Worker that was down — the buyer's next step should never be "guess".

     The session id is included wherever we have one, because that single string
     is all it takes to reissue the key against the real payment, so a support
     message carrying it can be answered in seconds instead of a hunt through
     the dashboard. */
  function strandedHelp(session, reason) {
    const box = document.getElementById("help");
    const sess = session ? String(session).slice(0, 120) : "";
    const subject = "Transit Project licence — paid, no key";
    const body = "I bought a licence and didn't receive a key."
      + (sess ? "\n\nStripe checkout session: " + sess : "")
      + "\n\n(Please attach or quote your Stripe receipt.)";
    const contact = SUPPORT_EMAIL
      ? 'Email <a style="color:var(--accent,#4ea1ff)" href="mailto:' + esc(SUPPORT_EMAIL)
        + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body)
        + '">' + esc(SUPPORT_EMAIL) + "</a> and your key will be sent by hand."
      : "Reply to the receipt Stripe emailed you and your key will be sent by hand.";
    box.innerHTML =
      "<b>Paid but no key?</b><br>" + (reason ? esc(reason) + " " : "")
      + contact + " Your purchase is on record either way — nothing further is owed."
      + (sess ? '<br><br><span style="opacity:.75">Quote this reference:</span><br>'
                + '<code style="user-select:all;word-break:break-all;font-size:12.5px">' + esc(sess) + "</code>" : "");
    box.style.display = "block";
  }

  function showKey(k){
    key = k;
    document.getElementById("keyText").textContent = k;
    show("keyWrap", true); show("manualWrap", false);
  }

  (async function boot(){
    const session = qs.get("session_id");
    if (key) { showKey(key); return; }
    /* Came back from a real Stripe checkout, but there is no licence server to
       turn the session into a key. Without this branch the page falls through
       to its default state -- "Paste your license key:" and an empty box -- so
       somebody who has just paid $19 is asked for a key nobody ever sent them,
       with no error and no explanation. That reads as a scam, and it is the
       worst thirty seconds a new customer could have.

       buy.html will not show a Buy button unless a Worker is configured, so
       this should be unreachable. It exists because "should be unreachable" is
       not the standard to hold a payment page to. */
    if (session && !workerUrl) {
      show("manualWrap", false);
      document.getElementById("activateBtn").style.display = "none";
      msg("Your payment went through — but this site can't issue keys yet, so there's "
        + "nothing to activate on this device.");
      strandedHelp(session, "The licence server isn't connected.");
      return;
    }
    if (session && workerUrl) {
      show("fetching", true); show("manualWrap", false);
      try {
        const r = await fetch(`${workerUrl}/claim?session=${encodeURIComponent(session)}`);
        const data = await r.json();
        show("fetching", false);
        if (data.ok) { showKey(data.key); return; }
        /* Paid, and the claim was refused. The manual box stays — a key from a
           previous device still works here — but it is no longer the only way
           out, which it was when this said "contact the seller" and left them
           to work out how. */
        show("manualWrap", true);
        msg("Couldn't confirm the purchase (" + (data.error || "error") + ").");
        strandedHelp(session, "Stripe couldn't confirm that payment automatically.");
      } catch (_) {
        show("fetching", false); show("manualWrap", true);
        msg("Couldn't reach the licence server.");
        strandedHelp(session, "The licence server didn't answer.");
      }
      return;
    }
    /* No session and no key. Usually someone opening the page to type a key
       they already have — so the box stays and nothing is alarming — but it is
       also where a buyer lands when the payment link's redirect drops the
       session id, having paid and having nothing to type. */
    strandedHelp("", "");
  })();

  document.getElementById("activateBtn").onclick = async () => {
    const k = (key || document.getElementById("keyInput").value || "").trim().toUpperCase();
    if (!k) { msg("Enter a key first."); return; }
    localStorage.setItem("tb.license", k);
    localStorage.removeItem("tb.license.okUntil");
    if (workerUrl) {
      msg("Checking…");
      try {
        let dev = localStorage.getItem("tb.device");
        const r = await fetch(`${workerUrl}/verify?key=${encodeURIComponent(k)}&device=${dev||"activate"}`);
        const data = await r.json();
        if (data.ok) {
          localStorage.setItem("tb.license.okUntil", String(Date.now()+86400000));
          localStorage.setItem("tb.license.lastOk", String(Date.now()));
          msg("✓ Licensed! Opening your board…");
          setTimeout(()=>{ window.location.href = "dc.html"; }, 900);
        } else msg(data.error === "device_limit" ? "This key is already on its maximum number of devices." : "That key wasn't recognized.");
      } catch (_) { msg("Saved. The board will verify the key when it can reach the license server."); }
    } else msg("Saved. Open any board to finish activation.");
  };
</script>
</body>
</html>
