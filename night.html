<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Brand marks. favicon.svg is the dot-less 16px drawing: the guide's floor
     for the full mark is 40px, and a browser tab is not going to honour that. -->
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="apple-touch-icon" href="brand/icon-dark-180.png">
<meta name="theme-color" content="#12101A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#010409" />
<title>Sky — Nearest Flight</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="theme.css?v=15" />
<script src="settings-ui.js?v=10" defer></script>
<script src="license.js" defer></script>
<script src="gate.js?v=1" defer></script>
<script src="delays.js?v=2"></script>
<script src="transitous.js?v=2"></script>
<script src="schedule-health.js?v=1"></script>
<script src="worker-health.js?v=1"></script>
<style>
  :root{
    --bg:#010409; --amber:#7db8ff; --amber-dim:#4a7fc4; --muted:#35567e; --faint:#16263c;
    --city:#dcebff; --glow:#123c78; --good:#5ad1a0; --late:#ff6b5a;
    --panel:#0d1728; --panel2:#0a1220; --btn-text:#06121f;
  }
  /* Black/Day are picked in Settings alongside the existing accent-color swatches
     (same three-way Dark/Black/Day choice as the two boards). Day trades the
     accent-derived night-sky palette for a fixed light one -- the picked accent
     hex still tints buttons/borders, but structural text/bg stay fixed so they
     stay readable on a light background; see setTheme()'s "day" branch. */
  :root[data-theme="day"]{
    --bg:#eef1f8; --amber:#1c3a63; --amber-dim:#3d5a82; --muted:#5b6478; --faint:#c7ccd9;
    --city:#161b2e; --glow:#c7d6f2; --good:#1f8f5f; --late:#c23b2b;
    --panel:#ffffff; --panel2:#f3f5fb; --btn-text:#ffffff;
  }
  :root[data-theme="day"] #sky{display:none}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--amber);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; flex-direction:column; height:100dvh;
    letter-spacing:.5px;
  }
  /* top bar */
  header{display:flex; align-items:center; gap:14px; padding:3.2vmin 4vw 0}
  /* The mark. It scales with the page like everything else here, but never
     below the guide's 40px floor — this page has no zoom on an ancestor, so
     the rendered size is the CSS size. The margin is the guide's clear space:
     one station dot, 13% of the mark. */
  #markLink{display:flex; align-items:center; flex:none; border:0; padding:0; background:none}
  #markLink:hover{border:0}
  #brandMark{display:block; width:clamp(40px,5.2vmin,72px); height:clamp(40px,5.2vmin,72px);
    margin:calc(clamp(40px,5.2vmin,72px) * .13)}
  header .tag{font-size:clamp(.8rem,2.1vw,1.5rem); color:var(--amber-dim); font-weight:700;
    text-transform:uppercase; letter-spacing:.35em;
    background:linear-gradient(90deg,var(--amber),#3ad0c8); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent}
  header .clock{margin-left:auto; font-size:clamp(1rem,2.6vw,2rem); color:var(--muted);
    font-variant-numeric:tabular-nums}
  header a, header button{color:var(--muted); text-decoration:none; font-size:clamp(.9rem,2.2vw,1.4rem);
    border:1px solid var(--faint); border-radius:10px; padding:.4em .7em; background:none;
    cursor:pointer; display:inline-flex; align-items:center; font-family:inherit}
  header a:hover, header button:hover{color:var(--amber-dim); border-color:var(--amber-dim)}

  main{flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.2vmin;
    padding:1.4vmin 5vw; min-height:0; overflow:hidden}

  /* sizes are height-aware (min of vw and vh) so the page always fits the screen */
  .distrow{display:flex; align-items:center; gap:clamp(8px,1.4vw,16px)}
  .dist{font-size:clamp(.8rem,min(2.4vw,2.5vh),1.6rem); color:var(--amber-dim); font-weight:600}
  /* Compass pointer: north stays up and the needle swings to the subject, so
     "the plane is that way" is readable at a glance from across a room. */
  .compass{position:relative; flex:none; width:clamp(38px,min(6vw,7vh),74px); aspect-ratio:1}
  .compass svg{width:100%; height:100%; overflow:visible}
  .compass .c-ring{fill:none; stroke:var(--amber-dim); stroke-width:3; opacity:.35}
  .compass .c-tick{stroke:var(--amber-dim); stroke-width:4; opacity:.45; stroke-linecap:round}
  .compass .c-arrow{fill:var(--amber); filter:drop-shadow(0 0 6px var(--amber))}
  #compassNeedle{transform-origin:50px 50px; transition:transform .8s cubic-bezier(.3,.8,.3,1)}
  .compass .c-n{position:absolute; top:-0.35em; left:50%; transform:translateX(-50%);
    font:800 clamp(7px,1.1vw,11px)/1 var(--mono,ui-monospace,Menlo,monospace);
    color:var(--amber-dim); opacity:.7; letter-spacing:.05em}
  .airline-row{display:flex; align-items:center; gap:clamp(8px,1.2vw,18px)}
  /* The real carrier's mark, on a white chip so airline blues and blacks stay
     legible on the night palette. Hidden unless a logo actually loads, so a
     private jet or an unknown operator shows the name alone rather than a gap. */
  #airlineLogo{display:none; height:clamp(26px,min(4.4vw,5.2vh),64px); width:auto;
    max-width:34vw; object-fit:contain; background:#fff; border-radius:8px;
    padding:clamp(3px,.5vw,7px); flex:none}
  .airline{font-size:calc(var(--fit,1)*clamp(1.7rem,min(7.4vw,8.8vh),5.4rem)); font-weight:800; line-height:1.08; color:var(--amber);
    background:linear-gradient(92deg,var(--amber) 15%,var(--city) 70%,var(--amber-dim));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; width:fit-content}
  .flight{font-size:calc(var(--fit,1)*clamp(1rem,min(3.1vw,3.5vh),2.3rem)); color:var(--amber-dim); font-weight:700; margin-top:.15em}

  .route{display:flex; align-items:baseline; gap:2.5vw; flex-wrap:wrap; margin-top:.5vmin}
  .route .city{font-size:calc(var(--fit,1)*clamp(1.4rem,min(6.4vw,7.8vh),4.9rem)); font-weight:800; line-height:1.08; color:var(--city);
    background:linear-gradient(90deg,var(--city) 35%,var(--amber) 130%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .route .code{font-size:clamp(1rem,2.6vw,2.4rem); color:var(--muted); font-weight:700}
  .route .arrow{font-size:calc(var(--fit,1)*clamp(1.3rem,min(5vw,6vh),3.8rem)); color:var(--amber-dim); font-weight:400}
  .subcity{font-size:calc(var(--fit,1)*clamp(.78rem,min(2.1vw,2.4vh),1.45rem)); color:var(--muted); font-weight:600; margin-top:.3em}

  .status{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-top:1vmin;
    font-size:calc(var(--fit,1)*clamp(1rem,min(3vw,3.3vh),2.2rem)); font-weight:800}
  .status .phase{color:var(--amber)}
  .status .alt{color:var(--amber-dim); font-weight:700}
  .status .alt:nth-of-type(3n+1){color:#3ad0c8}
  .status .alt:nth-of-type(3n+2){color:#7cc0ff}
  .status .alt:nth-of-type(3n){color:#ffb454}
  :root[data-theme="day"] .status .alt{filter:brightness(.55) saturate(1.3)}
  :root[data-theme="day"] .status .badge.na{filter:brightness(.6) saturate(1.3)}
  .status .badge{padding:.12em .5em; border-radius:.3em; font-weight:800}
  .status .badge.ok{background:rgba(90,209,122,.14); color:var(--good-ink)}
  .status .badge.late{background:rgba(255,107,90,.15); color:var(--late-ink)}
  /* The four shared delay bands (delays.js + theme.css). Deliberately NOT
     derived from --amber/--city, so brand mode repainting the screen in a
     carrier's colour cannot also repaint how late the train is. */
  .status .badge.dly-ok{background:rgba(51,209,122,.14); color:var(--delay-ok)}
  .status .badge.dly-min{background:rgba(255,204,51,.15); color:var(--delay-min)}
  .status .badge.dly-mid{background:rgba(255,138,117,.15); color:var(--delay-mid)}
  .status .badge.dly-max{background:var(--delay-max-bg); color:var(--delay-max-ink)}
  .status .badge.na{color:#b39dff; border:1px solid rgba(179,157,255,.45); background:rgba(179,157,255,.08)}
  /* emergency squawk (7500/7600/7700) or an ADS-B emergency flag -- rare, so
     make it impossible to miss: red, bordered, gently pulsing. */
  .status .badge.faa{background:rgba(255,204,51,.14); color:#ffd76a;
    border:1px solid rgba(255,204,51,.4)}
  .status .badge.faa.major{background:rgba(255,120,60,.16); color:#ffa06a;
    border-color:rgba(255,140,80,.55)}
  .status .badge.hold{background:rgba(255,204,51,.16); color:#ffd76a;
    border:1px solid rgba(255,204,51,.45)}
  .status .badge.emerg{background:rgba(255,60,45,.18); color:#ff6b5a;
    border:1px solid rgba(255,90,80,.55); animation:emergPulse 1.1s ease-in-out infinite}
  @keyframes emergPulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* a rotating arrow shows the vehicle's actual heading (track over ground);
     inline-block so the per-frame transform:rotate() actually applies. */
  .status .hdg-arrow{display:inline-block; font-weight:900; line-height:1}
  .status .vr-arm{font-weight:900}

  /* ---- journey progress: how far along its route the vehicle is, drawn as a
     slim bar with a glowing marker at the live position + flown/to-go labels.
     Shown for planes and Amtrak (anything with known origin+destination). ---- */
  .progress{margin-top:1.3vmin; display:none}
  .progress .bar{position:relative; height:6px; border-radius:99px; background:var(--faint)}
  .progress .fill{position:absolute; left:0; top:0; bottom:0; border-radius:99px;
    background:linear-gradient(90deg,var(--amber-dim),var(--amber) 45%,#3ad0c8 80%,#7cc0ff); transition:width 1s ease}
  .progress .dot{position:absolute; top:50%; width:13px; height:13px; margin-left:-6.5px;
    border-radius:50%; background:var(--amber); transform:translateY(-50%);
    box-shadow:0 0 0 3px var(--bg),0 0 10px 2px var(--glow); transition:left 1s ease}
  .progress .lbl{display:flex; justify-content:space-between; gap:1em; margin-top:.6em;
    font-size:clamp(.7rem,min(1.9vw,2.1vh),1.15rem); color:var(--muted); font-weight:600;
    font-variant-numeric:tabular-nums}
  .progress .lbl .pct{color:var(--amber-dim); font-weight:800}

  .empty{font-size:clamp(2rem,7vw,6rem); font-weight:800; color:var(--amber-dim); text-align:center}

  #fsHint{position:fixed; top:0; left:50%; transform:translate(-50%,-120%); z-index:80;
    background:var(--panel); color:var(--city); border:1px solid var(--faint); border-radius:0 0 12px 12px;
    padding:12px 20px; font-size:14px; max-width:90vw; text-align:center; transition:transform .35s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #fsHint.show{transform:translate(-50%,0)}

  /* ---- animated night sky background ---- */
  #sky{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
  /* Real sunrise/sunset: a horizon-to-zenith gradient recolored from the sun's
     actual elevation at this location (see sunElevationDeg/updateSunSky), sitting
     UNDER the existing glow blobs + stars so twilight/dawn/dusk tint the whole
     sky instead of replacing it. opacity is driven per-frame by JS; only opacity
     transitions (gradients themselves can't be CSS-transitioned) but updates are
     60s apart so the color step is always small enough to look smooth. */
  #sunSky{position:absolute; inset:0; transition:opacity 4s ease}
  #sky .glow{position:absolute; border-radius:50%; filter:blur(70px); opacity:.28;
    animation:drift 30s ease-in-out infinite alternate}
  #sky .g1{width:60vmax;height:60vmax; left:-18vmax; top:-24vmax; background:radial-gradient(circle,var(--glow),transparent 65%)}
  #sky .g2{width:48vmax;height:48vmax; right:-14vmax; bottom:-18vmax; background:radial-gradient(circle,rgba(58,208,200,.85),transparent 65%); animation-delay:-11s; opacity:.2}
  #sky .g3{width:32vmax;height:32vmax; left:38vw; top:58vh; background:radial-gradient(circle,rgba(181,140,255,.8),transparent 60%); animation-delay:-20s; opacity:.16}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,3vmax,0) scale(1.12)}}
  .star{position:absolute; border-radius:50%; background:var(--city);
    animation:twinkle var(--tw,4s) ease-in-out var(--td,0s) infinite}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
  /* ---- the real moon: position + phase computed from the actual sky ---- */
  #moon{position:absolute; width:min(7.5vmin,64px); height:min(7.5vmin,64px); display:none;
    filter:drop-shadow(0 0 16px rgba(190,210,255,.35))}
  #moon svg{width:100%; height:100%; display:block}
  #moon .lit{fill:#e8edf6}
  #moon .base{fill:#1c2740}

  /* ---- rare-bird alert banner (emergency / military / A380 / ISS pass) ---- */
  #alertBanner{position:fixed; top:0; left:50%; transform:translate(-50%,-130%); z-index:85;
    background:var(--panel); border:1px solid var(--amber-dim); border-top:none; border-radius:0 0 14px 14px;
    padding:13px 22px; max-width:92vw; box-shadow:0 12px 44px rgba(0,0,0,.55); transition:transform .45s ease;
    display:flex; align-items:center; gap:14px}
  #alertBanner.show{transform:translate(-50%,0)}
  #alertBanner .ic{font-size:26px}
  #alertBanner .t{color:var(--city); font-weight:800; font-size:clamp(.95rem,2.2vw,1.3rem)}
  #alertBanner .s{color:var(--muted); font-weight:600; font-size:clamp(.8rem,1.8vw,1.05rem); margin-top:2px}
  #alertBanner.red{border-color:rgba(255,90,80,.6)}
  #alertBanner.red .t{color:#ff8577; animation:emergPulse 1.1s ease-in-out infinite}

  /* ---- spotter's log overlay ---- */
  #logPanel, #fleetPanel{position:fixed; inset:0; background:rgba(1,4,9,.72); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  #logPanel.show, #fleetPanel.show{display:flex}
  #logPanel .panel, #fleetPanel .panel{background:var(--panel2); border:1px solid var(--faint); border-radius:18px;
    padding:26px; max-width:520px; width:100%; box-shadow:0 20px 80px rgba(0,0,0,.6);
    max-height:86dvh; overflow:auto}
  #logPanel h3, #fleetPanel h3{color:var(--amber); font-size:20px}
  #logPanel .sect{color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.15em; margin:18px 0 6px}
  #logPanel .row, #fleetPanel .row{display:flex; justify-content:space-between; gap:1em; padding:7px 0;
    border-bottom:1px solid var(--faint); color:var(--city); font-size:14px; font-weight:600}
  #logPanel .row b, #fleetPanel .row b{color:var(--amber)}
  #logPanel .row .when, #fleetPanel .row .when{color:var(--muted); font-variant-numeric:tabular-nums}
  #logPanel .empty2, #fleetPanel .empty2{color:var(--muted); font-size:14px; padding:6px 0}
  #logPanel .actions, #fleetPanel .actions{display:flex; gap:10px; margin-top:22px}
  #logPanel .actions button, #fleetPanel .actions button{flex:1; padding:12px; border-radius:12px; font-weight:800; font-size:14px;
    cursor:pointer; font-family:inherit}
  #logPanel .done2, #fleetPanel .done2{border:none; background:var(--amber); color:var(--btn-text)}
  #logPanel .reset{border:1px solid rgba(255,107,90,.5); background:none; color:var(--late-ink)}
  /* ---- "nearest of N" -> whole-fleet list ---- */
  .fleet-btn{cursor:pointer; border-bottom:1px dotted var(--amber-dim)}
  .fleet-btn:hover{color:var(--amber); border-bottom-color:var(--amber)}
  .frow-sub{color:var(--muted); font-weight:600}
  /* zoom toggle pinned inside the mini map: whole route <-> close on the
     vehicle. Above Leaflet's own panes (which top out around z-index 700). */
  #miniZoomBtn{position:absolute; right:7px; bottom:7px; z-index:900;
    background:rgba(8,16,30,.82); color:var(--amber); border:1px solid var(--faint);
    border-radius:9px; padding:5px 9px; font-family:inherit; font-size:11px; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; cursor:pointer; backdrop-filter:blur(6px);
    display:flex; align-items:center; gap:5px; line-height:1}
  #miniZoomBtn:hover{border-color:var(--amber-dim); color:var(--city)}
  #miniZoomBtn .ic{font-size:12px}
  @media (pointer:coarse){ #miniZoomBtn{padding:8px 11px; font-size:12px} }
  .mini-fleet-dot{display:block; width:7px; height:7px; border-radius:50%;
    background:var(--amber-dim); opacity:.8; box-shadow:0 0 5px var(--glow)}

  /* ---- flight-change transition ---- */
  #flight.swap{animation:swapIn .8s cubic-bezier(.2,.7,.2,1)}
  @keyframes swapIn{
    from{opacity:0; transform:translateY(30px) scale(.98); filter:blur(8px)}
    to{opacity:1; transform:none; filter:none}
  }

  /* ---- mini live map (real position, not just an abstract progress bar) ----
     Lives in the .side column next to the photo, not stretched full-width
     under the text, so it gets a sane (close to square) shape instead of a
     thin wide letterbox. */
  /* position:relative + z-index:0 isolate Leaflet's internal pane z-indexes
     (400+) so the settings/log overlays (z-index:50) actually cover the map */
  #miniMap{width:100%; min-height:0; border-radius:1.4vmin; border:1px solid rgba(124,192,255,.35);
    display:none; overflow:hidden; position:relative; z-index:0}
  #miniMap .leaflet-container{background:var(--panel2)}
  /* where YOU are — the map showed the vehicle and its route but never the
     place you're standing, so "the sky over here" had no "here" on it */
  .mini-here{display:block; width:11px; height:11px; border-radius:50%;
    background:var(--accent,#7cc0ff); border:2px solid var(--bg,#070d17);
    box-shadow:0 0 0 2px var(--accent,#7cc0ff), 0 0 10px var(--accent,#7cc0ff)}
  .mini-here-label{white-space:nowrap; font-size:10px; font-weight:700; letter-spacing:.04em;
    color:var(--text,#e8eefc); text-shadow:0 1px 5px #000, 0 0 2px #000;
    transform:translate(10px,-7px)}
  .mini-veh-icon svg{overflow:visible; filter:drop-shadow(0 0 6px rgba(120,180,255,.9))}
  .mini-veh-icon path, .mini-veh-icon rect{fill:#bcd9ff}
  .mini-veh-icon{transition:transform 1.4s linear}
  .mini-endpt{width:9px; height:9px; border-radius:50%; background:var(--muted); border:2px solid var(--panel2)}

  /* ---- settings panel ---- */
  #settings{position:fixed; inset:0; background:rgba(1,4,9,.72); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  #settings.show{display:flex}
  #settings .panel{background:var(--panel2); border:1px solid var(--faint); border-radius:18px;
    padding:26px; max-width:460px; width:100%; box-shadow:0 20px 80px rgba(0,0,0,.6)}
  #settings h3{color:var(--amber); font-size:20px; margin-bottom:4px}
  #settings .lbl{color:var(--muted); font-size:13px; font-weight:700; text-transform:uppercase;
    letter-spacing:.15em; margin:20px 0 9px}
  .seg{display:flex; gap:8px}
  .seg button{flex:1; padding:14px 6px; border-radius:12px; border:1px solid var(--faint);
    background:var(--panel); color:var(--muted); font-size:15px; font-weight:700; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:inherit}
  .seg button .ic{font-size:22px}
  .seg button.active{border-color:var(--amber); color:var(--amber); background:rgba(125,184,255,.08)}
  .locrow{display:flex; gap:8px; margin:6px 0 8px}
  .locrow input{flex:1; min-width:0; padding:10px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
    color:var(--amber); font-size:15px; font-family:inherit}
  .locrow input:focus{outline:none; border-color:var(--amber)}
  .locrow button{flex:none; padding:0 16px; border-radius:10px; border:0;
    background:var(--amber); color:var(--btn-text,#06121f); font-weight:800; cursor:pointer}
  .ghostbtn{width:100%; padding:9px; border-radius:10px; background:transparent;
    color:var(--amber-dim); border:1px solid rgba(255,255,255,.16); cursor:pointer;
    font-size:13px; font-family:inherit}
  #skyAddrMsg, #goveeMsg{font-size:12.5px; min-height:16px; margin:6px 0 2px; color:var(--amber-dim)}
  .locrow select{flex:1; min-width:0; padding:10px 12px; border-radius:10px; font-family:inherit;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05); color:var(--amber); font-size:15px}
  .swatches{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .sw{width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    padding:0; outline:none}
  .sw.active{border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .sw.custom{background:conic-gradient(#ff5a5a,#ffd23f,#5ad17a,#4aa8ff,#b388ff,#ff5a5a);
    position:relative; overflow:hidden}
  .sw.custom input{position:absolute; inset:-6px; opacity:0; cursor:pointer}
  #settings .done{margin-top:24px; width:100%; padding:13px; border-radius:12px; border:none;
    background:var(--amber); color:var(--btn-text); font-weight:800; font-size:15px; cursor:pointer; font-family:inherit}

  #flight{display:grid; grid-template-columns:1.5fr 1fr; gap:4vw; align-items:center;
    min-height:0; max-height:100%; width:100%}
  #flight .txt{min-width:0}
  /* .side stacks the photo + mini-map, splitting a shared height budget so
     the map gets a roughly square shape instead of a thin full-width strip. */

<script>/* Self-heal stale pages. The Spotter PWA's first service worker was scoped to
   the whole site and cached every board, so a device that installed it keeps serving
   old copies no matter how many times the site is redeployed - which looks exactly
   like "GitHub isn't deploying". Drop that old cache, force any worker to re-check
   for a new version, and never let a worker own these pages again. */
(function(){try{
  if(window.caches && caches.keys) caches.keys().then(function(ks){
    ks.forEach(function(k){ if(k!=="spotter-v2") caches.delete(k); });
  });
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){
        // a worker whose scope covers this page must not be caching boards
        if(r.scope && location.href.indexOf(r.scope)===0 && !/spot\.html$/.test(location.pathname)) r.update();
      });
    });
}catch(e){}})();</script>

function expandBundle(s){
  if(!s || s.v!==2 || !Array.isArray(s.pats)) return s;

    return { line:t.l, hs:t.h, s:t.s, st:ids.map((sid,i)=>[sid, base + (off[i]||0)]) };

function haversineNm(a,b){
  const R=3440.065, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const COMPASS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

   maths to a compass word for the text line; the arrow needs the real angle. */
function bearingDeg(a,b){
  const y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180);
  const x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function bearingFrom(a,b){
  const y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180);
  const x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);
  return COMPASS[Math.round((Math.atan2(y,x)*180/Math.PI+360)%360/22.5)%16];
}

async function lookupRoute(callsign){
  if(!callsign) return null;
  const hit=routeCache[callsign];
  if(hit && Date.now()-hit.t < 216e5) return hit.v;          // cache 6h
  try{
    const d=await getJSON(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
    const fr=d && d.response && d.response.flightroute;
    const v = fr ? { airline:fr.airline, origin:fr.origin, destination:fr.destination } : null;
    routeCache[callsign]={ t:Date.now(), v }; saveRouteCache();
    return v;
  }catch(e){ routeCache[callsign]={ t:Date.now(), v:null }; return null; }
}


/* ---- which way round is this flight actually going? ----------------------
   adsbdb stores ONE canonical origin/destination per callsign, but airlines
   reuse a flight number for the return leg — so roughly half the time the pair
   is right and the direction is backwards. Measured against live traffic over
   DC: 14 of 35 aircraft were flying AWAY from their stated destination, most of
   them ~170 degrees off, which is the signature of a reversed leg rather than
   bad data.

   The aircraft itself settles it. Compare its ground track to the bearing to
   each end of the route: if it is pointed at the stated ORIGIN and away from the
   stated DESTINATION, the legs are swapped. The 30-degree margin keeps it from
   flipping on aircraft that are merely off-course, holding, or on a dogleg.
   Same sample: agreement rose from 22/34 to 27/34. */
/* ---- is this route physically possible from here? ------------------------
   adsbdb keys on CALLSIGN, and airlines reuse flight numbers hard, so the route
   it returns is often for a completely different leg flown by the same number
   on another day — a Seattle-to-Portland pair arriving on an aircraft over
   Maryland. orientRoute() cannot catch that: it only decides which way round a
   route runs, and reversing Seattle/Portland is still Seattle/Portland.

   So gate on geometry, the way the city boards already do. An aircraft en route
   sits near the great circle between its two ends, which means
   dist(here,origin) + dist(here,destination) should be close to the leg itself.
   Well outside that ellipse and the route belongs to some other flight.

   Second test for low altitude: under 10,000ft an aircraft is climbing out of
   or descending into somewhere nearby, so one end of a real route has to be
   local. A cruise-altitude overflight legitimately has neither end near us,
   which is why the test only applies down low.

   Measured on the boards when this was written: of 29 aircraft with a route,
   19 were impossible. Showing them was worse than showing nothing, because a
   named city reads as fact. */
function routePlausibleNight(route, pos, alt, loc){
  if(!route || !route.origin || !route.destination || !pos) return false;
  const O=route.origin, D=route.destination;
  if(typeof O.latitude!=="number" || typeof D.latitude!=="number") return false;
  const oLL={lat:O.latitude, lon:O.longitude}, dLL={lat:D.latitude, lon:D.longitude};
  const leg=haversineNm(oLL,dLL);
  const detour=haversineNm(pos,oLL)+haversineNm(pos,dLL);
  if(detour > leg*1.12 + 40) return false;
  if(typeof alt==="number" && alt<10000 && loc &&
     Math.min(haversineNm(loc,oLL), haversineNm(loc,dLL)) > 60) return false;
  return true;
}

function orientRoute(route, pos, track){
  if(!route || !route.origin || !route.destination) return route;
  if(typeof track!=="number" || !pos) return route;
  const O=route.origin, D=route.destination;
  if(typeof O.latitude!=="number" || typeof D.latitude!=="number") return route;
  const bearTo=t=>{ const r=Math.PI/180;
    const y=Math.sin((t.longitude-pos.lon)*r)*Math.cos(t.latitude*r);
    const x=Math.cos(pos.lat*r)*Math.sin(t.latitude*r)
          - Math.sin(pos.lat*r)*Math.cos(t.latitude*r)*Math.cos((t.longitude-pos.lon)*r);
    return (Math.atan2(y,x)/r+360)%360; };
  const off=b=>{ const d=Math.abs(b-track)%360; return d>180?360-d:d; };
  const offD=off(bearTo(D)), offO=off(bearTo(O));
  if(offO < offD - 30) return { ...route, origin:D, destination:O, _flipped:true };
  return route;
}

/* ---- representative train/bus photos (Wikimedia Commons search, CORS-open
   via origin=*, no key needed). Unlike the plane photo above, this is NOT a
   photo of the exact vehicle -- there's no public per-vehicle photo lookup for
   MARC/Ride On/SEPTA/PATCO/Amtrak the way planespotters covers aircraft by ADS-B
   hex -- so it's a representative photo of that line/system, clearly labeled
   as such and cached for a month since the "right" photo for a line doesn't
   change. */
/* Asks for a whole PAGE of candidates (not just the top hit) so buses/trains —
   which have no per-vehicle photo source — still get a varied slideshow.
   Commons' image search mixes in maps, logos, timetables and route diagrams,
   which look wrong on a photo panel, so those are filtered out by file type
   and title keyword. `index` preserves Commons' own relevance ranking. */
async function fetchWikiPhoto(query, limit=8){
  try{
    const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=${limit}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1600&format=json&origin=*`;
    const d=await getJSON(url, 10000);
    const pages=d && d.query && d.query.pages;
    if(!pages) return [];
    return Object.values(pages)
      .sort((a,b)=>(a.index||0)-(b.index||0))
      .map(page=>{
        const info=page && page.imageinfo && page.imageinfo[0];
        if(!info) return null;
        const title=String(page.title||"");
        if(!/\.(jpe?g|png|webp)$/i.test(title)) return null;                       // no SVG/PDF/video
        if(/\b(map|diagram|logo|icon|seal|chart|schematic|timetable|sign|ticket)\b/i.test(title)) return null;
        const artist=(((info.extmetadata||{}).Artist||{}).value||"").replace(/<[^>]+>/g,"").trim();
        return { src:info.thumburl||info.url, link:info.descriptionurl||"", cred:artist };
      })
      .filter(v=>v && v.src);
  }catch(e){ return []; }
}
async function lookupWikiPhoto(query, fallbackQuery){
  const key="wikiN:"+query;                                     // versioned: old entries held ONE photo
  const hit=photoCache[key];
  if(hit && Date.now()-hit.t < 30*864e5) return hit.v||[];      // cache 30 days -- these don't change
  let v=await fetchWikiPhoto(query);
  // thin result? widen with the fallback query rather than replacing, so a
  // sparse line ("Ride On bus") still fills out from the broader system search
  if(v.length<4 && fallbackQuery && fallbackQuery!==query){
    const seen=new Set(v.map(x=>x.src));
    (await fetchWikiPhoto(fallbackQuery)).forEach(x=>{ if(!seen.has(x.src)){ seen.add(x.src); v.push(x); } });
  }
  photoCache[key]={ t:Date.now(), v }; savePhotoCache();
  return v;
}

   the map sat zoomed in on the aircraft instead of showing its whole route.
   Remember what we wanted to fit, apply it once layout has settled, and let the
   existing ResizeObserver re-apply it if the box was still unsized. */
let miniFitPts=null, miniFitFallback=null, miniFitTries=0;

  // uselessly zoomed-out fit, so wait for a real height rather than any height.

  // subject arrives, and waiting on a ResizeObserver alone left the map stuck
  // at its construction zoom when no further resize ever came.

  // and re-applying the same fit then is what keeps the whole route in frame.
  // Cleared only when a new subject arrives (see renderMiniMap's fit branch).
}
/* ---- the real flight path ----
   Great circle by spherical linear interpolation between the two endpoints:
   convert to 3-D unit vectors, slerp, convert back. This is the route an
   aircraft actually flies -- a straight line drawn on a Mercator map is a
   rhumb line, which for anything transcontinental is hundreds of miles from
   the truth. Also used for trains/buses, where over short distances it is
   indistinguishable from the straight line it replaces (so no special-casing). */
function greatCircle(a, b, steps=96){
  const R=Math.PI/180, la1=a.lat*R, lo1=a.lon*R, la2=b.lat*R, lo2=b.lon*R;
  const v1=[Math.cos(la1)*Math.cos(lo1), Math.cos(la1)*Math.sin(lo1), Math.sin(la1)];
  const v2=[Math.cos(la2)*Math.cos(lo2), Math.cos(la2)*Math.sin(lo2), Math.sin(la2)];
  let dot=v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2];
  dot=Math.max(-1,Math.min(1,dot));
  const ang=Math.acos(dot);
  if(ang<1e-6) return [[a.lat,a.lon],[b.lat,b.lon]];
  const out=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps, s1=Math.sin((1-t)*ang)/Math.sin(ang), s2=Math.sin(t*ang)/Math.sin(ang);
    const x=v1[0]*s1+v2[0]*s2, y=v1[1]*s1+v2[1]*s2, z=v1[2]*s1+v2[2]*s2;
    let lon=Math.atan2(y,x)/R;
    // keep the drawn line continuous across the antimeridian instead of
    // snapping the whole way back across the map
    if(out.length){ const prev=out[out.length-1][1];
      while(lon-prev>180) lon-=360; while(prev-lon>180) lon+=360; }
    out.push([Math.atan2(z,Math.hypot(x,y))/R, lon]);
  }
  return out;
}
function nearestIdx(path, ll){
  let bi=0, bd=Infinity;
  for(let i=0;i<path.length;i++){
    const d=haversineNm({lat:path[i][0],lon:path[i][1]}, ll);
    if(d<bd){ bd=d; bi=i; }

  return bi;
}

      gcPath=gc;
      // dark casing: over radar and pale coastlines a bare 2px line vanishes
      L.polyline(gc, {color:"#05070f", weight:5.5, opacity:.55, lineCap:"round"}).addTo(miniRouteLayer);
      if(k>0) L.polyline(gc.slice(0,k+1), {color:"#8fc0ff", weight:2.4, opacity:.9}).addTo(miniRouteLayer);
      if(k<gc.length-1) L.polyline(gc.slice(k), {color:"#7d95c9", weight:2, opacity:.42, dashArray:"1 8"}).addTo(miniRouteLayer);
    }
    /* Frame the WHOLE journey: origin, destination, the vehicle and you. A
       previous pass framed only you+vehicle because a long leg zooms out to
       ~z4 and local streets stop being legible -- that trade is real, but the
       point of this map is the route, so the route wins and the city detail is
       what gives way. Your own position is still included so you can always see
       where the flight passes relative to you. The ISS is the exception: it
       crosses a continent in minutes, so it keeps its own hemisphere view. */
    // Build BOTH frames every render so the toggle is instant and always has
    // fresh positions; which one is used is the tap's business, not this code's.
    const close=[[posLL.lat,posLL.lon]];
    if(loc && typeof loc.lat==="number") close.push([loc.lat,loc.lon]);
    // every 8th arc point, so a bowed great circle is framed by its true
    // extent rather than by the straight line between its two ends
    let route=close.slice();
    if(gcPath) route=route.concat(gcPath.filter((_,i)=>i%8===0 || i===gcPath.length-1));
    miniFrameClose = mode!=="iss" ? close : null;
    miniFrameRoute = mode!=="iss" ? route : null;
    miniFitFallback = [posLL.lat, posLL.lon];
    applyMiniZoomFrame();
    miniMapFor=fitKey;
  }
  // Live track: the positions this screen has actually SEEN, so the path flown
  // is observed rather than assumed. Public trace archives are 403/404 without
  // a key, so earlier track can't be fetched; this accumulates from the poll.
  if(miniTrailFor!==id){ miniTrailPts=[]; miniTrailFor=id;
    if(miniTrail){ miniRouteLayer.removeLayer(miniTrail); miniTrail=null; } }
  const lastT=miniTrailPts[miniTrailPts.length-1];
  if(!lastT || lastT[0]!==posLL.lat || lastT[1]!==posLL.lon){
    miniTrailPts.push([posLL.lat,posLL.lon]);
    if(miniTrailPts.length>240) miniTrailPts.shift();
  }
  if(miniTrailPts.length>1){
    if(!miniTrail) miniTrail=L.polyline(miniTrailPts,{color:"#bcd9ff", weight:3, opacity:.95,
      lineCap:"round", lineJoin:"round"}).addTo(miniRouteLayer);
    else miniTrail.setLatLngs(miniTrailPts);
  }
  if(!miniVeh || miniVehKind!==mode){
    if(miniVeh) miniVehLayer.removeLayer(miniVeh);
    miniVeh=L.marker([posLL.lat,posLL.lon], {icon:vehDivIcon(mode)}).addTo(miniVehLayer);
    miniVehKind=mode;
  } else {
    miniVeh.setLatLng([posLL.lat,posLL.lon]);
    if(!miniMap.getBounds().pad(-.12).contains([posLL.lat,posLL.lon])) miniMap.panTo([posLL.lat,posLL.lon], {animate:true});
  }
}

/* twinkling stars */
function makeStars(){
  const holder=$("#stars"); if(!holder || holder.children.length) return;
  for(let i=0;i<110;i++){

/* ---- the real moon ----
   Same low-precision astronomy toolkit as sunElevationDeg below, extended to
   the lunar ephemeris (mean longitude/anomaly + the largest perturbation
   terms -- ~1° accuracy, plenty for placing a decoration in the sky).
   Returns altitude/azimuth for the viewer plus the illuminated fraction and
   waxing/waning, which drive an SVG whose terminator ellipse is the real
   phase shape rather than a canned emoji. */
function moonAltAzPhase(date, lat, lon){
  const rad=Math.PI/180, d=(date.getTime()-Date.UTC(2000,0,1,12,0,0))/86400000;
  const Lm=218.316+13.176396*d, Mm=134.963+13.064993*d, F=93.272+13.229350*d;
  const lam=(Lm+6.289*Math.sin(Mm*rad))*rad, bet=(5.128*Math.sin(F*rad))*rad;
  const e=(23.439-0.0000004*d)*rad;
  const ra=Math.atan2(Math.sin(lam)*Math.cos(e)-Math.tan(bet)*Math.sin(e), Math.cos(lam));
  const dec=Math.asin(Math.sin(bet)*Math.cos(e)+Math.cos(bet)*Math.sin(e)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  let ha=(gmst+lon/15)*15 - ra/rad; ha=((ha%360)+360)%360; if(ha>180) ha-=360;
  const haR=ha*rad, latR=lat*rad;
  const alt=Math.asin(Math.sin(latR)*Math.sin(dec)+Math.cos(latR)*Math.cos(dec)*Math.cos(haR))/rad;
  let az=Math.atan2(Math.sin(haR), Math.cos(haR)*Math.sin(latR)-Math.tan(dec)*Math.cos(latR))/rad+180;
  az=((az%360)+360)%360;                       // 0=N, clockwise
  const meanLon=280.460+0.9856474*d, meanAnom=(357.528+0.9856003*d)*rad;
  const sunLam=(meanLon+1.915*Math.sin(meanAnom)+0.020*Math.sin(2*meanAnom))*rad;
  const elong=(((lam-sunLam)/rad)%360+360)%360;
  return { alt, az, frac:(1-Math.cos(elong*rad))/2, waxing: elong<180 };
}
function moonPhaseName(frac, waxing){
  if(frac<.03) return "new moon"; if(frac>.97) return "full moon";
  if(Math.abs(frac-.5)<.04) return waxing?"first quarter":"last quarter";
  return `${waxing?"waxing":"waning"} ${frac>.5?"gibbous":"crescent"}`;
}
function moonSvg(frac, waxing){
  const r=28, cx=32, cy=32, rx=(Math.abs(2*frac-1)*r).toFixed(2);
  const sweepOut=waxing?1:0;                                  // lit limb: right when waxing
  const sweepTerm=(frac>.5?1:0)^(waxing?0:1);                 // terminator bulge side
  return `<svg viewBox="0 0 64 64"><circle class="base" cx="${cx}" cy="${cy}" r="${r}"/>`+
    `<path class="lit" d="M${cx} ${cy-r} A${r} ${r} 0 0 ${sweepOut} ${cx} ${cy+r} A${rx} ${r} 0 0 ${sweepTerm} ${cx} ${cy-r} Z"/></svg>`;
}
function updateMoon(){
  const el=$("#moon"); if(!el) return;
  const m=moonAltAzPhase(new Date(), loc.lat, loc.lon);
  if(m.alt<=0 || m.frac<.02){ el.style.display="none"; return; }
  el.style.display="block";
  // azimuth → x across the viewport (E≈25%, S=center, W≈75%); altitude → height
  el.style.left=`calc(${(m.az/360*100).toFixed(1)}% - min(3.75vmin,32px))`;
  el.style.top=`${(76 - Math.min(m.alt,70)/70*68).toFixed(1)}%`;
  el.style.opacity = sunElevationDeg(new Date(),loc.lat,loc.lon)>0 ? .35 : .95;
  const key=`${m.frac.toFixed(2)}|${m.waxing}`;
  if(el.dataset.k!==key){ el.dataset.k=key; el.innerHTML=moonSvg(m.frac,m.waxing); }
  el.title=`${moonPhaseName(m.frac,m.waxing)} · ${(m.frac*100).toFixed(0)}% illuminated`;
}

/* ---- live precipitation radar (RainViewer -- free public tiles, no key).
   Latest composite frame as a translucent tile layer on the mini map; the
   frame list is re-checked every 5 min and the layer swapped only when a
   newer frame exists (the old one lingers a beat so tiles never flash). */
let radarTL=null;
async function refreshRadar(m, opacity){
  try{
    const j=await getJSON("https://api.rainviewer.com/public/weather-maps.json", 10000);
    const fr=j&&j.radar&&j.radar.past&&j.radar.past[j.radar.past.length-1];
    if(!fr) return;
    const url=`${j.host}${fr.path}/256/{z}/{x}/{y}/2/1_1.png`;
    if(radarTL && radarTL._url===url) return;
    // RainViewer's public composite tops out at z7 (verified: z8+ returns
    // watermark tiles) -- Leaflet upscales beyond that, like any weather app
    const nl=L.tileLayer(url,{opacity, maxNativeZoom:7});
    nl.addTo(m);
    const old=radarTL; radarTL=nl;
    if(old) setTimeout(()=>m.removeLayer(old), 1200);
  }catch(e){}
}
function initRadar(m, opacity){ refreshRadar(m,opacity); setInterval(()=>refreshRadar(m,opacity), 5*60000); }

/* ---- real sunrise/sunset sky colors ----
   Low-precision solar position formula (Julian-day mean longitude/anomaly ->
   ecliptic -> equatorial -> hour angle via GMST), the same approach SunCalc-style
   libraries use, accurate to well under a degree -- plenty for driving a color
   gradient. No CDN dependency, matching the rest of this project's zero-setup bundled
   approach. Returns the sun's elevation in degrees above the horizon for `date` at
   `lat`,`lon` (0 = right on the horizon, i.e. sunrise/sunset itself). */
function sunElevationDeg(date, lat, lon){
  const rad=Math.PI/180, d=(date.getTime()-Date.UTC(2000,0,1,12,0,0))/86400000; // days since J2000.0
  const meanLon=(280.460+0.9856474*d)%360, meanAnom=(357.528+0.9856003*d)%360;
  const eclLon=meanLon+1.915*Math.sin(meanAnom*rad)+0.020*Math.sin(2*meanAnom*rad);
  const oblEcl=23.439-0.0000004*d;
  const ra=Math.atan2(Math.cos(oblEcl*rad)*Math.sin(eclLon*rad), Math.cos(eclLon*rad))/rad;
  const decl=Math.asin(Math.sin(oblEcl*rad)*Math.sin(eclLon*rad))/rad;
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  let lst=((gmst+lon/15)%24+24)%24, raHours=((ra/15)%24+24)%24;
  let ha=(lst-raHours)*15; if(ha>180) ha-=360; if(ha<-180) ha+=360;
  const latR=lat*rad, declR=decl*rad, haR=ha*rad;
  return Math.asin(Math.sin(latR)*Math.sin(declR)+Math.cos(latR)*Math.cos(declR)*Math.cos(haR))/rad;
}
/* Horizon(bottom)/mid/top(zenith) hex colors + overall opacity at key sun
   elevations, hand-picked to peak in vivid orange/pink/gold right at elevation 0
   (sunrise/sunset itself), pass through indigo/violet twilight on the way down
   into night, and fade to near-invisible once the sun is well up -- so daytime
   stays close to the app's normal palette instead of looking tinted. */
const SUN_STOPS=[
  { el:-18, top:"#000000", mid:"#02040c", bot:"#050b1c", op:.12 },
  { el:-12, top:"#03050f", mid:"#0c1030", bot:"#151048", op:.25 },
  { el:-6,  top:"#0a0f2e", mid:"#2c1f5e", bot:"#5b2a6b", op:.42 },
  { el:-2,  top:"#152a5e", mid:"#8a3a6b", bot:"#e8623f", op:.60 },
  { el:0,   top:"#1c3f7a", mid:"#d16a63", bot:"#ffab4d", op:.72 },
  { el:4,   top:"#3a72b8", mid:"#a7c3e8", bot:"#ffd28a", op:.45 },
  { el:12,  top:"#3f86c9", mid:"#bcd9f5", bot:"#f2e7cf", op:.20 },
  { el:30,  top:"#3f86c9", mid:"#bcd9f5", bot:"#eaf3ff", op:.06 },
];
function lerpRgb(a,b,t){ return a.map((v,i)=>v+(b[i]-v)*t); }
function sunSkyColors(el){
  const s=SUN_STOPS;
  if(el<=s[0].el) return { top:s[0].top, mid:s[0].mid, bot:s[0].bot, op:s[0].op };
  if(el>=s[s.length-1].el){ const last=s[s.length-1]; return { top:last.top, mid:last.mid, bot:last.bot, op:last.op }; }
  let a=s[0], b=s[s.length-1];
  for(let i=0;i<s.length-1;i++){ if(el>=s[i].el && el<=s[i+1].el){ a=s[i]; b=s[i+1]; break; } }
  const t=(el-a.el)/(b.el-a.el);
  return {
    top: rgbStr(lerpRgb(hexToRgb(a.top), hexToRgb(b.top), t)),
    mid: rgbStr(lerpRgb(hexToRgb(a.mid), hexToRgb(b.mid), t)),
    bot: rgbStr(lerpRgb(hexToRgb(a.bot), hexToRgb(b.bot), t)),
    op: a.op+(b.op-a.op)*t,
  };
}
function sunSkyEnabled(){ return localStorage.getItem("nightmode.sunsky")!=="0"; }
function updateSunSky(){
  const el=$("#sunSky"); if(!el) return;
  // brand mode owns the background; a sunset over a United-blue screen is noise
  if(!sunSkyEnabled() || document.body.classList.contains("brandmode")){ el.style.opacity=0; return; }
  const c=sunSkyColors(sunElevationDeg(new Date(), loc.lat, loc.lon));
  el.style.background=`linear-gradient(to top, ${c.bot}, ${c.mid} 45%, ${c.top} 100%)`;
  el.style.opacity=c.op;
}
function setSunSky(v){
  localStorage.setItem("nightmode.sunsky", v==="off"?"0":"1");
  document.querySelectorAll("#skySeg button").forEach(b=>b.classList.toggle("active", b.dataset.sky===v));
  updateSunSky();
}

/* The panel is a slideshow, not a still: whatever photos the subject has cycle
   every 9 s with a cross-fade, and the credit line tracks the current frame
   (each photo has its OWN photographer, so the credit must change with it). */
let photoShownFor=null, photoList=[], photoIdx=0, photoTimer=null, photoRep=false;
async function updatePhoto(key, representative, fallbackQuery){
  const wrap=$("#photoWrap");
  if(photoShownFor===key) return;                              // same subject — keep the running slideshow
  const v = representative ? await lookupWikiPhoto(key, fallbackQuery) : await lookupPhoto(key);
  photoShownFor=key; photoRep=!!representative; photoIdx=0;
  photoList=(Array.isArray(v)?v:(v?[v]:[])).filter(x=>x && x.src);
  clearInterval(photoTimer); photoTimer=null;
  if(!photoList.length){ wrap.style.display="none"; return; }
  wrap.style.display="";
  showPhoto(0);
  startPhotoRotation();
}
/* Rotation pace is a setting, because this page is usually left running on a
   display: "slow" (default) is calm enough to ignore, "cycle" is the old
   brisker pace, "hold" freezes on the first photo. */
const PHOTO_MS={ slow:45000, med:15000, off:0 };
function photoPace(){ const v=localStorage.getItem("nightmode.photopace"); return PHOTO_MS[v]!=null?v:"slow"; }
function startPhotoRotation(){
  clearInterval(photoTimer); photoTimer=null;
  const ms=PHOTO_MS[photoPace()];
  if(!ms || photoList.length<2) return;
  photoTimer=setInterval(()=>{ photoIdx=(photoIdx+1)%photoList.length; showPhoto(photoIdx); }, ms);
}
function setPhotoPace(v){
  if(PHOTO_MS[v]==null) v="slow";
  localStorage.setItem("nightmode.photopace", v);
  document.querySelectorAll("#photoSeg button").forEach(b=>b.classList.toggle("active", b.dataset.photo===v));
  if(v==="off" && photoList.length){ photoIdx=0; showPhoto(0); }   // settle back on the first shot
  startPhotoRotation();
}
function showPhoto(i){
  const v=photoList[i]; if(!v) return;
  const img=$("#photo");
  img.classList.remove("ph-in"); void img.offsetWidth; img.classList.add("ph-in");   // restart the fade
  img.src=v.src;
  img.alt = photoRep ? "Representative photo of this line" : "Photo of this aircraft";
  const a=$("#photoCredit"); a.href=v.link||"#";
  a.textContent = (photoRep
    ? (v.cred?`${v.cred} · Wikimedia Commons`:"Wikimedia Commons")+" (representative photo)"
    : (v.cred?`photo © ${v.cred} · planespotters.net`:"planespotters.net"))
    + (photoList.length>1?`  ·  ${i+1}/${photoList.length}`:"");
}

/* ===== subject producers: each returns a normalized subject or null ===== */
let mode = (()=>{ const m=localStorage.getItem("nightmode.subject"); return ["planes","trains","buses","iss"].includes(m)?m:"planes"; })();
const TAGS  = { planes:"Nearest flight", trains:"Nearest train", buses:CITY_CFG.busTag, iss:"Nearest spacecraft" };
const RANGE = { planes:"aircraft within 30 nm", trains:`Amtrak + ${CITY_CFG.localRailSystem} trains`, buses:CITY_CFG.busRange, iss:"International Space Station · low Earth orbit" };
/* SEPTA's live feeds occasionally send phantom vehicles with nonsense
   sentinel lateness (e.g. late:998) instead of omitting the field --
   matching the same guard used on the boards. */

/* ---- PLANES ---- */

/* Keep an aircraft on screen through a tracking gap -- see the boards' copy of
   this for the full reasoning. Short version: ADS-B receivers have a blind cone
   directly overhead and MLAT fixes drop in and out, so the closest traffic is
   exactly what flickers out of the feed. Carry a missing aircraft forward along
   its last track/speed for a minute, flagged as extrapolated, instead of
   deleting it the moment one poll omits it. */
const PLANE_MEMORY_MS = 60000;
const planeMemory = new Map();
function coastPlanes(fresh){
  const now = Date.now(), seen = new Set();
  for(const a of fresh){ if(!a.hex) continue; seen.add(a.hex); planeMemory.set(a.hex, { a, t: now }); }
  const out = fresh.slice();
  for(const [hex, rec] of planeMemory){
    if(seen.has(hex)) continue;
    const age = now - rec.t;
    if(age > PLANE_MEMORY_MS){ planeMemory.delete(hex); continue; }
    const a = rec.a, gs = Number(a.gs), trk = Number(a.track);
    if(!isFinite(gs) || !isFinite(trk) || gs <= 0) continue;
    const nm = gs * (age / 3600000), r = trk * Math.PI / 180;
    out.push({ ...a, lat: a.lat + (nm/60)*Math.cos(r),
               lon: a.lon + (nm/60)*Math.sin(r)/Math.max(0.2, Math.cos(a.lat*Math.PI/180)),
               _coasted: Math.max(1, Math.round(age/1000)) });
  }
  return out;
}
/* Aircraft feed. Defaults to adsb.lol, which is free and CORS-open but
   PROHIBITS COMMERCIAL USE. Set "tb.adsbUrl" to an adsb-worker.js deployment to
   switch to a commercially-usable feed (adsb.lol / adsb.fi) — those send no CORS
   headers of their own, so the Worker is required, not optional. */
/* An empty card that explains itself. A board with no aircraft feed is not
   broken, it is unconfigured, and the difference matters to someone who just
   paid for this. */
function showPlanesUnconfigured(){
  const box=document.querySelector("#planeList"); if(!box) return;
  if(box.dataset.unconfigured==="1") return;       // don't rebuild every tick
  box.dataset.unconfigured="1";
  box.innerHTML='<div class="empty">No aircraft feed configured.<br>'
    + '<span style="opacity:.75">Add one in \u2699 Settings \u2192 Aircraft feed. '
    + 'See AIRCRAFT-FEED.md \u2014 it takes a few minutes and runs on your own machine.</span></div>';
  const c=document.querySelector("#planeCount"); if(c) c.textContent="";
}
function adsbBase(){
  /* NO DEFAULT, on purpose. This used to fall back to adsb.lol, which is
     free and CORS-open and PROHIBITS COMMERCIAL USE — so a product that ships
     with it baked in is in breach the day it is sold, however the feature is
     priced. Giving the planes away inside a paid app does not make the use
     non-commercial; it is still the seller's product calling that feed.

     So the seller ships no aircraft feed at all. The operator of each board
     supplies their own URL, on their own machine, under whatever terms they
     agree with the provider — which takes the seller out of the licence chain
     entirely. adsb-proxy.py in this repo is a ready-made one; AIRCRAFT-FEED.md
     is the setup. Unset, the card says so and nothing is fetched. */
  try{ var u=(localStorage.getItem("tb.adsbUrl")||"").trim().replace(/\/+$/,"");
       if(u) return u+"/v2"; }catch(e){}
  return "";
}
/* Throws when no feed is configured, so the callers below fail into their
   existing error handling instead of fetching a relative URL off this site. */
function adsbRequire(){
  const b = adsbBase();
  if(!b) throw new Error("no aircraft feed configured (see AIRCRAFT-FEED.md)");
  return b;
}
async function producePlane(){
  const data=await getJSON(`${adsbRequire()}/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/${CFG.radiusNm}`);
  scanAlerts(data.ac);                              // rare-bird sweep over EVERY aircraft in range
  const acAll=coastPlanes(data.ac||[]);             // survive brief tracking gaps overhead
  const air=acAll.filter(a=>a.alt_baro!=="ground" && typeof a.lat==="number" && typeof a.lon==="number")
    .map(a=>({a, nm: a.dst!=null? a.dst : haversineNm(loc,{lat:a.lat,lon:a.lon})})).sort((x,y)=>x.nm-y.nm);
  if(!air.length) return null;
  let pick=null;
  for(const x of air.filter(x=>/^[A-Z]{3}\d/.test((x.a.flight||"").trim())).slice(0,4)){
    let route=await lookupRoute((x.a.flight||"").trim());
    // point it the way the aircraft is actually flying before anything uses it
    route=orientRoute(route, {lat:x.a.lat, lon:x.a.lon}, x.a.track);
    /* Drop a route the aircraft could not possibly be flying. Better to show
       the tail number than to name two cities it has nothing to do with. */
    if(route && !routePlausibleNight(route, {lat:x.a.lat, lon:x.a.lon}, x.a.alt_baro, loc)) route=null;
    if(route && route.origin && route.destination){ pick={...x, route}; break; }
  }
  if(!pick) pick={...air[0], route:null};
  const {a, nm, route}=pick, spd=a.gs?Math.round(a.gs):null;
  air.forEach(x=>noteTrack(x.a));            // sample every aircraft in range, not just this one
  const oLL=route&&route.origin&&typeof route.origin.latitude==="number"?{lat:route.origin.latitude,lon:route.origin.longitude}:null;
  const dLL=route&&route.destination&&typeof route.destination.latitude==="number"?{lat:route.destination.latitude,lon:route.destination.longitude}:null;
  let eta=`<span class="badge na">en route</span>`;
  if(dLL && a.gs>40){ const mins=Math.round(haversineNm({lat:a.lat,lon:a.lon},dLL)/a.gs*60);
    if(mins>=0&&mins<600){ const arr=cityClock(Date.now()+mins*60000);
      eta=mins<=1?`<span class="badge ok">landing now</span>`:`<span class="badge ok">≈ ${mins} min · arr ${arr}</span>`; } }
  const prog=journeyProgress(oLL, dLL, {lat:a.lat,lon:a.lon});
  // approach mode: on final near a known destination -> add landing runway +
  // surface weather there (METAR). Cached, so usually no extra latency.
  let appr="";
  if(dLL && route && phaseOf(a)==="on final approach" && haversineNm({lat:a.lat,lon:a.lon},dLL)<20){
    appr=approachChips(await lookupDestWx(dLL), runwayFor(route.destination.icao_code, a.track));
  }
  return { id:"p"+a.hex, nm, unit:"nm", dir:bearingFrom(loc,{lat:a.lat,lon:a.lon}), count:air.length,
    // every aircraft in range, for the click-to-expand fleet list + mini-map dots
    fleet: air.map(x=>({ t:(x.a.flight||"").trim()||x.a.r||x.a.hex, s:x.a.desc||x.a.t||"",
      nm:x.nm, unit:"nm", dir:bearingFrom(loc,{lat:x.a.lat,lon:x.a.lon}),
      x: typeof x.a.alt_baro==="number"?`${x.a.alt_baro.toLocaleString()} ft`:"",
      ll:{lat:x.a.lat,lon:x.a.lon} })),
    acType:(a.t||"").toUpperCase(), acTypeName:a.desc||a.t, airlineNm:airlineName(route,a),
    gsKt:a.gs, altFt: typeof a.alt_baro==="number"?a.alt_baro:null,
    // altitude AND speed: "how high" without "how fast" is half the story when
    // you are watching something cross the sky
    altText: [typeof a.alt_baro==="number"?`${a.alt_baro.toLocaleString()} ft`:"",
              spd?`${spd} kt`:""].filter(Boolean).join(" · "),

/* ---- NYC: subway/LIRR/Metro-North, all direct-fetch (no Worker/key needed --
   see nyc.html) via the same minimal GTFS-Realtime protobuf decoder built
   there. Ported here rather than shared via a separate file since these are
   small, pure, self-contained functions (no dependency on nyc.html's own
   `state` object) and this project has no build step to share modules with
   otherwise. */
function* gtfsrtFields(b, start, end){
  let i = start;
  while(i < end){
    const [key, ni] = gtfsrtVarint(b, i); i = ni;
    const field = Number(key >> 3n), wt = Number(key & 7n);
    if(wt === 0){ const [v, n] = gtfsrtVarint(b, i); i = n; yield [field, 0, v]; }
    else if(wt === 2){ const [len, n] = gtfsrtVarint(b, i); const l = Number(len); yield [field, 2, [n, n + l]]; i = n + l; }
    else if(wt === 5){ yield [field, 5, i]; i += 4; }
    else if(wt === 1){ i += 8; }
    else throw new Error("bad wiretype "+wt);
  }
}
function gtfsrtVarint(b, i){
  let result = 0n, shift = 0n, x;
  do{ x = BigInt(b[i++]); result |= (x & 0x7fn) << shift; shift += 7n; }while(x & 0x80n);
  return [result, i];
}
function gtfsrtF32(b, i){ return new DataView(b.buffer, b.byteOffset+i, 4).getFloat32(0, true); }
function gtfsrtStr(b, s, e){ return new TextDecoder().decode(b.subarray(s, e)); }
function gtfsrtInt32(v){ return Number(BigInt.asIntN(32, v)); }
function decodeVehiclePosition(b, s, e){
  const v = {};
  for(const [vf, vwt, vv] of gtfsrtFields(b, s, e)){
    if(vf === 1 && vwt === 2){
      for(const [tf, twt, tv] of gtfsrtFields(b, vv[0], vv[1])){
        if(tf === 1) v.tripId = gtfsrtStr(b, tv[0], tv[1]);
        else if(tf === 5) v.routeId = gtfsrtStr(b, tv[0], tv[1]);
      }
    } else if(vf === 2 && vwt === 2){
      for(const [pf, pwt, pv] of gtfsrtFields(b, vv[0], vv[1])){
        if(pf === 1) v.lat = gtfsrtF32(b, pv);
        else if(pf === 2) v.lon = gtfsrtF32(b, pv);
        else if(pf === 5) v.speed = gtfsrtF32(b, pv);
      }
    } else if(vf === 4 && vwt === 0){ v.status = Number(vv); }
    else if(vf === 7 && vwt === 2){ v.stopId = gtfsrtStr(b, vv[0], vv[1]); }
  }
  return v;
}
function decodeTripUpdate(b, s, e){
  const u = { stops: [] };
  for(const [tf, twt, tv] of gtfsrtFields(b, s, e)){
    if(tf === 1 && twt === 2){
      for(const [df, dwt, dv] of gtfsrtFields(b, tv[0], tv[1])){
        if(df === 1) u.tripId = gtfsrtStr(b, dv[0], dv[1]);
        else if(df === 5) u.routeId = gtfsrtStr(b, dv[0], dv[1]);
      }
    } else if(tf === 2 && twt === 2){
      const stu = {};
      for(const [sf, swt, sv] of gtfsrtFields(b, tv[0], tv[1])){
        if(sf === 4 && swt === 2) stu.stopId = gtfsrtStr(b, sv[0], sv[1]);
        else if(sf === 2 && swt === 2){
          for(const [af, awt, av] of gtfsrtFields(b, sv[0], sv[1])){
            if(af === 1 && awt === 0) stu.delaySec = gtfsrtInt32(av);
          }
        }
      }
      u.stops.push(stu);
    } else if(tf === 5 && twt === 0){ u.tripDelaySec = gtfsrtInt32(tv); }
  }
  return u;
}
function decodeGtfsRt(buf){
  const vehicles = [], updates = {};
  for(const [f, wt, val] of gtfsrtFields(buf, 0, buf.length)){
    if(f !== 2 || wt !== 2) continue;
    const [es, ee] = val;
    for(const [ef, ewt, eval_] of gtfsrtFields(buf, es, ee)){
      if(ef === 4 && ewt === 2){
        const v = decodeVehiclePosition(buf, eval_[0], eval_[1]);
        if(v.tripId) vehicles.push(v);
      } else if(ef === 3 && ewt === 2){
        const u = decodeTripUpdate(buf, eval_[0], eval_[1]);
        if(u.tripId) updates[u.tripId] = u;
      }
    }
  }
  return { vehicles, updates };
}
const NYC_SUBWAY_FEEDS = ["gtfs","gtfs-ace","gtfs-bdfm","gtfs-g","gtfs-jz","gtfs-nqrw","gtfs-l"];
const nycSchedCache = {};
async function ensureNycSchedule(file){
  if(nycSchedCache[file]) return nycSchedCache[file];
  try{
    const s=await getJSON(file, 20000);
    s._coord={}; s._name={};
    (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon]; s._name[st.id]=st.name; });
    nycSchedCache[file]=s;
  }catch(e){}
  return nycSchedCache[file];
}
function nycStationCoord(sched, stopId){
  if(!sched) return null;
  const pid=(sched.platforms||{})[stopId] || stopId;
  return (sched._coord||{})[pid] || null;
}
function nycStationName(sched, stopId){
  if(!sched) return "";
  const pid=(sched.platforms||{})[stopId] || stopId;
  return (sched._name||{})[pid] || "";
}
// Human line/branch name for a live NYC vehicle -- same resolution the board
// uses (see nyc.html): subway carries its own route_id; LIRR's numeric
// route_id maps via the bundle's `routes`; Metro-North has NO route_id and
// maps its train number (v.tripId) via the bundle's `tripLines`.
function nycLineOf(v, sched){
  if(sched && sched.routes && sched.routes[v.routeId]) return sched.routes[v.routeId];
  if(sched && sched.tripLines && sched.tripLines[v.tripId]) return sched.tripLines[v.tripId];
  return v.routeId || null;
}
async function fetchNycFleet(feedPaths, schedFile){
  const sched = await ensureNycSchedule(schedFile);
  const results = await Promise.allSettled(feedPaths.map(p=>
    fetch(`https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/${p}`).then(r=>r.arrayBuffer())
  ));
  let vehicles=[], updates={};
  results.forEach(r=>{
    if(r.status!=="fulfilled") return;
    try{ const {vehicles:v,updates:u}=decodeGtfsRt(new Uint8Array(r.value)); vehicles=vehicles.concat(v); Object.assign(updates,u); }catch(e){}
  });
  return vehicles.map(v=>{
    if(!v.routeId && updates[v.tripId]) v.routeId = updates[v.tripId].routeId;   // LIRR: route_id lives on the TripUpdate
    const coord = typeof v.lat==="number" ? [v.lat,v.lon] : nycStationCoord(sched, v.stopId);
    if(!coord) return null;
    return { v, lat:coord[0], lon:coord[1], nm:haversineNm(loc,{lat:coord[0],lon:coord[1]}),
      stationName: nycStationName(sched, v.stopId), line: nycLineOf(v, sched) };
  }).filter(Boolean);
}
/* "Nearest train" for NYC checks subway + LIRR + Metro-North concurrently

/* "Nearest train" should mean nearest across every rail system that's
   available, not just Amtrak -- pick whichever candidate is actually closer. */

/* ---- METRORAIL, deliberately last in line -------------------------------
   Metro runs every few minutes, so if it competed on distance like everything
   else it would win essentially always and Sky view would become a Metro
   display — Amtrak and MARC, the trains that are actually an event to see,
   would never get a turn. So it is a FALLBACK: only consulted when no Amtrak
   and no MARC train is anywhere in range.

   Positions come from WMATA's TrainPositions product, which reports a train's
   place as a track circuit rather than a lat/lon. Circuits are resolved to
   coordinates through the same StandardRoutes interpolation the DC board
   already uses, so a train sits between its two stations rather than snapping
   to one. Out-of-service movements (ServiceType NoPassengers/Unknown) are
   dropped — an empty train repositioning is not a sighting. */
const LINE_COL={RD:"#e51937",BL:"#0076c0",OR:"#f7941e",SV:"#a1a3a1",GR:"#00b140",YL:"#ffd200"};
let metroPosNight=null;          // circuitId -> {lat,lon,line}

/* WMATA reports a train's position as a TRACK CIRCUIT, not a coordinate. Each
   line's StandardRoutes lists its circuits in order, and only some of them
   carry a StationCode. So walk each line once, and for every circuit find the
   nearest stationed circuit behind and ahead of it and interpolate between
   those two stations by sequence position. A train then sits sensibly between
   stations instead of snapping onto one — the same treatment the DC board
   already gives its Metro trains. Built once and cached; the layout of the
   system does not change between refreshes. */
async function ensureMetroPositions(key){
  if(metroPosNight) return metroPosNight;
  metroPosNight={};
  try{
    const [routes, stationsDoc] = await Promise.all([
      getJSON(`https://api.wmata.com/TrainPositions/StandardRoutes?contentType=json&api_key=${encodeURIComponent(key)}`, 15000),
      getJSON(`https://api.wmata.com/Rail.svc/json/jStations?api_key=${encodeURIComponent(key)}`, 15000),
    ]);
    const S={}; (stationsDoc.Stations||[]).forEach(st=>{ S[st.Code]={lat:st.Lat, lon:st.Lon}; });
    (routes.StandardRoutes||[]).forEach(r=>{
      const cs=(r.TrackCircuits||[]).slice().sort((a,b)=>a.SeqNum-b.SeqNum);
      // index of every circuit that names a station we have coordinates for
      const anchors=[];
      cs.forEach((c,i)=>{ if(c.StationCode && S[c.StationCode]) anchors.push({i, ll:S[c.StationCode]}); });
      if(!anchors.length) return;
      let ai=0;
      cs.forEach((c,i)=>{
        while(ai<anchors.length-1 && anchors[ai+1].i < i) ai++;
        const before=anchors[ai];
        const after=anchors[Math.min(ai+1, anchors.length-1)];
        let ll;
        if(before.i===after.i) ll={lat:before.ll.lat, lon:before.ll.lon};
        else{
          const f=Math.max(0, Math.min(1, (i-before.i)/(after.i-before.i)));
          ll={ lat:before.ll.lat+(after.ll.lat-before.ll.lat)*f,
               lon:before.ll.lon+(after.ll.lon-before.ll.lon)*f };
        }
        if(c.CircuitId!=null) metroPosNight[c.CircuitId]={...ll, line:r.LineCode};
      });
    });
  }catch(e){ /* leave the map empty; produceMetroTrain then simply finds nothing */ }
  return metroPosNight;
}

async function produceMetroTrain(){
  const keyLs=CITY_CFG.lsWmataKey; if(!keyLs || !loc) return null;
  let key=""; try{ key=(localStorage.getItem(keyLs)||"").trim(); }catch(e){}
  if(!key) return null;
  let d=null;
  try{ d=await getJSON(`https://api.wmata.com/TrainPositions/TrainPositions?contentType=json&api_key=${encodeURIComponent(key)}`, 12000); }
  catch(e){ return null; }
  const pos=await ensureMetroPositions(key);
  const cand=[];
  ((d && d.TrainPositions)||[]).forEach(t=>{
    // an empty train being repositioned is not a sighting
    if(t.ServiceType && t.ServiceType!=="Normal") return;
    const p=pos[t.CircuitId]; if(!p) return;
    const ll={lat:p.lat, lon:p.lon};
    cand.push({ t, ll, nm:haversineNm(loc, ll), line:t.LineCode||p.line||"" });
  });
  if(!cand.length) return null;
  cand.sort((a,b)=>a.nm-b.nm);
  const w=cand[0], line=w.line;
  return {
    id:"metro:"+(w.t.TrainId||w.t.CircuitId),
    kind:"train", nm:w.nm, unit:"nm",
