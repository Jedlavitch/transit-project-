/* ---- Europe: nearest train / bus from a schedule-derived position ----------
   These cities' feeds report departures, not vehicle positions. A trip does
   carry its whole stop sequence with coordinates and times, so the vehicle is
   placed between the two stops the clock puts it between — the same technique
   this project already uses for MARC and Ride On, which also have no live
   position feed. It is a schedule-derived position and the status line says so
   rather than implying GPS. */
async function produceEuroVehicle(families, kind){
  if(!window.TBTransitous) return null;
  const v = await TBTransitous.nearestVehicle(loc.lat, loc.lon, families,
    { source:CITY_CFG.transitSource, mainStation:CITY_CFG.mainStation });
  if(!v) return null;
  const d=v.dep, t=v.trip, pos=v.pos;
  const mi = v.km*0.621371;
  const oLL={lat:t.from.lat, lon:t.from.lon}, dLL={lat:t.to.lat, lon:t.to.lon};
  const line = d.route || d.label || "";
  const nextName = pos.next && pos.next.name;
  const nextT = pos.next && pos.next.t;
  const arr = t.end ? cityClock(t.end) : "";
  /* Plain text on purpose. This feeds `sub`, which the renderer assigns with
     textContent, so a banded <span> would be printed as literal markup instead
     of being coloured. The delay is already banded on this screen by
     lateBadge()/adherenceChip(), which build the status badge as HTML, so this
     line only has to state the number. */
  const lateChip = (d.realTime && d.delayMin>0) ? `  ·  +${d.delayMin} min` : "";
  /* Distance covered and remaining, walked along the stop list so a curving
     line is not understated the way a straight origin-to-destination hop is. */
  const travelled = (function(){
    const st=t.stops, mi=(a,b)=>{
      const R=3958.8, rad=Math.PI/180;
      const dLat=(b.lat-a.lat)*rad, dLon=(b.lon-a.lon)*rad;
      const h=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(h));
    };
    let done=0, left=0, passed=true;
    for(let i=0;i<st.length-1;i++){
      const seg=mi(st[i],st[i+1]);
      if(st[i+1].t<=Date.now()) done+=seg;
      else if(st[i].t<=Date.now()){ // the segment being travelled right now
        done+=mi(st[i],{lat:pos.lat,lon:pos.lon});
        left+=mi({lat:pos.lat,lon:pos.lon},st[i+1]);
      } else left+=seg;
    }
    return {done, left};
  })();
  return {
    id:"e"+(d.tripId||line), nm:mi, unit:"mi",
    dir:bearingFrom(loc,{lat:pos.lat,lon:pos.lon}), count:1,
    sysName:CITY_CFG.cityLabel, lateMin:(d.realTime && d.delayMin>0)? d.delayMin : null,
    altText:`${pos.pct}% of the way`,
    title:[line, d.label].filter(Boolean)[0] || (kind==="bus"?"Bus":"Train"),
    sub:[line && (kind==="bus"?`Route ${line}`:`Line ${line}`), d.label, d.stop&&d.stop.name]
        .filter(Boolean).join("  ·  ")+lateChip,
    oCity:t.from.name, dCity:t.to.name,
    subline:`${t.from.name}  →  ${t.to.name}`,
    oLL, dLL, posLL:{lat:pos.lat, lon:pos.lon}, oCode:"", dCode:"",
    /* progPct is a FRACTION here — the renderer multiplies by 100, so passing a
       percentage showed "3000%". Distances are measured along the stop
       sequence rather than straight-line, so a route that curves reports the
       length actually travelled. */
    progPct:pos.pct/100, progFlown:travelled.done, progToGo:travelled.left,
    statusHtml:`<span class="phase">${pos.pct>=100?"arrived":pos.pct<=0?"about to depart":"en route"}</span>`
      + (nextName? nextStopChip(nextName,
            nextT? cityClock(nextT) : "",
            "position from timetable") : "")
      + (arr? `<span class="badge na">arr ${arr}</span>` : ""),
    photoQuery:`${CITY_CFG.cityLabel} ${kind==="bus"?"tram bus":"train"}`,
    photoFallback:`${CITY_CFG.cityLabel} public transport` };
}
async function produceTrain(){
  /* Cities with no local vehicle feed and no Amtrak: say so instead of spinning.
     These boards have live DEPARTURES (transitous / the Swiss API) but nothing
     that reports where a vehicle physically IS, and Sky mode's whole subject is
     one moving thing with a position, a photo and an ETA. Without this the
     screen sat on "Finding trains…" forever, which reads as broken rather than
     as unavailable. */
  if(CITY_CFG.noLocalVehicles){
    const v = await produceEuroVehicle(["longdistance","regional","metro"], "train");
    return v || { none:true, note:"No train running near here right now" };
  }

  const [amtrak, local] = await Promise.all([
    produceAmtrakTrain().catch(()=>null),
    produceLiveLocalTrain().catch(()=>null),
  ]);
  if(amtrak && local){
    // winner shows, but the fleet list covers BOTH systems, distance-sorted
    const win = amtrak.nm<=local.nm ? amtrak : local;
    win.fleet=[...(amtrak.fleet||[]), ...(local.fleet||[])].sort((a,b)=>a.nm-b.nm);
    win.count=win.fleet.length;
    return win;
  }
  if(amtrak || local) return amtrak || local;
  /* Only now. Metro is frequent enough that letting it compete on distance
     would mean it won every time and nothing else ever appeared. */
  return await produceMetroTrain().catch(()=>null);
}

/* ---- BUSES (city-appropriate bundled schedule) ----
   Bethesda -> Ride On routes 23 & 29; Philadelphia -> SEPTA Bus routes 3, 4
   & 16. Neither publishes a public real-time feed, so -- like MARC on the
   board -- this places the nearest bus by interpolating its scheduled trip
   between stops. Reads whichever bundle matches CITY_CFG.busSchedule. */
let roSchedNight=null, roSchedNightFile=null;
async function ensureRideOnScheduleNight(){
  if(roSchedNight && roSchedNightFile===CITY_CFG.busSchedule) return roSchedNight;
  try{
    const s=await getJSON(CITY_CFG.busSchedule, 15000);
    s._coord={}; (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon,st.name]; });
    roSchedNight=s; roSchedNightFile=CITY_CFG.busSchedule;
  }catch(e){}
  return roSchedNight;
}
function roYmd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
// "Now" for schedule math, in the bundle's own timezone when it declares one
// (s.tz, e.g. "Europe/Amsterdam") -- else the viewer's local clock (all US
// bundles; unchanged). Same helper flipboard.html carries.
function roNowParts(tz){
  const d=new Date();
  if(!tz) return { y:roYmd(d), dow:(d.getDay()+6)%7, min:d.getHours()*60+d.getMinutes() };
  const p={};
  new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short"}).formatToParts(d)
    .forEach(x=>{ if(x.type!=="literal") p[x.type]=x.value; });
  const dow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[p.weekday];
  return { y:p.year+p.month+p.day, dow, min:(parseInt(p.hour,10)%24)*60+parseInt(p.minute,10) };
}
function roActiveServices(s, parts){
  const {y,dow}=parts;
  const act=new Set();
  for(const id in s.svc){ const v=s.svc[id]; if(y>=v.start && y<=v.end && v.dow[dow]) act.add(id); }
  const ex=s.exc[y]; if(ex){ (ex.rem||[]).forEach(x=>act.delete(x)); (ex.add||[]).forEach(x=>act.add(x)); }
  /* Bundled calendars EXPIRE. Agencies publish only a few weeks ahead, and
     when the last date passes this set comes back empty and the card goes
     silently blank -- no error, just no trains (how LA Metro Rail vanished).
     refresh-schedules.py + the schedule-refresh workflow keep the bundles
     current; this is the last resort if that ever stops running: fall back
     to the same weekday from the calendar we do have. Times drift from
     reality as the bundle ages, so the boards label it "stale schedule"
     rather than passing it off as current. */
  if(!act.size){
    for(const id in s.svc){ const v=s.svc[id]; if(v.dow[dow]) act.add(id); }
    if(act.size) s._stale=true;
  }
  return act;
}
/* Live bus, via the board's own optional Worker URL (lsBusUrl -- a SEPARATE
   field from lsSeptaUrl even though Philly's happens to be the same URL,
   see CITY_CONFIG comment). Ride On has no live source at all, so Bethesda
   always falls through to the schedule; MTA Bus's Worker (mta-bus-worker.js)
   returns raw GTFS-Realtime protobuf rather than SEPTA's plain JSON, so NYC
   takes its own decode path here instead of assuming SEPTA's /transitview
   JSON shape. */
async function produceLiveBus(){
  if(!CITY_CFG.lsBusUrl) return null;
  const url=loadLiveUrl(CITY_CFG.lsBusUrl); if(!url) return null;
  if(CITY_CFG.nycRail){
    let buf; try{ buf=new Uint8Array(await fetch(`${url}/vehiclePositions`).then(r=>r.arrayBuffer())); }catch(e){ return null; }
    const {vehicles}=decodeGtfsRt(buf);
    const NYC_BUS_ROUTES=new Set(["M42","M15","M15+","M34+","M34A+"]);
    const buses=vehicles.filter(v=>NYC_BUS_ROUTES.has(v.routeId) && typeof v.lat==="number");
    if(!buses.length) return null;
    const list=buses.map(v=>({v, nm:haversineNm(loc,{lat:v.lat,lon:v.lon})})).sort((a,b)=>a.nm-b.nm);
    const {v,nm}=list[0];
    return { id:"lb"+v.tripId, nm, unit:"nm", dir:bearingFrom(loc,{lat:v.lat,lon:v.lon}), count:list.length,
      fleet: list.map(({v:v2,nm:n2})=>({ t:`Route ${v2.routeId}`, s:"", nm:n2, unit:"nm",
        dir:bearingFrom(loc,{lat:v2.lat,lon:v2.lon}), x:"live", ll:{lat:v2.lat,lon:v2.lon} })),
      altText:"", title:`Route ${v.routeId}`, sub:`MTA Bus`, sysName:"MTA Bus",
      oCity:null, dCity:null, subline:"",
      oLL:null, dLL:null, posLL:{lat:v.lat,lon:v.lon}, oCode:"", dCode:"",
      statusHtml:`<span class="phase">in service</span><span class="badge na">live</span>`,
      photoQuery:CITY_CFG.busPhotoQuery, photoFallback:"transit bus exterior" };
  }
  let data; try{ data=await getJSON(`${url}/transitview`,12000); }catch(e){ return null; }
  const buses=(data.bus||[]).filter(b=>b.lat&&b.lng);
  if(!buses.length) return null;
  const list=buses.map(b=>({b, nm:haversineNm(loc,{lat:+b.lat,lon:+b.lng})})).sort((a,c)=>a.nm-c.nm);
  const {b,nm}=list[0], late=isRealLate(b.late);
  return { id:"lb"+(b.VehicleID||b.route_id), nm, unit:"nm", dir:bearingFrom(loc,{lat:+b.lat,lon:+b.lng}), count:list.length,
    fleet: list.map(({b:b2,nm:n2})=>({ t:`Route ${b2.route_id}`, s:b2.destination||"", nm:n2, unit:"nm",
      dir:bearingFrom(loc,{lat:+b2.lat,lon:+b2.lng}),
      x:isRealLate(b2.late)?`+${b2.late} min`:"on time", ll:{lat:+b2.lat,lon:+b2.lng} })),
    altText:"", title:`Route ${b.route_id}`, sub:`${b.destination||"?"} · ${CITY_CFG.localBusSystem}`,
    sysName:CITY_CFG.localBusSystem,
    oCity:null, dCity:b.destination||null, subline: b.Direction||"",
    oLL:null, dLL:null, posLL:{lat:+b.lat,lon:+b.lng}, oCode:"", dCode:"",
    statusHtml:`<span class="phase">in service</span>`+headingChip(b.heading)
      +(b.next_stop_name?nextStopChip(b.next_stop_name,"",""):"")
      +lateBadge(late?b.late:0),
    photoQuery:CITY_CFG.busPhotoQuery, photoFallback:"transit bus exterior" };
}

/* ---- METROBUS, same last-in-line rule as Metrorail ----------------------
   Metrobus runs hundreds of vehicles across the city, so on distance alone it
   would beat Ride On's two routes essentially always and the bus mode would
   become a Metrobus display. It is therefore only consulted when Ride On has
   nothing in range — which, given Ride On here is just routes 23 and 29, is
   most of the time, so this is what makes bus mode useful rather than what
   takes it over.

   Unlike Metrorail this needs no circuit arithmetic: jBusPositions reports real
   coordinates, and takes a radius so the query is already scoped to nearby. */
async function produceMetroBus(){
  const keyLs=CITY_CFG.lsWmataKey; if(!keyLs || !loc) return null;
  let key=""; try{ key=(localStorage.getItem(keyLs)||"").trim(); }catch(e){}
  if(!key) return null;
  let d=null;
  try{
    d=await getJSON(`https://api.wmata.com/Bus.svc/json/jBusPositions?Lat=${loc.lat}&Lon=${loc.lon}`+
      `&Radius=8000&api_key=${encodeURIComponent(key)}`, 12000);
  }catch(e){ return null; }
  const cand=[];
  ((d && d.BusPositions)||[]).forEach(v=>{
    if(v.Lat==null || v.Lon==null) return;
    const ll={lat:v.Lat, lon:v.Lon};
    const dev = typeof v.Deviation==="number" ? v.Deviation : null;
    cand.push({ v, ll, nm:haversineNm(loc, ll), dev });
  });
  if(!cand.length) return null;
  cand.sort((a,b)=>a.nm-b.nm);
  const w=cand[0], v=w.v;
  return {
    id:"mbus:"+(v.VehicleID||`${v.RouteID}-${v.Lat}`),
    kind:"bus", nm:w.nm, unit:"nm",
    dir:bearingFrom(loc, w.ll),
    title:`Route ${v.RouteID||"?"}`,
    sub:`Metrobus${v.TripHeadsign?` → ${v.TripHeadsign}`:""}${v.VehicleID?` · bus ${v.VehicleID}`:""}`
      + (typeof w.dev==="number" && Math.abs(Math.round(w.dev))>=2
         ? `  ·  ${Math.abs(Math.round(w.dev))} min ${w.dev>0?"late":"early"}` : ""),
    oCity:null, dCity:v.TripHeadsign||null, subline:"Metrobus",
    posLL:w.ll, oLL:null, dLL:null,
    altText:"", oCode:"", dCode:"",
    sysTag:"Nearest Metrobus", sysRange:"Metrobus — shown when no Ride On bus is near",
    lateMin: w.dev,
    statusHtml:`<span class="phase">in service</span>`
      + adherenceChip(w.dev)
      /* TripEndTime is deliberately not shown. It is the SCHEDULED end of the
         trip and buses routinely run past it — observed a D80 scheduled to
         finish 21:17 still running at 21:38 while reporting Deviation 0. Putting
         both on screen states two things that contradict each other, and WMATA's
         own numbers are the reason, not a display bug. Deviation alone answers
         the question actually being asked. */
      + `<span class="badge na">Metrobus</span>`,
    color:"#6aa9ff",
    photoQuery:CITY_CFG.metroBusPhotoQuery||"WMATA Metrobus",
    fleet:cand.slice(0,40).map(c=>({ t:`Route ${c.v.RouteID||"?"}`, s:c.v.TripHeadsign||"",
      nm:c.nm, unit:"nm", ll:c.ll,
      x: typeof c.dev==="number" && Math.abs(Math.round(c.dev))>=2
         ? `${Math.abs(Math.round(c.dev))}m ${c.dev>0?"late":"early"}` : "on time" })),
    count:cand.length,
  };
}

async function produceBus(){
  /* Cities with no local vehicle feed and no Amtrak: say so instead of spinning.
     These boards have live DEPARTURES (transitous / the Swiss API) but nothing
     that reports where a vehicle physically IS, and Sky mode's whole subject is
     one moving thing with a position, a photo and an ETA. Without this the
     screen sat on "Finding buss…" forever, which reads as broken rather than
     as unavailable. */
  if(CITY_CFG.noLocalVehicles){
    const v = await produceEuroVehicle(["bus","tram"], "bus");
    return v || { none:true, note:"No bus running near here right now" };
  }

  const live=await produceLiveBus().catch(()=>null);
  if(live) return live;
  const s=await ensureRideOnScheduleNight();
  // no bundled timetable for this city: fall straight through to Metrobus
  if(!s) return await produceMetroBus().catch(()=>null);
  const busSystem = CITY_CFG.localBusSystem;
  const nowP=roNowParts(s.tz), active=roActiveServices(s, nowP);
  let best=null, inService=0; const cand=[];
  s.trips.forEach((tr,i)=>{
    if(!active.has(tr.s)) return;
    const seq=tr.st; if(seq.length<2) return;
    for(const nowMin of [nowP.min, nowP.min+1440]){
      if(nowMin < seq[0][1] || nowMin > seq[seq.length-1][1]) continue;
      let k=0; while(k<seq.length-1 && seq[k+1][1] <= nowMin) k++;
      const a=seq[k], b=seq[Math.min(k+1,seq.length-1)];
      const ca=s._coord[a[0]], cb=s._coord[b[0]]; if(!ca||!cb) break;
      const f = b[1]>a[1] ? (nowMin-a[1])/(b[1]-a[1]) : 0;
      const lat=ca[0]+(cb[0]-ca[0])*f, lon=ca[1]+(cb[1]-ca[1])*f;
      const nm=haversineNm(loc,{lat,lon});
      const first=s._coord[seq[0][0]], last=s._coord[seq[seq.length-1][0]];
      inService++;   // this trip is running right now (nearby or not) -> feeds "nearest of N"
      cand.push({ t:`Route ${tr.line}`, s:tr.hs||"", nm, unit:"nm", dir:bearingFrom(loc,{lat,lon}),
        x:"scheduled", ll:{lat,lon} });
      // next scheduled stop = the segment's far end (name + scheduled minute)
      if(!best || nm<best.nm) best={ i, tr, lat, lon, nm, first, last, nextName: cb[2], nextMin: b[1] };
      break;
    }
  });
  /* Nothing on the local routes right now. Only at this point does Metrobus get
     a look in — the same last-in-line rule Metrorail follows, and for the same
     reason: hundreds of vehicles would otherwise win on distance every time. */
  if(!best) return await produceMetroBus().catch(()=>null);
  const { tr, lat, lon, nm, first, last, nextName, nextMin } = best;
  const prog=journeyProgress(first?{lat:first[0],lon:first[1]}:null, last?{lat:last[0],lon:last[1]}:null, {lat,lon});
  return { id:"ro"+best.i, nm, unit:"nm", dir:bearingFrom(loc,{lat,lon}), count:inService,
    fleet: cand.sort((a,b2)=>a.nm-b2.nm),
    altText:"", title:`Route ${tr.line}`, sub:`${tr.hs} · ${busSystem}`, sysName:busSystem,
    oCity: first?first[2]:null, dCity: last?last[2]:tr.hs,
    subline:`scheduled position (${busSystem} has no public live feed)`,
    oLL: first?{lat:first[0],lon:first[1]}:null, dLL: last?{lat:last[0],lon:last[1]}:null,
    posLL:{lat,lon}, oCode:"", dCode:"",
    progPct: prog?prog.pct:null, progFlown: prog?prog.flownNm:null, progToGo: prog?prog.toGoNm:null,
    statusHtml:`<span class="phase">in service</span>`+(nextName?nextStopChip(nextName, minToClock(nextMin), ""):"")
      +`<span class="badge na">scheduled</span>`,
    photoQuery: CITY_CFG.busPhotoQuery,
    photoFallback:"transit bus exterior" };
}
/* ---- ISS (wheretheiss.at -- no key, CORS-open). Distance shown is the true
   line-of-sight slant range, and elevation comes from spherical geometry, so
   "above your horizon" means you could actually walk outside and look. */
async function produceISS(){
  const d=await getJSON("https://api.wheretheiss.at/v1/satellites/25544", 10000);
  if(typeof d.latitude!=="number") return null;
  const posLL={lat:d.latitude, lon:d.longitude};
  const R=6371, h=d.altitude||420;
  const c=haversineNm(loc,posLL)*1.852/R;                      // central angle, radians
  const elev=Math.atan2(Math.cos(c)-R/(R+h), Math.sin(c))*180/Math.PI;
  const slantKm=Math.sqrt(R*R+(R+h)*(R+h)-2*R*(R+h)*Math.cos(c));
  const mph=Math.round((d.velocity||0)*0.621371), up=elev>0;
  const sunlit=d.visibility!=="eclipsed";
  return { id:"iss", nm:slantKm*0.621371, unit:"mi", dir:bearingFrom(loc,posLL), elev,
    altText:`${Math.round(h)} km up`,
    title:"International Space Station", sub:`ISS · NORAD 25544 · ${mph.toLocaleString()} mph`,
    oCity:null, dCity:null,
    subline: up ? `above your horizon — look ${bearingFrom(loc,posLL)}, ${Math.round(elev)}° up`
                : `below the horizon · sub-point ${posLL.lat.toFixed(1)}°, ${posLL.lon.toFixed(1)}°`,
    oLL:null, dLL:null, posLL, oCode:"", dCode:"",
    statusHtml:`<span class="phase">${up?"overhead":"orbiting"}</span>`
      +`<span class="alt">${up?Math.round(elev)+"° elevation":Math.round(-elev)+"° below horizon"}</span>`
      +`<span class="badge ${sunlit?"ok":"na"}">${sunlit?"in sunlight":"in Earth's shadow"}</span>`,
    photoQuery:"International Space Station", photoFallback:"ISS space station Earth orbit" };
}

/* ---- approach mode: destination weather + landing runway ----
   METAR from aviationweather.gov's data API (CORS-open, no key). The runway
   is inferred: magnetic heading ≈ true track + local declination (d, °W
   positive), matched against the airport's runway numbers. The table only
   needs the airports these boards actually sit under. */
const RUNWAYS={ KDCA:{d:11,r:[1,19,15,33,4,22]}, KIAD:{d:11,r:[1,19,12,30]}, KBWI:{d:11,r:[10,28,15,33]},
  KPHL:{d:12,r:[9,27,17,35,8,26]}, KJFK:{d:13,r:[4,22,13,31]}, KLGA:{d:13,r:[4,22,13,31]}, KEWR:{d:13,r:[4,22,11,29]},
  KBOS:{d:14,r:[4,22,9,27,15,33,14,32]}, EHAM:{d:-2,r:[18,36,6,24,9,27,4,22]},
  KLAX:{d:-12,r:[6,24,7,25]}, KBUR:{d:-12,r:[8,26,15,33]}, KSFO:{d:-13,r:[1,19,10,28]}, KOAK:{d:-13,r:[12,30,10,28]} };
/* Surface weather comes from Open-Meteo rather than the METAR itself --
   aviationweather.gov publishes no CORS header, so browsers can't read it
   directly, and this project deliberately has no proxy to hide behind.
   Open-Meteo is CORS-open, keyless, and can report wind in knots at the
   destination's exact coordinates, which is all the chip needs. */
const metarCache={};
async function lookupDestWx(ll){
  if(!ll) return null;
  const key=`${ll.lat.toFixed(2)},${ll.lon.toFixed(2)}`;
  const hit=metarCache[key];
  if(hit && Date.now()-hit.t<6e5) return hit.v;                // cache 10 min
  let v=null;
  try{
    const d=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${ll.lat.toFixed(3)}&longitude=${ll.lon.toFixed(3)}`+
      `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&wind_speed_unit=kn`, 8000);
    const c=d && d.current;
    if(c) v={ wdir:Math.round(c.wind_direction_10m), wspd:Math.round(c.wind_speed_10m),
      wgst: c.wind_gusts_10m!=null?Math.round(c.wind_gusts_10m):null,
      visMi: c.visibility!=null?c.visibility/1609.34:null };
  }catch(e){}
  metarCache[key]={t:Date.now(), v};
  return v;
}
function runwayFor(icao, track){
  const rw=RUNWAYS[icao]; if(!rw || typeof track!=="number") return null;
  const mag=((track+rw.d)%360+360)%360;
  let best=null, bestD=21;                                     // must be within 20°
  for(const n of rw.r){ let dd=Math.abs(mag-n*10); if(dd>180) dd=360-dd; if(dd<bestD){ bestD=dd; best=n; } }
  return best;
}
function approachChips(wx, rwy){
  let h="";
  if(rwy!=null) h+=`<span class="badge na">RWY ${String(rwy).padStart(2,"0")}</span>`;
  if(wx){
    if(typeof wx.wdir==="number" && typeof wx.wspd==="number" && wx.wspd>0)
      h+=`<span class="alt">wind ${wx.wdir}° ${wx.wspd}${wx.wgst&&wx.wgst>=wx.wspd+8?`G${wx.wgst}`:""} kt</span>`;
    else if(wx.wspd===0) h+=`<span class="alt">wind calm</span>`;
    if(wx.visMi!=null && wx.visMi<7) h+=`<span class="alt">${wx.visMi.toFixed(1)} mi vis</span>`;
  }
  return h;
}

/* ---- rare-bird alerts: things worth interrupting the wall for ----
   The plane producer already downloads EVERY aircraft in range and keeps one;
   this sweeps the rest of that list for the interesting stuff -- emergencies
   anywhere nearby, military traffic (dbFlags bit 0), the big/rare airframes,
   close helicopters -- and slides a banner down. In-memory dedupe per
   aircraft per 30 min so a loitering helicopter doesn't nag. */
const RARE_TYPES={ A388:"Airbus A380", B748:"Boeing 747-8", B744:"Boeing 747-400", B742:"Boeing 747-200",
  A124:"Antonov An-124", C5M:"C-5M Super Galaxy", C17:"C-17 Globemaster III",
  VC25:"VC-25A — Air Force One", B52:"B-52 Stratofortress", U2:"U-2 Dragon Lady", E6:"E-6B Mercury" };
const alertSeen={};
let alertQueue=[], alertShowing=false;
function pushAlert(key, red, ic, t, s, ttlMin=30){
  const now=Date.now();
  if(alertSeen[key] && now-alertSeen[key]<ttlMin*60000) return;
  alertSeen[key]=now;
  alertQueue.push({red,ic,t,s});
  if(!alertShowing) nextAlert();
}
function nextAlert(){
  const b=$("#alertBanner"), a=alertQueue.shift();
  if(!a){ alertShowing=false; return; }
  alertShowing=true;
  b.classList.toggle("red", !!a.red);
  b.querySelector(".ic").textContent=a.ic;
  b.querySelector(".t").textContent=a.t;
  b.querySelector(".s").textContent=a.s;
  b.classList.add("show");
  setTimeout(()=>{ b.classList.remove("show"); setTimeout(nextAlert, 600); }, 9000);
}
function scanAlerts(ac){
  for(const a of (ac||[])){
    if(typeof a.lat!=="number" || typeof a.lon!=="number") continue;
    const nm=a.dst!=null?a.dst:haversineNm(loc,{lat:a.lat,lon:a.lon});
    const who=[(a.flight||"").trim()||a.r||a.hex, a.desc||a.t].filter(Boolean).join(" · ");
    const where=`${nm.toFixed(0)} nm ${bearingFrom(loc,{lat:a.lat,lon:a.lon})}`
      +(typeof a.alt_baro==="number"?` · ${a.alt_baro.toLocaleString()} ft`:"");
    const sq=(a.squawk||"").trim(), em=(a.emergency||"").trim().toLowerCase();
    const emerg=SQUAWK_EMERG[sq] || (em && em!=="none" ? em.toUpperCase() : null);
    if(emerg){ pushAlert("em:"+a.hex, true, "EMG", `${emerg} — squawk ${sq||"?"}`, `${who} · ${where}`); continue; }
    const ty=(a.t||"").toUpperCase();
    if(RARE_TYPES[ty]){ pushAlert("rare:"+a.hex, false, "RARE", `${RARE_TYPES[ty]} in range`, `${who} · ${where}`); continue; }
    if((a.dbFlags||0)&1){ pushAlert("mil:"+a.hex, false, "MIL", "Military aircraft in range", `${who} · ${where}`); continue; }
    if(a.category==="A7" && nm<=5) pushAlert("heli:"+a.hex, false, "HELI", "Helicopter close by", `${who} · ${where}`);
  }
}
/* Off-mode watcher: the sweep above only runs while in planes mode, so once a
   minute do a light scan (one point query) from the other modes, and check
   for an ISS pass from every mode -- dedupe key "iss" spans the whole ~10 min
   pass, and 45 min is under one orbit so the NEXT pass can alert again. */
async function backgroundWatch(){
  try{
    if(mode!=="planes"){
      const d=await getJSON(`${adsbRequire()}/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/${CFG.radiusNm}`, 10000);
      scanAlerts(d.ac);
    }
  }catch(e){}
  try{
    if(mode!=="iss"){
      const s=await produceISS();
      if(s && s.elev>10) pushAlert("iss", false, "ISS", "The ISS is above your horizon",
        `look ${s.dir}, ${Math.round(s.elev)}° up · ${Math.round(s.nm).toLocaleString()} mi away`, 45);
    }
  }catch(e){}
}

/* ---- spotter's log: everything this screen has ever seen ---- */
function freshLog(){ return { v:1, planes:{n:0, types:{}, airlines:{}}, trains:{n:0, systems:{}},
  buses:{n:0, routes:{}}, iss:{n:0}, records:{} }; }
let skyLog=(function(){ try{ const l=JSON.parse(localStorage.getItem("skylog.v1")||"null"); if(l && l.v===1) return l; }catch(e){}
  return freshLog(); })();
function saveLogNow(){ try{ localStorage.setItem("skylog.v1", JSON.stringify(skyLog)); }catch(e){} }
function bumpLog(m, key, name){ if(!key) return; const e=m[key]||(m[key]={n:0, first:Date.now()});
  e.n++; e.last=Date.now(); if(name) e.name=name; }
function recHigh(id, v, who){ if(v==null || !isFinite(v)) return;
  const r=skyLog.records[id]; if(!r || v>r.v) skyLog.records[id]={v, who, t:Date.now()}; }
function recLow(id, v, who){ if(v==null || !isFinite(v)) return;
  const r=skyLog.records[id]; if(!r || v<r.v) skyLog.records[id]={v, who, t:Date.now()}; }
function logSubject(s){
  if(mode==="planes"){

    bumpLog(skyLog.planes.airlines, s.airlineNm);

    recLow("closestNm", s.nm, s.title);

  else if(mode==="trains"){ skyLog.trains.n++; bumpLog(skyLog.trains.systems, s.sysName);
    recHigh("mostLateMin", s.lateMin, s.title); }
  else if(mode==="buses"){ skyLog.buses.n++; bumpLog(skyLog.buses.routes, s.title); }
  else if(mode==="iss"){ skyLog.iss.n++; }

}
function fmtWhen(t){ return t?new Date(t).toLocaleDateString([],{month:"short",day:"numeric"}):""; }
function renderLogPanel(){

const PRODUCERS = { planes:producePlane, trains:produceTrain, buses:produceBus, iss:produceISS };

/* ---- holding pattern: the one delay signal ADS-B can actually prove --------
   There is no schedule in this data, so "12 minutes late" is not something that
   can be derived honestly (see the note in the README). What CAN be observed is
   an aircraft flying circles: air traffic control has parked it, which always
   means delay. Track each aircraft's heading over a few minutes and add up the
   turn — a racetrack hold accumulates well past a full circle, while a normal
   route change is one turn and done. */
const trackHist = new Map();          // hex -> [{t, trk}]
const HOLD_WINDOW_MS = 240000;
function noteTrack(a){
  if(!a || !a.hex || typeof a.track!=="number") return;
  const now=Date.now();
  const h=trackHist.get(a.hex) || [];
  h.push({ t:now, trk:a.track });
  while(h.length && now-h[0].t > HOLD_WINDOW_MS) h.shift();
  trackHist.set(a.hex, h);
  if(trackHist.size>400) trackHist.delete(trackHist.keys().next().value);   // bounded
}
function isHolding(a){
  if(!a || !a.hex) return false;
  const alt = typeof a.alt_baro==="number" ? a.alt_baro : null;
  if(alt!=null && alt>26000) return false;         // holds happen low, not at cruise
  const h=trackHist.get(a.hex);
  if(!h || h.length<4 || (h[h.length-1].t - h[0].t) < 90000) return false;
  let turn=0;
  for(let i=1;i<h.length;i++){
    let d=h[i].trk - h[i-1].trk;                   // shortest signed way round
    d=((d+540)%360)-180;
    turn+=d;
  }
  return Math.abs(turn) >= 300;                    // most of a full circle or more
}
/* ---- FAA delay status for the airports a flight touches --------------------
   Free, no key, but CORS-blocked at source, so it comes via faa-worker.js. This
   is AIRPORT-level: "PHL has a 47-minute ground delay", not "your flight is 47
   minutes late". Labelled that way on purpose -- claiming a per-flight delay
   from airport-wide data would be a guess dressed up as a fact. */
let faaData=null, faaAt=0, faaBusy=false;
function faaUrl(){ try{ return (localStorage.getItem("tb.faaUrl")||"").trim().replace(/\/+$/,""); }catch(e){ return ""; } }
async function refreshFaa(){
  if(faaBusy || Date.now()-faaAt < 120000) return faaData;    // FAA moves on the order of minutes
  faaBusy=true;
  /* Same-origin file first: the deploy publishes faa-delays.json on a schedule,
     so this needs no proxy, no Worker and no CORS at all. A Worker URL is still
     honoured if one is configured -- it just isn't required any more. */
  const tries=[ "faa-delays.json?t="+Math.floor(Date.now()/120000) ];
  const u=faaUrl(); if(u) tries.push(u+"/delays");
  for(const src of tries){
    try{
      const d=await getJSON(src, 12000);
      if(d && d.ok && d.airports){ faaData=d.airports; faaAt=Date.now(); break; }
    }catch(e){}
  }
  faaBusy=false;
  return faaData;
}
function faaFor(code){
  const c=String(code||"").toUpperCase().trim();
  if(!c || !faaData) return [];
  return faaData[c] || [];
}
function faaChips(s){
  if(!faaData) return "";
  const seen=new Set(), out=[];
  [[s.oCode,"from"],[s.dCode,"to"]].forEach(([code,which])=>{
    faaFor(code).forEach(e=>{
      const k=code+e.kind; if(seen.has(k)) return; seen.add(k);
      const cls = e.severity==="major" ? "faa major" : "faa";
      out.push(`<span class="badge ${cls}" title="${escapeHtml(e.reason||"")}">${escapeHtml(code)} ${escapeHtml(e.text||e.label||"")}</span>`);
    });
  });
  return out.slice(0,2).join("");
}
function phaseOf(a){
  if(isHolding(a)) return "holding";
  const alt=typeof a.alt_baro==="number"?a.alt_baro:null, rate=a.baro_rate||0;
  if(alt==null) return "en route";
  if(alt<4000 && rate<-150) return "on final approach";
  if(rate<-350) return "descending";
  if(rate>350) return "climbing";
  if(alt>=28000) return "cruising";
  return "en route";
}
function airlineName(route, a){
  if(route && route.airline && route.airline.name) return route.airline.name;
  if(a.ownOp) return a.ownOp;
  const cs=(a.flight||"").trim();
  return cs || a.r || "Unknown aircraft";
}
/* ---- live telemetry chips (planes) ----
   These read fields the ADS-B feed already returns but the view was throwing
   away: vertical rate (climb/descent trend), true track (heading), and the
   transponder squawk / emergency flag. */
function vRateChip(rate){
  if(typeof rate!=="number" || !isFinite(rate) || Math.abs(rate)<120) return "";  // ~level: skip
  const fpm=Math.abs(Math.round(rate/10)*10).toLocaleString();
  return `<span class="alt"><span class="vr-arm">${rate>0?"↗":"↘"}</span> ${fpm} fpm</span>`;
}
/* Accepts a heading either as degrees (ADS-B track, SEPTA's numeric heading)
   or as a compass string ("N","NE",… -- how Amtrak reports it), so one chip
   serves planes, trains and buses. Returns "" when there's nothing usable. */
const COMPASS8={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,
  S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
function headingChip(track){
  let deg=null;
  if(typeof track==="number" && isFinite(track)) deg=track;
  else if(typeof track==="string"){ const k=track.trim().toUpperCase();
    if(k in COMPASS8) deg=COMPASS8[k]; else if(/^-?\d+(\.\d+)?$/.test(k)) deg=parseFloat(k); }
  if(deg==null) return "";
  const t=Math.round(((deg%360)+360)%360), dir=COMPASS[Math.round(t/22.5)%16];
  // ↑ points north (0°); rotating it clockwise by the heading gives the real bearing.
  return `<span class="alt"><span class="hdg-arrow" style="transform:rotate(${t}deg)">↑</span> ${t}° ${dir}</span>`;
}
/* A "next stop" chip: the train/bus equivalent of a flight's ETA badge --
   where it's headed next, with a scheduled/estimated time and optional note. */
/* Schedule adherence, where a feed genuinely reports it.
   WMATA's jBusPositions carries Deviation in minutes: positive is running late,
   negative is running early (buses do run ahead of time, and a bus that leaves a
   stop early is arguably the worse failure — so it is shown, not hidden). Live
   sample over Bethesda ranged from +22 to -8.

   Deliberately NOT applied to everything: Metrorail's TrainPositions has no
   schedule field at all, and the bundled-timetable buses are POSITIONED from the
   timetable, so calling them "on time" would be circular. Neither gets a badge
   rather than getting an invented one. */
/* The on-time/late badge these live rows used to build inline by hand, now
   banded. Both call sites pass 0 when the feed reports no usable delay, which
   is the same "on time" they showed before. */
function lateBadge(min){
  const li=liveLateInfo(min);
  if(!li) return `<span class="badge ok">on time</span>`;
  return `<span class="badge ${li.cls}">${li.mins>0 ? `+${li.mins} min late` : "on time"}</span>`;
}
function adherenceChip(min){
  if(typeof min!=="number" || !isFinite(min)) return "";
  const m=Math.round(min);
  // Running early keeps its own plain wording -- the bands describe lateness,
  // and painting "4 min early" green would say the same thing as on time
  // while being a different fact.
  if(m<0) return `<span class="badge">${Math.abs(m)} min early</span>`;
  /* The old chip allowed two minutes of slack before calling a train late, and
     called everything past that simply "late". The bands replace both halves of
     that, and the slack has to go with them: keeping it would print "on time"
     in the 1-5 band's yellow, so the words and the colour would contradict each
     other on the one minute they straddle. One minute down is now one down. */
  const li=liveLateInfo(m);
  if(!li) return "";
  return `<span class="badge ${li.cls}">${li.mins>0 ? `${li.mins} min late` : "on time"}</span>`;
}
function nextStopChip(name, timeStr, note){
  if(!name) return "";
  const extra=[timeStr, note].filter(Boolean).join(" · ");
  return `<span class="badge na">→ ${escapeHtml(name)}${extra?` · ${escapeHtml(extra)}`:""}</span>`;
}
/* Wall-clock times on a city board belong to that CITY, not to whoever is
   looking at it. Sky mode is opened from a board that may be six hours away,
   so "arr 18:45" has to mean 18:45 there. Cities with no tz set keep the
   viewer's own zone, which is exactly what every one of them did before.
   NOT for minToClock(): that builds a Date from minutes-since-midnight in
   local time, so re-reading it in another zone would shift it twice. */
function cityClock(t){
  const d = (t instanceof Date) ? t : new Date(t);
  if(isNaN(d)) return "";
  const tz = CITY_CFG && CITY_CFG.tz;
  if(!tz) return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return d.toLocaleTimeString(CITY_CFG.clock24 ? "en-GB" : "en-US",
    {hour:"2-digit", minute:"2-digit", hour12:!CITY_CFG.clock24, timeZone:tz});
}
function isoToClock(iso){ return iso ? cityClock(iso) : ""; }
// minutes-since-midnight (schedule math, may wrap past 1440) -> "10:45 PM"
function minToClock(min){ if(typeof min!=="number"||!isFinite(min)) return "";
  const m=((Math.round(min)%1440)+1440)%1440; return new Date(2000,0,1,Math.floor(m/60),m%60).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
// Amtrak's next scheduled stop = first station it hasn't departed yet.
function amtrakNextStop(t){
  const ns=(t.stations||[]).find(s=>s.status!=="Departed");
  if(!ns) return null;
  return { name:ns.name||ns.code, time:isoToClock(ns.arr||ns.dep||ns.schArr||ns.schDep),
    note:(ns.arrCmnt||ns.depCmnt||"").trim() };
}
const SQUAWK_EMERG={ "7500":"HIJACK", "7600":"RADIO FAIL", "7700":"EMERGENCY" };
/* Carriers whose IATA code we trust the logo CDN to resolve correctly.
   This is an ALLOWLIST on purpose. IATA codes get reassigned when airlines fold,
   and the CDN keeps whatever it was told years ago -- PSA Airlines (OH) came
   back as "silkavia", an unrelated carrier. A missing logo is a non-event; a
   confidently wrong one misinforms, so anything unverified simply shows no mark.
   US regional operators (PSA, Envoy, SkyWest, Republic, Endeavor, Mesa) are
   deliberately absent: they fly in mainline colours, so their own codes are
   exactly the ones that mismap. */
const LOGO_OK = new Set(("AA DL UA WN B6 AS NK F9 HA G4 SY MX " +
  "AC WS AM Y4 VB CM AV LA AR G3 AD CM " +
  "BA VS EI FR U2 W6 LH LX OS SN KL AF IB VY TP AZ SK DY AY LO OK TK SU A3 EW HV " +
  "EK QR EY SV MS ET RJ GF WY " +
  "SQ CX NH JL KE OZ CI BR TG MH GA VN AI 6E UK CZ MU CA HU 3U " +
  "QF NZ VA JQ FJ").split(/\s+/).filter(Boolean));
const logoAllowed = c => LOGO_OK.has(String(c || "").trim().toUpperCase());
function emergencyBadge(a){
  const sq=(a.squawk||"").trim(), em=(a.emergency||"").trim().toLowerCase();
  const label=SQUAWK_EMERG[sq] || (em && em!=="none" ? em.toUpperCase() : null);
  return label ? `<span class="badge emerg">⚠ ${escapeHtml(label)}</span>` : "";
}
/* Great-circle progress along a known origin→destination leg: how far the
   vehicle has come and how far is left, as a fraction and in nautical miles. */
function journeyProgress(oLL, dLL, posLL){
  if(!oLL || !dLL || !posLL) return null;
  const total=haversineNm(oLL, dLL);
  if(!(total>1)) return null;
  const toGo=Math.max(0, haversineNm(posLL, dLL));
  const flown=Math.max(0, total-toGo);
  return { pct:Math.max(0, Math.min(1, flown/total)), flownNm:flown, toGoNm:toGo };
}

let lastId=null;
function render(s){
  $("#updated").textContent = "updated "+cityClock(Date.now());

    $("#flight").style.display="none"; L.style.display=""; L.classList.remove("pulse");
    L.textContent="Add a WMATA key on the board to track buses"; renderMiniMap(null,null,null,null); return;
  }

     "nothing nearby right now": this will not resolve by waiting, so it says
     what is actually true instead of pulsing forever. */

    $("#flight").style.display="none"; L.style.display=""; L.classList.remove("pulse");

  }

     screen, so a Metrobus appeared under "Nearest Ride On bus". A fallback

  $("#rangeLbl").textContent = s.sysRange || RANGE[mode] || "";

  else if(s.photoQuery) updatePhoto(s.photoQuery, true, s.photoFallback);
  else { $("#photoWrap").style.display="none"; photoShownFor=null; }
  currentFleet = s.fleet||null;
  renderMiniMap(s.id, s.oLL, s.dLL, s.posLL, currentFleet);
  // swing the needle to the subject. posLL is set for every mode, so this one
  // line covers planes, trains and buses alike; hide the dial if a producer
  // ever omits a position rather than leaving the arrow pointing at stale sky.
  const cw=$("#compass"), needle=$("#compassNeedle");
  if(cw && needle && loc && s.posLL && isFinite(s.posLL.lat) && isFinite(s.posLL.lon)){
    cw.style.visibility="visible";

    // unwrap so a 350->10 swing rotates 20 degrees the short way, not 340 back
    const prev=Number(needle.dataset.deg||0);
    needle.dataset.deg = prev + (((deg-prev)%360)+540)%360-180;
    needle.style.transform=`rotate(${needle.dataset.deg}deg)`;
    cw.title=`Look ${s.dir} — ${s.nm.toFixed(1)} ${s.unit||"nm"} away (${Math.round(deg)}°)`;

    ? (currentFleet && currentFleet.length>1
        ? ` · <span class="fleet-btn" id="fleetBtn" title="Show everything in range">nearest of ${s.count} ▾</span>`
        : ` · nearest of ${s.count}`)
    : "");
  if($("#fleetPanel").classList.contains("show")) renderFleetPanel();

  const pv=$("#progress");

    pv.style.display="block";

     neutral placeholder for codes it doesn't know rather than a 404, so hide on
     error AND when there's no code at all -- trains and buses have none. */
  (function(){
    const img=$("#airlineLogo"); if(!img) return;

  // oCode/dCode are the reliable source (Sky's route object nests
  // origin/destination, so reading route.from/.to silently yielded nothing).
  // a producer that omits statusHtml used to render the literal text "undefined"
  $("#status").innerHTML = (s.statusHtml || "") + faaChips(s);
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function applyPalette(hex){

const TRANSIT_BRAND={
  "Amtrak":"#004B8D",
  // Washington / Baltimore
  "MARC":"#e8792b",          "Ride On":"#2f9e44",
  // New York
  "Subway":"#0039A6",        "Subway/LIRR/MNR":"#0039A6",   "MTA Bus":"#0039A6",

  "MBTA":"#DA291C",          "LA Metro":"#EB131B",          "Metrolink":"#0B5EA9",
  "BART/Caltrain":"#0099D8", "cable car":"#8C4A2F",         "GVB":"#3FA9E0",

const brandOn = () => localStorage.getItem("nightmode.brand")==="1";
/* Background and ink for a carrier, chosen together.

   A mid-tone brand colour is the awkward case: American's blue is equally poor
   against white and against black (about 4.3 either way), which is fine on a
   phone at arm's length and not fine on a wall. So a colour that cannot reach a
   comfortable ratio is deepened until it can, keeping its hue — a darker United
   blue still reads as United blue, unreadable text does not read as anything.
   Colours that are already light (Spirit yellow, Vueling yellow) are left alone
   and take dark ink instead. */
/* Swap the mark's dot centres to match whatever the screen has become.

   This is the one page where that is not a styling nicety. In brand mode the
   whole background turns into an airline's colour, and those run from Alaska's
   near-black to Southwest's yellow — the ring around each station dot is drawn
   in the background colour, so the wrong variant leaves three coloured blobs
   with a hole punched through them, or a white halo on a pale wall of yellow.
   The guide's rule is exactly this ("swap dot centers to match the background"),
   and the page already computes which way a background leans for its text. */
function setMarkForBackground(bgRgb){
  const img=document.getElementById("brandMark");
  if(!img) return;
  const [r,g,b]=bgRgb.map(v=>{v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4;});
  const light=(.2126*r+.7152*g+.0722*b) > 0.4;

  if(!img.src.endsWith(want)) img.src=want;
}

function brandPaint(hex){
  const lum=rgb=>{const [r,g,b]=rgb.map(v=>{v/=255; return v<=.03928? v/12.92 : ((v+.055)/1.055)**2.4;});
    return .2126*r+.7152*g+.0722*b;};
  const ratio=(a,b)=>{const L1=lum(a),L2=lum(b); return (Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);};
  const WHITE=[255,255,255], BLACK=[10,10,12];
  let bg=hexToRgb(hex);
  const best=()=>ratio(WHITE,bg)>=ratio(BLACK,bg) ? WHITE : BLACK;
  // deepen a stubborn mid-tone until white sits comfortably on it
  for(let i=0;i<14 && ratio(best(),bg)<6; i++){
    if(lum(bg)>0.5) break;              // already light: dark ink handles it
    bg=bg.map(v=>v*0.88);
  }
  return {bg, ink:best()};
}
/* The operator's colour for this subject, or "" if we cannot say. Guessing from
   the aircraft owner's name is deliberately not attempted: leasing trusts and
   fractional operators would paint the screen the wrong colour with confidence.
   Trains and buses have it easier — they carry their agency by name. */
function brandHexFor(s){
  if(!s) return "";
  if(mode==="trains" || mode==="buses"){
    const sys=String(s.sysName||"").trim();
    return TRANSIT_BRAND[sys] || "";
  }
  if(mode!=="planes") return "";
  const iata=String(s.airlineIata||"").trim().toUpperCase();
  if(iata && AIRLINE_BRAND[iata]) return AIRLINE_BRAND[iata];
  const call=String(s.callsign||s.flight||"").trim().toUpperCase();
  const icao=call.slice(0,3).replace(/[^A-Z0-9]/g,"");
  if(icao && AIRLINE_BRAND[icao]) return AIRLINE_BRAND[icao];
  return "";
}
let brandActive="";
/* Called on every render. Repaints only when the carrier actually changes, so a
   12s refresh of the same aircraft doesn't restyle the page over and over. */
function applyBrand(s){
  const hex = brandOn() ? brandHexFor(s) : "";
  if(hex===brandActive) return;
  brandActive=hex;
  const R=document.documentElement, theme=R.dataset.theme||"dark";

  if(!hex || theme==="day"){
    // back to the user's own accent, and the sky comes back with it
    applyPalette(localStorage.getItem("nightmode.accent") || "#7db8ff");
    document.body.classList.remove("brandmode");
    setMarkForBackground(theme==="day" ? [255,255,255] : [10,10,12]);
    updateSunSky();
    return;
  }

  /* The screen BECOMES the airline's colour — not a dark tint of it. Stars and
     the sunrise gradient are switched off in this mode (body.brandmode) because
     they are a night sky, and this is not one: a United-blue or FedEx-purple
     screen with stars over it just looks like a bug.

     Every other colour is derived from the ink, blended toward that background,
     so secondary text sits between the two rather than being a grey that was
     mixed for a near-black page and looks dirty on a coloured one. */
  const paint=brandPaint(hex), bg=paint.bg, ink=paint.ink;
  const mix=(t)=>ink.map((v,i)=>v+(bg[i]-v)*t);      // ink -> background
  R.style.setProperty("--bg", rgbStr(bg));
  R.style.setProperty("--amber", rgbStr(ink));
  R.style.setProperty("--city", rgbStr(ink));
  R.style.setProperty("--amber-dim", rgbStr(mix(.28)));
  R.style.setProperty("--muted", rgbStr(mix(.52)));
  R.style.setProperty("--faint", rgbStr(mix(.78)));
  R.style.setProperty("--glow", rgbStr(mix(.45)));
  setMarkForBackground(bg);
  document.body.classList.add("brandmode");
  updateSunSky();
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", rgbStr(bg));
}
function setBrand(v){
  localStorage.setItem("nightmode.brand", v==="on"?"1":"0");

/* ---- room lights: wear the colour of whatever is overhead ------------------
   Drives Govee bulbs/strips through govee-worker.js, which holds the API key.
   The browser cannot reach Govee directly on either path — the LAN API is UDP,
   which no page can speak, and the cloud API sends no CORS header — so the
   Worker is not an optimisation here, it is the only way in.

   Colour comes from the SAME brandHexFor() the screen uses, but deliberately
   not from brand mode: a dark screen with a lit room is a perfectly reasonable
   thing to want, so the lights get their own switch.

   Every call here is fire-and-forget. A light left unplugged, a Worker that is
   down, a Govee outage — none of it may interrupt a board whose actual job is
   showing you the sky. Failures go to the console and stop there. */
const GOVEE_RADIUS_NM = 10;      // "nearby". The sky view itself scans out to 30
const GOVEE_DWELL_MS  = 45000;   // hold a colour at least this long
const GOVEE_CLEAR_MS  = 90000;   // sky empty this long -> put the room back
const gvUrl = () => { try{ return (localStorage.getItem("tb.goveeUrl")||"").trim().replace(/\/+$/,""); }catch(e){ return ""; } };
const gvOn  = () => { try{ return localStorage.getItem("tb.goveeOn")==="1"; }catch(e){ return false; } };
const gvDev = () => { try{ return JSON.parse(localStorage.getItem("tb.goveeDev")||"null"); }catch(e){ return null; } };
/* The snapshot lives in localStorage, not just memory, because the case it
   exists for is the room being left the wrong colour — and a crash or a reload
   mid-flight is exactly when that happens. On disk it survives both. */
const gvSnap = () => { try{ return JSON.parse(localStorage.getItem("tb.goveeSnap")||"null"); }catch(e){ return null; } };
function gvSetSnap(v){
  try{ v ? localStorage.setItem("tb.goveeSnap", JSON.stringify(v)) : localStorage.removeItem("tb.goveeSnap"); }catch(e){}
}
function gvBody(extra){
  const d=gvDev(); if(!d) return null;
  return Object.assign({ sku:d.sku, device:d.device }, extra||{});
}
async function gvSet(extra){
  const u=gvUrl(), body=gvBody(extra); if(!u || !body) return null;
  try{
    const r=await fetch(u+"/set", { method:"POST", headers:{"content-type":"application/json"},
                                    body:JSON.stringify(body) });
    const j=await r.json();
    if(!j.ok) console.warn("lights:", j.error, j.detail||"");
    return j;
  }catch(e){ console.warn("lights:", e.message); return null; }
}
/* Read the room's own colour before touching it, once, so there is something to
   go back to. Skipped if a snapshot already exists — overwriting it with an
   airline colour would make "restore" restore the wrong thing. */
async function gvCapture(){
  if(gvSnap()) return;
  const u=gvUrl(), d=gvDev(); if(!u || !d) return;
  try{
    const r=await fetch(`${u}/state?sku=${encodeURIComponent(d.sku)}&device=${encodeURIComponent(d.device)}`);
    const j=await r.json();
    if(j && j.ok) gvSetSnap({ power:j.power, brightness:j.brightness, rgb:j.rgb });
  }catch(e){ console.warn("lights:", e.message); }
}
/* What to send to put the room back the way we found it.

   A light found switched OFF is the common case — the board runs at night — and
   it only needs switching off again. Restoring a colour and a brightness onto a
   dark light is two more upstream calls to set properties nobody can see, and
   an off light reports brightness 0, which is not a value Govee accepts back
   (its range starts at 1). So off is a single call and an early out. */
function gvRestoreBody(s){
  if(!s) return null;
  if(s.power===0) return { power:0 };
  const p={};
  if(s.power!=null) p.power=s.power;
  if(Number.isFinite(s.rgb)) p.rgb=s.rgb;
  if(Number.isFinite(s.brightness) && s.brightness>0) p.brightness=s.brightness;
  return Object.keys(p).length ? p : null;
}
function gvRestore(){
  const s=gvSnap(); if(!s) return;
  gvSetSnap(null); lightHex="";
  const p=gvRestoreBody(s);
  if(p) gvSet(p);

const gvRgbInt = (hex)=>{ const [r,g,b]=hexToRgb(hex); return (r<<16)|(g<<8)|b; };

let lightHex="", lightAt=0, lightSeen=0;
/* Called on every render, alongside applyBrand(). Cheap and silent unless the
   operator overhead actually changed. */
function driveLights(s){
  if(!gvOn() || !gvUrl() || !gvDev()) return;
  // planes report nm, trains and buses report miles
  const dist = (s && s.nm!=null) ? (s.unit==="mi" ? s.nm/1.15078 : s.nm) : Infinity;
  const hex  = (s && dist<=GOVEE_RADIUS_NM) ? brandHexFor(s) : "";
  const now  = Date.now();

  if(hex){
    lightSeen=now;
    if(hex===lightHex) return;
    /* Dwell. Near a busy corridor the nearest aircraft can change every refresh,
       and a room that restyles itself every 12 seconds is a strobe, not a
       signal. Too soon simply means no change — the next render tries again, so
       whatever is overhead when the timer clears is what wins. */
    if(now-lightAt < GOVEE_DWELL_MS) return;
    /* The dwell clock starts even if the change fails. An unreachable light
       must not be retried on every 12s render — that is a dead light generating
       traffic forever. */
    lightAt=now;
    (async()=>{
      const hadSnap = !!gvSnap();
      await gvCapture();
      const r = await gvSet({ power:1, rgb:gvRgbInt(hex) });
      if(r && r.ok){ lightHex=hex; return; }
      /* Nothing actually changed — an offline light is the common way this
         happens. Don't record a colour the room isn't wearing: lightHex would
         suppress the retry once the light came back, and a snapshot captured
         this pass would have us "restoring" a room we never touched. Only drop
         the snapshot if it was ours; an earlier successful colour still needs
         something to go back to. */
      lightHex="";
      if(!hadSnap) gvSetSnap(null);
    })();
    return;
  }
  /* Nothing in range. Aircraft drop out of a feed for a refresh or two without
     going anywhere, so the room does not snap back on the first empty poll. */
  if(lightHex && now-lightSeen > GOVEE_CLEAR_MS) gvRestore();
}
/* Last gasp. If the tab closes while the room is wearing an airline's colour,
   nothing else will ever put it back: the Worker is stateless and the board is
   gone. sendBeacon survives teardown where fetch() does not, and a text/plain
   body keeps it free of the CORS preflight it could not answer anyway. */
window.addEventListener("pagehide", ()=>{
  const s=gvSnap(), u=gvUrl(); if(!s || !u || !navigator.sendBeacon) return;
  const p=gvRestoreBody(s), body=gvBody(p); if(!p || !body) return;
  navigator.sendBeacon(u+"/set", new Blob([JSON.stringify(body)], {type:"text/plain"}));
  gvSetSnap(null);
});
function gvMsg(m, kind){
  const el=document.getElementById("goveeMsg"); if(!el) return;
  el.textContent=m||"";
  el.style.color = kind==="bad" ? "var(--late,#ff5a5a)" : kind==="good" ? "var(--good,#33d17a)" : "var(--amber-dim)";
}
/* Ask the Worker what is on the account. Colour-capable devices only: a Govee

async function gvScan(){
  const u=gvUrl(); if(!u){ gvMsg("Save the Worker URL first.", "bad"); return; }
  gvMsg("Scanning…");
  let j;
  try{ j=await (await fetch(u+"/devices")).json(); }
  catch(e){ gvMsg("Couldn't reach that Worker.", "bad"); return; }
  if(!j || !j.ok){ gvMsg("Govee said: "+((j&&(j.detail||j.error))||"no answer"), "bad"); return; }
  const lights=(j.devices||[]).filter(d=>d.rgb);
  const sel=document.getElementById("goveeDev");
  if(!lights.length){ gvMsg("No colour-capable lights on that account.", "bad"); return; }
  sel.innerHTML="";
  const cur=gvDev();
  lights.forEach(d=>{
    const o=document.createElement("option");
    o.value=JSON.stringify({sku:d.sku, device:d.device, name:d.name});
    o.textContent=d.name;
    if(cur && cur.device===d.device) o.selected=true;
    sel.appendChild(o);
  });
  if(!cur) try{ localStorage.setItem("tb.goveeDev", sel.value); }catch(e){}
  gvMsg(`${lights.length} light${lights.length>1?"s":""} found.`, "good");
}
function setGovee(v){
  const on = v==="on";
  try{ localStorage.setItem("tb.goveeOn", on?"1":"0"); }catch(e){}
  document.querySelectorAll("#goveeSeg button").forEach(b=>b.classList.toggle("active", b.dataset.govee===v));
  // switching off should hand the room back, not abandon it mid-colour
  if(!on) gvRestore();
  else if(!gvDev()) gvMsg("Pick a light first — press Scan.", "bad");
}
/* ---- make it fit, whatever the screen and whatever the name ----------------
   main is overflow:hidden by design (a wall display must not scroll), which
   means anything too tall is silently cut rather than reachable. How tall the
   text runs depends on the carrier's name and the two city names wrapping, so
   the same screen fits one flight and clips the next — no media query can know
   that in advance. Every fixed threshold I tried was missed by a common
   resolution sitting just above it.

   So: measure, and shrink the type a step at a time until it fits. Floor of
   0.62 because past that it stops being a glanceable board; if content is still
   too tall there, being slightly cut is the lesser evil. */
function fitSky(){
  const m=document.getElementById("main")||document.querySelector("main");
  if(!m) return;
  const R=document.documentElement;
  R.style.setProperty("--fit","1");
  // read once per step; each write forces exactly one reflow
  for(let f=1; f>0.62; f-=0.04){
    if(m.scrollHeight<=m.clientHeight+1) break;
    R.style.setProperty("--fit", f.toFixed(2));
  }
}
let fitQueued=false;
function queueFit(){
  if(fitQueued) return;
  fitQueued=true;
  requestAnimationFrame(()=>{ fitQueued=false; fitSky(); });
}
window.addEventListener("resize", queueFit);
function setNightTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("nightmode.theme", t);
  document.querySelectorAll("#themeSeg button").forEach(b=>b.classList.toggle("active", b.dataset.theme===t));
  setTheme(localStorage.getItem("nightmode.accent")||"#7db8ff");
}
function buildSwatches(){
  const wrap=$("#swatches"); wrap.innerHTML="";
  PRESETS.forEach(([hex,name])=>{ const b=document.createElement("button"); b.className="sw"; b.dataset.hex=hex; b.title=name; b.style.background=hex; b.onclick=()=>setTheme(hex); wrap.appendChild(b); });
  const custom=document.createElement("label"); custom.className="sw custom"; custom.title="Custom color";
  const inp=document.createElement("input"); inp.type="color"; inp.value=localStorage.getItem("nightmode.accent")||"#7db8ff";
  inp.oninput=()=>setTheme(inp.value); custom.appendChild(inp); wrap.appendChild(custom);
}
function setMode(m){
  mode=m; localStorage.setItem("nightmode.subject", m);
  $("#tag").textContent=TAGS[m]; $("#rangeLbl").textContent=RANGE[m];
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
  lastId=null; photoShownFor=null; $("#photoWrap").style.display="none"; $("#flight").style.display="none";
  if(miniVehLayer){ miniVehLayer.clearLayers(); miniVeh=null; miniVehKind=null; miniMapFor=null; }
  if(miniFleetLayer) miniFleetLayer.clearLayers();
  currentFleet=null; $("#fleetPanel").classList.remove("show");
  const L=$("#loading"); L.style.display=""; L.classList.add("pulse");
  L.textContent = m==="planes"?"Scanning the sky…":m==="trains"?"Finding trains…":m==="iss"?"Acquiring the ISS…":"Finding buses…";
  tick();
}
function initSettings(){
  buildSwatches();
  $("#setBtn").onclick=()=>$("#settings").classList.add("show");
  $("#setDone").onclick=()=>$("#settings").classList.remove("show");
  $("#settings").addEventListener("click",e=>{ if(e.target.id==="settings") $("#settings").classList.remove("show"); });
  $("#modeSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setMode(b.dataset.mode); });
  $("#logBtn").onclick=()=>{ renderLogPanel(); $("#logPanel").classList.add("show"); };
  $("#logDone").onclick=()=>$("#logPanel").classList.remove("show");
  $("#logPanel").addEventListener("click",e=>{ if(e.target.id==="logPanel") $("#logPanel").classList.remove("show"); });
  $("#logReset").onclick=()=>{ if(confirm("Reset the spotter's log? This clears everything seen so far.")){
    skyLog=freshLog(); saveLogNow(); renderLogPanel(); } };
  // the "nearest of N" chip is re-created every render, so delegate the click
  $("#dist").addEventListener("click", e=>{
    if(e.target.closest("#fleetBtn")){ renderFleetPanel(); $("#fleetPanel").classList.add("show"); } });
  $("#fleetDone").onclick=()=>$("#fleetPanel").classList.remove("show");
  $("#fleetPanel").addEventListener("click",e=>{ if(e.target.id==="fleetPanel") $("#fleetPanel").classList.remove("show"); });
  $("#themeSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setNightTheme(b.dataset.theme); });
  $("#skySeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setSunSky(b.dataset.sky); });
  $("#brandSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setBrand(b.dataset.brand); });
  $("#photoSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setPhotoPace(b.dataset.photo); });
}
function clock(){ $("#clock").textContent=cityClock(Date.now()); }

/* ---- full-screen kiosk mode + keep-awake ---- */
const SVG_EXPAND=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/></svg>`;
const SVG_COMPRESS=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m8 0v-3a2 2 0 0 1 2-2h3"/></svg>`;
let wakeLock=null, wakeWanted=true;
/* Keep the display awake. Two things this used to get wrong, both of which the
   move to transitproject.online exposed:
   1. The lock was tied to FULL SCREEN. iPhone Safari has no Fullscreen API at
      all, so fsElement() was always null there and the lock was never taken --
      the phone dimmed on schedule. It is now independent of full screen.
   2. The OS silently releases the lock whenever the page is hidden (tab switch,
      lock, even a pull-down). Re-acquiring was ALSO gated on full screen, so it
      never came back. We now re-acquire on the lock's own release event, on
      every visibility change, and on the first touch/key as a gesture fallback
      for browsers that want one.
   Wake Lock needs a SECURE context: over plain http:// navigator.wakeLock does
   not exist (see the https upgrade in cityswitch.js). */
async function requestWake(){
  if(!wakeWanted || document.visibilityState!=="visible") return;
  try{
    if(!("wakeLock" in navigator)) return;
    if(wakeLock && !wakeLock.released) return;
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ if(wakeWanted) setTimeout(requestWake, 400); });
  }catch(e){}
}
async function releaseWake(){ wakeWanted=false; try{ if(wakeLock) await wakeLock.release(); }catch(e){} wakeLock=null; }

/* some browsers only grant the lock off a user gesture */
let wakeGestureHooked=false;
function hookWakeGesture(){ if(wakeGestureHooked) return; wakeGestureHooked=true;
  const go=()=>{ wakeWanted=true; requestWake(); };
  document.addEventListener("pointerdown", go, {passive:true});
  document.addEventListener("keydown", go);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") requestWake(); });
  go();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", hookWakeGesture); else hookWakeGesture();

/* Full screen must act on the TOP document. Boards run inside the same-origin
   cityswitch.js shell iframe, where the fullscreen element belongs to the outer
   document — so document.fullscreenElement reads null inside the frame and
   document.exitFullscreen() silently no-ops, which is why Exit did nothing. */
function fsDoc(){
  try{ if(window.top && window.top!==window && window.top.document) return window.top.document; }catch(e){}
  return document;
}
function fsElement(){ const d=fsDoc(); return d.fullscreenElement || d.webkitFullscreenElement; }
function toggleFullscreen(){
  const d=fsDoc(), el=d.documentElement;
  if(fsElement()){ const ex=d.exitFullscreen||d.webkitExitFullscreen; if(ex) ex.call(d); return; }
  /* The licence check lives HERE rather than on the button, so that every way
     in is covered -- the button, the F key, and whatever gets added next. On
     the button alone it was one keystroke to walk past the only lock on the
     feature the licence exists to sell, and the button's own tooltip named the
     shortcut. Note the position: AFTER the exit branch, because leaving full
     screen is never gated. Trapping somebody in it is a bug, not a sale. */
  if(window.TBGate && !TBGate.require("fullscreen")) return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){ hintFS(); return; }
  try{ const p=req.call(el); if(p&&p.catch) p.catch(()=>hintFS()); }catch(e){ hintFS(); }
}
let hintTimer=null;
function hintFS(){
  let t=$("#fsHint");
  if(!t){ t=document.createElement("div"); t.id="fsHint"; document.body.appendChild(t); }
  t.textContent="Full screen is blocked here. Open this page in its own browser tab (or your deployed link) to go full screen.";
  t.style.transform="translate(-50%,0)"; clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ t.style.transform="translate(-50%,-120%)"; }, 4500);
}
function onFsChange(){
  const on=!!fsElement(), b=$("#fsBtn");
  if(b){ b.innerHTML=on?SVG_COMPRESS:SVG_EXPAND; b.title=on?"Exit full screen (F)":"Full screen (F)"; }
  wakeWanted=true; requestWake();   // awake in or out of kiosk full screen
}
function initFullscreen(){
  $("#fsBtn").onclick=toggleFullscreen;
  document.addEventListener("fullscreenchange", onFsChange);
try{ if(fsDoc()!==document) fsDoc().addEventListener("fullscreenchange", onFsChange); }catch(e){}
  document.addEventListener("webkitfullscreenchange", onFsChange);
try{ if(fsDoc()!==document) fsDoc().addEventListener("webkitfullscreenchange", onFsChange); }catch(e){}
  document.addEventListener("keydown", e=>{ if((e.key==="f"||e.key==="F") && !/^(input|textarea)$/i.test(e.target.tagName)) toggleFullscreen(); });
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") requestWake(); });
  onFsChange();
  // Keep kiosk fullscreen across the ‹ board (and other) nav links: remember it
  // when a nav link is clicked while fullscreen (capture phase, before it
  // navigates), then re-enter on the destination page -- immediately where the
  // browser allows (Chrome --kiosk), else on the first tap/key. A manual exit
  // records nothing, so leaving fullscreen on purpose stays windowed.
  document.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest("header a[href]");
    if(a && fsElement()){ try{ sessionStorage.setItem("kioskFS","1"); }catch(_){} }
  }, true);
  try{ if(sessionStorage.getItem("kioskFS")==="1"){
    sessionStorage.removeItem("kioskFS");
    const tryFS=()=>{ if(fsElement()) return; const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(req){ try{ const p=req.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(_){} } };
    tryFS();
    const once=()=>{ document.removeEventListener("pointerdown",once,true); document.removeEventListener("keydown",once,true); tryFS(); };
    document.addEventListener("pointerdown", once, true);
    document.addEventListener("keydown", once, true);
  } }catch(_){}
}

function boot(){
  initFullscreen();
  { const s=$("#skyAddrSet"), g=$("#skyAddrGps"), i=$("#skyAddr");
    if(s) s.onclick=skySetAddress;
    if(g) g.onclick=skyUseGps;
    if(i){ i.value = (loc && loc.label && loc.label!=="your location") ? loc.label : "";
           i.addEventListener("keydown", e=>{ if(e.key==="Enter") skySetAddress(); }); } }
  document.documentElement.setAttribute("data-theme", localStorage.getItem("nightmode.theme")||"dark");
  setTheme(localStorage.getItem("nightmode.accent")||"#7db8ff");
  initSettings();
  document.querySelectorAll("#themeSeg button").forEach(b=>b.classList.toggle("active", b.dataset.theme===(localStorage.getItem("nightmode.theme")||"dark")));
  document.querySelectorAll("#skySeg button").forEach(b=>b.classList.toggle("active", b.dataset.sky===(sunSkyEnabled()?"on":"off")));
  document.querySelectorAll("#brandSeg button").forEach(b=>b.classList.toggle("active", b.dataset.brand===(brandOn()?"on":"off")));
  document.querySelectorAll("#photoSeg button").forEach(b=>b.classList.toggle("active", b.dataset.photo===photoPace()));
  makeStars();
  $("#boardBtn").setAttribute("href", CITY_CFG.board);
  $("#boardBtn").title = `Back to the ${CITY_CFG.cityLabel} board`;
  $("#loclbl").textContent = loc.label ? "near "+loc.label : "";
  clock(); setInterval(clock, 1000);
  updateSunSky(); setInterval(updateSunSky, 60000);
  updateMoon(); setInterval(updateMoon, 60000);
  refreshFaa(); setInterval(refreshFaa, 120000);
  { const i=$("#faaUrl"), b=$("#faaSave");
    if(i) i.value=faaUrl();
    if(b) b.onclick=()=>{ try{ localStorage.setItem("tb.faaUrl",(i.value||"").trim().replace(/\/+$/,"")); }catch(e){}
      faaData=null; faaAt=0; refreshFaa().then(()=>tick()); }; }
  { const i=$("#goveeUrl"), b=$("#goveeSave"), sc=$("#goveeScan"), sel=$("#goveeDev");
    if(i) i.value=gvUrl();
    if(b) b.onclick=()=>{ try{ localStorage.setItem("tb.goveeUrl",(i.value||"").trim().replace(/\/+$/,"")); }catch(e){}
      gvMsg("Saved. Press Scan to find your lights."); };
    if(sc) sc.onclick=gvScan;
    if(sel) sel.onchange=()=>{ if(!sel.value) return;
      try{ localStorage.setItem("tb.goveeDev", sel.value); }catch(e){}
      lightHex=""; lightAt=0;                       // new light: let it take a colour at once
      gvMsg(JSON.parse(sel.value).name+" will follow what's overhead.", "good"); };
    // a light already chosen on a previous visit should show as chosen
    { const cur=gvDev(); if(sel && cur){ const o=document.createElement("option");
        o.value=JSON.stringify(cur); o.textContent=cur.name; o.selected=true; sel.appendChild(o); } }
    $("#goveeSeg").addEventListener("click", e=>{ const t=e.target.closest("button"); if(t) setGovee(t.dataset.govee); });
    document.querySelectorAll("#goveeSeg button").forEach(x=>x.classList.toggle("active", x.dataset.govee===(gvOn()?"on":"off")));
    /* A snapshot still on disk at startup means the last session ended with the
       room wearing someone's livery -- the beacon missed, or the tab was killed.
       Hand it back before doing anything else. */
    if(gvSnap() && gvUrl() && gvDev()) gvRestore(); }
  setInterval(backgroundWatch, 60000);             // off-mode rare-bird + ISS-pass watcher
  setMode(mode); setInterval(tick, CFG.refreshMs);
  // Only fall back to GPS if the board itself would (i.e. you haven't set a
  // manual address there) -- otherwise this would silently override the
  // address you typed into the board with your device's raw location.
  if(navigator.geolocation && !boardLocIsManual()){
    navigator.geolocation.getCurrentPosition(p=>{
      loc={ lat:p.coords.latitude, lon:p.coords.longitude, label:"your location" };
      $("#loclbl").textContent="near your location"; tick(); updateSunSky(); updateMoon();
    }, ()=>{}, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
  }
}
// Defensive: if the very first boot() attempt throws (observed occasionally),
// retry shortly after instead of leaving the page stuck uninitialized.
function safeBoot(){ try{ boot(); }catch(e){ console.error("boot() failed, retrying:", e); setTimeout(()=>{ try{ boot(); }catch(e2){ console.error("boot() retry failed:", e2); } }, 150); } }
if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", safeBoot); } else { safeBoot(); }
</script>
