<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transit Project — Unlock a screen</title>
<link rel="icon" type="image/svg+xml" href="../brand/favicon.svg">
<meta name="robots" content="noindex">
<style>
  body{background:#0a1020;color:#93a5cf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  a{color:#4ea1ff}
</style>
</head>
<body>
<!-- =========================================================================
     A door with a shorter name.

     The pairing panel asks people to type "transitproject.online/pair", because
     that is a thing you can read off a television across a room and get right
     on a phone keyboard. The page itself is /pair.html, and neither GitHub
     Pages nor Cloudflare Pages will serve one for the other -- but both serve
     index.html for a directory, so this forwards.

     The query string has to survive the trip: it carries the six-character
     code out of the QR, and dropping it would send somebody who scanned
     correctly to an empty box asking them to type it in by hand.
     ========================================================================= -->
<p>Taking you to the pairing page… <a id="go" href="../pair.html">continue</a></p>
<script>
  var to = "../pair.html" + (location.search || "") + (location.hash || "");
  document.getElementById("go").href = to;
  location.replace(to);
</script>
<noscript><p>JavaScript is off — <a href="../pair.html">open the pairing page</a>.</p></noscript>
</body>
</html>
