<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Brand marks. favicon.svg is the dot-less 16px drawing: the guide's floor
     for the full mark is 40px, and a browser tab is not going to honour that. -->
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="apple-touch-icon" href="brand/icon-dark-180.png">
<meta name="theme-color" content="#12101A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Departure Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=29" />
<script src="settings-ui.js?v=15" defer></script>
<!-- NOT deferred, and first: it wraps window.fetch, so it has to be in place
     before any other script can start a feed. Deferred would run after the
     page's own inline code had already begun fetching. -->
<script src="feed-backoff.js?v=1"></script>
<script src="license.js?v=2" defer></script>
<!-- Restarts a board that has been up for days, but only once it has just
     proved this origin is reachable — a reload into a dead network turns a
     stale-but-useful wall display into an empty one. See kiosk-reload.js. -->
<script src="kiosk-reload.js?v=1" defer></script>
<script src="gate.js?v=3" defer></script>
<script src="wake.js?v=1"></script>
<script src="delays.js?v=2"></script>
<style>
  /* Split-flap look keeps its own black palette, blue-tinted to match the
     shared theme (typeface + accents come from theme.css conventions). */
  :root{
    --bg:#000; --panel:#0b101e; --line:#1f2942; --text:#e8edf8; --muted:#8a94ad;
    --flap-bg:#141b2c; --flap-bg2:#0d1322; --flap-text:#f1f5ff; --seam:rgba(0,0,0,.65);
    --accent:#6ab0ff; --good:#5ad17a; --warn:#ffcc33; --late:#ff5a5a;
    /* board size -- overridden by [data-size="sm"|"lg"] below, set from Settings.
       Bumped noticeably bigger across the board (was 22/32/17) plus a clearer,
       wider-set font (IBM Plex Mono) for easier reading at a glance. */
    --flap-w:28px; --flap-h:40px; --flap-font:22px; --row-gap:.6vh;
  }
  :root[data-size="sm"]{ --flap-w:19px; --flap-h:27px; --flap-font:15px; --row-gap:.3vh; }
  :root[data-size="lg"]{ --flap-w:36px; --flap-h:52px; --flap-font:30px; --row-gap:1vh; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    display:flex; flex-direction:column; height:100dvh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:2vmin 3vw;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  /* One mark shows, the other is hidden, chosen by theme rather than by script:
     this page has no zoom and no per-operator repaint, so the theme attribute is
     the whole question and CSS can answer it on its own. The dot-less small mark
     is used because the header sizes off vmin and can land under the 40px floor
     on a short screen. */
  /* Not a button. `header a` gives every link a bordered pill, which would draw
     a box straight through the mark's clear space and make the logo read as a
     control you can press for something. */
  header .homelink{display:flex; align-items:center; flex:none;
    border:0; padding:0; background:none; border-radius:0}
  header .homelink:hover{border:0; background:none}
  header .mk-light{display:none}
  :root[data-theme="day"] header .mk-dark{display:none}
  :root[data-theme="day"] header .mk-light{display:block}
  header .title{font-size:clamp(1rem,2.2vw,1.6rem); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink)}
  header .title small{display:block; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--muted); text-transform:none; margin-top:2px}
  header .clock{margin-left:auto; font-size:clamp(1rem,2vw,1.5rem); font-variant-numeric:tabular-nums; color:var(--muted)}
  header a, header button{
    color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line);
    border-radius:8px; padding:.5em .8em; background:none; cursor:pointer; font-family:inherit;
  }
  header a:hover, header button:hover{color:var(--accent-ink); border-color:var(--accent)}

  #status{padding:1vmin 3vw; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); flex-shrink:0; display:flex; gap:1.5em}

  main{flex:1; min-height:0; overflow:hidden; padding:1.4vmin 3vw; display:flex; flex-direction:column}
  .board-head{
    display:grid; grid-template-columns:var(--cols); gap:1.4vw; padding:0 .3vw 1vmin;
    font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted); flex-shrink:0;
  }
  .board-rows{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-start; gap:var(--row-gap); overflow:hidden}
  .board-row{
    display:grid; grid-template-columns:var(--cols); gap:1.2vw; align-items:center;
    padding:.4vh .3vw; border-bottom:1px solid rgba(255,255,255,.03);
  }
  .op-logo{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    font:800 clamp(9px,.85vw,12px)/1 "IBM Plex Mono","Courier New",monospace; letter-spacing:.02em;
    padding:.4em .5em; border-radius:4px; color:#0a0e08; white-space:nowrap;
  }
  /* Real operator logo, on its own light chip so brand colors/black marks
     (WMATA's logo is solid black) stay legible regardless of the row's own
     accent color or the page's dark theme. */
  /* Operator marks come in wildly different shapes: WMATA's is taller than it is
     wide (250x307), Amtrak's is a long wordmark at 250x27 — nine times wider
     than tall. Pinning HEIGHT and letting width follow made Amtrak 215px wide in
     an 88px column, straight across the VIA column next to it. The img's own
     max-width could never help: it resolves against this box, and an inline-flex
     box with no width bound just grows to fit its content.
     So the BOX is bounded by the column, and the image is capped in BOTH axes
     and left to scale itself down — a wide wordmark ends up short rather than
     wide, which is the shape it has to be to fit. */
  .op-logo-img{
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:1; min-width:0; max-width:100%;
    background:#fff; border-radius:5px; padding:4px 7px; height:calc(var(--flap-h) * .78);
  }
  .op-logo-img img{
    display:block; width:auto; height:auto;
    max-width:100%; max-height:100%; object-fit:contain;
  }
  .flap-field{display:flex; gap:2px; flex-wrap:nowrap; overflow:hidden}
  .flap-field.left{justify-content:flex-start}
  .flap-field.right{justify-content:flex-end}

  .flap{
    position:relative; flex-shrink:0; width:var(--flap-w); height:var(--flap-h);
    background:linear-gradient(180deg,var(--flap-bg),var(--flap-bg2));
    border-radius:2px; overflow:hidden;
    box-shadow:inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,.05);
  }
  /* A position holding no character is a dark gap, not a lit empty box. Fields
     are fixed-width, so a third of every board (225 of 672 cells, measured) was
     blank tiles — and giving them the same panel treatment as a real character
     made emptiness the loudest texture on the screen. A real Solari board's
     unused flaps read as black. The element stays in place, so the flap still
     animates when a character arrives. */
  .flap.blank{ background:none; box-shadow:none; }
  .flap.blank::after{ display:none }
  .flap::after{
    content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--seam); transform:translateY(-.5px); z-index:2;
  }
  .flap .ch{
    display:flex; align-items:center; justify-content:center; width:100%; height:100%;
    font:700 var(--flap-font)/1 "IBM Plex Mono","Courier New",monospace; color:var(--flap-text);
    letter-spacing:.01em; transform-origin:center; backface-visibility:hidden;
  }
  .flap.flipping .ch{ animation:flapTurn .11s linear }
  @keyframes flapTurn{
    0%{ transform:rotateX(0deg) }
    50%{ transform:rotateX(-90deg) }
    100%{ transform:rotateX(0deg) }
  }
  /* ---- style: euro — a Deutsche Bahn panel -----------------------------
     Modelled on a real DB board: white on blue, not flaps on black. Split-flap
     is the wrong object for a modern European station — those boards are LCD,
     and the flap texture was fighting the thing it was imitating. The American
     style keeps its flaps, which is right: Penn Station's really are Solari.
     Destination is the largest element on the row, the train number sits in a
     pale chip, and the via-stops are deliberately secondary. */
  :root[data-style="euro"]{ --db-blue:#0a7bc8; --db-blue2:#0968aa; --db-chip:#e8f1f8; }
  :root[data-style="euro"] .board-row{
    background:linear-gradient(180deg,var(--db-blue),var(--db-blue2));
    align-items:center; border-radius:2px; padding:0 10px;
  }
  /* Real boards are built from two-row physical panels, so the pairs sit
     together with a gap between them. */
  :root[data-style="euro"] .board-row:nth-child(odd){ margin-top:6px }
  :root[data-style="euro"] .board-row.empty{ background:none }

  /* place the shared row children into DB's reading order */
  /* grid-row:1 on every child matters. Grid auto-placement only ever moves
     forward, so assigning child 2 to column 4 and then child 3 to column 2 sent
     child 3 to a SECOND row — which is why time, chip, destination and platform
     each sat at a different height in a tall block. Pinning the row keeps one
     line regardless of the column order. */
  :root[data-style="euro"] .board-row > *{ grid-row:1 }
  :root[data-style="euro"] .board-row > *:nth-child(1){ grid-column:1 }  /* time   */
  :root[data-style="euro"] .board-row > *:nth-child(2){ grid-column:3 }  /* ziel   */
  :root[data-style="euro"] .board-row > *:nth-child(3){ grid-column:2 }  /* train  */
  :root[data-style="euro"] .board-row > *:nth-child(4){ grid-column:5 }  /* hinweis*/
  :root[data-style="euro"] .board-row > *:nth-child(5){ grid-column:4 }  /* gleis  */

  /* no flap furniture: plain white text on the panel */
  /* width:auto collapses a blank cell to nothing, so ZÜRICH FLUGHAFEN lost its
     space and read as one word. A blank keeps a space's worth of width. */
  :root[data-style="euro"] .flap{ background:none; box-shadow:none; border-radius:0; width:auto }
  :root[data-style="euro"] .flap.blank{ width:.34em }
  :root[data-style="euro"] .flap::after{ display:none }
  :root[data-style="euro"] .flap-field{ gap:0 }
  :root[data-style="euro"] .flap .ch{
    color:#fff; font:600 calc(var(--flap-font) * .82)/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    letter-spacing:.01em;
  }
  /* Ziel is the row's headline */
  :root[data-style="euro"] .board-row > *:nth-child(2) .ch{
    font-weight:700; font-size:calc(var(--flap-font) * 1.12);
  }
  /* The note column: small, and only ever occupied by an exception. */
  :root[data-style="euro"] .board-row > *:nth-child(4) .ch{
    font-size:calc(var(--flap-font) * .58); opacity:.95; font-weight:700;
  }
  :root[data-style="euro"] .board-row.late  > *:nth-child(4) .ch{ color:#ffd34d }
  :root[data-style="euro"] .board-row.gone  > *:nth-child(4) .ch{ color:#ff8a8a }
  :root[data-style="euro"] .board-row.gone  > *:nth-child(2) .ch{ text-decoration:line-through; opacity:.75 }
  /* the train-number chip, in place of the operator logo */
  :root[data-style="euro"] .op-logo-img{ display:none !important }
  :root[data-style="euro"] .op-logo{
    display:inline-block !important; background:var(--db-chip) !important; color:#123a5c;
    font:700 calc(var(--flap-font) * .62)/1.7 "IBM Plex Mono",monospace;
    border-radius:2px; padding:.1em .5em; letter-spacing:.02em; white-space:nowrap;
  }
  :root[data-style="euro"] .status-tag.platform{
    font:700 calc(var(--flap-font) * 1.25)/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    color:#fff; background:none; border:none; letter-spacing:0;
    width:100%; text-align:right;
  }
  /* header band + page: the dark navy strip over blue panels */
  body.euro-skin .board-head{
    background:#0d1b2a; color:#cfe4f5; border-radius:2px; padding:4px 10px;
  }
  body.euro-skin .board-head i{ font-style:italic; opacity:.75; font-weight:500 }
  /* ---- style: metro (platform countdown) ----
     Not a split-flap at all: a dot-matrix panel. Bigger type, fewer rows, and
     the minutes doing the shouting. */
  :root[data-style="metro"]{ --flap-h:calc(var(--flap-h) * 1.25) }
  :root[data-style="metro"] .flap{ background:none; box-shadow:none; border-radius:0 }
  :root[data-style="metro"] .flap::after{ display:none }
  :root[data-style="metro"] .flap .ch{
    color:var(--metro-ink,#ffb02e);
    font:700 calc(var(--flap-font) * 1.15)/1 "IBM Plex Mono",monospace;
    text-shadow:0 0 6px color-mix(in srgb, var(--metro-ink,#ffb02e) 45%, transparent);
  }
  /* The countdown is a plain element next to fields of taller flaps, so it has
     to be centred against them explicitly or it sits half a row low. */
  :root[data-style="metro"] .board-row{
    border-bottom:1px solid rgba(255,255,255,.05); align-items:center;
  }
  /* Unused fields are HIDDEN, not parked. Assigning two children to the same
     grid-column stacked them in one cell and their text overlaid the row —
     GLENMONT and a route name rendering on top of each other as GLENMONTNGER. */
  :root[data-style="metro"] .board-row > *{ display:flex; align-items:center; grid-row:1 }
  :root[data-style="metro"] .board-row > *:nth-child(1){ display:none }   /* time  */
  :root[data-style="metro"] .board-row > *:nth-child(4){ display:none }   /* via   */
  :root[data-style="metro"] .board-row > *:nth-child(3){ grid-column:2 }  /* line  */
  :root[data-style="metro"] .board-row > *:nth-child(2){ grid-column:3 }  /* dest  */
  :root[data-style="metro"] .board-row > *:nth-child(5){ grid-column:4 }  /* min   */
  :root[data-style="metro"] .op-logo.metro-bullet{
    display:inline-flex !important; align-items:center; justify-content:center;
    font:800 calc(var(--flap-font) * .9)/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    letter-spacing:0; text-shadow:none; white-space:nowrap;
  }
  .op-logo.metro-bullet.code{ border-radius:3px; padding:.18em .55em; min-width:calc(var(--flap-font)*2) }
  .op-logo.metro-bullet.tab { border-radius:calc(var(--flap-font)*.6); padding:.16em .8em }
  .op-logo.metro-bullet.disc{ width:calc(var(--flap-font)*1.85); height:calc(var(--flap-font)*1.85);
                              border-radius:50%; padding:0 }
  :root[data-style="metro"] .board-rows, :root[data-style="metro"] .board-head{
    background:var(--metro-bg, transparent);
  }
  :root[data-style="metro"] .op-logo-img, :root[data-style="metro"] .op-logo{ display:none !important }
  :root[data-style="metro"] .status-tag.countdown{
    font:800 calc(var(--flap-font) * 1.7)/1 "IBM Plex Mono",monospace;
    color:var(--metro-ink,#ffb02e); background:none; border:none; letter-spacing:0;
    width:100%; text-align:right;
    text-shadow:0 0 8px color-mix(in srgb, var(--metro-ink,#ffb02e) 45%, transparent);
  }
  /* ---- SEPTA Regional Rail LED matrix ---- */
  #septaBoard{ display:none }
  :root[data-style="septa"] #boardRows, :root[data-style="septa"] .board-head{ display:none }
  :root[data-style="septa"] #septaBoard{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:0; flex:1; min-height:0; background:#000; overflow:hidden;
    border-top:2px solid #e01b1b;
  }
  /* the red rules that divide the physical panels */
  .sp-panel{ border-right:2px solid #e01b1b; border-bottom:2px solid #e01b1b; padding:6px 12px 10px; min-width:0 }
  /* --sp-scale is driven by fitSeptaPanels(): thirteen lines on a short window
     do not fit even at one departure each, and shrinking the type is the only
     move left that keeps every line on the board. */
  .sp-panel h3{
    margin:0 0 4px; text-align:center; color:#fff; font-weight:700;
    font:700 calc(var(--flap-font) * .78 * var(--sp-scale,1))/1.5 "IBM Plex Mono",monospace;
    letter-spacing:.04em;
  }
  .sp-row{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:baseline;
    font:700 calc(var(--flap-font) * .68 * var(--sp-scale,1))/1.65 "IBM Plex Mono",monospace;
    white-space:nowrap;
  }
  .sp-t{ color:#22d3ee }                       /* cyan times, as on the real board */
  .sp-n{ color:#e8b04b; font-variant-numeric:tabular-nums }   /* train number */
  .sp-d{ color:#39ff6a; overflow:hidden; text-overflow:ellipsis }   /* green destinations */
  .sp-s{ color:#39ff6a }
  .sp-s.warn{ color:#ffd34d } .sp-s.sched{ color:#9fb4c7 }
  .sp-live{ display:block; font-size:calc(var(--flap-font) * .52 * var(--sp-scale,1)); font-weight:700;
            letter-spacing:.02em; margin-top:1px }
  .sp-live.ok{ color:#39ff6a } .sp-live.warn{ color:#ffd34d }
  /* The scrolling strip along the bottom of the real board. Two copies of the
     message ride a single translated track, so the loop is seamless rather than
     snapping back at the end. Duration scales with nothing — it is a fixed,
     slow, readable crawl. */
  .datestr{ display:none }
  :root[data-style="septa"] .datestr{
    display:inline-block; color:#e8b04b; font:700 calc(var(--flap-font) * .62)/1 "IBM Plex Mono",monospace;
    letter-spacing:.06em; margin-left:auto; padding-right:14px; white-space:nowrap;
  }
  #septaTicker{ display:none }
  :root[data-style="septa"] #septaTicker{
    display:block; overflow:hidden; white-space:nowrap; background:#000;
    border-top:2px solid #e01b1b; padding:5px 0;
  }
  .sp-tick-in{ display:inline-flex; will-change:transform; animation:spTick 34s linear infinite }
  .sp-tick-in span{
    padding-right:5rem; color:#ffb02e; letter-spacing:.06em;
    font:700 calc(var(--flap-font) * .6)/1.4 "IBM Plex Mono",monospace;
  }
  @keyframes spTick{ from{ transform:translateX(0) } to{ transform:translateX(-50%) } }
  @media (prefers-reduced-motion:reduce){ .sp-tick-in{ animation:none } }
  .sp-empty{ color:#9fb4c7; padding:20px; font:600 14px "IBM Plex Mono",monospace }
  .board-row.empty{ opacity:0 }
  .status-tag{font-size:11px; font-weight:800; letter-spacing:.06em; padding:.2em .5em; border-radius:4px; white-space:nowrap}
  .status-tag.ok{background:rgba(90,209,122,.15); color:var(--good-ink)}
  .status-tag.warn{background:rgba(255,204,51,.15); color:var(--warn-ink)}
  .status-tag.late{background:rgba(255,90,90,.15); color:var(--late-ink)}
  .status-tag.na{color:var(--muted); border:1px solid var(--line)}
  .status-tag.bad{background:rgba(255,90,90,.2); color:var(--late-ink)}
  /* The four shared delay bands (delays.js + theme.css), tinted to sit on the
     split-flap's dark plates. The severe band keeps the solid plate it has on
     the boards -- on a wall display that is the whole point of it. */
  .status-tag.dly-ok{background:rgba(51,209,122,.15); color:var(--delay-ok)}
  .status-tag.dly-min{background:rgba(255,204,51,.15); color:var(--delay-min)}
  .status-tag.dly-mid{background:rgba(255,138,117,.15); color:var(--delay-mid)}
  .status-tag.dly-max{background:var(--delay-max-bg); color:var(--delay-max-ink)}

  footer{padding:1.2vmin 3vw; border-top:1px solid var(--line); font-size:11px; color:var(--muted); flex-shrink:0; display:flex; gap:1.5em}
  #fsHint{position:fixed; top:0; left:50%; transform:translate(-50%,-120%); z-index:80;
    background:#0b101e; color:var(--text); border:1px solid var(--line); border-radius:0 0 10px 10px;
    padding:10px 18px; font-size:13px; max-width:90vw; text-align:center; transition:transform .35s ease}
  #fsHint.show{transform:translate(-50%,0)}

  /* ---- settings panel ---- */
  #settings{position:fixed; top:0;right:0;bottom:0;left:0;inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:90; padding:20px}
  #settings.show{display:flex}
  #settings .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px; max-width:480px; width:100%; max-height:88vh; overflow:auto}
  #settings h3{margin:0 0 4px; font-size:19px; color:var(--accent-ink)}
  #settings .lbl{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; margin:18px 0 9px}
  #settings .seg{display:flex; gap:8px}
  #settings .seg button{flex:1; padding:11px 6px; border-radius:10px; border:1px solid var(--line);
    background:#10182b; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit}
  #settings .seg button.active{border-color:var(--accent); color:var(--accent-ink); background:rgba(106,176,255,.08)}
  #settings .sys-grid{display:flex; flex-wrap:wrap; gap:8px}
  #settings .sys-toggle{flex:1; min-width:130px; display:flex; align-items:center; gap:8px; padding:9px 11px;
    border-radius:10px; border:1px solid var(--line); background:#10182b; font-size:13px; cursor:pointer}
  #settings .sys-toggle input{margin:0; cursor:pointer}
  #settings .done{margin-top:22px; width:100%; padding:12px; border-radius:10px; border:none;
    background:var(--accent); color:#071528; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit}

  /* ============ blue depth pass (shared design language) ============
     Deep-navy floors + bright-blue highlights, same tokens as the city boards.
     Deliberately avoids .flap/.cell so the split-flap animation is untouched. */
  body{background:
      radial-gradient(900px 600px at 108% 14%, rgba(78,161,255,.12) 0%, transparent 55%),
      radial-gradient(1300px 850px at 50% 122%, var(--blue-deep,#0a1a3d) 0%, transparent 62%),
      var(--bg)}

<script>/* Self-heal stale pages. The Spotter PWA's first service worker was scoped to
   the whole site and cached every board, so a device that installed it keeps serving
   old copies no matter how many times the site is redeployed - which looks exactly
   like "GitHub isn't deploying". Drop that old cache, force any worker to re-check
   for a new version, and never let a worker own these pages again. */
(function(){try{
  if(window.caches && caches.keys) caches.keys().then(function(ks){
    ks.forEach(function(k){ if(k!=="spotter-v2") caches.delete(k); });
  });
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){
        // a worker whose scope covers this page must not be caching boards
        if(r.scope && location.href.indexOf(r.scope)===0 && !/spot\.html$/.test(location.pathname)) r.update();
      });
    });
}catch(e){}})();</script>

<script>
"use strict";
/* Departure board is shared by the city boards, same as night.html. Which

const CITY_CONFIG = {

    tz:"Europe/Berlin", clock24:true,
  },

    lsLoc:"transitboard.loc", board:"dc.html", cityLabel:"Washington DC",
    lsWmataKey:"transitboard.wmataKey", lsHidden:"transitboard.hiddenCards",
  },

    lsWmataKey:null, lsHidden:"transitboardnj.hiddenCards",
  },
  philly: {
    defaultLoc:{ lat:39.9812, lon:-75.1563, label:"Temple University, Philadelphia" },
    lsLoc:"transitboardphl.loc", board:"philadelphia.html", cityLabel:"Philadelphia",
    lsWmataKey:null, lsHidden:"transitboardphl.hiddenCards",
  },
  nyc: {
    defaultLoc:{ lat:40.7506, lon:-73.9935, label:"Penn Station, New York, NY" },
    lsLoc:"transitboardnyc.loc", board:"nyc.html", cityLabel:"New York",
    lsWmataKey:null, lsHidden:"transitboardnyc.hiddenCards",
  },
  boston: {
    defaultLoc:{ lat:42.3519, lon:-71.0552, label:"South Station, Boston, MA" },
    lsLoc:"transitboardboston.loc", board:"boston.html", cityLabel:"Boston",
    lsWmataKey:null, lsHidden:"transitboardboston.hiddenCards",
  },
  amsterdam: {
    defaultLoc:{ lat:52.3791, lon:4.9003, label:"Amsterdam Centraal" },
    lsLoc:"transitboardamsterdam.loc", board:"amsterdam.html", cityLabel:"Amsterdam",
    lsWmataKey:null, lsHidden:"transitboardamsterdam.hiddenCards",
  },
  la: {
    defaultLoc:{ lat:34.0562, lon:-118.2365, label:"Union Station, Los Angeles" },
    lsLoc:"transitboardla.loc", board:"losangeles.html", cityLabel:"Los Angeles",
    lsWmataKey:null, lsHidden:"transitboardla.hiddenCards",
  },
  sf: {
    defaultLoc:{ lat:37.7844, lon:-122.4078, label:"Powell St, San Francisco" },
    lsLoc:"transitboardsf.loc", board:"sanfrancisco.html", cityLabel:"San Francisco",
    lsWmataKey:null, lsHidden:"transitboardsf.hiddenCards",
  },
};
// Falls back to "dc" for any unrecognized/missing ?city= value (which also
// keeps old ?city=bethesda links working -- "bethesda" is no longer a key,
// so it lands on the DC config it always meant).
const CITY_PARAM = new URLSearchParams(location.search).get("city");
const CITY = CITY_CONFIG[CITY_PARAM] ? CITY_PARAM : "dc";
const CITY_CFG = CITY_CONFIG[CITY];
const $ = s=>document.querySelector(s);

/* Bundled timetables ship pattern-deduplicated ("v":2): stop sequences and
   running-time profiles are each stored once and referenced by index, because
   these files are dominated by repetition (the NYC subway's 18,481 trips share
   just 121 stop sequences). Expand back to the plain
   {line,hs,s,st:[[stop,min],...]} shape on load so everything downstream --
   interpolation, departure lists, route lines -- stays exactly as it was. */
function expandBundle(s){
  if(!s || s.v!==2 || !Array.isArray(s.pats)) return s;
  const pats=s.pats, offs=s.offs||[];
  s.trips=(s.trips||[]).map(t=>{
    const ids=pats[t.p]||[], off=offs[t.o]||[], base=t.t||0;
    return { line:t.l, hs:t.h, s:t.s, st:ids.map((sid,i)=>[sid, base + (off[i]||0)]) };
  });
  delete s.pats; delete s.offs;
  return s;
}
function loadBoardLoc(){
  try{ const s=JSON.parse(localStorage.getItem(CITY_CFG.lsLoc)); if(s&&s.lat) return s; }catch(e){}
  return null;
}
const loc = loadBoardLoc() || CITY_CFG.defaultLoc;
/* Which systems show on the board -- its own dedicated toggle set (separate
   from the board's "show on board" cards, since the ideal mix for a compact
   departure board can differ from the card layout). Defaults to whatever the
   board itself currently has hidden the first time this page loads, then is
   fully independent from then on. */
const LS_FLIP_HIDDEN = `flipboard.${CITY}.hidden`;
function loadHiddenSystems(){
  const raw=localStorage.getItem(LS_FLIP_HIDDEN);
  if(raw!==null){ try{ return new Set(JSON.parse(raw)); }catch(e){ return new Set(); } }
  try{ return new Set(JSON.parse(localStorage.getItem(CITY_CFG.lsHidden)||"[]")); }catch(e){ return new Set(); }
}
function saveHiddenSystems(set){ localStorage.setItem(LS_FLIP_HIDDEN, JSON.stringify([...set])); }
function systemVisible(id){ return !loadHiddenSystems().has(id); }
function loadUrl(key){ return key ? (localStorage.getItem(key)||"") : ""; }

async function getJSON(url, timeout=12000){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), timeout);
  try{ const r=await fetch(url, {signal:ctrl.signal}); if(!r.ok) throw new Error("http "+r.status); return expandBundle(await r.json()); }
  finally{ clearTimeout(t); }
}
function haversineMi(a,b){
  const R=3958.8, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const x=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function clockOf(min){
  let h=Math.floor(min/60)%24, m=Math.round(min%60), ap=h>=12?"P":"A";
  return `${((h+11)%12)+1}:${String(m).padStart(2,"0")}${ap}`;
}
function clock24Of(min){ return `${String(Math.floor(min/60)%24).padStart(2,"0")}:${String(Math.round(min%60)).padStart(2,"0")}`; }
function ymd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
// "Now" for schedule math: minutes-since-midnight + GTFS date parts, computed
// in the bundle's own timezone when it declares one (s.tz, e.g.
// "Europe/Amsterdam"), else the viewer's local clock (all US bundles --
// unchanged behavior). Without this, a European board viewed from the US
// would show every scheduled departure hours off.
function schedNowParts(tz){
  const d=new Date();
  if(!tz) return { y:ymd(d), dow:(d.getDay()+6)%7, min:d.getHours()*60+d.getMinutes() };
  const p={};
  new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short"}).formatToParts(d)
    .forEach(x=>{ if(x.type!=="literal") p[x.type]=x.value; });
  const dow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[p.weekday];
  return { y:p.year+p.month+p.day, dow, min:(parseInt(p.hour,10)%24)*60+parseInt(p.minute,10) };
}
function activeServices(s, parts){
  const {y,dow}=parts;
  const act=new Set();
  for(const id in s.svc){ const v=s.svc[id]; if(y>=v.start && y<=v.end && v.dow[dow]) act.add(id); }
  const ex=s.exc[y]; if(ex){ (ex.rem||[]).forEach(x=>act.delete(x)); (ex.add||[]).forEach(x=>act.add(x)); }
  /* Bundled calendars EXPIRE. Agencies publish only a few weeks ahead, and
     when the last date passes this set comes back empty and the card goes
     silently blank -- no error, just no trains (how LA Metro Rail vanished).
     refresh-schedules.py + the schedule-refresh workflow keep the bundles
     current; this is the last resort if that ever stops running: fall back
     to the same weekday from the calendar we do have. Times drift from
     reality as the bundle ages, so the boards label it "stale schedule"
     rather than passing it off as current. */
  if(!act.size){
    for(const id in s.svc){ const v=s.svc[id]; if(v.dow[dow]) act.add(id); }
    if(act.size) s._stale=true;
  }
  return act;
}

/* ===== row collectors -- each returns an array of
   {sortMin, etaMin, time, dest, via, status, statusKind, color} =====

   etaMin is MINUTES FROM NOW, or null where the collector genuinely cannot say
   (an Amtrak train with no speed fix, an aircraft overhead). It exists because
   sortMin does NOT mean one thing: minutes-since-midnight on the bundled
   schedules and Amtrak, minutes-from-now on WMATA/bus/transitous, and tenths of
   a mile on planes. A metro board reading a countdown off sortMin therefore
   printed "720 MIN" at noon. Every new collector must set etaMin; it is the one
   field the countdown styles can trust. */

/* Generic bundled-schedule collector: MARC, Ride On, SEPTA Rail, SEPTA
   Subway, SEPTA Bus (schedule fallback), PATCO all share the identical
   {stations, svc, exc, trips:[{line,hs,s,st}]} JSON shape, so one function
   covers all of them -- same pattern the boards use, just producing rows
   instead of cards. */
const scheduleCache={};
async function collectScheduleRows(cfg){
  try{
    let s=scheduleCache[cfg.url];
    if(!s){
      s=await getJSON(cfg.url, 15000);
      s._coord={}; (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon,st.name]; });
      s._dep={};
      (s.trips||[]).forEach(tr=>tr.st.forEach(([sid,min])=>{ (s._dep[sid]=s._dep[sid]||[]).push({line:tr.line, hs:tr.hs, s:tr.s, t:min}); }));
      scheduleCache[cfg.url]=s;
    }
    const nowP=schedNowParts(s.tz), nowMin=nowP.min, active=activeServices(s, nowP);
    const near=(s.stations||[]).map(st=>({st, mi:haversineMi(loc,{lat:st.lat,lon:st.lon})})).sort((a,b)=>a.mi-b.mi).slice(0, cfg.stationCount||3);
    const rows=[];
    near.forEach(({st})=>{
      const deps=(s._dep[st.id]||[]).filter(d=>active.has(d.s)).map(d=>({...d,min:d.t})).filter(d=>d.min>=nowMin).sort((a,b)=>a.min-b.min).slice(0, cfg.perStation||2);
      deps.forEach(d=>{
        rows.push({ sortMin:d.min, etaMin:d.min-nowMin,
          time:(s.tz?clock24Of:clockOf)(d.min), dest:(d.hs||st.name||"").toUpperCase(),
          via:(d.line||"").toUpperCase(), status:"SCHEDULED", statusKind:"na",
          color:cfg.colorFn?cfg.colorFn(d.line):cfg.color });
      });
    });
    return rows;
  }catch(e){ return []; }
}

/* Every Regional Rail line, not just the ones calling nearest.

   collectScheduleRows takes the N nearest stations and reads whatever departs
   from them. That is right for a "what's near me" card and wrong for a
   departure board: a line that does not stop near where the board is pointed
   never enters the candidate set, at ANY sampling depth. Measured — 2 stations
   x 2 gave 3 of the 13 lines, 10 x 12 gave 6, and 10 x 40 also gave 6.

   So this inverts the loop. Walk the Center City stations, bucket the
   departures BY LINE, and take each line's next few. A line is represented if
   it runs at all, however sparse, so Cynwyd and the Airport line hold their
   panel next to Paoli. */
/* Penn Medicine through Temple: the five Regional Rail stations the real board
   covers, named rather than measured. A six-mile radius around the saved
   location was standing in for this and pulled in 38 of the bundle's 156
   stations — Germantown, Olney, Manayunk and Wayne Junction were filling the
   panels with departures from places this sign does not serve. Naming them also
   makes the board independent of where the viewer happens to have pinned
   themselves, which a station board should be.

   Bundle spellings, not colloquial ones: SEPTA renamed 30th Street to "Gray
   30th St Station", and this matches on the bundle's exact `name`. */
const SEPTA_CENTER_CITY = new Set([
  "Penn Medicine Station",
  "Gray 30th St Station",
  "Suburban Station",
  "Jefferson Station",
  "Temple University",
]);
async function collectSeptaByLine(cfg){
  try{
    let s=scheduleCache[cfg.url];
    if(!s){
      s=await getJSON(cfg.url, 15000);
      s._coord={}; (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon,st.name]; });
      s._dep={};
      (s.trips||[]).forEach(tr=>tr.st.forEach(([sid,min])=>{ (s._dep[sid]=s._dep[sid]||[]).push({line:tr.line, hs:tr.hs, s:tr.s, n:tr.n, t:min}); }));
      scheduleCache[cfg.url]=s;
    }
    const nowP=schedNowParts(s.tz), nowMin=nowP.min, active=activeServices(s, nowP);
    const byLine={};
    const scope = cfg.stations || null;
    (s.stations||[]).forEach(st=>{
      if(scope && !scope.has(st.name)) return;
      (s._dep[st.id]||[]).forEach(d=>{
        if(!active.has(d.s)) return;
        /* Schedules run past midnight as 24:xx+, so a departure can be "later
           today" while numerically smaller than now. */
        let min=d.t; if(min < nowMin) min += 1440;
        if(min - nowMin > 180) return;                 // three hours is a boardful
        const line=(d.line||"").toUpperCase();
        if(!SEPTA_LINES[line]) return;                 // rail only
        (byLine[line]=byLine[line]||[]).push({ min, hs:d.hs, st:st.name, n:d.n });
      });
    });
    const rows=[];
    Object.keys(byLine).forEach(line=>{
      /* One row per TRAIN, not per calling point. A Center City train stops at
         30th Street, Suburban and Jefferson — all inside the radius — so it was
         being listed three times over, at three different minutes. Keying on
         time+headsign could never catch that, since the times genuinely differ;
         the train number can, and only exists here because the bundle now
         carries it. Earliest call wins, which is the one you would catch. */
      const seen=new Set();
      byLine[line].sort((a,b)=>a.min-b.min)
        .filter(d=>{ const k=d.n || (d.min+"|"+d.hs); if(seen.has(k)) return false; seen.add(k); return true; })
        .slice(0, cfg.perLine||3)
        .forEach(d=>rows.push({
          sortMin:d.min, etaMin:d.min-nowMin, time:(s.tz?clock24Of:clockOf)(d.min % 1440),
          dest:(d.hs||d.st||"").toUpperCase(), via:line,
          /* GTFS gives the number prefixed with the line code (CYN1052); the
             board prints just the digits, as SEPTA's own does. */
          trainNo:String(d.n||"").replace(/^[A-Z]+/, ""),
          status:"SCHEDULED", statusKind:"na", color:cfg.color }));
    });
    return rows;
  }catch(e){ return []; }
}

/* Amtrak (both cities) -- amtraker is a genuinely live API, so status
   reflects real on-time/late info instead of "scheduled". TIME is a rough
   ETA to the train's own destination (speed + great-circle distance, same
   technique night.html uses), not a station-board departure time. */
let amStationsCache=null;
async function ensureAmStations(){
  if(amStationsCache) return amStationsCache;
  try{
    const d=await getJSON("https://api-v3.amtraker.com/v3/stations", 12000);
    const m={}; for(const c in d){ const s=d[c]; if(typeof s.lat==="number") m[c]=[s.lat,s.lon]; }
    amStationsCache=m;
  }catch(e){ amStationsCache={}; }
  return amStationsCache;
}
async function collectAmtrakRows(count){
  try{
    const [data, st] = await Promise.all([getJSON("https://api-v3.amtraker.com/v3/trains", 12000), ensureAmStations()]);
    const now=new Date(), list=[];
    for(const arr of Object.values(data)) for(const t of (arr||[])){
      if(typeof t.lat!=="number"||typeof t.lon!=="number") continue;
      if(t.trainState && t.trainState!=="Active") continue;
      const mi=haversineMi(loc,{lat:t.lat,lon:t.lon});
      if(mi>150) continue;
      list.push({t, mi});
    }
    list.sort((a,b)=>a.mi-b.mi);
    return list.slice(0,count).map(({t})=>{
      /* Lateness used to be read out of trainTimely and bucketed by regex.
         That field is empty on every active train now, so every Amtrak row was
         landing on "na" and the board showed no delays at all. Derive it from
         the next stop's scheduled vs actual time instead -- the same source
         the city boards use -- and keep the feed's own wording as a fallback
         for if it ever starts reporting again. */
      const late=(t.trainTimely||"").trim();
      const amLi=amtrakLateInfo((t.stations||[]).find(s=>s.status!=="Departed"));
      const statusKind = amLi ? amLi.cls : "na";
      const statusText = amLi
        ? (amLi.mins>0 ? `+${amLi.mins} MIN` : "ON TIME")
        : (late||"EN ROUTE").toUpperCase();
      const dLL=st[t.destCode];
      let sortMin=1440, time="EN ROUTE", etaMin=null;
      if(dLL && t.velocity>15){
        const mins=Math.round(haversineMi({lat:t.lat,lon:t.lon},{lat:dLL[0],lon:dLL[1]})/t.velocity*60);
        if(mins>=0 && mins<900){
          sortMin=(now.getHours()*60+now.getMinutes()+mins)%1440;
          time=mins<=1 ? "ARR" : clockOf(sortMin);
          etaMin=mins;                 // the run-time estimate, before the clock wrap
        }
      }
      return { sortMin, etaMin, time, dest:(t.destName||t.destCode||"?").toUpperCase(),
        via:(t.routeName||"AMTRAK").toUpperCase(), status:statusText, statusKind,
        color:"#3ad0c8" };
    });
  }catch(e){ return []; }
}

/* WMATA Metrorail (Bethesda only, needs the board's own saved key) */
const RAIL_COLORS={RD:"#BF0D3E",BL:"#009CDE",YL:"#FFD100",OR:"#ED8B00",GR:"#00B140",SV:"#919D9D"};
const RAIL_NAMES={RD:"RED",BL:"BLUE",YL:"YELLOW",OR:"ORANGE",GR:"GREEN",SV:"SILVER"};
let wmataStationsCache=null;
async function ensureWmataStations(key){
  if(wmataStationsCache) return wmataStationsCache;
  const data=await getJSON(`https://api.wmata.com/Rail.svc/json/jStations?api_key=${encodeURIComponent(key)}`, 15000);
  wmataStationsCache=data.Stations||[];
  return wmataStationsCache;
}
async function collectRailRows(count){
  const key=loadUrl(CITY_CFG.lsWmataKey); if(!key) return [];
  try{
    const stations=await ensureWmataStations(key);
    const near=stations.map(s=>({s, mi:haversineMi(loc,{lat:s.Lat,lon:s.Lon})})).sort((a,b)=>a.mi-b.mi).slice(0,3);
    /* reduce/concat, not flatMap (Chrome 69). On an older television this threw
       and the split-flap board's Metrorail section rendered zero rows while every
       other section flipped normally — silent, because the caller returns []. */
    const codes=[...new Set(near.reduce(function(a,x){
      return a.concat([x.s.Code, x.s.StationTogether1, x.s.StationTogether2].filter(Boolean)); },[]))].join(",");
    if(!codes) return [];
    const data=await getJSON(`https://api.wmata.com/StationPrediction.svc/json/GetPrediction/${codes}?api_key=${encodeURIComponent(key)}`, 12000);
    const trains=(data.Trains||[]).filter(t=>t.Line && t.Line!=="--" && t.Min!=="---");
    return trains.slice(0,count).map(t=>{
      const min=t.Min==="BRD"?0 : t.Min==="ARR"?0 : parseInt(t.Min,10)||99;
      return { sortMin:min, etaMin:min, time: t.Min==="BRD"?"BRD":t.Min==="ARR"?"ARR":`${min} MIN`,
        dest:(t.DestinationName||"?").toUpperCase(), via:`${RAIL_NAMES[t.Line]||t.Line} LINE`,
        status:"LIVE", statusKind:"ok", color:RAIL_COLORS[t.Line]||"#888" };
    });
  }catch(e){ return []; }
}
/* WMATA Metrobus (Bethesda only) */
let wmataBusStopsCache=null;
async function collectBusRows(count){
  const key=loadUrl(CITY_CFG.lsWmataKey); if(!key) return [];
  try{
    if(!wmataBusStopsCache){
      const data=await getJSON(`https://api.wmata.com/Bus.svc/json/jStops?Lat=${loc.lat}&Lon=${loc.lon}&Radius=1000&api_key=${encodeURIComponent(key)}`, 12000);
      wmataBusStopsCache=(data.Stops||[]).map(s=>({StopID:s.StopID, Name:s.Name, Lat:s.Lat, Lon:s.Lon, Routes:s.Routes||[],
        mi:haversineMi(loc,{lat:s.Lat,lon:s.Lon})})).filter(s=>s.StopID && s.Routes.length).sort((a,b)=>a.mi-b.mi).slice(0,4);
    }
    const rows=[];
    for(const stop of wmataBusStopsCache){
      if(rows.length>=count) break;
      let pred={}; try{ pred=await getJSON(`https://api.wmata.com/NextBusService.svc/json/jPredictions?StopID=${stop.StopID}&api_key=${encodeURIComponent(key)}`, 10000); }catch(e){}
      (pred.Predictions||[]).slice(0,3).forEach(p=>{
        rows.push({ sortMin:p.Minutes<=0?0:p.Minutes, etaMin:p.Minutes<=0?0:p.Minutes,
          time:p.Minutes<=0?"NOW":`${p.Minutes} MIN`,
          dest:(p.DirectionText||"?").toUpperCase(), via:`ROUTE ${p.RouteID}`, status:"LIVE", statusKind:"ok", color:"#6aa9ff" });
      });
    }
    return rows;
  }catch(e){ return []; }
}

/* Planes overhead -- doesn't map to "departure time" as naturally as
   ground transit, so TIME shows altitude and VIA shows aircraft type. */
/* Aircraft feed. Defaults to adsb.lol, which is free and CORS-open but
   PROHIBITS COMMERCIAL USE. Set "tb.adsbUrl" to an adsb-worker.js deployment to
   switch to a commercially-usable feed (adsb.lol / adsb.fi) — those send no CORS
   headers of their own, so the Worker is required, not optional. */
/* An empty card that explains itself. A board with no aircraft feed is not
   broken, it is unconfigured, and the difference matters to someone who just
   paid for this. */
function showPlanesUnconfigured(){
  const box=document.querySelector("#planeList"); if(!box) return;
  if(box.dataset.unconfigured==="1") return;       // don't rebuild every tick
  box.dataset.unconfigured="1";
  box.innerHTML='<div class="empty">No aircraft feed configured.<br>'
    + '<span style="opacity:.75">Add one in \u2699 Settings \u2192 Aircraft feed. '
    + 'See AIRCRAFT-FEED.md \u2014 it takes a few minutes and runs on your own machine.</span></div>';
  const c=document.querySelector("#planeCount"); if(c) c.textContent="";
}
function adsbBase(){
  /* NO DEFAULT, on purpose. This used to fall back to adsb.lol, which is
     free and CORS-open and PROHIBITS COMMERCIAL USE — so a product that ships
     with it baked in is in breach the day it is sold, however the feature is
     priced. Giving the planes away inside a paid app does not make the use
     non-commercial; it is still the seller's product calling that feed.

     So the seller ships no aircraft feed at all. The operator of each board
     supplies their own URL, on their own machine, under whatever terms they
     agree with the provider — which takes the seller out of the licence chain
     entirely. adsb-proxy.py in this repo is a ready-made one; AIRCRAFT-FEED.md
     is the setup. Unset, the card says so and nothing is fetched. */
  try{ var u=(localStorage.getItem("tb.adsbUrl")||"").trim().replace(/\/+$/,"");
       if(u) return u+"/v2"; }catch(e){}
  return "";
}
/* Throws when no feed is configured, so the callers below fail into their
   existing error handling instead of fetching a relative URL off this site. */
function adsbRequire(){
  const b = adsbBase();
  if(!b) throw new Error("no aircraft feed configured (see AIRCRAFT-FEED.md)");
  return b;
}
async function collectPlaneRows(count){
  try{
    const data=await getJSON(`${adsbRequire()}/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/30`, 10000);
    const air=(data.ac||[]).filter(a=>a.alt_baro!=="ground" && typeof a.lat==="number")
      .map(a=>({a, mi:haversineMi(loc,{lat:a.lat,lon:a.lon})})).sort((x,y)=>x.mi-y.mi).slice(0,count);
    return air.map(({a})=>{
      const rate=a.baro_rate||0, alt=typeof a.alt_baro==="number"?a.alt_baro:null;
      const phase = alt==null?"EN ROUTE" : rate<-350?"DESCENDING" : rate>350?"CLIMBING" : alt>=28000?"CRUISING":"EN ROUTE";
      /* Sorted by distance, not time: an aircraft overhead is not departing
         from anywhere, so there is no countdown to show and etaMin stays null. */
      return { sortMin:Math.round(a.mi*10), etaMin:null, time: alt!=null?`${alt.toLocaleString()}FT`:"—",
        dest:(a.flight||a.r||"UNKNOWN").trim().toUpperCase(), via:(a.desc||a.t||"AIRCRAFT").toUpperCase(),
        status:phase, statusKind:"na", color:"#ffd166" };
    });
  }catch(e){ return []; }
}

/* Departures for the European cities, from the same adapter the boards use.
   One fetch serves every family card here: it is cached for a few seconds so
   six collect() calls in one render don't become six round trips. */
let _tousCache={t:0, rows:null, p:null};
async function collectTransitousAll(){
  if(!window.TBTransitous) return [];
  if(Date.now()-_tousCache.t < 20000 && _tousCache.rows) return _tousCache.rows;
  if(_tousCache.p) return _tousCache.p;
  _tousCache.p = (async()=>{
    try{
      const stops=await TBTransitous.cityBoard(loc.lat, loc.lon,
        {stops:4, perStop:14, source:CITY_CFG.transitSource, mainStation:CITY_CFG.mainStation});
      const all=[]; stops.forEach(st=>st.deps.forEach(d=>all.push(d)));
      /* Long-distance asked for separately, mode-filtered: at a big station the
         next departures are all trams and the ICEs never make the list. */
      try{
        const ld=await TBTransitous.longDistanceAt(CITY_CFG.mainStation, 8, CITY_CFG.transitSource);
        const seen=new Set(all.map(d=>d.route+"@"+d.when));
        ld.forEach(d=>{ if(!seen.has(d.route+"@"+d.when)) all.push(d); });
      }catch(e){}
      _tousCache={t:Date.now(), rows:all, p:null};
      return all;
    }catch(e){ _tousCache={t:Date.now(), rows:[], p:null}; return []; }
  })();
  return _tousCache.p;
}
const TOUS_COL={longdistance:"#e2504f", regional:"#3ad0c8", metro:"#4ea1ff",
                tram:"#f0ab00", bus:"#6aa9ff", ferry:"#5ad17a"};
async function collectTransitousRows(family, count){
  const all=await collectTransitousAll();
  return all.filter(d=>d.family===family)
    .sort((a,b)=>a.when-b.when)
    .slice(0,count)
    .map(d=>{
      const min=Math.max(0, Math.round((d.when-Date.now())/60000));
      return { sortMin:min, etaMin:min, time: min<=0? "NOW" : `${min} MIN`,
        /* The European style leads with a wall-clock departure and a platform,
           the way a Solari board does; the countdown suits the metro style. Both
           are carried so the renderer can pick, rather than the collector
           deciding which one this city is allowed to show. */
        clock: cityClock(d.when),
        platform: (d.platform||"").toUpperCase(),
        dest:(d.headsign||"?").toUpperCase(), via:(d.route||d.label||"").toUpperCase(),
        /* Only claim live where the feed says so — the Swiss trams are live, the
           Rhine boats are not, and both end up on this board. */
        /* Any real-time delay goes through the shared bands rather than the
           old on-time/late split, so a Zurich tram three minutes down and one
           twenty minutes down stop looking identical. */
        status: d.cancelled? "CANCELLED" : (d.realTime? (d.delayMin>0? `+${d.delayMin} MIN`:"ON TIME") : "SCHEDULED"),
        statusKind: d.cancelled? "bad"
          : (d.realTime? ((liveLateInfo(d.delayMin)||{}).cls || "ok") : "na"),
        color: TOUS_COL[family]||"#6aa9ff",
        /* The operator's own line colour, where their feed carries one, for the
           metro skin's bullet. Kept apart from `color`, which is the per-family
           tint the Solari style uses and is not a line colour at all. */
        lineColor: d.lineColor||null, lineTextColor: d.lineTextColor||null };
    });
}

/* True when the active skin has cut the board down to this one system. Sampling
   depth was chosen for a board sharing sixteen slots between six systems; the
   same depth on a subway-only platform sign fills six of its eight rows and
   leaves two dark. Asked at collect time, so the Solari board — which still
   shows every operator — keeps its original mix. */
function soloSystem(id){
  return !!(SKIN && SKIN.only && SKIN.only.length === 1 && SKIN.only[0] === id);
}

const SYSTEM_DEFS = SYSTEM_DEFS_BY_CITY[CITY];
async function collectAllRows(){
  /* A metro skin may declare the systems its real signage carries (`only`).
     Applied here rather than in the renderer so the other systems are never
     fetched or sorted in the first place — filtering after the ROW_COUNT cut
     below would let a bus departure take a slot and then vanish, leaving a
     platform sign with visible holes in it. */
  const permitted = (STYLE==="metro" && SKIN && SKIN.only) ? new Set(SKIN.only) : null;
  const active=SYSTEM_DEFS.filter(sys=>systemVisible(sys.id) && (!permitted || permitted.has(sys.id)));
  const results=await Promise.all(active.map(sys=>sys.collect()));
  const rows=[];
  active.forEach((sys,i)=>{ results[i].forEach(r=>{
    r.logo=sys.logo;
    r.logoImg = sys.logoImgFn ? sys.logoImgFn(r) : LOGO_URLS[sys.id];
    rows.push(r);
  }); });
  rows.sort((a,b)=>a.sortMin-b.sortMin);
  /* The row-based styles have a fixed number of slots, so trimming to the
     soonest ROW_COUNT is exactly right for them. The grouped SEPTA board is not
     a slot list — it panels BY LINE and trims within each line itself — so the
     same cut silently starved it: sixteen slots shared with the subway, buses,
     PATCO, Amtrak and planes left only the soonest handful of rail departures,
     and five of the thirteen lines never reached the renderer. Verified against
     the bundled schedule: all 13 lines have departures at every hour tested,
     including the midday one where the board was showing 8. */
  if(STYLE==="septa") return rows;
  /* A countdown board is spent on whatever it shows, and the bundled schedules
     are minute-resolution: around Penn Station six lines genuinely leave inside
     the same minute, so the soonest eight were six rows of NOW and two of the
     next minute. Every one of them true, and together they say nothing — a
     rider learns what is leaving in the next quarter hour from a board that
     spends its rows on distinct times.

     So the surplus simultaneous departures are DEMOTED, never dropped or
     restated: at most two share a minute up front, the rest fall behind them
     and are trimmed by the row count like anything else. Same real departures,
     a selection that carries more. Only the countdown styles do this; a
     departure hall listing everything leaving at 14:05 is correct. */
  const spread = STYLE==="metro" ? demoteSimultaneous(rows, 2) : rows;
  return spread.slice(0, ROW_COUNT).sort((a,b)=>a.sortMin-b.sortMin);
}
function demoteSimultaneous(rows, maxPerMinute){
  const seen={}, front=[], back=[];
  rows.forEach(r=>{
    const k = r.etaMin==null ? "?" : r.etaMin;
    seen[k] = (seen[k]||0) + 1;
    (seen[k] <= maxPerMinute ? front : back).push(r);
  });
  return front.concat(back);
}

/* ===== flip-click sound (synthesized, no audio file needed) =====
   A short filtered-noise burst approximates the mechanical "clack" of a
   real split-flap card turning. Reuses one pre-built noise buffer for every
   click rather than building a new one per flip (many cells can flip within
   the same ~100ms window, especially on a full board refresh). Browsers
   block audio until a user gesture happens at least once -- ensureAudio()
   just quietly no-ops until then, same as any other autoplay-blocked page. */
const LS_SOUND="flipboard.sound";
let soundOn = localStorage.getItem(LS_SOUND) !== "off";
let audioCtx=null, clickBuffer=null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    const dur=audioCtx.sampleRate*0.03;
    clickBuffer=audioCtx.createBuffer(1, dur, audioCtx.sampleRate);
    const data=clickBuffer.getChannelData(0);
    for(let i=0;i<dur;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/dur, 3);
  }
  if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playFlipClick(){
  if(!soundOn) return;
  const ctx=ensureAudio(); if(!ctx || !clickBuffer) return;
  const now=ctx.currentTime;
  const src=ctx.createBufferSource(); src.buffer=clickBuffer;
  const filter=ctx.createBiquadFilter(); filter.type="bandpass"; filter.frequency.value=2000+Math.random()*600; filter.Q.value=1.1;
  const gain=ctx.createGain(); gain.gain.setValueAtTime(0.09, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.03);
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start(now); src.stop(now+0.035);
}
document.addEventListener("pointerdown", ()=>ensureAudio(), {once:true});

/* ===== split-flap rendering engine ===== */
const CHARS=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:'&-/,";
function randChar(){ return CHARS[Math.floor(Math.random()*CHARS.length)]; }

/* Make a destination fit its column without slicing through a word.
   A hard .slice() turned SOUTH TO FRIENDSHIP into "SOUTH TO FRIENDS" and
   NORTH TO ROCKVILLE into "NORTH TO ROCKVIL" — the reader cannot tell a cut
   word from a real one, which is worse than showing less. In order: use it
   whole; drop a leading direction word that the line already implies; drop
   interior vowels from the longest word, the way transit signage does
   (FRIENDSHIP -> FRNDSHP); and only then cut, at a word boundary. */
function fitText(str, width){
  let t=(str||"").toUpperCase().replace(/\s+/g," ").trim();
  if(t.length<=width) return t;

  const lead=t.match(/^(NORTH|SOUTH|EAST|WEST|NORTHBOUND|SOUTHBOUND|INBOUND|OUTBOUND)\s+TO\s+/);
  if(lead && (t=t.slice(lead[0].length)).length<=width) return t;

  const squeeze=w => w.length<5 ? w : w[0]+w.slice(1,-1).replace(/[AEIOU]/g,"")+w.slice(-1);
  let words=t.split(" ");
  while(t.length>width){
    let longest=0;
    for(let i=1;i<words.length;i++) if(words[i].length>words[longest].length) longest=i;
    const shorter=squeeze(words[longest]);
    if(shorter===words[longest]) break;          // nothing left to squeeze
    words[longest]=shorter; t=words.join(" ");
  }
  if(t.length<=width) return t;

  // still too long: cut whole words off the end rather than mid-word
  while(words.length>1 && words.join(" ").length>width) words.pop();
  t=words.join(" ");
  return t.length<=width ? t : t.slice(0,width);
}

class FlapField{
  constructor(container, width, align){
    this.width=width; this.cells=[];
    container.className="flap-field "+(align||"left");
    for(let i=0;i<width;i++){
      const flap=document.createElement("span"); flap.className="flap";
      const ch=document.createElement("span"); ch.className="ch"; ch.textContent=" ";
      flap.appendChild(ch); container.appendChild(flap);
      this.cells.push({flap, ch, current:" ", gen:0});
    }
  }
  setText(str){
    const padded=fitText(str, this.width).padEnd(this.width," ");
    for(let i=0;i<this.width;i++){
      const target=padded[i], cell=this.cells[i];
      cell.flap.classList.toggle("blank", target===" ");
      if(cell.current===target) continue;
      this._flip(cell, target, i*14);
    }
  }
  /* A flip is a chain of timers ~400ms long across a field, and the board can be
     asked to repaint sooner than that — a 20s tick landing on a resize, or
     measureAndRefit() rebuilding the rows underneath it. Two chains on one cell
     used to interleave their writes, which is where the mixed-up destinations
     ("GLENMONTNGER") came from.

     `gen` settles it: starting a flip invalidates every earlier chain on that
     cell, and a superseded chain drops out instead of finishing into a cell that
     has moved on. `current` is claimed HERE rather than at the end of the chain,
     because a repaint arriving mid-flip compared against the old value and took
     the `continue` above — so a value that changed and changed back within one
     animation never repainted, and the board sat there showing the wrong
     destination indefinitely with no way to correct itself. */
  _flip(cell, target, delay){
    const gen = ++cell.gen;
    cell.current = target;
    const steps=[randChar(), target];
    let i=0;
    const runStep=()=>{
      if(cell.gen !== gen) return;
      const c=steps[i];
      cell.flap.classList.remove("flipping"); void cell.flap.offsetWidth;
      cell.flap.classList.add("flipping");
      playFlipClick();
      setTimeout(()=>{ if(cell.gen === gen) cell.ch.textContent=c; }, 55);
      i++;
      if(i<steps.length) setTimeout(runStep, 90);
    };
    setTimeout(runStep, delay);
  }
}

/* A departure hall board is a long list; a platform display is a handful of

/* The time column is sized from the flaps it has to hold, not guessed. It was a
   flat 52px against seven 28px flaps — 208px of content in 52px of column, with
   overflow:hidden — so the one column a departure board exists for showed about
   two characters: "12:02A" read as "12", "1 MIN" as "1", "BRD" as "BR". Wrong at
   every size setting too, since the flaps scale with --flap-w and 52px did not.
   Six 2px gaps between seven flaps, hence the +12. */
/* ---------- board styles ----------------------------------------------------
   A Solari board in Zurich, an Amtrak board at Penn Station and a subway
   platform display look nothing alike, and the last one is not a departure
   board at all — which mattered here, because most of what these boards show is
   metro and bus being rendered as though it were intercity rail.

     euro   Solari. 24-hour departure time, destination, and the PLATFORM as the
            column that carries the row — which is what you actually walk up to
            a European board to read. Delay shown against the time.
     usa    Amtrak. Clock time and a STATUS word doing the work: ON TIME,
            BOARDING, DELAYED. Track where a feed gives one.
     metro  Not split-flap. A platform countdown: line bullet, destination, and
            big minutes. Fewer rows, larger type, meant to be read at a glance
            from further away.

   Platform only exists on the transitous feeds, which is the European cities —
   the WMATA, Amtrak and bundled-GTFS collectors have no track field to give. So
   the column populates exactly where the style that wants it is the default,
   and shows a dash elsewhere rather than pretending. */
/* ---------- metro: one skin per city ----------------------------------------
   A generic amber panel everywhere is the same mistake as one departure board
   for twelve cities, a level down. WMATA's sign, a SEPTA sign and a GVB sign
   are different objects, and the line mark is the whole identity — so it is
   drawn in each operator's idiom rather than spelled out.

   No skin is ever shared between cities. `bullet` picks the shape: `code` for a
   tinted two-letter block (WMATA), `tab` for a rounded lozenge, `disc` for a
   circle. `lines` maps the route text a feed gives us to that operator's real
   colour; anything unmatched falls back to the skin's own ink, so an unexpected
   route shows plainly instead of vanishing.

   `only` names the systems the operator's real signage carries, and is what
   makes nyc a platform sign rather than a departure hall.

   NYC's two OTHER displays — the cyan countdown clock and the OUTFRONT vertical
   next-train panel — are genuinely different layouts rather than skins, so they
   live in station.html and not here. */
/* The MIN column, which is the column a platform sign exists for. Reads etaMin
   — never sortMin — and falls back to whatever clock time the collector printed
   when the eta is genuinely unknown, because "1:36P" is at least true where a
   made-up countdown would not be. Over an hour out it stays a clock time: no
   real sign counts down from 94. */
function metroMins(r){
  const m = r.etaMin;
  if(m == null || m > 60) return r.time;
  return m <= 0 ? "NOW" : m + " MIN";
}

/* Which ink reads on a bullet of a given colour. This was "does the hex start
   with f, e or d" — a test that calls MTA's #EE352E light and prints the 1/2/3
   discs in black, where every one in the system is white on red. Relative
   luminance (WCAG) still gets the yellow N/Q/R/W right, which is the case the
   original test existed for. */
function inkOn(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||""));
  if(!m) return "#fff";
  const n = parseInt(m[1],16);
  const lin = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const L = 0.2126*lin((n>>16)&255) + 0.7152*lin((n>>8)&255) + 0.0722*lin(n&255);
  return L > 0.42 ? "#111" : "#fff";
}

/* ---------- SEPTA Regional Rail, the Center City LED matrix ------------------
   Modelled on the board at Suburban/Jefferson: departures GROUPED INTO PANELS
   BY LINE, each with its own header, divided by red rules — not one merged
   time-sorted list, which is what every other style here renders. Green
   destinations and ON TIME, cyan times, white headers, on black.

   Regional Rail only. The same feed also carries the Broad Street Line, PATCO
   and buses, and none of those appear on a Regional Rail board. */
const SEPTA_LINES = {
  AIR:"Airport Line",            CHE:"Chestnut Hill East Line",
  CHW:"Chestnut Hill West Line", CYN:"Cynwyd Line",
  FOX:"Fox Chase Line",          LAN:"Lansdale/Doylestown Line",
  MED:"Media/Wawa Line",         NOR:"Manayunk/Norristown Line",
  PAO:"Paoli/Thorndale Line",    TRE:"Trenton Line",
  WAR:"Warminster Line",         WIL:"Wilmington/Newark Line",
  WTR:"West Trenton Line",
};
function septaGroups(rows){
  const by = {};
  (rows||[]).forEach(r => {
    const code = (r.via||"").toUpperCase();
    if (!SEPTA_LINES[code]) return;            // drops BSL, PATCO and buses
    (by[code] = by[code] || []).push(r);
  });
  /* Soonest line first, so the next thing to leave leads the board. */
  return Object.keys(by)
    .map(code => ({ code, name: SEPTA_LINES[code],
                    rows: by[code].sort((a,b)=>a.sortMin-b.sortMin).slice(0,4) }))
    .sort((a,b) => a.rows[0].sortMin - b.rows[0].sortMin);
}
/* Live running, from SEPTA's own TrainView via the optional worker.

   Deliberately reported PER LINE, not per departure. TrainView describes trains
   already moving — number, destination, next stop, minutes late — while the
   panel rows are scheduled departures from the bundled timetable, and there is
   no train number on the scheduled side to join them on. Stamping a line's
   delay onto a specific scheduled departure would be inventing a claim about a
   train we have not actually matched: it might well be the punctual one. So the
   delay is stated where it is true — of the line — and the rows stay scheduled.

   No worker configured, or the fetch fails: the board is exactly as before. */
let septaLive = { at:0, byLine:{} };
async function refreshSeptaLive(){
  /* This page has no `state` object — that is a city-board global — so read the
     worker URL from the same localStorage key the Philadelphia board saves it
     to. Referencing an undeclared binding threw inside tick() and took the
     whole board down with it. */
  let base = "";
  try { base = localStorage.getItem("transitboardphl.septaUrl") || ""; } catch(e){}
  if(!base && window.TB_CONFIG && TB_CONFIG.septaUrl) base = TB_CONFIG.septaUrl;
  if(!base) return;
  try{
    const list = await getJSON(base.replace(/\/+$/,"") + "/trainview", 12000);
    const by = {};
    (Array.isArray(list)?list:[]).forEach(t=>{
      const name = String(t.line||"").trim();
      if(!name) return;
      const late = Number(t.late);
      const g = by[name] = by[name] || { n:0, late:0, worst:0 };
      g.n++;
      /* SEPTA reports phantom sentinel lateness (998/999) on stale vehicles —
         the same guard the city boards already use for this feed. */
      if(isFinite(late) && late>0 && late<200){ g.late++; g.worst=Math.max(g.worst, late); }
    });
    septaLive = { at:Date.now(), byLine:by };
  }catch(e){ /* leave the last good reading; the board stays scheduled */ }
}
function liveFor(lineName){
  const key = lineName.replace(/\s+Line$/,"");
  const g = septaLive.byLine[key] || septaLive.byLine[lineName];
  if(!g || !g.n) return null;
  return g.worst>0 ? { cls:"warn", text:`${g.n} running · up to +${g.worst} min` }
                   : { cls:"ok",   text:`${g.n} running · on time` };
}

/* The message the real board crawls, plus anything the live feed makes worth

function renderSeptaTicker(){
  const t = $("#septaTicker"); if(!t) return;
  const bits = ["For schedule and travel information go to SEPTA.org"];
  const worst = Object.entries(septaLive.byLine||{})
    .filter(([,g]) => g.worst >= 10)
    .sort((a,b) => b[1].worst - a[1].worst)[0];
  if(worst) bits.push(`${worst[0]} Line delays of up to ${worst[1].worst} minutes`);
  const msg = bits.join("   •   ");
  t.querySelectorAll(".sp-tick-in span").forEach(el => { el.textContent = msg; });
}

/* SEPTA's own signs do not print the full GTFS headsign: the bundle says
   "Center City Philadelphia" where the board says CENTER CITY, and the column is
   sized for the latter. Left alone, 16 of 39 destinations ellipsised mid-word
   ("CENTER CITY PHILADE…"), which is the one field a rider is reading. Only
   names the bundle actually produces are listed; anything else keeps its own
   wording minus a trailing "STATION". */
const SEPTA_DEST = {
  "CENTER CITY PHILADELPHIA": "CENTER CITY",
  "AIRPORT TERMINALS E & F":  "AIRPORT TERM E-F",
  "NORRISTOWN ELM STREET":    "NORRISTOWN ELM ST",
  "GRAY 30TH ST STATION":     "30TH ST",
};
function septaDest(d){
  const k = String(d||"").toUpperCase().trim();
  return SEPTA_DEST[k] || k.replace(/\s+STATION$/, "");
