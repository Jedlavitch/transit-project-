<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Departure Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* Split-flap look keeps its own black palette, blue-tinted to match the
     shared theme (typeface + accents come from theme.css conventions). */
  :root{
    --bg:#000; --panel:#0b101e; --line:#1f2942; --text:#e8edf8; --muted:#8a94ad;
    --flap-bg:#141b2c; --flap-bg2:#0d1322; --flap-text:#f1f5ff; --seam:rgba(0,0,0,.65);
    --accent:#6ab0ff; --good:#5ad17a; --warn:#ffcc33; --late:#ff5a5a;
    /* board size -- overridden by [data-size="sm"|"lg"] below, set from Settings.
       Bumped noticeably bigger across the board (was 22/32/17) plus a clearer,
       wider-set font (IBM Plex Mono) for easier reading at a glance. */
    --flap-w:28px; --flap-h:40px; --flap-font:22px; --row-gap:.6vh;
  }
  :root[data-size="sm"]{ --flap-w:19px; --flap-h:27px; --flap-font:15px; --row-gap:.3vh; }
  :root[data-size="lg"]{ --flap-w:36px; --flap-h:52px; --flap-font:30px; --row-gap:1vh; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    display:flex; flex-direction:column; height:100dvh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:2vmin 3vw;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  header .title{font-size:clamp(1rem,2.2vw,1.6rem); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink)}
  header .title small{display:block; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--muted); text-transform:none; margin-top:2px}
  header .clock{margin-left:auto; font-size:clamp(1rem,2vw,1.5rem); font-variant-numeric:tabular-nums; color:var(--muted)}
  header a, header button{
    color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line);
    border-radius:8px; padding:.5em .8em; background:none; cursor:pointer; font-family:inherit;
  }
  header a:hover, header button:hover{color:var(--accent-ink); border-color:var(--accent)}

  #status{padding:1vmin 3vw; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); flex-shrink:0; display:flex; gap:1.5em}

  main{flex:1; min-height:0; overflow:hidden; padding:1.4vmin 3vw; display:flex; flex-direction:column}
  .board-head{
    display:grid; grid-template-columns:var(--cols); gap:1.4vw; padding:0 .3vw 1vmin;
    font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted); flex-shrink:0;
  }
  .board-rows{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-start; gap:var(--row-gap); overflow:hidden}
  .board-row{
    display:grid; grid-template-columns:var(--cols); gap:1.2vw; align-items:center;
    padding:.4vh .3vw; border-bottom:1px solid rgba(255,255,255,.03);
  }
  .op-logo{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    font:800 clamp(9px,.85vw,12px)/1 "IBM Plex Mono","Courier New",monospace; letter-spacing:.02em;
    padding:.4em .5em; border-radius:4px; color:#0a0e08; white-space:nowrap;
  }
  /* Real operator logo, on its own light chip so brand colors/black marks
     (WMATA's logo is solid black) stay legible regardless of the row's own
     accent color or the page's dark theme. */
  /* Operator marks come in wildly different shapes: WMATA's is taller than it is
     wide (250x307), Amtrak's is a long wordmark at 250x27 — nine times wider
     than tall. Pinning HEIGHT and letting width follow made Amtrak 215px wide in
     an 88px column, straight across the VIA column next to it. The img's own
     max-width could never help: it resolves against this box, and an inline-flex
     box with no width bound just grows to fit its content.
     So the BOX is bounded by the column, and the image is capped in BOTH axes
     and left to scale itself down — a wide wordmark ends up short rather than
     wide, which is the shape it has to be to fit. */
  .op-logo-img{
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:1; min-width:0; max-width:100%;
    background:#fff; border-radius:5px; padding:4px 7px; height:calc(var(--flap-h) * .78);
  }
  .op-logo-img img{
    display:block; width:auto; height:auto;
    max-width:100%; max-height:100%; object-fit:contain;
  }
  .flap-field{display:flex; gap:2px; flex-wrap:nowrap; overflow:hidden}
  .flap-field.left{justify-content:flex-start}
  .flap-field.right{justify-content:flex-end}

  .flap{
    position:relative; flex-shrink:0; width:var(--flap-w); height:var(--flap-h);
    background:linear-gradient(180deg,var(--flap-bg),var(--flap-bg2));
    border-radius:2px; overflow:hidden;
    box-shadow:inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,.05);
  }
  /* A position holding no character is a dark gap, not a lit empty box. Fields
     are fixed-width, so a third of every board (225 of 672 cells, measured) was
     blank tiles — and giving them the same panel treatment as a real character
     made emptiness the loudest texture on the screen. A real Solari board's
     unused flaps read as black. The element stays in place, so the flap still
     animates when a character arrives. */
  .flap.blank{ background:none; box-shadow:none; }
  .flap.blank::after{ display:none }
  .flap::after{
    content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--seam); transform:translateY(-.5px); z-index:2;
  }
  .flap .ch{
    display:flex; align-items:center; justify-content:center; width:100%; height:100%;
    font:700 var(--flap-font)/1 "IBM Plex Mono","Courier New",monospace; color:var(--flap-text);
    letter-spacing:.01em; transform-origin:center; backface-visibility:hidden;
  }
  .flap.flipping .ch{ animation:flapTurn .11s linear }
  @keyframes flapTurn{
    0%{ transform:rotateX(0deg) }
    50%{ transform:rotateX(-90deg) }
    100%{ transform:rotateX(0deg) }
  }
  /* ---- style: euro — a Deutsche Bahn panel -----------------------------
     Modelled on a real DB board: white on blue, not flaps on black. Split-flap
     is the wrong object for a modern European station — those boards are LCD,
     and the flap texture was fighting the thing it was imitating. The American
     style keeps its flaps, which is right: Penn Station's really are Solari.
     Destination is the largest element on the row, the train number sits in a
     pale chip, and the via-stops are deliberately secondary. */
  :root[data-style="euro"]{ --db-blue:#0a7bc8; --db-blue2:#0968aa; --db-chip:#e8f1f8; }
  :root[data-style="euro"] .board-row{
    background:linear-gradient(180deg,var(--db-blue),var(--db-blue2));
    align-items:center; border-radius:2px; padding:0 10px;
  }
  /* Real boards are built from two-row physical panels, so the pairs sit
     together with a gap between them. */
  :root[data-style="euro"] .board-row:nth-child(odd){ margin-top:6px }
  :root[data-style="euro"] .board-row.empty{ background:none }

  /* place the shared row children into DB's reading order */
  /* grid-row:1 on every child matters. Grid auto-placement only ever moves
     forward, so assigning child 2 to column 4 and then child 3 to column 2 sent
     child 3 to a SECOND row — which is why time, chip, destination and platform
     each sat at a different height in a tall block. Pinning the row keeps one
     line regardless of the column order. */
  :root[data-style="euro"] .board-row > *{ grid-row:1 }
  :root[data-style="euro"] .board-row > *:nth-child(1){ grid-column:1 }  /* time   */
  :root[data-style="euro"] .board-row > *:nth-child(2){ grid-column:3 }  /* ziel   */
  :root[data-style="euro"] .board-row > *:nth-child(3){ grid-column:2 }  /* train  */
  :root[data-style="euro"] .board-row > *:nth-child(4){ grid-column:5 }  /* hinweis*/
  :root[data-style="euro"] .board-row > *:nth-child(5){ grid-column:4 }  /* gleis  */

  /* no flap furniture: plain white text on the panel */
  /* width:auto collapses a blank cell to nothing, so ZÜRICH FLUGHAFEN lost its
     space and read as one word. A blank keeps a space's worth of width. */
  :root[data-style="euro"] .flap{ background:none; box-shadow:none; border-radius:0; width:auto }
  :root[data-style="euro"] .flap.blank{ width:.34em }
  :root[data-style="euro"] .flap::after{ display:none }
  :root[data-style="euro"] .flap-field{ gap:0 }
  :root[data-style="euro"] .flap .ch{
    color:#fff; font:600 calc(var(--flap-font) * .82)/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    letter-spacing:.01em;
  }
  /* Ziel is the row's headline */
  :root[data-style="euro"] .board-row > *:nth-child(2) .ch{
    font-weight:700; font-size:calc(var(--flap-font) * 1.12);
  }
  /* The note column: small, and only ever occupied by an exception. */
  :root[data-style="euro"] .board-row > *:nth-child(4) .ch{
    font-size:calc(var(--flap-font) * .58); opacity:.95; font-weight:700;
  }
  :root[data-style="euro"] .board-row.late  > *:nth-child(4) .ch{ color:#ffd34d }
  :root[data-style="euro"] .board-row.gone  > *:nth-child(4) .ch{ color:#ff8a8a }
  :root[data-style="euro"] .board-row.gone  > *:nth-child(2) .ch{ text-decoration:line-through; opacity:.75 }
  /* the train-number chip, in place of the operator logo */
  :root[data-style="euro"] .op-logo-img{ display:none !important }
  :root[data-style="euro"] .op-logo{
    display:inline-block !important; background:var(--db-chip) !important; color:#123a5c;
    font:700 calc(var(--flap-font) * .62)/1.7 "IBM Plex Mono",monospace;
    border-radius:2px; padding:.1em .5em; letter-spacing:.02em; white-space:nowrap;
  }
  :root[data-style="euro"] .status-tag.platform{
    font:700 calc(var(--flap-font) * 1.25)/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    color:#fff; background:none; border:none; letter-spacing:0;
    width:100%; text-align:right;
  }
  /* header band + page: the dark navy strip over blue panels */
  body.euro-skin .board-head{
    background:#0d1b2a; color:#cfe4f5; border-radius:2px; padding:4px 10px;
  }
  body.euro-skin .board-head i{ font-style:italic; opacity:.75; font-weight:500 }
  /* ---- style: metro (platform countdown) ----
     Not a split-flap at all: a dot-matrix panel. Bigger type, fewer rows, and
     the minutes doing the shouting. */
  :root[data-style="metro"]{ --flap-h:calc(var(--flap-h) * 1.25) }
  :root[data-style="metro"] .flap{ background:none; box-shadow:none; border-radius:0 }
  :root[data-style="metro"] .flap::after{ display:none }
  :root[data-style="metro"] .flap .ch{
    color:var(--metro-ink,#ffb02e);
    font:700 calc(var(--flap-font) * 1.15)/1 "IBM Plex Mono",monospace;
    text-shadow:0 0 6px color-mix(in srgb, var(--metro-ink,#ffb02e) 45%, transparent);
  }
  /* The countdown is a plain element next to fields of taller flaps, so it has
     to be centred against them explicitly or it sits half a row low. */
  :root[data-style="metro"] .board-row{
    border-bottom:1px solid rgba(255,255,255,.05); align-items:center;
  }
  :root[data-style="metro"] .board-row > *{ display:flex; align-items:center }
  :root[data-style="metro"] .op-logo-img, :root[data-style="metro"] .op-logo{ display:none !important }
  :root[data-style="metro"] .status-tag.countdown{
    font:800 calc(var(--flap-font) * 1.7)/1 "IBM Plex Mono",monospace;
    color:var(--metro-ink,#ffb02e); background:none; border:none; letter-spacing:0;
    width:100%; text-align:right;
    text-shadow:0 0 8px color-mix(in srgb, var(--metro-ink,#ffb02e) 45%, transparent);
  }
  .board-row.empty{ opacity:0 }
  .status-tag{font-size:11px; font-weight:800; letter-spacing:.06em; padding:.2em .5em; border-radius:4px; white-space:nowrap}
  .status-tag.ok{background:rgba(90,209,122,.15); color:var(--good-ink)}
  .status-tag.warn{background:rgba(255,204,51,.15); color:var(--warn-ink)}
  .status-tag.late{background:rgba(255,90,90,.15); color:var(--late-ink)}
  .status-tag.na{color:var(--muted); border:1px solid var(--line)}
  .status-tag.bad{background:rgba(255,90,90,.2); color:var(--late-ink)}
  /* The four shared delay bands (delays.js + theme.css), tinted to sit on the
     split-flap's dark plates. The severe band keeps the solid plate it has on
     the boards -- on a wall display that is the whole point of it. */
  .status-tag.dly-ok{background:rgba(51,209,122,.15); color:var(--delay-ok)}
  .status-tag.dly-min{background:rgba(255,204,51,.15); color:var(--delay-min)}
  .status-tag.dly-mid{background:rgba(255,138,117,.15); color:var(--delay-mid)}
  .status-tag.dly-max{background:var(--delay-max-bg); color:var(--delay-max-ink)}

  footer{padding:1.2vmin 3vw; border-top:1px solid var(--line); font-size:11px; color:var(--muted); flex-shrink:0; display:flex; gap:1.5em}
  #fsHint{position:fixed; top:0; left:50%; transform:translate(-50%,-120%); z-index:80;
    background:#0b101e; color:var(--text); border:1px solid var(--line); border-radius:0 0 10px 10px;
    padding:10px 18px; font-size:13px; max-width:90vw; text-align:center; transition:transform .35s ease}
  #fsHint.show{transform:translate(-50%,0)}

  /* ---- settings panel ---- */
  #settings{position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:90; padding:20px}
  #settings.show{display:flex}
  #settings .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px; max-width:480px; width:100%; max-height:88vh; overflow:auto}
  #settings h3{margin:0 0 4px; font-size:19px; color:var(--accent-ink)}
  #settings .lbl{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; margin:18px 0 9px}
  #settings .seg{display:flex; gap:8px}
  #settings .seg button{flex:1; padding:11px 6px; border-radius:10px; border:1px solid var(--line);
    background:#10182b; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit}
  #settings .seg button.active{border-color:var(--accent); color:var(--accent-ink); background:rgba(106,176,255,.08)}
  #settings .sys-grid{display:flex; flex-wrap:wrap; gap:8px}
  #settings .sys-toggle{flex:1; min-width:130px; display:flex; align-items:center; gap:8px; padding:9px 11px;
    border-radius:10px; border:1px solid var(--line); background:#10182b; font-size:13px; cursor:pointer}
  #settings .sys-toggle input{margin:0; cursor:pointer}
  #settings .done{margin-top:22px; width:100%; padding:12px; border-radius:10px; border:none;
    background:var(--accent); color:#071528; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit}

  /* ============ blue depth pass (shared design language) ============
     Deep-navy floors + bright-blue highlights, same tokens as the city boards.
     Deliberately avoids .flap/.cell so the split-flap animation is untouched. */
  body{background:
      radial-gradient(900px 600px at 108% 14%, rgba(78,161,255,.12) 0%, transparent 55%),
      radial-gradient(1300px 850px at 50% 122%, var(--blue-deep,#0a1a3d) 0%, transparent 62%),
      var(--bg)}
  header{background:linear-gradient(180deg, var(--blue-deep,#0a1a3d), transparent)}
  header .title{background:linear-gradient(90deg,var(--accent),#3ad0c8 55%,#b58cff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  :root[data-theme="day"] header .title{filter:brightness(.7) saturate(1.2)}
  .op-logo{box-shadow:0 0 0 1px rgba(124,192,255,.25)}
</style>
<script>/* Self-heal stale pages. The Spotter PWA's first service worker was scoped to
   the whole site and cached every board, so a device that installed it keeps serving
   old copies no matter how many times the site is redeployed - which looks exactly
   like "GitHub isn't deploying". Drop that old cache, force any worker to re-check
   for a new version, and never let a worker own these pages again. */
(function(){try{
  if(window.caches && caches.keys) caches.keys().then(function(ks){
    ks.forEach(function(k){ if(k!=="spotter-v2") caches.delete(k); });
  });
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){
        // a worker whose scope covers this page must not be caching boards
        if(r.scope && location.href.indexOf(r.scope)===0 && !/spot\.html$/.test(location.pathname)) r.update();
      });
    });
}catch(e){}})();</script>
</head>

         up front so a script error can never bounce you to the DC board. -->
    <a id="boardBtn" href="dc.html" title="Back to the board" onclick="window.location.href=this.href; return false;">‹ board</a>
    <script>(function(){try{var m={dc:"dc.html",philly:"philadelphia.html",nj:"newjersey.html",
      nyc:"nyc.html",boston:"boston.html",amsterdam:"amsterdam.html",la:"losangeles.html",
      sf:"sanfrancisco.html",zurich:"zurich.html",cologne:"cologne.html",stuttgart:"stuttgart.html"};
      var c=new URLSearchParams(location.search).get("city"), a=document.getElementById("boardBtn");
      if(a && m[c]) a.setAttribute("href", m[c]);}catch(e){}})();</script>
  </header>

   one opened it comes in via ?city=dc|philly|nyc so it can reuse that
   board's own saved location / WMATA key / live-Worker URLs / "show on
   board" toggles -- nothing to set up twice. */

  },

    lsLoc:"transitboardnj.loc", board:"newjersey.html", cityLabel:"New Jersey",
    lsWmataKey:null, lsHidden:"transitboardnj.hiddenCards",
  },
  philly: {

    lsLoc:"transitboardphl.loc", board:"philadelphia.html", cityLabel:"Philadelphia",
    lsWmataKey:null, lsHidden:"transitboardphl.hiddenCards",

    lsLoc:"transitboardnyc.loc", board:"nyc.html", cityLabel:"New York",

  boston: {

/* Bundled timetables ship pattern-deduplicated ("v":2): stop sequences and
   running-time profiles are each stored once and referenced by index, because
   these files are dominated by repetition (the NYC subway's 18,481 trips share
   just 121 stop sequences). Expand back to the plain
   {line,hs,s,st:[[stop,min],...]} shape on load so everything downstream --
   interpolation, departure lists, route lines -- stays exactly as it was. */
function expandBundle(s){
  if(!s || s.v!==2 || !Array.isArray(s.pats)) return s;
  const pats=s.pats, offs=s.offs||[];
  s.trips=(s.trips||[]).map(t=>{
    const ids=pats[t.p]||[], off=offs[t.o]||[], base=t.t||0;
    return { line:t.l, hs:t.h, s:t.s, st:ids.map((sid,i)=>[sid, base + (off[i]||0)]) };
  });
  delete s.pats; delete s.offs;
  return s;
}

  try{ return new Set(JSON.parse(localStorage.getItem(CITY_CFG.lsHidden)||"[]")); }catch(e){ return new Set(); }

async function getJSON(url, timeout=12000){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), timeout);
  try{ const r=await fetch(url, {signal:ctrl.signal}); if(!r.ok) throw new Error("http "+r.status); return expandBundle(await r.json()); }
  finally{ clearTimeout(t); }
}
function haversineMi(a,b){
  const R=3958.8, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const x=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function clockOf(min){
  let h=Math.floor(min/60)%24, m=Math.round(min%60), ap=h>=12?"P":"A";
  return `${((h+11)%12)+1}:${String(m).padStart(2,"0")}${ap}`;
}
function clock24Of(min){ return `${String(Math.floor(min/60)%24).padStart(2,"0")}:${String(Math.round(min%60)).padStart(2,"0")}`; }
function ymd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
// "Now" for schedule math: minutes-since-midnight + GTFS date parts, computed
// in the bundle's own timezone when it declares one (s.tz, e.g.
// "Europe/Amsterdam"), else the viewer's local clock (all US bundles --
// unchanged behavior). Without this, a European board viewed from the US
// would show every scheduled departure hours off.
function schedNowParts(tz){
  const d=new Date();
  if(!tz) return { y:ymd(d), dow:(d.getDay()+6)%7, min:d.getHours()*60+d.getMinutes() };
  const p={};
  new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short"}).formatToParts(d)
    .forEach(x=>{ if(x.type!=="literal") p[x.type]=x.value; });
  const dow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[p.weekday];
  return { y:p.year+p.month+p.day, dow, min:(parseInt(p.hour,10)%24)*60+parseInt(p.minute,10) };
}
function activeServices(s, parts){
  const {y,dow}=parts;
  const act=new Set();
  for(const id in s.svc){ const v=s.svc[id]; if(y>=v.start && y<=v.end && v.dow[dow]) act.add(id); }
  const ex=s.exc[y]; if(ex){ (ex.rem||[]).forEach(x=>act.delete(x)); (ex.add||[]).forEach(x=>act.add(x)); }
  /* Bundled calendars EXPIRE. Agencies publish only a few weeks ahead, and
     when the last date passes this set comes back empty and the card goes
     silently blank -- no error, just no trains (how LA Metro Rail vanished).
     refresh-schedules.py + the schedule-refresh workflow keep the bundles
     current; this is the last resort if that ever stops running: fall back
     to the same weekday from the calendar we do have. Times drift from
     reality as the bundle ages, so the boards label it "stale schedule"
     rather than passing it off as current. */
  if(!act.size){
    for(const id in s.svc){ const v=s.svc[id]; if(v.dow[dow]) act.add(id); }
    if(act.size) s._stale=true;
  }
  return act;
}

/* ===== row collectors -- each returns an array of {sortMin, time, dest, via, status, statusKind, color} ===== */

/* Generic bundled-schedule collector: MARC, Ride On, SEPTA Rail, SEPTA
   Subway, SEPTA Bus (schedule fallback), PATCO all share the identical
   {stations, svc, exc, trips:[{line,hs,s,st}]} JSON shape, so one function
   covers all of them -- same pattern the boards use, just producing rows
   instead of cards. */
const scheduleCache={};
async function collectScheduleRows(cfg){
  try{
    let s=scheduleCache[cfg.url];
    if(!s){
      s=await getJSON(cfg.url, 15000);
      s._coord={}; (s.stations||[]).forEach(st=>{ s._coord[st.id]=[st.lat,st.lon,st.name]; });
      s._dep={};
      (s.trips||[]).forEach(tr=>tr.st.forEach(([sid,min])=>{ (s._dep[sid]=s._dep[sid]||[]).push({line:tr.line, hs:tr.hs, s:tr.s, t:min}); }));
      scheduleCache[cfg.url]=s;
    }
    const nowP=schedNowParts(s.tz), nowMin=nowP.min, active=activeServices(s, nowP);
    const near=(s.stations||[]).map(st=>({st, mi:haversineMi(loc,{lat:st.lat,lon:st.lon})})).sort((a,b)=>a.mi-b.mi).slice(0, cfg.stationCount||3);
    const rows=[];
    near.forEach(({st})=>{
      const deps=(s._dep[st.id]||[]).filter(d=>active.has(d.s)).map(d=>({...d,min:d.t})).filter(d=>d.min>=nowMin).sort((a,b)=>a.min-b.min).slice(0, cfg.perStation||2);
      deps.forEach(d=>{
        rows.push({ sortMin:d.min, time:(s.tz?clock24Of:clockOf)(d.min), dest:(d.hs||st.name||"").toUpperCase(),
          via:(d.line||"").toUpperCase(), status:"SCHEDULED", statusKind:"na",
          color:cfg.colorFn?cfg.colorFn(d.line):cfg.color });
      });
    });
    return rows;
  }catch(e){ return []; }
}

/* Amtrak (both cities) -- amtraker is a genuinely live API, so status
   reflects real on-time/late info instead of "scheduled". TIME is a rough
   ETA to the train's own destination (speed + great-circle distance, same
   technique night.html uses), not a station-board departure time. */
let amStationsCache=null;
async function ensureAmStations(){
  if(amStationsCache) return amStationsCache;
  try{
    const d=await getJSON("https://api-v3.amtraker.com/v3/stations", 12000);
    const m={}; for(const c in d){ const s=d[c]; if(typeof s.lat==="number") m[c]=[s.lat,s.lon]; }
    amStationsCache=m;
  }catch(e){ amStationsCache={}; }
  return amStationsCache;
}
async function collectAmtrakRows(count){
  try{
    const [data, st] = await Promise.all([getJSON("https://api-v3.amtraker.com/v3/trains", 12000), ensureAmStations()]);
    const now=new Date(), list=[];
    for(const arr of Object.values(data)) for(const t of (arr||[])){
      if(typeof t.lat!=="number"||typeof t.lon!=="number") continue;
      if(t.trainState && t.trainState!=="Active") continue;
      const mi=haversineMi(loc,{lat:t.lat,lon:t.lon});
      if(mi>150) continue;
      list.push({t, mi});
    }
    list.sort((a,b)=>a.mi-b.mi);
    return list.slice(0,count).map(({t})=>{
      /* Lateness used to be read out of trainTimely and bucketed by regex.
         That field is empty on every active train now, so every Amtrak row was
         landing on "na" and the board showed no delays at all. Derive it from
         the next stop's scheduled vs actual time instead -- the same source
         the city boards use -- and keep the feed's own wording as a fallback
         for if it ever starts reporting again. */
      const late=(t.trainTimely||"").trim();
      const amLi=amtrakLateInfo((t.stations||[]).find(s=>s.status!=="Departed"));
      const statusKind = amLi ? amLi.cls : "na";
      const statusText = amLi
        ? (amLi.mins>0 ? `+${amLi.mins} MIN` : "ON TIME")
        : (late||"EN ROUTE").toUpperCase();
      const dLL=st[t.destCode];
      let sortMin=1440, time="EN ROUTE";
      if(dLL && t.velocity>15){
        const mins=Math.round(haversineMi({lat:t.lat,lon:t.lon},{lat:dLL[0],lon:dLL[1]})/t.velocity*60);
        if(mins>=0 && mins<900){
          sortMin=(now.getHours()*60+now.getMinutes()+mins)%1440;
          time=mins<=1 ? "ARR" : clockOf(sortMin);
        }
      }
      return { sortMin, time, dest:(t.destName||t.destCode||"?").toUpperCase(),
        via:(t.routeName||"AMTRAK").toUpperCase(), status:statusText, statusKind,
        color:"#3ad0c8" };
    });
  }catch(e){ return []; }
}

/* Aircraft feed. Defaults to airplanes.live, which is free and CORS-open but

   switch to a commercially-usable feed (adsb.lol / adsb.fi) — those send no CORS
   headers of their own, so the Worker is required, not optional. */
function adsbBase(){
  try{ var u=(localStorage.getItem("tb.adsbUrl")||"").trim().replace(/\/+$/,"");
       if(u) return u+"/v2"; }catch(e){}
  return "https://api.airplanes.live/v2";
}
async function collectPlaneRows(count){
  try{
    const data=await getJSON(`${adsbBase()}/point/${loc.lat.toFixed(4)}/${loc.lon.toFixed(4)}/30`, 10000);
    const air=(data.ac||[]).filter(a=>a.alt_baro!=="ground" && typeof a.lat==="number")
      .map(a=>({a, mi:haversineMi(loc,{lat:a.lat,lon:a.lon})})).sort((x,y)=>x.mi-y.mi).slice(0,count);
    return air.map(({a})=>{
      const rate=a.baro_rate||0, alt=typeof a.alt_baro==="number"?a.alt_baro:null;
      const phase = alt==null?"EN ROUTE" : rate<-350?"DESCENDING" : rate>350?"CLIMBING" : alt>=28000?"CRUISING":"EN ROUTE";
      return { sortMin:Math.round(a.mi*10), time: alt!=null?`${alt.toLocaleString()}FT`:"—",
        dest:(a.flight||a.r||"UNKNOWN").trim().toUpperCase(), via:(a.desc||a.t||"AIRCRAFT").toUpperCase(),
        status:phase, statusKind:"na", color:"#ffd166" };
    });
  }catch(e){ return []; }
}

let _tousCache={t:0, rows:null, p:null};
async function collectTransitousAll(){
  if(!window.TBTransitous) return [];
  if(Date.now()-_tousCache.t < 20000 && _tousCache.rows) return _tousCache.rows;
  if(_tousCache.p) return _tousCache.p;
  _tousCache.p = (async()=>{
    try{
      const stops=await TBTransitous.cityBoard(loc.lat, loc.lon,
        {stops:4, perStop:14, source:CITY_CFG.transitSource, mainStation:CITY_CFG.mainStation});
      const all=[]; stops.forEach(st=>st.deps.forEach(d=>all.push(d)));
      /* Long-distance asked for separately, mode-filtered: at a big station the
         next departures are all trams and the ICEs never make the list. */
      try{
        const ld=await TBTransitous.longDistanceAt(CITY_CFG.mainStation, 8, CITY_CFG.transitSource);
        const seen=new Set(all.map(d=>d.route+"@"+d.when));
        ld.forEach(d=>{ if(!seen.has(d.route+"@"+d.when)) all.push(d); });
      }catch(e){}
      _tousCache={t:Date.now(), rows:all, p:null};
      return all;
    }catch(e){ _tousCache={t:Date.now(), rows:[], p:null}; return []; }
  })();
  return _tousCache.p;
}
const TOUS_COL={longdistance:"#e2504f", regional:"#3ad0c8", metro:"#4ea1ff",
                tram:"#f0ab00", bus:"#6aa9ff", ferry:"#5ad17a"};
async function collectTransitousRows(family, count){
  const all=await collectTransitousAll();
  return all.filter(d=>d.family===family)
    .sort((a,b)=>a.when-b.when)
    .slice(0,count)
    .map(d=>{
      const min=Math.max(0, Math.round((d.when-Date.now())/60000));
      return { sortMin:min, time: min<=0? "NOW" : `${min} MIN`,
        /* The European style leads with a wall-clock departure and a platform,
           the way a Solari board does; the countdown suits the metro style. Both
           are carried so the renderer can pick, rather than the collector
           deciding which one this city is allowed to show. */
        clock: cityClock(d.when),
        platform: (d.platform||"").toUpperCase(),
        dest:(d.headsign||"?").toUpperCase(), via:(d.route||d.label||"").toUpperCase(),
        /* Only claim live where the feed says so — the Swiss trams are live, the
           Rhine boats are not, and both end up on this board. */
        /* Any real-time delay goes through the shared bands rather than the
           old on-time/late split, so a Zurich tram three minutes down and one
           twenty minutes down stop looking identical. */
        status: d.cancelled? "CANCELLED" : (d.realTime? (d.delayMin>0? `+${d.delayMin} MIN`:"ON TIME") : "SCHEDULED"),
        statusKind: d.cancelled? "bad"
          : (d.realTime? ((liveLateInfo(d.delayMin)||{}).cls || "ok") : "na"),
        color: TOUS_COL[family]||"#6aa9ff" };
    });
}

/* ===== flip-click sound (synthesized, no audio file needed) =====
   A short filtered-noise burst approximates the mechanical "clack" of a
   real split-flap card turning. Reuses one pre-built noise buffer for every
   click rather than building a new one per flip (many cells can flip within
   the same ~100ms window, especially on a full board refresh). Browsers
   block audio until a user gesture happens at least once -- ensureAudio()
   just quietly no-ops until then, same as any other autoplay-blocked page. */
const LS_SOUND="flipboard.sound";
let soundOn = localStorage.getItem(LS_SOUND) !== "off";
let audioCtx=null, clickBuffer=null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    const dur=audioCtx.sampleRate*0.03;
    clickBuffer=audioCtx.createBuffer(1, dur, audioCtx.sampleRate);
    const data=clickBuffer.getChannelData(0);
    for(let i=0;i<dur;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/dur, 3);
  }
  if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playFlipClick(){
  if(!soundOn) return;
  const ctx=ensureAudio(); if(!ctx || !clickBuffer) return;
  const now=ctx.currentTime;
  const src=ctx.createBufferSource(); src.buffer=clickBuffer;
  const filter=ctx.createBiquadFilter(); filter.type="bandpass"; filter.frequency.value=2000+Math.random()*600; filter.Q.value=1.1;
  const gain=ctx.createGain(); gain.gain.setValueAtTime(0.09, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.03);
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start(now); src.stop(now+0.035);
}
document.addEventListener("pointerdown", ()=>ensureAudio(), {once:true});

/* ===== split-flap rendering engine ===== */
const CHARS=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:'&-/,";
function randChar(){ return CHARS[Math.floor(Math.random()*CHARS.length)]; }

/* Make a destination fit its column without slicing through a word.
   A hard .slice() turned SOUTH TO FRIENDSHIP into "SOUTH TO FRIENDS" and
   NORTH TO ROCKVILLE into "NORTH TO ROCKVIL" — the reader cannot tell a cut
   word from a real one, which is worse than showing less. In order: use it
   whole; drop a leading direction word that the line already implies; drop
   interior vowels from the longest word, the way transit signage does
   (FRIENDSHIP -> FRNDSHP); and only then cut, at a word boundary. */
function fitText(str, width){
  let t=(str||"").toUpperCase().replace(/\s+/g," ").trim();
  if(t.length<=width) return t;

  const lead=t.match(/^(NORTH|SOUTH|EAST|WEST|NORTHBOUND|SOUTHBOUND|INBOUND|OUTBOUND)\s+TO\s+/);
  if(lead && (t=t.slice(lead[0].length)).length<=width) return t;

  const squeeze=w => w.length<5 ? w : w[0]+w.slice(1,-1).replace(/[AEIOU]/g,"")+w.slice(-1);
  let words=t.split(" ");
  while(t.length>width){
    let longest=0;
    for(let i=1;i<words.length;i++) if(words[i].length>words[longest].length) longest=i;
    const shorter=squeeze(words[longest]);
    if(shorter===words[longest]) break;          // nothing left to squeeze
    words[longest]=shorter; t=words.join(" ");
  }
  if(t.length<=width) return t;

  // still too long: cut whole words off the end rather than mid-word
  while(words.length>1 && words.join(" ").length>width) words.pop();
  t=words.join(" ");
  return t.length<=width ? t : t.slice(0,width);
}

class FlapField{
  constructor(container, width, align){
    this.width=width; this.cells=[];
    container.className="flap-field "+(align||"left");
    for(let i=0;i<width;i++){
      const flap=document.createElement("span"); flap.className="flap";
      const ch=document.createElement("span"); ch.className="ch"; ch.textContent=" ";
      flap.appendChild(ch); container.appendChild(flap);
      this.cells.push({flap, ch, current:" "});
    }
  }
  setText(str){
    const padded=fitText(str, this.width).padEnd(this.width," ");
    for(let i=0;i<this.width;i++){
      const target=padded[i], cell=this.cells[i];
      cell.flap.classList.toggle("blank", target===" ");
      if(cell.current===target) continue;
      this._flip(cell, target, i*14);
    }
  }
  _flip(cell, target, delay){
    const steps=[randChar(), target];
    let i=0;
    const runStep=()=>{
      const c=steps[i];
      cell.flap.classList.remove("flipping"); void cell.flap.offsetWidth;
      cell.flap.classList.add("flipping");
      playFlipClick();
      setTimeout(()=>{ cell.ch.textContent=c; }, 55);
      i++;
      if(i<steps.length) setTimeout(runStep, 90);
      else cell.current=target;
    };
    setTimeout(runStep, delay);
  }
}

/* A departure hall board is a long list; a platform display is a handful of
   lines you read from thirty feet away. */
const ROW_COUNTS = { euro:16, usa:16, metro:8 };
let ROW_COUNT = 16;
const TIME_CHARS=7;                 // must match the FlapField built below
/* The time column is sized from the flaps it has to hold, not guessed. It was a
   flat 52px against seven 28px flaps — 208px of content in 52px of column, with
   overflow:hidden — so the one column a departure board exists for showed about
   two characters: "12:02A" read as "12", "1 MIN" as "1", "BRD" as "BR". Wrong at
   every size setting too, since the flaps scale with --flap-w and 52px did not.
   Six 2px gaps between seven flaps, hence the +12. */
/* ---------- board styles ----------------------------------------------------
   A Solari board in Zurich, an Amtrak board at Penn Station and a subway
   platform display look nothing alike, and the last one is not a departure
   board at all — which mattered here, because most of what these boards show is
   metro and bus being rendered as though it were intercity rail.

     euro   Solari. 24-hour departure time, destination, and the PLATFORM as the
            column that carries the row — which is what you actually walk up to
            a European board to read. Delay shown against the time.
     usa    Amtrak. Clock time and a STATUS word doing the work: ON TIME,
            BOARDING, DELAYED. Track where a feed gives one.
     metro  Not split-flap. A platform countdown: line bullet, destination, and
            big minutes. Fewer rows, larger type, meant to be read at a glance
            from further away.

   Platform only exists on the transitous feeds, which is the European cities —
   the WMATA, Amtrak and bundled-GTFS collectors have no track field to give. So
   the column populates exactly where the style that wants it is the default,
   and shows a dash elsewhere rather than pretending. */
const EURO_CITIES = new Set(["zurich","cologne","stuttgart","amsterdam"]);
const LS_STYLE = "flipboard.style";
function resolveStyle(pref){
  if (pref && pref !== "auto") return pref;
  return EURO_CITIES.has(CITY) ? "euro" : "usa";
}
let STYLE = resolveStyle(localStorage.getItem(LS_STYLE) || "auto");

const TIME_COL = `calc(var(--flap-w) * ${TIME_CHARS} + ${(TIME_CHARS-1)*2}px)`;
const STYLE_COLS = {
  /* DB reading order: time, the train-number chip, the via-stops, then the
     destination large, then Gleis. The row's children are in a different order
     in the DOM (shared with the other styles), so euro places them explicitly
     by grid-column rather than duplicating the row markup. */
  euro:  `86px 104px minmax(0,1fr) 74px 120px`,
  usa:   `${TIME_COL} minmax(0,1.7fr) 104px minmax(0,1fr) 96px`,
  metro: `96px minmax(0,1fr) 128px`,
};
const STYLE_HEADS = {
  /* Bilingual, as they are on the real thing. */
  euro:  ["Zeit <i>Time</i>","Zug <i>Train</i>","Ziel <i>Destination</i>","Gleis <i>Pl.</i>","Hinweis <i>Note</i>"],
  usa:   ["TIME","DESTINATION","OPERATOR","VIA","STATUS"],
  metro: ["LINE","DESTINATION","MIN"],
};
let COLS = STYLE_COLS[STYLE];
function applyStyleChrome(){
  COLS = STYLE_COLS[STYLE];
  ROW_COUNT = ROW_COUNTS[STYLE] || 16;
  document.documentElement.setAttribute("data-style", STYLE);
  const head=$("#boardHead");
  head.style.setProperty("--cols", COLS);
  head.innerHTML = STYLE_HEADS[STYLE].map(h=>`<span>${h}</span>`).join("");
  document.body.classList.toggle("euro-skin", STYLE==="euro");
}
applyStyleChrome();
const rowFields=[]; // [{el, logoEl, time:FlapField, dest:FlapField, via:FlapField, statusEl}]

/* How many flaps actually fit a column of `px`.

   The fields used to be hardcoded — dest was always 20 flaps — while the grid
   gives dest a fluid `1.7fr`. At 1280px that is 598px of flaps in a 467px
   column, and `overflow:hidden` silently ate the last five characters: NORTH TO
   ROCKVILLE rendered as NORTH TO ROCKVIL, indistinguishable from a real name.
   The time column already had this bug and a comment explaining it; this is the
   same fix generalised, so the board also gains and loses characters as the
   window resizes, which is what a real board does when you build a bigger one. */
const FLAP_GAP = 2;
function flapsThatFit(px){
  const cs = getComputedStyle(document.documentElement);
  let w = parseFloat(cs.getPropertyValue("--flap-w")) || 28;
  let gap = FLAP_GAP;
  /* The euro skin drops the flap furniture for proportional text, so a glyph is
     roughly half the width of a flap cell and there is no gap. Measuring it as
     though it were still 28px wide under-counted every column by half — which
     is why the note column fitted "+9" where "+9 MIN" had room. */
  if (document.documentElement.getAttribute("data-style") === "euro") {
    w = (parseFloat(cs.getPropertyValue("--flap-font")) || 22) * 0.52;
    gap = 0;
  }
  return Math.max(3, Math.floor((px + gap) / (w + gap)));
}
let fitWidths = null;      // {dest, via} in flaps, measured from the real layout
function measureAndRefit(){
  const row = rowFields[0] && rowFields[0].el;
  if (!row) return;
  const destPx = row.children[1].getBoundingClientRect().width;
  const viaPx  = row.children[3].getBoundingClientRect().width;
  if (!destPx || !viaPx) return;                       // laid out yet?
  const want = { dest: flapsThatFit(destPx), via: flapsThatFit(viaPx) };
  if (fitWidths && want.dest === fitWidths.dest && want.via === fitWidths.via) return;
  fitWidths = want;
  buildRows();                                          // rebuild at the new widths
  if (typeof lastRows !== "undefined" && lastRows) renderRows(lastRows);
}

function buildRows(){
  const wrap=$("#boardRows"); wrap.innerHTML="";
  /* Reset the field list too. This only ever ran once, so appending was
     harmless; now that a resize can rebuild at new widths, leaving the old
     entries in place meant renderRows kept writing into detached nodes and the
     board went blank while still reporting "16 shown". */
  rowFields.length=0;
  for(let i=0;i<ROW_COUNT;i++){
    const row=document.createElement("div"); row.className="board-row"; row.style.setProperty("--cols", COLS);
    const timeWrap=document.createElement("div"); row.appendChild(timeWrap);
    const destWrap=document.createElement("div"); row.appendChild(destWrap);
    const logoWrap=document.createElement("div"); logoWrap.style.display="flex"; logoWrap.style.alignItems="center";
    const logoImgEl=document.createElement("span"); logoImgEl.className="op-logo-img"; logoImgEl.style.display="none";
    const logoImg=document.createElement("img"); logoImg.alt=""; logoImgEl.appendChild(logoImg);
    const logoTextEl=document.createElement("span"); logoTextEl.className="op-logo"; logoTextEl.style.background="transparent";
    logoWrap.append(logoImgEl, logoTextEl); row.appendChild(logoWrap);
    const viaWrap=document.createElement("div"); row.appendChild(viaWrap);
    const statusWrap=document.createElement("div"); statusWrap.className="status-tag na"; statusWrap.textContent=""; row.appendChild(statusWrap);
    wrap.appendChild(row);
    rowFields.push({
      el:row, logoImgEl, logoImg, logoTextEl,
      time:new FlapField(timeWrap, TIME_CHARS, "left"),
      dest:new FlapField(destWrap, (fitWidths&&fitWidths.dest)||20, "left"),
      via:new FlapField(viaWrap,  (fitWidths&&fitWidths.via) ||12, "left"),
      statusEl:statusWrap,
    });
  }
}
function showLogoText(f, r){
  f.logoImgEl.style.display="none";
  f.logoTextEl.style.display="";
  f.logoTextEl.textContent=r?(r.logo||""):"";

let lastRows=null;
function renderRows(rows){
  lastRows=rows;
  $("#rowCount").textContent = rows.length ? `${rows.length} shown` : "";
  for(let i=0;i<ROW_COUNT;i++){
    const f=rowFields[i], r=rows[i];
    if(!r){
      f.time.setText(""); f.dest.setText(""); f.via.setText("");
      f.statusEl.textContent=""; f.statusEl.className="status-tag na";
      f.el.classList.add("empty");
      showLogoText(f, null);
      continue;
    }
    /* Slot five is the column each style exists for: a European board's
       platform, an American board's status word, the countdown on a metro
       display. The first four slots are shared, so the flap animation and the
       fitting work is not duplicated three times. */
    if(STYLE==="metro"){
      f.time.setText(r.via);                       // line bullet reads first here
      f.dest.setText(r.dest);
      f.via.setText("");
      f.statusEl.textContent = r.time;             // big minutes
      f.statusEl.className = "status-tag countdown " + (r.statusKind||"na");
    } else if(STYLE==="euro"){
      f.time.setText(r.clock || r.time);           // 24h departure, not a countdown
      f.dest.setText(r.dest);
      /* The chip is the train's identity — RE 5361, ICE 38, S 16 — which is
         what r.via actually holds. "Über" wants the intermediate stops, and no
         feed here supplies them: a departure carries its line and its headsign,
         not the calling pattern. So the column stays empty rather than being
         padded with the operator name to look full, and the layout gives the
         space to the destination instead. */
      /* A real board's note column is empty on a punctual train and carries the
         exception when there is one — "10 Minuten später", "Zug fällt aus".
         Printing ON TIME on every row would be noise, and the absence of a note
         is itself the information. Delay and cancellation were being dropped
         entirely when this column became the platform, which left the board
         unable to say the one thing it exists to say. */
      const late = /^\+(\d+)/.exec(r.status||"");
      f.via.setText(r.statusKind==="bad" ? "FÄLLT AUS"
                   : late ? `+${late[1]} MIN` : "");
      f.el.classList.toggle("late", !!late);
      f.el.classList.toggle("gone", r.statusKind==="bad");
      f.logoTextEl.style.display=""; f.logoImgEl.style.display="none";
      f.logoTextEl.textContent = r.via || "";
      f.logoTextEl.style.background = "";
      f.statusEl.textContent = r.platform || "—";
      f.statusEl.className = "status-tag platform";
      f.el.classList.remove("empty");
      continue;
    } else {
      f.time.setText(r.time); f.dest.setText(r.dest); f.via.setText(r.via);
      f.statusEl.textContent=r.status; f.statusEl.className="status-tag "+(r.statusKind||"na");
    }
    f.el.classList.remove("empty");
    if(r.logoImg){
      f.logoTextEl.style.display="none";
      f.logoImgEl.style.display="";
      if(f.logoImg.src!==r.logoImg){
        f.logoImg.onerror=()=>showLogoText(f, r); // real logo failed to load -- fall back to the text badge
        f.logoImg.src=r.logoImg;
      }
    } else {
      showLogoText(f, r);
    }
  }
}

async function tick(){
  $("#statusText").textContent="updating…";
  try{
    const rows=await collectAllRows();
    renderRows(rows);
    $("#statusText").textContent="live — "+CITY_CFG.board.replace(".html","");
  }catch(e){
    $("#statusText").textContent="update failed, retrying…";
  }
  $("#updated").textContent="updated "+cityClock(Date.now());
}
/* The CITY's clock, not the viewer's -- this board is read from anywhere but
   describes departures somewhere specific, and a Zurich board showing Eastern
   time is worse than showing none. Cities with no tz keep the viewer's zone,
   exactly as before. The TIME column itself is relative minutes, so it was
   never affected. */
function cityClock(t){
  const d = (t instanceof Date) ? t : new Date(t);
  if(isNaN(d)) return "";
  const tz = CITY_CFG && CITY_CFG.tz;
  if(!tz) return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return d.toLocaleTimeString(CITY_CFG.clock24 ? "en-GB" : "en-US",
    {hour:"2-digit", minute:"2-digit", hour12:!CITY_CFG.clock24, timeZone:tz});
}
function clock(){ $("#clock").textContent=cityClock(Date.now()); }

/* ---- full-screen kiosk mode ---- */
/* Full screen must act on the TOP document. Boards run inside the same-origin
   cityswitch.js shell iframe, where the fullscreen element belongs to the outer
   document — so document.fullscreenElement reads null inside the frame and
   document.exitFullscreen() silently no-ops, which is why Exit did nothing. */
function fsDoc(){
  try{ if(window.top && window.top!==window && window.top.document) return window.top.document; }catch(e){}
  return document;
}
function fsElement(){ const d=fsDoc(); return d.fullscreenElement || d.webkitFullscreenElement; }
function toggleFullscreen(){
  const d=fsDoc(), el=d.documentElement;
  if(fsElement()){ const ex=d.exitFullscreen||d.webkitExitFullscreen; if(ex) ex.call(d); return; }
  /* The licence check lives HERE rather than on the button, so that every way
     in is covered -- the button, the F key, and whatever gets added next. On
     the button alone it was one keystroke to walk past the only lock on the
     feature the licence exists to sell, and the button's own tooltip named the
     shortcut. Note the position: AFTER the exit branch, because leaving full
     screen is never gated. Trapping somebody in it is a bug, not a sale. */
  if(window.TBGate && !TBGate.require("fullscreen")) return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){ hintFS(); return; }
  try{ const p=req.call(el); if(p&&p.catch) p.catch(()=>hintFS()); }catch(e){ hintFS(); }
}
let hintTimer=null;
function hintFS(){
  let t=$("#fsHint");
  if(!t){ t=document.createElement("div"); t.id="fsHint"; document.body.appendChild(t); }
  t.textContent="Full screen is blocked here. Open this page in its own browser tab to go full screen.";
  t.style.transform="translate(-50%,0)"; clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ t.style.transform="translate(-50%,-120%)"; }, 4500);
}
function initFullscreen(){
  $("#fsBtn").onclick=toggleFullscreen;
  document.addEventListener("keydown", e=>{ if((e.key==="f"||e.key==="F") && !/^(input|textarea)$/i.test(e.target.tagName)) toggleFullscreen(); });
  // Keep kiosk fullscreen across the ‹ board nav link: remember it when a nav
  // link is clicked while fullscreen (capture phase, before it navigates), then
  // re-enter on the destination page -- immediately where the browser allows
  // (Chrome --kiosk), else on the first tap/key. A manual exit records nothing.
  document.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest("header a[href]");
    if(a && fsElement()){ try{ sessionStorage.setItem("kioskFS","1"); }catch(_){} }
  }, true);
  try{ if(sessionStorage.getItem("kioskFS")==="1"){
    sessionStorage.removeItem("kioskFS");
    const tryFS=()=>{ if(fsElement()) return; const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(req){ try{ const p=req.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(_){} } };
    tryFS();
    const once=()=>{ document.removeEventListener("pointerdown",once,true); document.removeEventListener("keydown",once,true); tryFS(); };
    document.addEventListener("pointerdown", once, true);
    document.addEventListener("keydown", once, true);
  } }catch(_){}
}

/* ---- settings panel: which systems show + text size + sound ---- */
const LS_SIZE="flipboard.textSize";
function applySize(size){
  document.documentElement.setAttribute("data-size", size);
  localStorage.setItem(LS_SIZE, size);
  // bigger flaps mean fewer of them fit; re-measure rather than clip
  if (typeof measureAndRefit === "function") requestAnimationFrame(measureAndRefit);
  document.querySelectorAll("#sizeSeg button").forEach(b=>b.classList.toggle("active", b.dataset.size===size));
}
function applyStyle(pref){
  localStorage.setItem(LS_STYLE, pref);
  STYLE = resolveStyle(pref);
  applyStyleChrome();
  document.querySelectorAll("#styleSeg button").forEach(b=>b.classList.toggle("active", b.dataset.style===pref));
  fitWidths=null; buildRows();
  requestAnimationFrame(measureAndRefit);
  if(lastRows) renderRows(lastRows);
}
function applySound(on){
  soundOn=on;
  localStorage.setItem(LS_SOUND, on?"on":"off");
  document.querySelectorAll("#soundSeg button").forEach(b=>b.classList.toggle("active", (b.dataset.sound==="on")===on));
  if(on) ensureAudio();
}
function buildSystemToggles(){
  const wrap=$("#sysToggles"); wrap.innerHTML="";
  const hidden=loadHiddenSystems();
  SYSTEM_DEFS.forEach(sys=>{
    const lab=document.createElement("label"); lab.className="sys-toggle";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!hidden.has(sys.id);
    cb.onchange=()=>{
      const h=loadHiddenSystems();
      if(cb.checked) h.delete(sys.id); else h.add(sys.id);
      saveHiddenSystems(h);
      tick();
    };
    lab.appendChild(cb); lab.appendChild(document.createTextNode(sys.label));
    wrap.appendChild(lab);
  });
}
function initSettings(){
  buildSystemToggles();
  applySize(localStorage.getItem(LS_SIZE)||"md");
  applySound(soundOn);
  $("#setBtn").onclick=()=>$("#settings").classList.add("show");
  $("#setDone").onclick=()=>$("#settings").classList.remove("show");
  $("#settings").addEventListener("click", e=>{ if(e.target.id==="settings") $("#settings").classList.remove("show"); });
  $("#styleSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) applyStyle(b.dataset.style); });
  applyStyle(localStorage.getItem(LS_STYLE) || "auto");
  $("#sizeSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) applySize(b.dataset.size); });
  $("#soundSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) applySound(b.dataset.sound==="on"); });
}

function boot(){
  initFullscreen();
  initSettings();
  buildRows();
  requestAnimationFrame(measureAndRefit);        // once the grid has real widths
  let rt=null;
  addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(measureAndRefit, 150); });
  $("#boardBtn").setAttribute("href", CITY_CFG.board);
  $("#boardBtn").title = `Back to the ${CITY_CFG.cityLabel} board`;
  $("#loclbl").textContent = loc.label ? "near "+loc.label : "";
  clock(); setInterval(clock, 1000);
  tick(); setInterval(tick, 20000);
}
function safeBoot(){ try{ boot(); }catch(e){ console.error("boot() failed, retrying:", e); setTimeout(()=>{ try{ boot(); }catch(e2){ console.error("boot() retry failed:", e2); } }, 150); } }
if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", safeBoot); } else { safeBoot(); }
</script>
